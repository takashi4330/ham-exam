1\" target=\"_blank\" rel=\"noopener\">電波法 第110条第1号\u003c/a>\u003c/figcaption>\u003cblockquote>次の各号のいずれかに該当する場合には、当該違反行為をした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。\u003cbr>一　第四条の規定による免許又は第二十七条の二十一第一項の規定による登録がないのに、無線局を開設したとき。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H08-1","title":"電波の発射の停止と技術基準適合命令"},{"id":"H08-2","title":"検査"},{"id":"H08-3","title":"運用の停止と免許の取消し"},{"id":"H08-4","title":"報告"},{"id":"H08-5","title":"罰則"}],"search":[{"id":"","title":"","text":"総務大臣は、電波のきまりが守られるように、無線局を監督しています。この章では、電波の発射の停止、検査、無線局の運用の停止と免許の取消し、報告、罰則を覚えます。"},{"id":"H08-1","title":"電波の発射の停止と技術基準適合命令","text":"電波の発射の停止と技術基準適合命令 総務大臣は、無線局の発射する電波の質が総務省令で定めるものに適合していないと認めるときは、その無線局に臨時に電波の発射の停止を命じることができます（電波法第 72 条）。 電波法 第72条（電波の発射の停止） 第七十二条 総務大臣は、無線局の発射する電波の質が第二十八条の総務省令で定めるものに適合していないと認めるときは、当該無線局に対して臨時に電波の発射の停止を命ずることができる。 ２ 総務大臣は、前項の命令を受けた無線局からその発射する電波の質が第二十八条の総務省令の定めるものに適合するに至つた旨の申出を受けたときは、その無線局に電波を試験的に発射させなければならない。 ３ 総務大臣は、前項の規定により発射する電波の質が第二十八条の総務省令で定めるものに適合しているときは、直ちに第一項の停止を解除しなければならない。 電波の質が適合するようになったと申し出があると、総務大臣はその無線局に電波を試験的に発射させ、適合していれば直ちに停止を解除します。 また、無線設備が技術基準に適合していないと認めるときは、免許人に、無線設備の修理その他の必要な措置をとるよう命じることができます（電波法第 71 条の 5）。 電波法 第71条の5（技術基準適合命令） 第七十一条の五 総務大臣は、無線設備が第三章に定める技術基準に適合していないと認めるときは、当該無線設備を使用する無線局の免許人等に対し、その技術基準に適合するように当該無線設備の修理その他の必要な措置をとるべきことを命ずることができる。"},{"id":"H08-2","title":"検査","text":"検査 総務大臣は、総務省令で定める時期ごとに、職員を無線局に派遣して、無線設備などを検査させます（定期検査。電波法第 73 条第 1 項）。アマチュア局は、定期検査を行わない無線局です（電波法施行規則第 41 条の 2 の 6）。 電波法施行規則 第41条の2の6第1項第22号法第七十三条第一項の総務省令で定める無線局は、次のとおりとする。 二十二 アマチュア局 ただし、電波の発射の停止を命じたとき、その解除の申出があったとき、技術基準適合命令を出したときなど、特に必要があるときは、職員を派遣して検査させることがあります（臨時検査。第 73 条第 5 項）。"},{"id":"H08-3","title":"運用の停止と免許の取消し","text":"運用の停止と免許の取消し 総務大臣は、免許人が電波法や放送法、それにもとづく命令や処分に違反したときは、3 か月以内の期間を定めて無線局の運用の停止を命じ、又は期間を定めて運用許容時間、周波数、空中線電力を制限できます（電波法第 76 条第 1 項）。 電波法 第76条第1項総務大臣は、免許人等がこの法律、放送法若しくはこれらの法律に基づく命令又はこれらに基づく処分に違反したときは、三月以内の期間を定めて無線局の運用の停止を命じ、又は期間を定めて運用許容時間、周波数若しくは空中線電力を制限することができる。 次のときは、免許を取り消すことができます（第 76 条第 4 項）。 正当な理由がないのに、無線局の運用を引き続き 6 か月以上休止したとき不正な手段で無線局の免許や変更の許可などを受けたとき運用の停止の命令や制限に従わないとき電波法か放送法の罪で罰金以上の刑に処せられたとき（第 5 条第 3 項第 1 号に当たるに至ったとき） 電波法 第76条第4項総務大臣は、免許人（包括免許人を除く。）が次の各号のいずれかに該当するときは、その免許を取り消すことができる。 一 正当な理由がないのに、無線局の運用を引き続き六月以上休止したとき。 二 不正な手段により無線局の免許若しくは第十七条の許可を受け、又は第十九条の規定による指定の変更を行わせたとき。 三 第一項の規定による命令又は制限に従わないとき。 四 免許人が第五条第三項第一号に該当するに至つたとき。 五 特定地上基幹放送局の免許人が第七条第二項第四号ロに適合しなくなつたとき。 人の資格（無線従事者の免許）の取消しと業務の停止は、第 4 章（電波法第 79 条）で学びました。"},{"id":"H08-4","title":"報告","text":"報告 無線局の免許人は、次のときに総務大臣に報告しなければなりません（電波法第 80 条）。 遭難通信、緊急通信、安全通信、非常通信を行ったとき電波法や命令の規定に違反して運用した無線局を認めたとき無線局が外国で、あらかじめ総務大臣が告示した以外の運用の制限をされたとき また総務大臣は、無線通信の秩序の維持などのため必要があると認めるときは、免許人に無線局に関する報告を求めることができます（電波法第 81 条）。 電波法 第81条第八十一条 総務大臣は、無線通信の秩序の維持その他無線局の適正な運用を確保するため必要があると認めるときは、免許人等に対し、無線局に関し報告を求めることができる。"},{"id":"H08-5","title":"罰則","text":"罰則 電波法に違反すると、罰せられることがあります。以前は「懲役」と書かれていましたが、刑法の改正で、いまは「拘禁刑」です。 違反罰則根拠免許がないのに無線局を開設した1 年以下の拘禁刑又は 100 万円以下の罰金電波法第 110 条免許記録の範囲を超えて運用した（目的外の通信など）1 年以下の拘禁刑又は 100 万円以下の罰金電波法第 110 条無線局の取扱中に係る無線通信の秘密を漏らし、又は窃用した1 年以下の拘禁刑又は 50 万円以下の罰金電波法第 109 条わいせつな通信を発した2 年以下の拘禁刑又は 100 万円以下の罰金電波法第 108 条資格がないのにアマチュア無線局の無線設備の操作を行った30 万円以下の罰金電波法第 113 条 電波法 第110条第1号次の各号のいずれかに該当する場合には、当該違反行為をした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。 一 第四条の規定による免許又は第二十七条の二十一第一項の規定による登録がないのに、無線局を開設したとき。"}],"only":""},{"id":"H09","subject":"法規","num":9,"title":"モールス符号と電信の通信","html":"\u003cp>3アマは、4アマとちがって、モールス符号による通信（電信）の操作ができます。この章では、モールス符号の組み立てと欧文の符号、無線電信で使う略符号と Q 符号、無線電信の呼出し・応答・通報の送り方を覚えます。\u003c/p>\n\u003ch3 id=\"H09-1\">3アマとモールス符号\u003c/h3>\n\u003cp>3アマの操作の範囲は、空中線電力 50 ワット以下の無線設備で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使うものの操作です（電波法施行令第 3 条）。4アマの範囲から除かれている「モールス符号による通信操作」も含まれます。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3\" target=\"_blank\" rel=\"noopener\">電波法施行令 第3条第3項（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。\u003cbr>資格｜操作の範囲\u003cbr>第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作\u003cbr>第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一　空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二　空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの\u003c/blockquote>\u003c/figure>\n\u003cp>たとえば 7 MHz 帯（8 MHz 以下）や 21 MHz 帯（18 MHz 以上）で、50 ワット以下の電信（A1A）を送信できます。10 MHz 帯と 14 MHz 帯は、8 MHz を超え 18 MHz 未満なので、3アマの範囲に入りません。\u003c/p>\n\u003cp>モールス符号による無線電信の通信（モールス無線通信）には、無線局運用規則の別表第一号のモールス符号を使わなければなりません（無線局運用規則第 12 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_12\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第12条\u003c/a>\u003c/figcaption>\u003cblockquote>（モールス符号の使用）\u003cbr>第十二条　モールス無線電信による通信（以下「モールス無線通信」という。）には、別表第一号に掲げるモールス符号を用いなければならない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H09-2\">モールス符号の組み立て\u003c/h3>\n\u003cp>モールス符号は、短点（・）と長点（－）の組み合わせです。長点は「線」ともいいます。線の長さと間隔は、短点 1 つ分の長さを単位にして決まっています。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>もの\u003c/th>\u003cth>長さ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>線（長点）の長さ\u003c/td>\u003ctd>短点 3 つ分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 つの符号の中の、線や点の間隔\u003c/td>\u003ctd>短点 1 つ分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>符号と符号（文字と文字）の間隔\u003c/td>\u003ctd>短点 3 つ分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>語と語の間隔\u003c/td>\u003ctd>短点 7 つ分\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 別表第一号の注\u003c/a>\u003c/figcaption>\u003cblockquote>一　符号の線及び間隔\u003cbr>　１　一線の長さは、三点に等しい。\u003cbr>　２　一符号を作る各線又は点の間隔は、一点に等しい。\u003cbr>　３　二符号の間隔は、三点に等しい。\u003cbr>　４　二語の間隔は、七点に等しい。\u003c/blockquote>\u003c/figure>\n\u003cp>例：A（・－）は、点 1 ＋ 間隔 1 ＋ 線 3 で、短点 5 つ分の長さです。\u003c/p>\n\u003ch3 id=\"H09-3\">欧文と数字の符号\u003c/h3>\n\u003cp>欧文（アルファベット）と数字のモールス符号です（無線局運用規則別表第一号）。和文（カナ）の符号も別表第一号にあります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>文字\u003c/th>\u003cth>符号\u003c/th>\u003cth>文字\u003c/th>\u003cth>符号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>・－\u003c/td>\u003ctd>N\u003c/td>\u003ctd>－・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>－・・・\u003c/td>\u003ctd>O\u003c/td>\u003ctd>－－－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>－・－・\u003c/td>\u003ctd>P\u003c/td>\u003ctd>・－－・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D\u003c/td>\u003ctd>－・・\u003c/td>\u003ctd>Q\u003c/td>\u003ctd>－－・－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E\u003c/td>\u003ctd>・\u003c/td>\u003ctd>R\u003c/td>\u003ctd>・－・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F\u003c/td>\u003ctd>・・－・\u003c/td>\u003ctd>S\u003c/td>\u003ctd>・・・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>G\u003c/td>\u003ctd>－－・\u003c/td>\u003ctd>T\u003c/td>\u003ctd>－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H\u003c/td>\u003ctd>・・・・\u003c/td>\u003ctd>U\u003c/td>\u003ctd>・・－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I\u003c/td>\u003ctd>・・\u003c/td>\u003ctd>V\u003c/td>\u003ctd>・・・－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J\u003c/td>\u003ctd>・－－－\u003c/td>\u003ctd>W\u003c/td>\u003ctd>・－－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>K\u003c/td>\u003ctd>－・－\u003c/td>\u003ctd>X\u003c/td>\u003ctd>－・・－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L\u003c/td>\u003ctd>・－・・\u003c/td>\u003ctd>Y\u003c/td>\u003ctd>－・－－\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M\u003c/td>\u003ctd>－－\u003c/td>\u003ctd>Z\u003c/td>\u003ctd>－－・・\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>数字\u003c/th>\u003cth>符号\u003c/th>\u003cth>数字\u003c/th>\u003cth>符号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>・－－－－\u003c/td>\u003ctd>6\u003c/td>\u003ctd>－・・・・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>・・－－－\u003c/td>\u003ctd>7\u003c/td>\u003ctd>－－・・・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>・・・－－\u003c/td>\u003ctd>8\u003c/td>\u003ctd>－－－・・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>・・・・－\u003c/td>\u003ctd>9\u003c/td>\u003ctd>－－－－・\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>・・・・・\u003c/td>\u003ctd>0\u003c/td>\u003ctd>－－－－－\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>数字は、どれも点と線を合わせて 5 つです。1〜5 は点が数だけ並んで線が続き、6〜9 と 0 は線が先に並びます\u003c/li>\u003cli>E（・）と T（－）がいちばん短く、よく使う文字ほど短い符号になっています\u003c/li>\u003cli>記号もあります。問符（？）は ・・－－・・、斜線（／）は －・・－・ です。アマチュア無線では、移動して運用するときに、呼出符号の後に斜線と地域の数字を付けて（JA1〇〇〇/1 など）送ることがあります\u003c/li>\u003c/ul>\n\u003ch3 id=\"H09-4\">略符号（業務用語）\u003c/h3>\n\u003cp>無線電信による通信（無線電信通信）の業務用語には、無線局運用規則の別表第二号の略符号を使います。略符号と同じ意味のほかの言葉を使ってはいけません（無線局運用規則第 13 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_13\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第13条\u003c/a>\u003c/figcaption>\u003cblockquote>（業務用語）\u003cbr>第十三条　無線電信による通信（以下「無線電信通信」という。）の業務用語には、別表第二号に定める略語又は符号（以下「略符号」という。）を使用するものとする。ただし、デジタル選択呼出装置による通信（以下「デジタル選択呼出通信」という。）及び狭帯域直接印刷電信による通信（以下「狭帯域直接印刷電信通信」という。）については、この限りでない。\u003cbr>２　無線電信通信においては、前項の略符号と同意義の他の語辞を使用してはならない。ただし、航空、航空の準備及び航空の安全に関する情報を送信するための固定業務以外の固定業務においては、別に告示する略符号の使用を妨げない。\u003c/blockquote>\u003c/figure>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>略符号\u003c/th>\u003cth>意義（別表第二号）\u003c/th>\u003cth>無線電話では\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CQ\u003c/td>\u003ctd>各局あて一般呼出し\u003c/td>\u003ctd>各局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DE\u003c/td>\u003ctd>……から（呼出局の呼出符号の前に置く）\u003c/td>\u003ctd>こちらは\u003c/td>\u003c/tr>\u003ctr>\u003ctd>K\u003c/td>\u003ctd>送信してください\u003c/td>\u003ctd>どうぞ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R\u003c/td>\u003ctd>受信しました\u003c/td>\u003ctd>了解 又は OK\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AS（上に線）\u003c/td>\u003ctd>送信の待機を要求する符号\u003c/td>\u003ctd>お待ちください\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR（上に線）\u003c/td>\u003ctd>送信の終了符号\u003c/td>\u003ctd>終り\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BT（上に線）\u003c/td>\u003ctd>同一の伝送の異なる部分を分離する符号\u003c/td>\u003ctd>―\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HH（上に線）\u003c/td>\u003ctd>欧文通信及び自動機通信の訂正符号\u003c/td>\u003ctd>訂正\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VA（上に線）\u003c/td>\u003ctd>通信の完了符号\u003c/td>\u003ctd>さようなら\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RPT\u003c/td>\u003ctd>反復してください（又はこちらは、反復します）\u003c/td>\u003ctd>反復\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX\u003c/td>\u003ctd>機器の調整又は実験のため調整符号を発射するときに使う\u003c/td>\u003ctd>ただいま試験中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VVV\u003c/td>\u003ctd>調整符号\u003c/td>\u003ctd>本日は晴天なり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NIL\u003c/td>\u003ctd>こちらは、そちらに送信するものがありません\u003c/td>\u003ctd>―\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BK\u003c/td>\u003ctd>送信の中断を要求する符号\u003c/td>\u003ctd>―\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CL\u003c/td>\u003ctd>こちらは、閉局します\u003c/td>\u003ctd>―\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TU\u003c/td>\u003ctd>ありがとう\u003c/td>\u003ctd>―\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OSO（上に線）\u003c/td>\u003ctd>非常符号\u003c/td>\u003ctd>非常\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SOS（上に線）\u003c/td>\u003ctd>遭難信号\u003c/td>\u003ctd>遭難、MAYDAY 又はメーデー\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>文字の上に線を付けた略符号は、全部を 1 つの符号として、文字の間をあけずに続けて送ります（別表第二号の注）。たとえば AR は A（・－）と R（・－・）を続けて ・－・－・、VA は ・・・－・－、HH は短点 8 つです。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2\" target=\"_blank\" rel=\"noopener\">無線局運用規則 別表第二号（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>略符号｜意義\u003cbr>ＡＲ（上に線）｜送信の終了符号\u003cbr>ＡＳ（上に線）｜送信の待機を要求する符号\u003cbr>ＶＡ（上に線）｜通信の完了符号\u003c/blockquote>\u003c/figure>\n\u003cp>無線電話の略語との対応は、別表第四号にあります（法規の第 6 章）。\u003c/p>\n\u003ch3 id=\"H09-5\">Q 符号\u003c/h3>\n\u003cp>Q 符号は、Q で始まる 3 文字の略符号です。1 つの Q 符号で、決まった問いや答えを表します。問いの意味で使うときは、Q 符号の次に問符（？）を付けます（別表第二号の注）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Q 符号\u003c/th>\u003cth>問い（？を付ける）\u003c/th>\u003cth>答え又は通知\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>QRA\u003c/td>\u003ctd>貴局名は、何ですか。\u003c/td>\u003ctd>当局名は、……です。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRK\u003c/td>\u003ctd>こちらの信号の明りょう度は、どうですか。\u003c/td>\u003ctd>そちらの信号の明りょう度は、1 悪い〜5 非常に良いです。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRL\u003c/td>\u003ctd>そちらは、通信中ですか。\u003c/td>\u003ctd>こちらは、通信中です。妨害しないでください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRM\u003c/td>\u003ctd>こちらの伝送は、混信を受けていますか。\u003c/td>\u003ctd>そちらの伝送は、1 混信を受けていません〜5 非常に強い混信を受けています。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRN\u003c/td>\u003ctd>そちらは、空電に妨げられていますか。\u003c/td>\u003ctd>こちらは、1 空電に妨げられていません〜5 非常に強い空電に妨げられています。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRO\u003c/td>\u003ctd>こちらは、送信機の電力を増加しましょうか。\u003c/td>\u003ctd>送信機の電力を増加してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRP\u003c/td>\u003ctd>こちらは、送信機の電力を減少しましょうか。\u003c/td>\u003ctd>送信機の電力を減少してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRQ\u003c/td>\u003ctd>こちらは、もっと速く送信しましょうか。\u003c/td>\u003ctd>もっと速く送信してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRS\u003c/td>\u003ctd>こちらは、もっとおそく送信しましょうか。\u003c/td>\u003ctd>もっとおそく送信してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRT\u003c/td>\u003ctd>こちらは、送信を中止しましょうか。\u003c/td>\u003ctd>送信を中止してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRU\u003c/td>\u003ctd>そちらは、こちらへ伝送するものがありますか。\u003c/td>\u003ctd>こちらは、そちらへ伝送するものはありません。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRV\u003c/td>\u003ctd>そちらは、用意ができましたか。\u003c/td>\u003ctd>こちらは、用意ができました。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRX\u003c/td>\u003ctd>そちらは、何時に再びこちらを呼びますか。\u003c/td>\u003ctd>こちらは、……時に再びそちらを呼びます。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QRZ\u003c/td>\u003ctd>誰がこちらを呼んでいますか。\u003c/td>\u003ctd>そちらは、……から呼ばれています。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QSA\u003c/td>\u003ctd>こちらの信号の強さは、どうですか。\u003c/td>\u003ctd>そちらの信号の強さは、1 ほとんど感じません〜5 非常に強いです。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QSB\u003c/td>\u003ctd>こちらの信号には、フェージングがありますか。\u003c/td>\u003ctd>そちらの信号には、フェージングがあります。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QSL\u003c/td>\u003ctd>そちらは、受信証を送ることができますか。\u003c/td>\u003ctd>こちらは、受信証を送ります。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QSO\u003c/td>\u003ctd>そちらは、……と直接（又は中継で）通信することができますか。\u003c/td>\u003ctd>こちらは、……と直接（又は中継で）通信することができます。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QSY\u003c/td>\u003ctd>こちらは、他の周波数に変更して伝送しましょうか。\u003c/td>\u003ctd>他の周波数に変更して伝送してください。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QTH\u003c/td>\u003ctd>（緯度と経度などで示す）そちらの位置は、何ですか。\u003c/td>\u003ctd>こちらの位置は、……です。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QTR\u003c/td>\u003ctd>正確な時刻は、何時ですか。\u003c/td>\u003ctd>正確な時刻は、……時です。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2\" target=\"_blank\" rel=\"noopener\">無線局運用規則 別表第二号（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>注１（１）を付したＱ符号は，航空移動業務並びに航空，航空の準備及び航空の安全に関する情報を送信するための固定業務において使用してはならない。２（２）を付したＱ符号は，海上移動業務において使用してはならない。３Ｑ符号を問いの意義に使用するときは，Ｑ符号の次に問符をつけなければならない。\u003cbr>Ｑ符号｜意義\u003cbr>問い｜答え又は通知\u003cbr>ＱＲＭ｜こちらの伝送は，混信を受けていますか。｜そちらの伝送は，１　混信を受けていません。２　少し混信を受けています。３　かなりの混信を受けています。４　強い混信を受けています。５　非常に強い混信を受けています。\u003cbr>ＱＳＢ｜こちらの信号には，フェージングがありますか。｜そちらの信号には，フェージングがあります。\u003c/blockquote>\u003c/figure>\n\u003cp>ふだんのアマチュア無線では、QSO を「交信」、QSL を「交信証（QSL カード）」、QTH を「運用している場所」の意味でもよく使います。\u003c/p>\n\u003ch3 id=\"H09-6\">無線電信の呼出しと応答\u003c/h3>\n\u003cp>無線電話の呼出しや応答のしかた（法規の第 6 章）は、もともと無線電信の通信のしかたを無線電話に当てはめたものです（無線局運用規則第 18 条）。無線電信では、「こちらは」の代わりに DE、「どうぞ」の代わりに K を送ります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>すること\u003c/th>\u003cth>送る順番\u003c/th>\u003cth>根拠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>呼出し\u003c/td>\u003ctd>相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 3 回以下\u003c/td>\u003ctd>第 20 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>応答\u003c/td>\u003ctd>相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 1 回\u003c/td>\u003ctd>第 23 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一括呼出し\u003c/td>\u003ctd>CQ 3 回、DE 1 回、自局の呼出符号 3 回以下、K 1 回\u003c/td>\u003ctd>第 127 条（第 261 条で準用）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_20-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第20条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>呼出しは、順次送信する次に掲げる事項（以下「呼出事項」という。）によつて行うものとする。\u003cbr>一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　三回以下（海上移動業務にあつては二回以下）\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_2\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第23条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。\u003cbr>一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　一回\u003c/blockquote>\u003c/figure>\n\u003cp>応答のあと、すぐに通報を受信できるときは K を送ります。すぐに受信できないときは、K の代わりに AS（上に線）と、分で表した待ってほしいおよその時間を送ります。10 分以上待ってもらうときは、その理由も簡単に送ります（第 23 条第 3 項）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_3\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第23条第3項\u003c/a>\u003c/figcaption>\u003cblockquote>前項の応答に際して直ちに通報を受信しようとするときは、応答事項の次に「Ｋ」を送信するものとする。但し、直ちに通報を受信することができない事由があるときは、「Ｋ」の代りに「ＡＳ（上に線）」及び分で表わす概略の待つべき時間を送信するものとする。概略の待つべき時間が十分以上のときは、その理由を簡単に送信しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>呼出局の呼出符号がはっきりしないときは、相手局の呼出符号の代わりに QRZ? を送って、直ちに応答します（第 26 条）。\u003c/p>\n\u003cp>例（自局 JA1〇〇〇 が、相手局 JA1△△△ を呼ぶとき）\u003c/p>\n\u003cblockquote>呼出し：JA1△△△　JA1△△△　JA1△△△　DE　JA1〇〇〇　JA1〇〇〇　JA1〇〇〇　K\u003cbr>応答：JA1〇〇〇　JA1〇〇〇　JA1〇〇〇　DE　JA1△△△　K\u003c/blockquote>\n\u003ch3 id=\"H09-7\">通報の送り方と訂正\u003c/h3>\n\u003cp>通報は、相手局の呼出符号 1 回、DE 1 回、自局の呼出符号 1 回、通報、K 1 回の順に送ります。呼出しと同じ電波で送るときは、はじめの 3 つ（相手局の呼出符号から自局の呼出符号まで）を省略できます。通報の終わりには、欧文では AR（上に線）を送ります（第 29 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_29-Pr_3\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第29条第3項\u003c/a>\u003c/figcaption>\u003cblockquote>前項の送信において、通報は、和文の場合は「ラタ（上に線）」、欧文の場合は「ＡＲ（上に線）」をもつて終るものとする。\u003c/blockquote>\u003c/figure>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>こんなとき\u003c/th>\u003cth>すること\u003c/th>\u003cth>根拠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>送信中に誤って送ったことに気づいた（欧文の手送り）\u003c/td>\u003ctd>HH（上に線）を送り、正しく送った適当な語字から、さらに送り直す\u003c/td>\u003ctd>第 31 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>相手に反復を求める\u003c/td>\u003ctd>RPT の次に、反復してほしい箇所を示す\u003c/td>\u003ctd>第 32 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>長い時間続けて送る\u003c/td>\u003ctd>アマチュア局は 10 分ごとを標準として、DE と自局の呼出符号を送る\u003c/td>\u003ctd>第 30 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通信中に周波数を変えてほしい\u003c/td>\u003ctd>QSU 又は QSW 若しくは QSY と、使おうとする周波数を送る\u003c/td>\u003ctd>第 34 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通報を送り終え、ほかに送る通報がない\u003c/td>\u003ctd>通報に続いて NIL、K を送る\u003c/td>\u003ctd>第 36 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通報を確実に受信した\u003c/td>\u003ctd>R と、最後に受信した通報の番号を送る（受信証）\u003c/td>\u003ctd>第 37 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通信が終わった\u003c/td>\u003ctd>VA（上に線）を送る。海上移動業務以外では省略できる\u003c/td>\u003ctd>第 38 条\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_31\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第31条\u003c/a>\u003c/figcaption>\u003cblockquote>（誤送の訂正）\u003cbr>第三十一条　送信中において誤つた送信をしたことを知つたときは、左に掲げる略符号を前置して正しく送信した適当の語字から更に送信しなければならない。\u003cbr>一　手送による和文の送信の場合は、ラタ（上に線）\u003cbr>二　自動機（自動的にモールス符号を送信又は受信するものをいう。以下同じ。）による送信及び手送による欧文の送信の場合は、ＨＨ（上に線）\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_38\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第38条\u003c/a>\u003c/figcaption>\u003cblockquote>（通信の終了）\u003cbr>第三十八条　通信が終了したときは、「ＶＡ（上に線）」を送信するものとする。ただし、海上移動業務以外の業務においては、これを省略することができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H09-8\">電信の試験電波\u003c/h3>\n\u003cp>無線機器の試験や調整のために電信で電波を出すときは、次の順に行います（無線局運用規則第 39 条）。\u003c/p>\n\u003col>\u003cli>発射する前に、その周波数などで聴守し、他の無線局の通信に混信を与えないことを確かめる\u003c/li>\u003cli>EX 3 回、DE 1 回、自局の呼出符号 3 回を送る\u003c/li>\u003cli>さらに 1 分間聴守し、他の無線局から停止の請求がないことを確かめる\u003c/li>\u003cli>VVV の連続と、自局の呼出符号 1 回を送る。この送信は 10 秒間を超えないようにする（海上移動業務以外の局は、必要があれば 10 秒間を超えてもよい）\u003c/li>\u003c/ol>\n\u003cp>無線電話の「ただいま試験中」は EX に、「本日は晴天なり」は VVV に当たります。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第39条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。\u003cbr>一　ＥＸ　三回\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　三回\u003c/blockquote>\u003c/figure>","sections":[{"id":"H09-1","title":"3アマとモールス符号"},{"id":"H09-2","title":"モールス符号の組み立て"},{"id":"H09-3","title":"欧文と数字の符号"},{"id":"H09-4","title":"略符号（業務用語）"},{"id":"H09-5","title":"Q 符号"},{"id":"H09-6","title":"無線電信の呼出しと応答"},{"id":"H09-7","title":"通報の送り方と訂正"},{"id":"H09-8","title":"電信の試験電波"}],"search":[{"id":"","title":"","text":"3アマは、4アマとちがって、モールス符号による通信（電信）の操作ができます。この章では、モールス符号の組み立てと欧文の符号、無線電信で使う略符号と Q 符号、無線電信の呼出し・応答・通報の送り方を覚えます。"},{"id":"H09-1","title":"3アマとモールス符号","text":"3アマとモールス符号 3アマの操作の範囲は、空中線電力 50 ワット以下の無線設備で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使うものの操作です（電波法施行令第 3 条）。4アマの範囲から除かれている「モールス符号による通信操作」も含まれます。 電波法施行令 第3条第3項（表の一部）次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。 資格｜操作の範囲 第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作 第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一 空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二 空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの たとえば 7 MHz 帯（8 MHz 以下）や 21 MHz 帯（18 MHz 以上）で、50 ワット以下の電信（A1A）を送信できます。10 MHz 帯と 14 MHz 帯は、8 MHz を超え 18 MHz 未満なので、3アマの範囲に入りません。 モールス符号による無線電信の通信（モールス無線通信）には、無線局運用規則の別表第一号のモールス符号を使わなければなりません（無線局運用規則第 12 条）。 無線局運用規則 第12条（モールス符号の使用） 第十二条 モールス無線電信による通信（以下「モールス無線通信」という。）には、別表第一号に掲げるモールス符号を用いなければならない。"},{"id":"H09-2","title":"モールス符号の組み立て","text":"モールス符号の組み立て モールス符号は、短点（・）と長点（－）の組み合わせです。長点は「線」ともいいます。線の長さと間隔は、短点 1 つ分の長さを単位にして決まっています。 もの長さ線（長点）の長さ短点 3 つ分1 つの符号の中の、線や点の間隔短点 1 つ分符号と符号（文字と文字）の間隔短点 3 つ分語と語の間隔短点 7 つ分 無線局運用規則 別表第一号の注一 符号の線及び間隔 １ 一線の長さは、三点に等しい。 ２ 一符号を作る各線又は点の間隔は、一点に等しい。 ３ 二符号の間隔は、三点に等しい。 ４ 二語の間隔は、七点に等しい。 例：A（・－）は、点 1 ＋ 間隔 1 ＋ 線 3 で、短点 5 つ分の長さです。"},{"id":"H09-3","title":"欧文と数字の符号","text":"欧文と数字の符号 欧文（アルファベット）と数字のモールス符号です（無線局運用規則別表第一号）。和文（カナ）の符号も別表第一号にあります。 文字符号文字符号A・－N－・B－・・・O－－－C－・－・P・－－・D－・・Q－－・－E・R・－・F・・－・S・・・G－－・T－H・・・・U・・－I・・V・・・－J・－－－W・－－K－・－X－・・－L・－・・Y－・－－M－－Z－－・・ 数字符号数字符号1・－－－－6－・・・・2・・－－－7－－・・・3・・・－－8－－－・・4・・・・－9－－－－・5・・・・・0－－－－－ 数字は、どれも点と線を合わせて 5 つです。1〜5 は点が数だけ並んで線が続き、6〜9 と 0 は線が先に並びますE（・）と T（－）がいちばん短く、よく使う文字ほど短い符号になっています記号もあります。問符（？）は ・・－－・・、斜線（／）は －・・－・ です。アマチュア無線では、移動して運用するときに、呼出符号の後に斜線と地域の数字を付けて（JA1〇〇〇/1 など）送ることがあります"},{"id":"H09-4","title":"略符号（業務用語）","text":"略符号（業務用語） 無線電信による通信（無線電信通信）の業務用語には、無線局運用規則の別表第二号の略符号を使います。略符号と同じ意味のほかの言葉を使ってはいけません（無線局運用規則第 13 条）。 無線局運用規則 第13条（業務用語） 第十三条 無線電信による通信（以下「無線電信通信」という。）の業務用語には、別表第二号に定める略語又は符号（以下「略符号」という。）を使用するものとする。ただし、デジタル選択呼出装置による通信（以下「デジタル選択呼出通信」という。）及び狭帯域直接印刷電信による通信（以下「狭帯域直接印刷電信通信」という。）については、この限りでない。 ２ 無線電信通信においては、前項の略符号と同意義の他の語辞を使用してはならない。ただし、航空、航空の準備及び航空の安全に関する情報を送信するための固定業務以外の固定業務においては、別に告示する略符号の使用を妨げない。 略符号意義（別表第二号）無線電話ではCQ各局あて一般呼出し各局DE……から（呼出局の呼出符号の前に置く）こちらはK送信してくださいどうぞR受信しました了解 又は OKAS（上に線）送信の待機を要求する符号お待ちくださいAR（上に線）送信の終了符号終りBT（上に線）同一の伝送の異なる部分を分離する符号―HH（上に線）欧文通信及び自動機通信の訂正符号訂正VA（上に線）通信の完了符号さようならRPT反復してください（又はこちらは、反復します）反復EX機器の調整又は実験のため調整符号を発射するときに使うただいま試験中VVV調整符号本日は晴天なりNILこちらは、そちらに送信するものがありません―BK送信の中断を要求する符号―CLこちらは、閉局します―TUありがとう―OSO（上に線）非常符号非常SOS（上に線）遭難信号遭難、MAYDAY 又はメーデー 文字の上に線を付けた略符号は、全部を 1 つの符号として、文字の間をあけずに続けて送ります（別表第二号の注）。たとえば AR は A（・－）と R（・－・）を続けて ・－・－・、VA は ・・・－・－、HH は短点 8 つです。 無線局運用規則 別表第二号（表の一部）略符号｜意義 ＡＲ（上に線）｜送信の終了符号 ＡＳ（上に線）｜送信の待機を要求する符号 ＶＡ（上に線）｜通信の完了符号 無線電話の略語との対応は、別表第四号にあります（法規の第 6 章）。"},{"id":"H09-5","title":"Q 符号","text":"Q 符号 Q 符号は、Q で始まる 3 文字の略符号です。1 つの Q 符号で、決まった問いや答えを表します。問いの意味で使うときは、Q 符号の次に問符（？）を付けます（別表第二号の注）。 Q 符号問い（？を付ける）答え又は通知QRA貴局名は、何ですか。当局名は、……です。QRKこちらの信号の明りょう度は、どうですか。そちらの信号の明りょう度は、1 悪い〜5 非常に良いです。QRLそちらは、通信中ですか。こちらは、通信中です。妨害しないでください。QRMこちらの伝送は、混信を受けていますか。そちらの伝送は、1 混信を受けていません〜5 非常に強い混信を受けています。QRNそちらは、空電に妨げられていますか。こちらは、1 空電に妨げられていません〜5 非常に強い空電に妨げられています。QROこちらは、送信機の電力を増加しましょうか。送信機の電力を増加してください。QRPこちらは、送信機の電力を減少しましょうか。送信機の電力を減少してください。QRQこちらは、もっと速く送信しましょうか。もっと速く送信してください。QRSこちらは、もっとおそく送信しましょうか。もっとおそく送信してください。QRTこちらは、送信を中止しましょうか。送信を中止してください。QRUそちらは、こちらへ伝送するものがありますか。こちらは、そちらへ伝送するものはありません。QRVそちらは、用意ができましたか。こちらは、用意ができました。QRXそちらは、何時に再びこちらを呼びますか。こちらは、……時に再びそちらを呼びます。QRZ誰がこちらを呼んでいますか。そちらは、……から呼ばれています。QSAこちらの信号の強さは、どうですか。そちらの信号の強さは、1 ほとんど感じません〜5 非常に強いです。QSBこちらの信号には、フェージングがありますか。そちらの信号には、フェージングがあります。QSLそちらは、受信証を送ることができますか。こちらは、受信証を送ります。QSOそちらは、……と直接（又は中継で）通信することができますか。こちらは、……と直接（又は中継で）通信することができます。QSYこちらは、他の周波数に変更して伝送しましょうか。他の周波数に変更して伝送してください。QTH（緯度と経度などで示す）そちらの位置は、何ですか。こちらの位置は、……です。QTR正確な時刻は、何時ですか。正確な時刻は、……時です。 無線局運用規則 別表第二号（表の一部）注１（１）を付したＱ符号は，航空移動業務並びに航空，航空の準備及び航空の安全に関する情報を送信するための固定業務において使用してはならない。２（２）を付したＱ符号は，海上移動業務において使用してはならない。３Ｑ符号を問いの意義に使用するときは，Ｑ符号の次に問符をつけなければならない。 Ｑ符号｜意義 問い｜答え又は通知 ＱＲＭ｜こちらの伝送は，混信を受けていますか。｜そちらの伝送は，１ 混信を受けていません。２ 少し混信を受けています。３ かなりの混信を受けています。４ 強い混信を受けています。５ 非常に強い混信を受けています。 ＱＳＢ｜こちらの信号には，フェージングがありますか。｜そちらの信号には，フェージングがあります。 ふだんのアマチュア無線では、QSO を「交信」、QSL を「交信証（QSL カード）」、QTH を「運用している場所」の意味でもよく使います。"},{"id":"H09-6","title":"無線電信の呼出しと応答","text":"無線電信の呼出しと応答 無線電話の呼出しや応答のしかた（法規の第 6 章）は、もともと無線電信の通信のしかたを無線電話に当てはめたものです（無線局運用規則第 18 条）。無線電信では、「こちらは」の代わりに DE、「どうぞ」の代わりに K を送ります。 すること送る順番根拠呼出し相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 3 回以下第 20 条応答相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 1 回第 23 条一括呼出しCQ 3 回、DE 1 回、自局の呼出符号 3 回以下、K 1 回第 127 条（第 261 条で準用） 無線局運用規則 第20条第1項呼出しは、順次送信する次に掲げる事項（以下「呼出事項」という。）によつて行うものとする。 一 相手局の呼出符号 三回以下（海上移動業務にあつては二回以下） 二 ＤＥ 一回 三 自局の呼出符号 三回以下（海上移動業務にあつては二回以下） 無線局運用規則 第23条第2項前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。 一 相手局の呼出符号 三回以下（海上移動業務にあつては二回以下） 二 ＤＥ 一回 三 自局の呼出符号 一回 応答のあと、すぐに通報を受信できるときは K を送ります。すぐに受信できないときは、K の代わりに AS（上に線）と、分で表した待ってほしいおよその時間を送ります。10 分以上待ってもらうときは、その理由も簡単に送ります（第 23 条第 3 項）。 無線局運用規則 第23条第3項前項の応答に際して直ちに通報を受信しようとするときは、応答事項の次に「Ｋ」を送信するものとする。但し、直ちに通報を受信することができない事由があるときは、「Ｋ」の代りに「ＡＳ（上に線）」及び分で表わす概略の待つべき時間を送信するものとする。概略の待つべき時間が十分以上のときは、その理由を簡単に送信しなければならない。 呼出局の呼出符号がはっきりしないときは、相手局の呼出符号の代わりに QRZ? を送って、直ちに応答します（第 26 条）。 例（自局 JA1〇〇〇 が、相手局 JA1△△△ を呼ぶとき） 呼出し：JA1△△△ JA1△△△ JA1△△△ DE JA1〇〇〇 JA1〇〇〇 JA1〇〇〇 K 応答：JA1〇〇〇 JA1〇〇〇 JA1〇〇〇 DE JA1△△△ K"},{"id":"H09-7","title":"通報の送り方と訂正","text":"通報の送り方と訂正 通報は、相手局の呼出符号 1 回、DE 1 回、自局の呼出符号 1 回、通報、K 1 回の順に送ります。呼出しと同じ電波で送るときは、はじめの 3 つ（相手局の呼出符号から自局の呼出符号まで）を省略できます。通報の終わりには、欧文では AR（上に線）を送ります（第 29 条）。 無線局運用規則 第29条第3項前項の送信において、通報は、和文の場合は「ラタ（上に線）」、欧文の場合は「ＡＲ（上に線）」をもつて終るものとする。 こんなときすること根拠送信中に誤って送ったことに気づいた（欧文の手送り）HH（上に線）を送り、正しく送った適当な語字から、さらに送り直す第 31 条相手に反復を求めるRPT の次に、反復してほしい箇所を示す第 32 条長い時間続けて送るアマチュア局は 10 分ごとを標準として、DE と自局の呼出符号を送る第 30 条通信中に周波数を変えてほしいQSU 又は QSW 若しくは QSY と、使おうとする周波数を送る第 34 条通報を送り終え、ほかに送る通報がない通報に続いて NIL、K を送る第 36 条通報を確実に受信したR と、最後に受信した通報の番号を送る（受信証）第 37 条通信が終わったVA（上に線）を送る。海上移動業務以外では省略できる第 38 条 無線局運用規則 第31条（誤送の訂正） 第三十一条 送信中において誤つた送信をしたことを知つたときは、左に掲げる略符号を前置して正しく送信した適当の語字から更に送信しなければならない。 一 手送による和文の送信の場合は、ラタ（上に線） 二 自動機（自動的にモールス符号を送信又は受信するものをいう。以下同じ。）による送信及び手送による欧文の送信の場合は、ＨＨ（上に線） 無線局運用規則 第38条（通信の終了） 第三十八条 通信が終了したときは、「ＶＡ（上に線）」を送信するものとする。ただし、海上移動業務以外の業務においては、これを省略することができる。"},{"id":"H09-8","title":"電信の試験電波","text":"電信の試験電波 無線機器の試験や調整のために電信で電波を出すときは、次の順に行います（無線局運用規則第 39 条）。 発射する前に、その周波数などで聴守し、他の無線局の通信に混信を与えないことを確かめるEX 3 回、DE 1 回、自局の呼出符号 3 回を送るさらに 1 分間聴守し、他の無線局から停止の請求がないことを確かめるVVV の連続と、自局の呼出符号 1 回を送る。この送信は 10 秒間を超えないようにする（海上移動業務以外の局は、必要があれば 10 秒間を超えてもよい） 無線電話の「ただいま試験中」は EX に、「本日は晴天なり」は VVV に当たります。 無線局運用規則 第39条第1項無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。 一 ＥＸ 三回 二 ＤＥ 一回 三 自局の呼出符号 三回"}],"only":"3アマ"},{"id":"H10","subject":"法規","num":10,"title":"国際法規","html":"\u003cp>電波は国境を越えて届くので、無線通信には世界共通のきまりがあります。3アマの法規には、国際電気通信連合憲章（通信憲章）、国際電気通信連合条約（通信条約）、無線通信規則の簡略な概要が入ります（無線従事者規則第 5 条）。この章では、これらの文書のしくみと、有害な混信、局の許可と識別、アマチュア業務の国際的なきまりを覚えます。\u003c/p>\n\u003cp>国際法規の条文は、国際電気通信連合（ITU）が発行した英語の原文を載せ、日本語はこの問題集で訳したものです。日本政府の公式の訳とは、言葉が少しちがうことがあります。\u003c/p>\n\u003ch3 id=\"H10-1\">国際電気通信連合の文書\u003c/h3>\n\u003cp>国際電気通信連合の文書は、国際電気通信連合憲章、国際電気通信連合条約、業務規則の 3 つです（通信憲章第 4 条）。業務規則は、国際電気通信規則と無線通信規則で、すべての構成国（加盟している国）を拘束します。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>文書\u003c/th>\u003cth>電波法令での呼び方\u003c/th>\u003cth>中身\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>国際電気通信連合憲章\u003c/td>\u003ctd>通信憲章\u003c/td>\u003ctd>連合のいちばん基本の文書\u003c/td>\u003c/tr>\u003ctr>\u003ctd>国際電気通信連合条約\u003c/td>\u003ctd>通信条約\u003c/td>\u003ctd>憲章を補足する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線通信規則\u003c/td>\u003ctd>無線通信規則\u003c/td>\u003ctd>業務規則の 1 つ。周波数の分配、混信の防止、局の識別、業務ごとのきまりなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>国際電気通信規則\u003c/td>\u003ctd>―\u003c/td>\u003ctd>業務規則の 1 つ。国際電気通信業務の一般原則\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=9\" target=\"_blank\" rel=\"noopener\">通信憲章 第4条第1項（29）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）連合の文書は、国際電気通信連合憲章、国際電気通信連合条約及び業務規則とする。\u003cbr>The instruments of the Union are: – this Constitution of the International Telecommunication Union, – the Convention of the International Telecommunication Union, and – the Administrative Regulations.\u003c/blockquote>\u003c/figure>\n\u003cdetails class=\"law\">\u003csummary>通信憲章 第4条第3項（31）（条文を開く）\u003c/summary>\u003cblockquote>（訳）憲章と条約の規定は、さらに、電気通信の利用を規律し、すべての構成国を拘束する次の業務規則の規定によって補足される。国際電気通信規則、無線通信規則。\u003cbr>The provisions of both this Constitution and the Convention are further complemented by those of the Administrative Regulations, enumerated below, which regulate the use of telecommunications and shall be binding on all Member States: – International Telecommunication Regulations, – Radio Regulations.\u003c/blockquote>\u003cp>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=10\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>文書どうしの規定が矛盾するときは、憲章が条約と業務規則より優先し、条約が業務規則より優先します。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>通信憲章 第4条第4項（32）（条文を開く）\u003c/summary>\u003cblockquote>（訳）憲章の規定と、条約又は業務規則の規定との間に矛盾がある場合には、憲章が優先する。条約の規定と業務規則の規定との間に矛盾がある場合には、条約が優先する。\u003cbr>In the case of inconsistency between a provision of this Constitution and a provision of the Convention or of the Administrative Regulations, the Constitution shall prevail. In the case of inconsistency between a provision of the Convention and a provision of the Administrative Regulations, the Convention shall prevail.\u003c/blockquote>\u003cp>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=10\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>日本の電波法は、電波に関して条約に別段の定めがあるときは、その規定によると決めています（電波法第 3 条）。電波法令の「通信憲章」「通信条約」「無線通信規則」は、それぞれ上の表の文書のことです（電波法施行規則第 2 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_3\" target=\"_blank\" rel=\"noopener\">電波法 第3条\u003c/a>\u003c/figcaption>\u003cblockquote>（電波に関する条約）\u003cbr>第三条　電波に関し条約に別段の定があるときは、その規定による。\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_2-Pr_1-It_3\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第2条第1項第3号\u003c/a>\u003c/figcaption>\u003cblockquote>電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。\u003cbr>三　「無線通信規則」とは、国際電気通信連合憲章に規定する無線通信規則をいう。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H10-2\">周波数の利用と有害な混信\u003c/h3>\n\u003cp>周波数は限られた資源なので、無駄なく使います。構成国は、使う周波数の数とスペクトルを、必要な業務に欠かせない最小限度にするよう努めます（通信憲章第 44 条）。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>通信憲章 第44条第1項（195）（条文を開く）\u003c/summary>\u003cblockquote>（訳）構成国は、必要な業務を満足に提供するために欠くことのできない最小限度に、使用する周波数の数とスペクトルを制限するよう努める。そのため、最新の技術の進歩をできる限り速やかに取り入れるよう努める。\u003cbr>Member States shall endeavour to limit the number of frequencies and the spectrum used to the minimum essential to provide in a satisfactory manner the necessary services. To that end, they shall endeavour to apply the latest technical advances as soon as possible.\u003c/blockquote>\u003cp>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=48\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>「有害な混信」は、次のように定義されています。通信憲章の附属書と無線通信規則に、同じ定義があります。\u003c/p>\n\u003cblockquote>無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信\u003c/blockquote>\n\u003cdetails class=\"law\">\u003csummary>通信憲章 附属書（1003）（条文を開く）\u003c/summary>\u003cblockquote>（訳）有害な混信：無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信\u003cbr>Harmful Interference: Interference which endangers the functioning of a radionavigation service or of other safety services or seriously degrades, obstructs or repeatedly interrupts a radiocommunication service operating in accordance with the Radio Regulations.\u003c/blockquote>\u003cp>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=62\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cul>\u003cli>すべての局は、その目的にかかわらず、他の国などの無線業務や無線通信で、無線通信規則に従って運用されているものに、有害な混信を生じさせないように設置し、運用しなければならない（通信憲章第 45 条第 1 項）\u003c/li>\u003cli>構成国は、あらゆる種類の電気機器と電気設備の運用が有害な混信を生じさせないよう、実行可能なすべての措置をとる必要があることを認める（第 45 条第 3 項）\u003c/li>\u003cli>すべての局は、不要な伝送、過剰な信号の伝送、虚偽の信号やまぎらわしい信号の伝送、識別表示のない信号の伝送を行ってはならない（無線通信規則 15.1）\u003c/li>\u003cli>送信局は、満足な業務を確保するために必要な電力だけを輻射しなければならない（無線通信規則 15.2）\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>通信憲章 第45条第1項（197）（条文を開く）\u003c/summary>\u003cblockquote>（訳）すべての局は、その目的のいかんを問わず、他の構成国、認められた事業体又は無線業務を行うその他の正当に許可された事業体の無線業務又は無線通信で、無線通信規則に従って運用されるものに、有害な混信を生じさせないように設置し、及び運用しなければならない。\u003cbr>All stations, whatever their purpose, must be established and operated in such a manner as not to cause harmful interference to the radio services or communications of other Member States or of recognized operating agencies, or of other duly authorized operating agencies which carry on a radio service, and which operate in accordance with the provisions of the Radio Regulations.\u003c/blockquote>\u003cp>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=49\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"law\">\u003csummary>無線通信規則 第15条（15.1）（条文を開く）\u003c/summary>\u003cblockquote>（訳）すべての局は、不要な伝送、過剰な信号の伝送、虚偽の信号やまぎらわしい信号の伝送、識別表示のない信号の伝送（第19条に定める場合を除く。）を行ってはならない。\u003cbr>All stations are forbidden to carry out unnecessary transmissions, or the transmission of superfluous signals, or the transmission of false or misleading signals, or the transmission of signals without identification (except as provided for in Article 19).\u003c/blockquote>\u003cp>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=262\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"H10-3\">遭難の通信と通信の秘密\u003c/h3>\n\u003cul>\u003cli>無線局は、遭難の呼出しと通報を、どこから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う（通信憲章第 46 条）\u003c/li>\u003cli>構成国は、遭難・緊急・安全・識別の虚偽の信号やまぎらわしい信号の送信を防ぐ措置をとる（第 47 条）\u003c/li>\u003cli>構成国は、国際通信の秘密を確保するため、すべての可能な措置をとることを約束する（第 37 条）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=49\" target=\"_blank\" rel=\"noopener\">通信憲章 第46条（200）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）無線局は、遭難の呼出し及び通報を、どこから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う。\u003cbr>Radio stations shall be obliged to accept, with absolute priority, distress calls and messages regardless of their origin, to reply in the same manner to such messages, and immediately to take such action in regard thereto as may be required.\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=44\" target=\"_blank\" rel=\"noopener\">通信憲章 第37条第1項（184）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）構成国は、国際通信の秘密を確保するため、使用する電気通信のシステムに適合するすべての可能な措置をとることを約束する。\u003cbr>Member States agree to take all possible measures, compatible with the system of telecommunication used, with a view to ensuring the secrecy of international correspondence.\u003c/blockquote>\u003c/figure>\n\u003cp>電波法にも、遭難通信をほかのきまりの例外として扱うことや、通信の秘密の保護など、同じ考え方のきまりがあります（法規の第 5 章）。\u003c/p>\n\u003ch3 id=\"H10-4\">局の許可と識別\u003c/h3>\n\u003cp>個人や企業が送信局を設置し、運用するには、その局が属する国の政府が発給する許可書（日本では無線局の免許）が要ります（無線通信規則 18.1）。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>無線通信規則 第18条（18.1）（条文を開く）\u003c/summary>\u003cblockquote>（訳）個人又はいかなる企業も、その局が属する国の政府が（又は政府に代わって）、適当な形式で、かつ、この規則に従って発給する許可書なしに、送信局を設置し、又は運用してはならない（ただし、18.2、18.8 及び 18.11 を参照）。\u003cbr>No transmitting station may be established or operated by a private person or by any enterprise without a licence issued in an appropriate form and in conformity with the provisions of these Regulations by or on behalf of the government of the country to which the station in question is subject (however, see Nos. 18.2, 18.8 and 18.11).\u003c/blockquote>\u003cp>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=274\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>すべての伝送は、識別信号などで、どの局の伝送か分かるものでなければなりません。虚偽やまぎらわしい識別表示を使う伝送は禁止されています。アマチュア業務の伝送は、識別信号（呼出符号）を伴うものとされています（無線通信規則第 19 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=276\" target=\"_blank\" rel=\"noopener\">無線通信規則 第19条（19.1）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）すべての伝送は、識別信号その他の手段によって識別できるものでなければならない。\u003cbr>All transmissions shall be capable of being identified either by identification signals or by other means.\u003c/blockquote>\u003c/figure>\n\u003cdetails class=\"law\">\u003csummary>無線通信規則 第19条（19.4）（条文を開く）\u003c/summary>\u003cblockquote>（訳）次の業務のすべての伝送は、19.13 から 19.15 までに定める場合を除き、識別信号を伴うものとする。a) アマチュア業務、b) 放送業務、c) 28 000 kHz より低い周波数帯の固定業務、d) 移動業務、e) 標準周波数報時業務\u003cbr>All transmissions in the following services should, except as provided in Nos. 19.13 to 19.15, carry identification signals: a) amateur service; b) broadcasting service; c) fixed service in the bands below 28 000 kHz; d) mobile service; e) standard frequency and time signal service.\u003c/blockquote>\u003cp>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=276\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>アマチュア局の呼出符号は、たとえば「2 文字と 1 個の数字の後に、4 文字以下の集まり（最後は文字）を続けたもの」です（無線通信規則 19.68）。JA1〇〇〇 は、JA の 2 文字と数字の 1 の後に、3 文字の集まりが続く形です。19.68 では数字に 0 と 1 を使わないことになっていますが、アマチュア局にはこの定めは適用されません（19.69）。\u003c/p>\n\u003ch3 id=\"H10-5\">アマチュア業務のきまり\u003c/h3>\n\u003cp>無線通信規則は、アマチュア業務を次のように定義しています（1.56）。電波法施行規則のアマチュア業務の定義（法規の第 1 章）と、ほぼ同じ中身です。\u003c/p>\n\u003cblockquote>アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務\u003c/blockquote>\n\u003cdetails class=\"law\">\u003csummary>無線通信規則 第1条（1.56）（条文を開く）\u003c/summary>\u003cblockquote>（訳）アマチュア業務：アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務\u003cbr>amateur service: A radiocommunication service for the purpose of self-training, intercommunication and technical investigations carried out by amateurs, that is, by duly authorized persons interested in radio technique solely with a personal aim and without pecuniary interest.\u003c/blockquote>\u003cp>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=23\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>アマチュア衛星業務は、アマチュア業務と同じ目的のために、地球衛星の宇宙局を使う業務です（1.57）。アマチュア業務についてのおもなきまりは、無線通信規則の第 25 条にあります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>番号\u003c/th>\u003cth>きまり\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>25.1\u003c/td>\u003ctd>異なる国のアマチュア局の間の無線通信は、関係国の主管庁が反対を通告していなければ認められる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.2\u003c/td>\u003ctd>異なる国のアマチュア局の間の伝送は、アマチュア業務の目的に付随する通信と、個人的な性質の通信に限る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.2A\u003c/td>\u003ctd>異なる国のアマチュア局の間の伝送は、意味を隠すために暗号化してはならない（アマチュア衛星の制御信号は除く）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.3\u003c/td>\u003ctd>第三者のための国際通信は、緊急の場合と災害救助の場合に限って送信できる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.5\u003c/td>\u003ctd>モールス符号の送受信の能力を求めるかどうかは、主管庁が決める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.6\u003c/td>\u003ctd>主管庁は、アマチュア局を運用しようとする者の運用上と技術上の資格を確かめる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.7\u003c/td>\u003ctd>アマチュア局の最大電力は、関係の主管庁が定める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.8\u003c/td>\u003ctd>通信憲章、通信条約、無線通信規則の関係するすべての規定は、アマチュア局に適用する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.9\u003c/td>\u003ctd>アマチュア局は、伝送の間、短い間隔で自局の呼出符号を伝送しなければならない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.9A\u003c/td>\u003ctd>主管庁は、アマチュア局が災害救助を支える通信に備えられるよう、必要な措置をとることが奨励される\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25.9B\u003c/td>\u003ctd>外国の許可を受けた者が一時的に自国にいる間の運用を認めるかどうかは、その国の主管庁が決める\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>主管庁は、各国で電波の行政をする機関です（日本では総務省）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334\" target=\"_blank\" rel=\"noopener\">無線通信規則 第25条（25.2）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）異なる国のアマチュア局の間の伝送は、1.56 に定めるアマチュア業務の目的に付随する通信と、個人的な性質の通信に限る。\u003cbr>Transmissions between amateur stations of different countries shall be limited to communications incidental to the purposes of the amateur service, as defined in No. 1.56 and to remarks of a personal character.\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334\" target=\"_blank\" rel=\"noopener\">無線通信規則 第25条（25.9）\u003c/a>\u003c/figcaption>\u003cblockquote>（訳）アマチュア局は、その伝送の間、短い間隔で自局の呼出符号を伝送しなければならない。\u003cbr>During the course of their transmissions, amateur stations shall transmit their call sign at short intervals.\u003c/blockquote>\u003c/figure>\n\u003cp>日本の電波法令にも、これに合わせたきまりがあります。たとえば、アマチュア局は長い時間続けて送信するとき、10 分ごとを標準として自局の呼出符号を送ります（無線局運用規則第 30 条、法規の第 6 章・第 9 章）。\u003c/p>\n\u003ch3 id=\"H10-6\">周波数の分配と地域\u003c/h3>\n\u003cp>無線通信規則は、周波数を分配するために、世界を第一地域、第二地域、第三地域の 3 つに分けています（無線通信規則 5.2）。同じ周波数帯でも、地域によって分配がちがうことがあります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>地域\u003c/th>\u003cth>おもな範囲\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>第一地域\u003c/td>\u003ctd>ヨーロッパ、アフリカ、中東、ロシアなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二地域\u003c/td>\u003ctd>南北アメリカなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第三地域\u003c/td>\u003ctd>アジアの大部分とオセアニアなど\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第三地域は、西の A 線と東の C 線の間の地域（ロシアなどを除く）で、日本は第三地域に入ります。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>無線通信規則 第5条（5.5）（条文を開く）\u003c/summary>\u003cblockquote>（訳）第三地域：東は C 線、西は A 線で区切られた地域。ただし、アルメニア、アゼルバイジャン、ロシア連邦、ジョージア、カザフスタン、モンゴル、ウズベキスタン、トルコ、キルギス、タジキスタン、トルクメニスタン及びウクライナの領域と、ロシア連邦の北の地域を除く。また、この境界の外にあるイランの領域の部分を含む。\u003cbr>Region 3: Region 3 includes the area limited on the east by line C and on the west by line A, except any of the territory of Armenia, Azerbaijan, the Russian Federation, Georgia, Kazakhstan, Mongolia, Uzbekistan, Türkiye, Kyrgyzstan, Tajikistan, Turkmenistan and Ukraine and the area to the north of Russian Federation. It also includes that part of the territory of the Islamic Republic of Iran lying outside of those limits.\u003c/blockquote>\u003cp>\u003ca href=\"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=47\" target=\"_blank\" rel=\"noopener\">ITU の原文（英語）で読む\u003c/a>\u003c/p>\u003c/details>","sections":[{"id":"H10-1","title":"国際電気通信連合の文書"},{"id":"H10-2","title":"周波数の利用と有害な混信"},{"id":"H10-3","title":"遭難の通信と通信の秘密"},{"id":"H10-4","title":"局の許可と識別"},{"id":"H10-5","title":"アマチュア業務のきまり"},{"id":"H10-6","title":"周波数の分配と地域"}],"search":[{"id":"","title":"","text":"電波は国境を越えて届くので、無線通信には世界共通のきまりがあります。3アマの法規には、国際電気通信連合憲章（通信憲章）、国際電気通信連合条約（通信条約）、無線通信規則の簡略な概要が入ります（無線従事者規則第 5 条）。この章では、これらの文書のしくみと、有害な混信、局の許可と識別、アマチュア業務の国際的なきまりを覚えます。 国際法規の条文は、国際電気通信連合（ITU）が発行した英語の原文を載せ、日本語はこの問題集で訳したものです。日本政府の公式の訳とは、言葉が少しちがうことがあります。"},{"id":"H10-1","title":"国際電気通信連合の文書","text":"国際電気通信連合の文書 国際電気通信連合の文書は、国際電気通信連合憲章、国際電気通信連合条約、業務規則の 3 つです（通信憲章第 4 条）。業務規則は、国際電気通信規則と無線通信規則で、すべての構成国（加盟している国）を拘束します。 文書電波法令での呼び方中身国際電気通信連合憲章通信憲章連合のいちばん基本の文書国際電気通信連合条約通信条約憲章を補足する無線通信規則無線通信規則業務規則の 1 つ。周波数の分配、混信の防止、局の識別、業務ごとのきまりなど国際電気通信規則―業務規則の 1 つ。国際電気通信業務の一般原則 通信憲章 第4条第1項（29）（訳）連合の文書は、国際電気通信連合憲章、国際電気通信連合条約及び業務規則とする。 The instruments of the Union are: – this Constitution of the International Telecommunication Union, – the Convention of the International Telecommunication Union, and – the Administrative Regulations. 通信憲章 第4条第3項（31）（条文を開く）（訳）憲章と条約の規定は、さらに、電気通信の利用を規律し、すべての構成国を拘束する次の業務規則の規定によって補足される。国際電気通信規則、無線通信規則。 The provisions of both this Constitution and the Convention are further complemented by those of the Administrative Regulations, enumerated below, which regulate the use of telecommunications and shall be binding on all Member States: – International Telecommunication Regulations, – Radio Regulations.ITU の原文（英語）で読む 文書どうしの規定が矛盾するときは、憲章が条約と業務規則より優先し、条約が業務規則より優先します。 通信憲章 第4条第4項（32）（条文を開く）（訳）憲章の規定と、条約又は業務規則の規定との間に矛盾がある場合には、憲章が優先する。条約の規定と業務規則の規定との間に矛盾がある場合には、条約が優先する。 In the case of inconsistency between a provision of this Constitution and a provision of the Convention or of the Administrative Regulations, the Constitution shall prevail. In the case of inconsistency between a provision of the Convention and a provision of the Administrative Regulations, the Convention shall prevail.ITU の原文（英語）で読む 日本の電波法は、電波に関して条約に別段の定めがあるときは、その規定によると決めています（電波法第 3 条）。電波法令の「通信憲章」「通信条約」「無線通信規則」は、それぞれ上の表の文書のことです（電波法施行規則第 2 条）。 電波法 第3条（電波に関する条約） 第三条 電波に関し条約に別段の定があるときは、その規定による。 電波法施行規則 第2条第1項第3号電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。 三 「無線通信規則」とは、国際電気通信連合憲章に規定する無線通信規則をいう。"},{"id":"H10-2","title":"周波数の利用と有害な混信","text":"周波数の利用と有害な混信 周波数は限られた資源なので、無駄なく使います。構成国は、使う周波数の数とスペクトルを、必要な業務に欠かせない最小限度にするよう努めます（通信憲章第 44 条）。 通信憲章 第44条第1項（195）（条文を開く）（訳）構成国は、必要な業務を満足に提供するために欠くことのできない最小限度に、使用する周波数の数とスペクトルを制限するよう努める。そのため、最新の技術の進歩をできる限り速やかに取り入れるよう努める。 Member States shall endeavour to limit the number of frequencies and the spectrum used to the minimum essential to provide in a satisfactory manner the necessary services. To that end, they shall endeavour to apply the latest technical advances as soon as possible.ITU の原文（英語）で読む 「有害な混信」は、次のように定義されています。通信憲章の附属書と無線通信規則に、同じ定義があります。 無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信 通信憲章 附属書（1003）（条文を開く）（訳）有害な混信：無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信 Harmful Interference: Interference which endangers the functioning of a radionavigation service or of other safety services or seriously degrades, obstructs or repeatedly interrupts a radiocommunication service operating in accordance with the Radio Regulations.ITU の原文（英語）で読む すべての局は、その目的にかかわらず、他の国などの無線業務や無線通信で、無線通信規則に従って運用されているものに、有害な混信を生じさせないように設置し、運用しなければならない（通信憲章第 45 条第 1 項）構成国は、あらゆる種類の電気機器と電気設備の運用が有害な混信を生じさせないよう、実行可能なすべての措置をとる必要があることを認める（第 45 条第 3 項）すべての局は、不要な伝送、過剰な信号の伝送、虚偽の信号やまぎらわしい信号の伝送、識別表示のない信号の伝送を行ってはならない（無線通信規則 15.1）送信局は、満足な業務を確保するために必要な電力だけを輻射しなければならない（無線通信規則 15.2） 通信憲章 第45条第1項（197）（条文を開く）（訳）すべての局は、その目的のいかんを問わず、他の構成国、認められた事業体又は無線業務を行うその他の正当に許可された事業体の無線業務又は無線通信で、無線通信規則に従って運用されるものに、有害な混信を生じさせないように設置し、及び運用しなければならない。 All stations, whatever their purpose, must be established and operated in such a manner as not to cause harmful interference to the radio services or communications of other Member States or of recognized operating agencies, or of other duly authorized operating agencies which carry on a radio service, and which operate in accordance with the provisions of the Radio Regulations.ITU の原文（英語）で読む 無線通信規則 第15条（15.1）（条文を開く）（訳）すべての局は、不要な伝送、過剰な信号の伝送、虚偽の信号やまぎらわしい信号の伝送、識別表示のない信号の伝送（第19条に定める場合を除く。）を行ってはならない。 All stations are forbidden to carry out unnecessary transmissions, or the transmission of superfluous signals, or the transmission of false or misleading signals, or the transmission of signals without identification (except as provided for in Article 19).ITU の原文（英語）で読む"},{"id":"H10-3","title":"遭難の通信と通信の秘密","text":"遭難の通信と通信の秘密 無線局は、遭難の呼出しと通報を、どこから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う（通信憲章第 46 条）構成国は、遭難・緊急・安全・識別の虚偽の信号やまぎらわしい信号の送信を防ぐ措置をとる（第 47 条）構成国は、国際通信の秘密を確保するため、すべての可能な措置をとることを約束する（第 37 条） 通信憲章 第46条（200）（訳）無線局は、遭難の呼出し及び通報を、どこから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う。 Radio stations shall be obliged to accept, with absolute priority, distress calls and messages regardless of their origin, to reply in the same manner to such messages, and immediately to take such action in regard thereto as may be required. 通信憲章 第37条第1項（184）（訳）構成国は、国際通信の秘密を確保するため、使用する電気通信のシステムに適合するすべての可能な措置をとることを約束する。 Member States agree to take all possible measures, compatible with the system of telecommunication used, with a view to ensuring the secrecy of international correspondence. 電波法にも、遭難通信をほかのきまりの例外として扱うことや、通信の秘密の保護など、同じ考え方のきまりがあります（法規の第 5 章）。"},{"id":"H10-4","title":"局の許可と識別","text":"局の許可と識別 個人や企業が送信局を設置し、運用するには、その局が属する国の政府が発給する許可書（日本では無線局の免許）が要ります（無線通信規則 18.1）。 無線通信規則 第18条（18.1）（条文を開く）（訳）個人又はいかなる企業も、その局が属する国の政府が（又は政府に代わって）、適当な形式で、かつ、この規則に従って発給する許可書なしに、送信局を設置し、又は運用してはならない（ただし、18.2、18.8 及び 18.11 を参照）。 No transmitting station may be established or operated by a private person or by any enterprise without a licence issued in an appropriate form and in conformity with the provisions of these Regulations by or on behalf of the government of the country to which the station in question is subject (however, see Nos. 18.2, 18.8 and 18.11).ITU の原文（英語）で読む すべての伝送は、識別信号などで、どの局の伝送か分かるものでなければなりません。虚偽やまぎらわしい識別表示を使う伝送は禁止されています。アマチュア業務の伝送は、識別信号（呼出符号）を伴うものとされています（無線通信規則第 19 条）。 無線通信規則 第19条（19.1）（訳）すべての伝送は、識別信号その他の手段によって識別できるものでなければならない。 All transmissions shall be capable of being identified either by identification signals or by other means. 無線通信規則 第19条（19.4）（条文を開く）（訳）次の業務のすべての伝送は、19.13 から 19.15 までに定める場合を除き、識別信号を伴うものとする。a) アマチュア業務、b) 放送業務、c) 28 000 kHz より低い周波数帯の固定業務、d) 移動業務、e) 標準周波数報時業務 All transmissions in the following services should, except as provided in Nos. 19.13 to 19.15, carry identification signals: a) amateur service; b) broadcasting service; c) fixed service in the bands below 28 000 kHz; d) mobile service; e) standard frequency and time signal service.ITU の原文（英語）で読む アマチュア局の呼出符号は、たとえば「2 文字と 1 個の数字の後に、4 文字以下の集まり（最後は文字）を続けたもの」です（無線通信規則 19.68）。JA1〇〇〇 は、JA の 2 文字と数字の 1 の後に、3 文字の集まりが続く形です。19.68 では数字に 0 と 1 を使わないことになっていますが、アマチュア局にはこの定めは適用されません（19.69）。"},{"id":"H10-5","title":"アマチュア業務のきまり","text":"アマチュア業務のきまり 無線通信規則は、アマチュア業務を次のように定義しています（1.56）。電波法施行規則のアマチュア業務の定義（法規の第 1 章）と、ほぼ同じ中身です。 アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務 無線通信規則 第1条（1.56）（条文を開く）（訳）アマチュア業務：アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務 amateur service: A radiocommunication service for the purpose of self-training, intercommunication and technical investigations carried out by amateurs, that is, by duly authorized persons interested in radio technique solely with a personal aim and without pecuniary interest.ITU の原文（英語）で読む アマチュア衛星業務は、アマチュア業務と同じ目的のために、地球衛星の宇宙局を使う業務です（1.57）。アマチュア業務についてのおもなきまりは、無線通信規則の第 25 条にあります。 番号きまり25.1異なる国のアマチュア局の間の無線通信は、関係国の主管庁が反対を通告していなければ認められる25.2異なる国のアマチュア局の間の伝送は、アマチュア業務の目的に付随する通信と、個人的な性質の通信に限る25.2A異なる国のアマチュア局の間の伝送は、意味を隠すために暗号化してはならない（アマチュア衛星の制御信号は除く）25.3第三者のための国際通信は、緊急の場合と災害救助の場合に限って送信できる25.5モールス符号の送受信の能力を求めるかどうかは、主管庁が決める25.6主管庁は、アマチュア局を運用しようとする者の運用上と技術上の資格を確かめる25.7アマチュア局の最大電力は、関係の主管庁が定める25.8通信憲章、通信条約、無線通信規則の関係するすべての規定は、アマチュア局に適用する25.9アマチュア局は、伝送の間、短い間隔で自局の呼出符号を伝送しなければならない25.9A主管庁は、アマチュア局が災害救助を支える通信に備えられるよう、必要な措置をとることが奨励される25.9B外国の許可を受けた者が一時的に自国にいる間の運用を認めるかどうかは、その国の主管庁が決める 主管庁は、各国で電波の行政をする機関です（日本では総務省）。 無線通信規則 第25条（25.2）（訳）異なる国のアマチュア局の間の伝送は、1.56 に定めるアマチュア業務の目的に付随する通信と、個人的な性質の通信に限る。 Transmissions between amateur stations of different countries shall be limited to communications incidental to the purposes of the amateur service, as defined in No. 1.56 and to remarks of a personal character. 無線通信規則 第25条（25.9）（訳）アマチュア局は、その伝送の間、短い間隔で自局の呼出符号を伝送しなければならない。 During the course of their transmissions, amateur stations shall transmit their call sign at short intervals. 日本の電波法令にも、これに合わせたきまりがあります。たとえば、アマチュア局は長い時間続けて送信するとき、10 分ごとを標準として自局の呼出符号を送ります（無線局運用規則第 30 条、法規の第 6 章・第 9 章）。"},{"id":"H10-6","title":"周波数の分配と地域","text":"周波数の分配と地域 無線通信規則は、周波数を分配するために、世界を第一地域、第二地域、第三地域の 3 つに分けています（無線通信規則 5.2）。同じ周波数帯でも、地域によって分配がちがうことがあります。 地域おもな範囲第一地域ヨーロッパ、アフリカ、中東、ロシアなど第二地域南北アメリカなど第三地域アジアの大部分とオセアニアなど 第三地域は、西の A 線と東の C 線の間の地域（ロシアなどを除く）で、日本は第三地域に入ります。 無線通信規則 第5条（5.5）（条文を開く）（訳）第三地域：東は C 線、西は A 線で区切られた地域。ただし、アルメニア、アゼルバイジャン、ロシア連邦、ジョージア、カザフスタン、モンゴル、ウズベキスタン、トルコ、キルギス、タジキスタン、トルクメニスタン及びウクライナの領域と、ロシア連邦の北の地域を除く。また、この境界の外にあるイランの領域の部分を含む。 Region 3: Region 3 includes the area limited on the east by line C and on the west by line A, except any of the territory of Armenia, Azerbaijan, the Russian Federation, Georgia, Kazakhstan, Mongolia, Uzbekistan, Türkiye, Kyrgyzstan, Tajikistan, Turkmenistan and Ukraine and the area to the north of Russian Federation. It also includes that part of the territory of the Islamic Republic of Iran lying outside of those limits.ITU の原文（英語）で読む"}],"only":"3アマ"},{"id":"K01","subject":"無線工学","num":1,"title":"電気の基礎","html":"\u003cp>無線機の中は、電気の回路でできています。この章では、電圧・電流・抵抗の関係（オームの法則）と、電力の計算を覚えます。どれも計算問題でよく使います。\u003c/p>\n\u003ch3 id=\"K01-1\">電圧・電流・抵抗\u003c/h3>\n\u003cp>電気の流れは、水の流れにたとえると分かりやすくなります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>量\u003c/th>\u003cth>記号\u003c/th>\u003cth>単位\u003c/th>\u003cth>水の流れでいうと\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>電圧\u003c/td>\u003ctd>V（E と書くこともある）\u003c/td>\u003ctd>ボルト〔V〕\u003c/td>\u003ctd>水を押し出す力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電流\u003c/td>\u003ctd>I\u003c/td>\u003ctd>アンペア〔A〕\u003c/td>\u003ctd>流れる水の量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>抵抗\u003c/td>\u003ctd>R\u003c/td>\u003ctd>オーム〔Ω〕\u003c/td>\u003ctd>流れにくさ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K01-2\">オームの法則\u003c/h3>\n\u003cp>電圧は、電流と抵抗をかけたものです。これをオームの法則といいます。\u003c/p>\n\u003cdiv class=\"formula\">V ＝ I × R\u003cbr>I ＝ V ÷ R\u003cbr>R ＝ V ÷ I\u003c/div>\n\u003cp>例：10 Ω の抵抗に 2 A の電流が流れると、抵抗の両端の電圧は 2 × 10 ＝ 20 V です。\u003c/p>\n\u003ch3 id=\"K01-3\">抵抗のつなぎ方\u003c/h3>\n\u003cp>一列につなぐことを直列、横に並べてつなぐことを並列といいます。いくつかの抵抗をまとめて 1 つとみたものを、合成抵抗といいます。\u003c/p>\n\u003cp>直列の合成抵抗は、足し算です。\u003c/p>\n\u003cdiv class=\"formula\">R ＝ R1 ＋ R2\u003c/div>\n\u003cp>並列の合成抵抗は、2 本なら「かけ算 ÷ 足し算」で求めます。\u003c/p>\n\u003cdiv class=\"formula\">R ＝ (R1 × R2) ÷ (R1 ＋ R2)\u003c/div>\n\u003cp>同じ値の抵抗を n 本並列にすると、1 本の n 分の 1 になります。たとえば 10 Ω を 2 本並列にすると 5 Ω です。並列の合成抵抗は、いちばん小さい抵抗より、さらに小さくなります。\u003c/p>\n\u003ch3 id=\"K01-4\">電力と電力量\u003c/h3>\n\u003cp>電力は、電気が 1 秒あたりにする仕事の量で、単位はワット〔W〕です。無線機の送信出力（5 W など）も電力で表します。\u003c/p>\n\u003cdiv class=\"formula\">P ＝ V × I\u003cbr>P ＝ I × I × R\u003cbr>P ＝ V × V ÷ R\u003c/div>\n\u003cp>例：100 V で 2 A 流れる機器の電力は 100 × 2 ＝ 200 W です。\u003c/p>\n\u003cp>電力量は、電力に使った時間をかけたものです。単位はワット時〔Wh〕です。50 W の機器を 2 時間使うと、50 × 2 ＝ 100 Wh です。\u003c/p>\n\u003ch3 id=\"K01-5\">単位の接頭語\u003c/h3>\n\u003cp>大きな数や小さな数は、単位の前に記号を付けて表します。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>記号\u003c/th>\u003cth>読み\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>G\u003c/td>\u003ctd>ギガ\u003c/td>\u003ctd>10 億倍（10⁹）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M\u003c/td>\u003ctd>メガ\u003c/td>\u003ctd>100 万倍（10⁶）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>k\u003c/td>\u003ctd>キロ\u003c/td>\u003ctd>1,000 倍（10³）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>m\u003c/td>\u003ctd>ミリ\u003c/td>\u003ctd>1,000 分の 1（10⁻³）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>μ\u003c/td>\u003ctd>マイクロ\u003c/td>\u003ctd>100 万分の 1（10⁻⁶）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>p\u003c/td>\u003ctd>ピコ\u003c/td>\u003ctd>1 兆分の 1（10⁻¹²）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>例：145 MHz は 145,000 kHz、0.5 A は 500 mA です。\u003c/p>\n\u003ch3 id=\"K01-6\">直流と交流\u003c/h3>\n\u003cp>直流は、電池のように、向きも大きさも変わらない電気です。交流は、家庭のコンセントのように、向きが決まった時間ごとにくり返し変わる電気です。\u003c/p>\n\u003cp>1 秒間のくり返しの回数を周波数といい、単位はヘルツ〔Hz〕です。1 回のくり返しにかかる時間を周期といいます。周期 T〔秒〕は、周波数 f〔Hz〕の逆数です。\u003c/p>\n\u003cdiv class=\"formula\">T ＝ 1 ÷ f\u003c/div>\n\u003cp>例：50 Hz の交流の周期は 1 ÷ 50 ＝ 0.02 秒（20 ミリ秒）です。\u003c/p>","sections":[{"id":"K01-1","title":"電圧・電流・抵抗"},{"id":"K01-2","title":"オームの法則"},{"id":"K01-3","title":"抵抗のつなぎ方"},{"id":"K01-4","title":"電力と電力量"},{"id":"K01-5","title":"単位の接頭語"},{"id":"K01-6","title":"直流と交流"}],"search":[{"id":"","title":"","text":"無線機の中は、電気の回路でできています。この章では、電圧・電流・抵抗の関係（オームの法則）と、電力の計算を覚えます。どれも計算問題でよく使います。"},{"id":"K01-1","title":"電圧・電流・抵抗","text":"電圧・電流・抵抗 電気の流れは、水の流れにたとえると分かりやすくなります。 量記号単位水の流れでいうと電圧V（E と書くこともある）ボルト〔V〕水を押し出す力電流Iアンペア〔A〕流れる水の量抵抗Rオーム〔Ω〕流れにくさ"},{"id":"K01-2","title":"オームの法則","text":"オームの法則 電圧は、電流と抵抗をかけたものです。これをオームの法則といいます。 V ＝ I × R I ＝ V ÷ R R ＝ V ÷ I 例：10 Ω の抵抗に 2 A の電流が流れると、抵抗の両端の電圧は 2 × 10 ＝ 20 V です。"},{"id":"K01-3","title":"抵抗のつなぎ方","text":"抵抗のつなぎ方 一列につなぐことを直列、横に並べてつなぐことを並列といいます。いくつかの抵抗をまとめて 1 つとみたものを、合成抵抗といいます。 直列の合成抵抗は、足し算です。 R ＝ R1 ＋ R2 並列の合成抵抗は、2 本なら「かけ算 ÷ 足し算」で求めます。 R ＝ (R1 × R2) ÷ (R1 ＋ R2) 同じ値の抵抗を n 本並列にすると、1 本の n 分の 1 になります。たとえば 10 Ω を 2 本並列にすると 5 Ω です。並列の合成抵抗は、いちばん小さい抵抗より、さらに小さくなります。"},{"id":"K01-4","title":"電力と電力量","text":"電力と電力量 電力は、電気が 1 秒あたりにする仕事の量で、単位はワット〔W〕です。無線機の送信出力（5 W など）も電力で表します。 P ＝ V × I P ＝ I × I × R P ＝ V × V ÷ R 例：100 V で 2 A 流れる機器の電力は 100 × 2 ＝ 200 W です。 電力量は、電力に使った時間をかけたものです。単位はワット時〔Wh〕です。50 W の機器を 2 時間使うと、50 × 2 ＝ 100 Wh です。"},{"id":"K01-5","title":"単位の接頭語","text":"単位の接頭語 大きな数や小さな数は、単位の前に記号を付けて表します。 記号読み意味Gギガ10 億倍（10⁹）Mメガ100 万倍（10⁶）kキロ1,000 倍（10³）mミリ1,000 分の 1（10⁻³）μマイクロ100 万分の 1（10⁻⁶）pピコ1 兆分の 1（10⁻¹²） 例：145 MHz は 145,000 kHz、0.5 A は 500 mA です。"},{"id":"K01-6","title":"直流と交流","text":"直流と交流 直流は、電池のように、向きも大きさも変わらない電気です。交流は、家庭のコンセントのように、向きが決まった時間ごとにくり返し変わる電気です。 1 秒間のくり返しの回数を周波数といい、単位はヘルツ〔Hz〕です。1 回のくり返しにかかる時間を周期といいます。周期 T〔秒〕は、周波数 f〔Hz〕の逆数です。 T ＝ 1 ÷ f 例：50 Hz の交流の周期は 1 ÷ 50 ＝ 0.02 秒（20 ミリ秒）です。"}],"only":""},{"id":"K02","subject":"無線工学","num":2,"title":"交流とコイル・コンデンサ","html":"\u003cp>無線機は、高い周波数の交流を扱います。この章では、交流の大きさの表し方と、交流に対するコンデンサとコイルの働き、共振を覚えます。共振は、無線機が目的の周波数だけを選ぶしくみの基本です。\u003c/p>\n\u003ch3 id=\"K02-1\">交流の大きさ\u003c/h3>\n\u003cp>交流の電圧は、たえず大きさと向きが変わります。ふつうは、同じ働き（熱）をする直流の大きさに直した「実効値」で表します。\u003c/p>\n\u003cdiv class=\"formula\">実効値 ＝ 最大値 ÷ √2 ≒ 最大値 × 0.707\u003cbr>最大値 ＝ 実効値 × √2 ≒ 実効値 × 1.41\u003c/div>\n\u003cp>例：家庭のコンセントの 100 V は実効値です。最大値は約 141 V です。\u003c/p>\n\u003ch3 id=\"K02-2\">コンデンサ\u003c/h3>\n\u003cp>コンデンサは、2 枚の金属の板（電極）を向かい合わせたものです。電気をためる能力を静電容量といい、単位はファラド〔F〕です。実際には、マイクロファラド〔μF〕やピコファラド〔pF〕を使います。\u003c/p>\n\u003cul>\u003cli>直流は通さない（電気がたまると、電流が止まる）\u003c/li>\u003cli>交流は通す。周波数が高いほど通しやすい\u003c/li>\u003c/ul>\n\u003cp>交流の流れにくさをリアクタンスといい、単位はオーム〔Ω〕です。コンデンサのリアクタンス（容量性リアクタンス）は、周波数が高いほど、静電容量が大きいほど小さくなります。\u003c/p>\n\u003cdiv class=\"formula\">XC ＝ 1 ÷ (2πfC)\u003c/div>\n\u003cp>コンデンサを並列につなぐと、合成の静電容量は足し算になります。直列につなぐと、抵抗の並列と同じ計算になります。抵抗とは逆なので注意します。\u003c/p>\n\u003cdiv class=\"formula\">並列：C ＝ C1 ＋ C2\u003cbr>直列：C ＝ (C1 × C2) ÷ (C1 ＋ C2)\u003c/div>\n\u003ch3 id=\"K02-3\">コイル\u003c/h3>\n\u003cp>コイルは、導線を巻いたものです。電流の変化をさまたげる働きの大きさをインダクタンスといい、単位はヘンリー〔H〕です。\u003c/p>\n\u003cul>\u003cli>直流は通す\u003c/li>\u003cli>交流は通しにくい。周波数が高いほど通しにくい\u003c/li>\u003c/ul>\n\u003cp>コイルのリアクタンス（誘導性リアクタンス）は、周波数が高いほど、インダクタンスが大きいほど大きくなります。\u003c/p>\n\u003cdiv class=\"formula\">XL ＝ 2πfL\u003c/div>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>部品\u003c/th>\u003cth>直流\u003c/th>\u003cth>周波数が高くなると\u003c/th>\u003cth>リアクタンス\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>コンデンサ\u003c/td>\u003ctd>通さない\u003c/td>\u003ctd>通しやすくなる\u003c/td>\u003ctd>XC ＝ 1 ÷ (2πfC)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>コイル\u003c/td>\u003ctd>通す\u003c/td>\u003ctd>通しにくくなる\u003c/td>\u003ctd>XL ＝ 2πfL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K02-4\">共振\u003c/h3>\n\u003cp>コイルとコンデンサを組み合わせると、ある周波数でコイルのリアクタンスとコンデンサのリアクタンスが等しくなります。これを共振といい、その周波数を共振周波数といいます。\u003c/p>\n\u003cdiv class=\"formula\">f ＝ 1 ÷ (2π√(LC))\u003c/div>\n\u003cul>\u003cli>直列共振：コイルとコンデンサを直列につなぐと、共振周波数でインピーダンス（交流の流れにくさ）が最小になり、電流が最大になる\u003c/li>\u003cli>並列共振：並列につなぐと、共振周波数でインピーダンスが最大になる\u003c/li>\u003c/ul>\n\u003cp>コイルのインダクタンスかコンデンサの静電容量を大きくすると、共振周波数は低くなります。無線機は、共振回路で目的の周波数を選んでいます。これを同調といいます。\u003c/p>\n\u003ch3 id=\"K02-5\">変圧器\u003c/h3>\n\u003cp>変圧器（トランス）は、鉄心に 2 つのコイルを巻いたものです。交流の電圧を変えられます。電圧の比は、巻数の比と同じです。\u003c/p>\n\u003cdiv class=\"formula\">V2 ÷ V1 ＝ N2 ÷ N1\u003c/div>\n\u003cp>例：1 次側 100 回巻きに 100 V の交流を加えると、2 次側 20 回巻きには 100 × 20 ÷ 100 ＝ 20 V が出ます。変圧器で、直流の電圧は変えられません。\u003c/p>","sections":[{"id":"K02-1","title":"交流の大きさ"},{"id":"K02-2","title":"コンデンサ"},{"id":"K02-3","title":"コイル"},{"id":"K02-4","title":"共振"},{"id":"K02-5","title":"変圧器"}],"search":[{"id":"","title":"","text":"無線機は、高い周波数の交流を扱います。この章では、交流の大きさの表し方と、交流に対するコンデンサとコイルの働き、共振を覚えます。共振は、無線機が目的の周波数だけを選ぶしくみの基本です。"},{"id":"K02-1","title":"交流の大きさ","text":"交流の大きさ 交流の電圧は、たえず大きさと向きが変わります。ふつうは、同じ働き（熱）をする直流の大きさに直した「実効値」で表します。 実効値 ＝ 最大値 ÷ √2 ≒ 最大値 × 0.707 最大値 ＝ 実効値 × √2 ≒ 実効値 × 1.41 例：家庭のコンセントの 100 V は実効値です。最大値は約 141 V です。"},{"id":"K02-2","title":"コンデンサ","text":"コンデンサ コンデンサは、2 枚の金属の板（電極）を向かい合わせたものです。電気をためる能力を静電容量といい、単位はファラド〔F〕です。実際には、マイクロファラド〔μF〕やピコファラド〔pF〕を使います。 直流は通さない（電気がたまると、電流が止まる）交流は通す。周波数が高いほど通しやすい 交流の流れにくさをリアクタンスといい、単位はオーム〔Ω〕です。コンデンサのリアクタンス（容量性リアクタンス）は、周波数が高いほど、静電容量が大きいほど小さくなります。 XC ＝ 1 ÷ (2πfC) コンデンサを並列につなぐと、合成の静電容量は足し算になります。直列につなぐと、抵抗の並列と同じ計算になります。抵抗とは逆なので注意します。 並列：C ＝ C1 ＋ C2 直列：C ＝ (C1 × C2) ÷ (C1 ＋ C2)"},{"id":"K02-3","title":"コイル","text":"コイル コイルは、導線を巻いたものです。電流の変化をさまたげる働きの大きさをインダクタンスといい、単位はヘンリー〔H〕です。 直流は通す交流は通しにくい。周波数が高いほど通しにくい コイルのリアクタンス（誘導性リアクタンス）は、周波数が高いほど、インダクタンスが大きいほど大きくなります。 XL ＝ 2πfL 部品直流周波数が高くなるとリアクタンスコンデンサ通さない通しやすくなるXC ＝ 1 ÷ (2πfC)コイル通す通しにくくなるXL ＝ 2πfL"},{"id":"K02-4","title":"共振","text":"共振 コイルとコンデンサを組み合わせると、ある周波数でコイルのリアクタンスとコンデンサのリアクタンスが等しくなります。これを共振といい、その周波数を共振周波数といいます。 f ＝ 1 ÷ (2π√(LC)) 直列共振：コイルとコンデンサを直列につなぐと、共振周波数でインピーダンス（交流の流れにくさ）が最小になり、電流が最大になる並列共振：並列につなぐと、共振周波数でインピーダンスが最大になる コイルのインダクタンスかコンデンサの静電容量を大きくすると、共振周波数は低くなります。無線機は、共振回路で目的の周波数を選んでいます。これを同調といいます。"},{"id":"K02-5","title":"変圧器","text":"変圧器 変圧器（トランス）は、鉄心に 2 つのコイルを巻いたものです。交流の電圧を変えられます。電圧の比は、巻数の比と同じです。 V2 ÷ V1 ＝ N2 ÷ N1 例：1 次側 100 回巻きに 100 V の交流を加えると、2 次側 20 回巻きには 100 × 20 ÷ 100 ＝ 20 V が出ます。変圧器で、直流の電圧は変えられません。"}],"only":""},{"id":"K03","subject":"無線工学","num":3,"title":"半導体と電子回路","html":"\u003cp>無線機の中では、ダイオードやトランジスタなどの半導体が働いています。この章では、半導体の種類と働き、増幅と発振のしくみを覚えます。\u003c/p>\n\u003ch3 id=\"K03-1\">半導体\u003c/h3>\n\u003cp>電気をよく通す物質を導体（銅など）、ほとんど通さない物質を絶縁体（ガラス、ゴムなど）といいます。その中間の性質をもつものが半導体で、シリコンやゲルマニウムなどがあります。\u003c/p>\n\u003cp>半導体には、自由電子がおもに電気を運ぶ N 形と、正孔（ホール）がおもに電気を運ぶ P 形があります。P 形と N 形を組み合わせて、ダイオードやトランジスタを作ります。\u003c/p>\n\u003ch3 id=\"K03-2\">ダイオード\u003c/h3>\n\u003cp>ダイオードは、P 形と N 形をつないだ部品です。P 形の側をアノード、N 形の側をカソードといいます。アノードからカソードへの向き（順方向）には電流がよく流れ、逆の向き（逆方向）にはほとんど流れません。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>種類\u003c/th>\u003cth>働き\u003c/th>\u003cth>使い方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>整流用ダイオード\u003c/td>\u003ctd>一方向にだけ電流を流す\u003c/td>\u003ctd>交流を直流に変える（整流）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ツェナーダイオード\u003c/td>\u003ctd>逆方向の電圧がある値を超えると電流が流れ、両端の電圧がほぼ一定になる\u003c/td>\u003ctd>定電圧回路\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可変容量ダイオード\u003c/td>\u003ctd>逆方向に加える電圧の大きさで、静電容量が変わる\u003c/td>\u003ctd>FM の変調、電子同調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>発光ダイオード（LED）\u003c/td>\u003ctd>順方向に電流を流すと光る\u003c/td>\u003ctd>表示灯、照明\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K03-3\">トランジスタと FET\u003c/h3>\n\u003cp>トランジスタには NPN 形と PNP 形があり、エミッタ（E）、ベース（B）、コレクタ（C）の 3 つの電極があります。ベースに流す小さな電流で、コレクタに流れる大きな電流を制御できます。これが増幅です。\u003c/p>\n\u003cp>FET（電界効果トランジスタ）は、ソース（S）、ゲート（G）、ドレイン（D）の 3 つの電極をもち、ゲートの電圧でドレインの電流を制御します。入力インピーダンスが高い（入力側にほとんど電流が流れない）のが特徴です。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>部品\u003c/th>\u003cth>電極\u003c/th>\u003cth>制御のしかた\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>トランジスタ\u003c/td>\u003ctd>エミッタ・ベース・コレクタ\u003c/td>\u003ctd>ベースの電流でコレクタの電流を制御する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FET\u003c/td>\u003ctd>ソース・ゲート・ドレイン\u003c/td>\u003ctd>ゲートの電圧でドレインの電流を制御する\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K03-4\">増幅回路\u003c/h3>\n\u003cp>小さな信号を大きくする回路を、増幅回路といいます。信号のどの範囲で電流を流すかによって、A 級、B 級、C 級に分けます。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>級\u003c/th>\u003cth>特徴\u003c/th>\u003cth>おもな使い方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A 級\u003c/td>\u003ctd>ひずみが少ないが、効率が低い\u003c/td>\u003ctd>小さな信号の増幅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B 級\u003c/td>\u003ctd>A 級より効率がよい。2 つを組み合わせて使う（プッシュプル）\u003c/td>\u003ctd>低周波の電力増幅、SSB の電力増幅（AB 級も使う）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C 級\u003c/td>\u003ctd>効率がいちばんよいが、ひずみが大きい\u003c/td>\u003ctd>電信や FM の電力増幅、周波数逓倍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>SSB の電波の電力増幅には、波形をくずさない、直線性のよい増幅（A 級、B 級、AB 級）が要ります。C 級増幅はひずみが大きいので、振幅が変わらない電信や FM の電力増幅に使います。\u003c/p>\n\u003ch3 id=\"K03-5\">発振回路\u003c/h3>\n\u003cp>増幅した出力の一部を、同じ位相で入力に戻すこと（正帰還）で、一定の周波数の交流を作り続ける回路を、発振回路といいます。送信機の電波のもとや、受信機の局部発振器に使います。\u003c/p>\n\u003cp>水晶発振器は、水晶片の性質を利用した発振器で、周波数がとても安定しています。多くの周波数を安定して作りたいときは、水晶発振器を基準にした PLL 周波数シンセサイザを使います。\u003c/p>","sections":[{"id":"K03-1","title":"半導体"},{"id":"K03-2","title":"ダイオード"},{"id":"K03-3","title":"トランジスタと FET"},{"id":"K03-4","title":"増幅回路"},{"id":"K03-5","title":"発振回路"}],"search":[{"id":"","title":"","text":"無線機の中では、ダイオードやトランジスタなどの半導体が働いています。この章では、半導体の種類と働き、増幅と発振のしくみを覚えます。"},{"id":"K03-1","title":"半導体","text":"半導体 電気をよく通す物質を導体（銅など）、ほとんど通さない物質を絶縁体（ガラス、ゴムなど）といいます。その中間の性質をもつものが半導体で、シリコンやゲルマニウムなどがあります。 半導体には、自由電子がおもに電気を運ぶ N 形と、正孔（ホール）がおもに電気を運ぶ P 形があります。P 形と N 形を組み合わせて、ダイオードやトランジスタを作ります。"},{"id":"K03-2","title":"ダイオード","text":"ダイオード ダイオードは、P 形と N 形をつないだ部品です。P 形の側をアノード、N 形の側をカソードといいます。アノードからカソードへの向き（順方向）には電流がよく流れ、逆の向き（逆方向）にはほとんど流れません。 種類働き使い方整流用ダイオード一方向にだけ電流を流す交流を直流に変える（整流）ツェナーダイオード逆方向の電圧がある値を超えると電流が流れ、両端の電圧がほぼ一定になる定電圧回路可変容量ダイオード逆方向に加える電圧の大きさで、静電容量が変わるFM の変調、電子同調発光ダイオード（LED）順方向に電流を流すと光る表示灯、照明"},{"id":"K03-3","title":"トランジスタと FET","text":"トランジスタと FET トランジスタには NPN 形と PNP 形があり、エミッタ（E）、ベース（B）、コレクタ（C）の 3 つの電極があります。ベースに流す小さな電流で、コレクタに流れる大きな電流を制御できます。これが増幅です。 FET（電界効果トランジスタ）は、ソース（S）、ゲート（G）、ドレイン（D）の 3 つの電極をもち、ゲートの電圧でドレインの電流を制御します。入力インピーダンスが高い（入力側にほとんど電流が流れない）のが特徴です。 部品電極制御のしかたトランジスタエミッタ・ベース・コレクタベースの電流でコレクタの電流を制御するFETソース・ゲート・ドレインゲートの電圧でドレインの電流を制御する"},{"id":"K03-4","title":"増幅回路","text":"増幅回路 小さな信号を大きくする回路を、増幅回路といいます。信号のどの範囲で電流を流すかによって、A 級、B 級、C 級に分けます。 級特徴おもな使い方A 級ひずみが少ないが、効率が低い小さな信号の増幅B 級A 級より効率がよい。2 つを組み合わせて使う（プッシュプル）低周波の電力増幅、SSB の電力増幅（AB 級も使う）C 級効率がいちばんよいが、ひずみが大きい電信や FM の電力増幅、周波数逓倍 SSB の電波の電力増幅には、波形をくずさない、直線性のよい増幅（A 級、B 級、AB 級）が要ります。C 級増幅はひずみが大きいので、振幅が変わらない電信や FM の電力増幅に使います。"},{"id":"K03-5","title":"発振回路","text":"発振回路 増幅した出力の一部を、同じ位相で入力に戻すこと（正帰還）で、一定の周波数の交流を作り続ける回路を、発振回路といいます。送信機の電波のもとや、受信機の局部発振器に使います。 水晶発振器は、水晶片の性質を利用した発振器で、周波数がとても安定しています。多くの周波数を安定して作りたいときは、水晶発振器を基準にした PLL 周波数シンセサイザを使います。"}],"only":""},{"id":"K04","subject":"無線工学","num":4,"title":"変調と送信機","html":"\u003cp>声を電波に乗せることを変調といいます。この章では、AM・FM・SSB の変調のちがいと、送信機の中のしくみを覚えます。\u003c/p>\n\u003ch3 id=\"K04-1\">変調の種類\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>変調\u003c/th>\u003cth>電波の型式\u003c/th>\u003cth>声に合わせて変えるもの\u003c/th>\u003cth>特徴\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>AM（振幅変調）\u003c/td>\u003ctd>A3E\u003c/td>\u003ctd>搬送波の振幅（強さ）\u003c/td>\u003ctd>しくみが簡単。雑音の影響を受けやすい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FM（周波数変調）\u003c/td>\u003ctd>F3E\u003c/td>\u003ctd>搬送波の周波数\u003c/td>\u003ctd>雑音に強く、音がよい。占有周波数帯幅が広い\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSB（単側波帯）\u003c/td>\u003ctd>J3E\u003c/td>\u003ctd>AM の片方の側波帯だけを送る\u003c/td>\u003ctd>占有周波数帯幅が AM の約半分。電力の効率がよい\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>AM の電波は、搬送波と、その上下にできる側波帯（上側波帯と下側波帯）からできています。占有周波数帯幅は、声の最高周波数の 2 倍です。SSB は、搬送波ともう片方の側波帯を取り除いて、片方の側波帯だけを送ります。\u003c/p>\n\u003cp>例：3 kHz までの声を AM で送ると、占有周波数帯幅は 3 × 2 ＝ 6 kHz です。SSB なら約 3 kHz です。\u003c/p>\n\u003ch3 id=\"K04-2\">変調度と過変調\u003c/h3>\n\u003cp>AM で、声によって搬送波の振幅がどれだけ変わるかを変調度といいます。変調度が 100 パーセントを超えることを過変調といいます。過変調になると、波形がひずみ、占有周波数帯幅が広がって、ほかの通信に混信を与える原因になります。\u003c/p>\n\u003cp>FM で、声に応じて周波数がずれる量を周波数偏移といいます。\u003c/p>\n\u003ch3 id=\"K04-3\">AM 送信機の構成\u003c/h3>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"発振器 → 緩衝増幅器 → 周波数逓倍器 → 励振増幅器 → 電力増幅器 → 空中線\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">発振器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">緩衝増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数逓倍器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">励振増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">電力増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">空中線\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>発振器：電波のもとになる、一定の周波数の交流を作る\u003c/li>\u003cli>緩衝増幅器：後ろの段の影響で、発振器の周波数が変わらないようにする\u003c/li>\u003cli>周波数逓倍器：周波数を整数倍（2 倍、3 倍など）にする\u003c/li>\u003cli>電力増幅器：必要な電力まで増幅する。AM では、ここに変調器から音声の信号を加えて変調することが多い\u003c/li>\u003c/ul>\n\u003ch3 id=\"K04-4\">FM 送信機の構成\u003c/h3>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"マイクロホン → 音声増幅器 → IDC 回路 → 変調器。発振器 → 変調器 → 周波数逓倍器 → 電力増幅器 → 空中線\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">マイクロホン\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">音声増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">IDC 回路\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">変調器\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan class=\"box\">発振器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">変調器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数逓倍器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">電力増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">空中線\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>IDC 回路（瞬時偏移制御回路）：声が大きくても、周波数偏移が決められた値を超えないようにする\u003c/li>\u003cli>周波数逓倍器：周波数を整数倍にすると、周波数偏移も同じ倍数になる\u003c/li>\u003cli>プリエンファシス：送信側で、声の高い音を強めて送る。受信側のディエンファシスで元に戻し、雑音を減らす\u003c/li>\u003c/ul>\n\u003ch3 id=\"K04-5\">SSB 送信機の構成\u003c/h3>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"音声増幅器 → 平衡変調器 → 帯域フィルタ → 周波数混合器 → 電力増幅器 → 空中線。搬送波発振器 → 平衡変調器\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">音声増幅器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">平衡変調器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">帯域フィルタ\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数混合器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">電力増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">空中線\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan class=\"box\">搬送波発振器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">平衡変調器\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>平衡変調器：搬送波を打ち消して、上下の側波帯だけを出す\u003c/li>\u003cli>帯域フィルタ：片方の側波帯だけを通す\u003c/li>\u003cli>電力増幅器：波形をくずさない直線増幅（A 級、B 級、AB 級）を使う\u003c/li>\u003c/ul>\n\u003ch3 id=\"K04-6\">送信機を使うときの注意\u003c/h3>\n\u003cul>\u003cli>調整は、擬似空中線（ダミーロード）をつないで行う\u003c/li>\u003cli>AM では過変調にしない。FM では、周波数偏移を大きくしすぎない\u003c/li>\u003cli>送信機の出力に低域フィルタ（LPF）を入れて、高調波を減らす（第 6 章）\u003c/li>\u003c/ul>","sections":[{"id":"K04-1","title":"変調の種類"},{"id":"K04-2","title":"変調度と過変調"},{"id":"K04-3","title":"AM 送信機の構成"},{"id":"K04-4","title":"FM 送信機の構成"},{"id":"K04-5","title":"SSB 送信機の構成"},{"id":"K04-6","title":"送信機を使うときの注意"}],"search":[{"id":"","title":"","text":"声を電波に乗せることを変調といいます。この章では、AM・FM・SSB の変調のちがいと、送信機の中のしくみを覚えます。"},{"id":"K04-1","title":"変調の種類","text":"変調の種類 変調電波の型式声に合わせて変えるもの特徴AM（振幅変調）A3E搬送波の振幅（強さ）しくみが簡単。雑音の影響を受けやすいFM（周波数変調）F3E搬送波の周波数雑音に強く、音がよい。占有周波数帯幅が広いSSB（単側波帯）J3EAM の片方の側波帯だけを送る占有周波数帯幅が AM の約半分。電力の効率がよい AM の電波は、搬送波と、その上下にできる側波帯（上側波帯と下側波帯）からできています。占有周波数帯幅は、声の最高周波数の 2 倍です。SSB は、搬送波ともう片方の側波帯を取り除いて、片方の側波帯だけを送ります。 例：3 kHz までの声を AM で送ると、占有周波数帯幅は 3 × 2 ＝ 6 kHz です。SSB なら約 3 kHz です。"},{"id":"K04-2","title":"変調度と過変調","text":"変調度と過変調 AM で、声によって搬送波の振幅がどれだけ変わるかを変調度といいます。変調度が 100 パーセントを超えることを過変調といいます。過変調になると、波形がひずみ、占有周波数帯幅が広がって、ほかの通信に混信を与える原因になります。 FM で、声に応じて周波数がずれる量を周波数偏移といいます。"},{"id":"K04-3","title":"AM 送信機の構成","text":"AM 送信機の構成 発振器→緩衝増幅器→周波数逓倍器→励振増幅器→電力増幅器→空中線 発振器：電波のもとになる、一定の周波数の交流を作る緩衝増幅器：後ろの段の影響で、発振器の周波数が変わらないようにする周波数逓倍器：周波数を整数倍（2 倍、3 倍など）にする電力増幅器：必要な電力まで増幅する。AM では、ここに変調器から音声の信号を加えて変調することが多い"},{"id":"K04-4","title":"FM 送信機の構成","text":"FM 送信機の構成 マイクロホン→音声増幅器→IDC 回路→変調器発振器→変調器→周波数逓倍器→電力増幅器→空中線 IDC 回路（瞬時偏移制御回路）：声が大きくても、周波数偏移が決められた値を超えないようにする周波数逓倍器：周波数を整数倍にすると、周波数偏移も同じ倍数になるプリエンファシス：送信側で、声の高い音を強めて送る。受信側のディエンファシスで元に戻し、雑音を減らす"},{"id":"K04-5","title":"SSB 送信機の構成","text":"SSB 送信機の構成 音声増幅器→平衡変調器→帯域フィルタ→周波数混合器→電力増幅器→空中線搬送波発振器→平衡変調器 平衡変調器：搬送波を打ち消して、上下の側波帯だけを出す帯域フィルタ：片方の側波帯だけを通す電力増幅器：波形をくずさない直線増幅（A 級、B 級、AB 級）を使う"},{"id":"K04-6","title":"送信機を使うときの注意","text":"送信機を使うときの注意 調整は、擬似空中線（ダミーロード）をつないで行うAM では過変調にしない。FM では、周波数偏移を大きくしすぎない送信機の出力に低域フィルタ（LPF）を入れて、高調波を減らす（第 6 章）"}],"only":""},{"id":"K05","subject":"無線工学","num":5,"title":"受信機","html":"\u003cp>受信機は、空中線に届いたたくさんの電波の中から目的の電波を選び、声に戻します。この章では、スーパーヘテロダイン受信機のしくみと、FM 受信機・SSB 受信機の回路を覚えます。\u003c/p>\n\u003ch3 id=\"K05-1\">受信機の性能\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>性能\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>感度\u003c/td>\u003ctd>どれだけ弱い電波まで受信できるか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>選択度\u003c/td>\u003ctd>近くの周波数の電波と分けて、目的の電波だけを選び出せるか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>忠実度\u003c/td>\u003ctd>送られた音を、どれだけ忠実に再現できるか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安定度\u003c/td>\u003ctd>周波数や感度が、時間がたっても変わらないか\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K05-2\">スーパーヘテロダイン受信機\u003c/h3>\n\u003cp>受信した電波を、いったん一定の周波数（中間周波数）に変えてから増幅する受信機を、スーパーヘテロダイン受信機といいます。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"空中線 → 高周波増幅器 → 周波数混合器 → 中間周波増幅器 → 検波器 → 低周波増幅器 → スピーカー。局部発振器 → 周波数混合器\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">空中線\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">高周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数混合器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">中間周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">検波器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">低周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">スピーカー\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan class=\"box\">局部発振器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数混合器\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>高周波増幅器：受信した電波を増幅する。感度をよくし、影像周波数による妨害を減らす\u003c/li>\u003cli>周波数混合器と局部発振器：受信した電波と局部発振器の出力をまぜて、中間周波数に変える（周波数変換）\u003c/li>\u003cli>中間周波増幅器：中間周波数で増幅する。受信機の選択度は、おもにここで決まる\u003c/li>\u003cli>検波器：中間周波数の信号から、音声の信号を取り出す\u003c/li>\u003cli>低周波増幅器：音声の信号を、スピーカーを鳴らせる大きさまで増幅する\u003c/li>\u003c/ul>\n\u003cp>中間周波数は、局部発振周波数と受信周波数の差です。\u003c/p>\n\u003cdiv class=\"formula\">中間周波数 ＝ 局部発振周波数 － 受信周波数（局部発振周波数が高いとき）\u003c/div>\n\u003ch3 id=\"K05-3\">影像周波数\u003c/h3>\n\u003cp>局部発振周波数から見て、受信周波数と反対側に中間周波数だけ離れた周波数の電波も、同じ中間周波数に変換されてしまいます。この周波数を影像周波数（イメージ周波数）といい、混信の原因になります。\u003c/p>\n\u003cdiv class=\"formula\">影像周波数 ＝ 受信周波数 ＋ 中間周波数 × 2（局部発振周波数が受信周波数より高いとき）\u003c/div>\n\u003cp>例：受信周波数 145.0 MHz、中間周波数 10.7 MHz、局部発振周波数 155.7 MHz のとき、影像周波数は 145.0 ＋ 10.7 × 2 ＝ 166.4 MHz です。\u003c/p>\n\u003cp>影像周波数による妨害は、高周波増幅器の同調回路の選択度をよくしたり、中間周波数を高くしたりすると減らせます。\u003c/p>\n\u003ch3 id=\"K05-4\">AGC\u003c/h3>\n\u003cp>受信する電波の強さが変わっても、出力（音の大きさ）をほぼ一定に保つ回路を、AGC（自動利得調整）回路といいます。フェージングで電波の強さが変わるときに役立ちます。\u003c/p>\n\u003ch3 id=\"K05-5\">FM 受信機\u003c/h3>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"空中線 → 高周波増幅器 → 周波数混合器 → 中間周波増幅器 → 振幅制限器 → 周波数弁別器 → 低周波増幅器 → スピーカー\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">空中線\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">高周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数混合器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">中間周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">振幅制限器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">周波数弁別器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">低周波増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">スピーカー\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>振幅制限器（リミッタ）：振幅を一定にそろえて、振幅の変化として入ってくる雑音を取り除く\u003c/li>\u003cli>周波数弁別器：周波数の変化を、音声の信号に変える（FM の検波）\u003c/li>\u003cli>スケルチ回路：電波が来ていないときに出る大きな雑音を消す（UV-5R Mini のメニュー 2-2 Squelch もこれ）\u003c/li>\u003cli>ディエンファシス回路：送信側で強めた高い音を、元に戻す\u003c/li>\u003c/ul>\n\u003ch3 id=\"K05-6\">SSB 受信機\u003c/h3>\n\u003cp>SSB の電波には搬送波がないので、受信機の中で搬送波の代わりの信号を作って加え、音声を取り出します。この信号を作る発振器を BFO（うなり周波数発振器）、音声を取り出す検波器をプロダクト検波器（積検波器）といいます。電信（A1A）を聞くときも、BFO を使ってモールス符号を音にします。\u003c/p>","sections":[{"id":"K05-1","title":"受信機の性能"},{"id":"K05-2","title":"スーパーヘテロダイン受信機"},{"id":"K05-3","title":"影像周波数"},{"id":"K05-4","title":"AGC"},{"id":"K05-5","title":"FM 受信機"},{"id":"K05-6","title":"SSB 受信機"
