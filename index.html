。\u003c/p>\n\u003ch3 id=\"H01-1\">電波法と命令\u003c/h3>\n\u003cp>電波のきまりは、国会が作る法律（電波法）と、それを細かく決める命令に分かれています。この問題集で根拠に出てくるのは、次の 7 つです。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>名前\u003c/th>\u003cth>種類\u003c/th>\u003cth>おもな中身\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>電波法\u003c/td>\u003ctd>法律\u003c/td>\u003ctd>電波を使うときの基本のきまり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電波法施行令\u003c/td>\u003ctd>政令\u003c/td>\u003ctd>無線従事者が操作できる範囲など\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電波法施行規則\u003c/td>\u003ctd>総務省令\u003c/td>\u003ctd>無線通信の業務や無線局の種類の定義など\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線局運用規則\u003c/td>\u003ctd>総務省令\u003c/td>\u003ctd>呼出しのしかたなど、運用のきまり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線従事者規則\u003c/td>\u003ctd>総務省令\u003c/td>\u003ctd>国家試験や免許証のきまり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線局免許手続規則\u003c/td>\u003ctd>総務省令\u003c/td>\u003ctd>免許の申請や再免許の手続き\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線設備規則\u003c/td>\u003ctd>総務省令\u003c/td>\u003ctd>電波の質、送信設備や受信設備の条件\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"H01-2\">電波法の目的\u003c/h3>\n\u003cp>電波法の第 1 条に、目的が書かれています。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_1\" target=\"_blank\" rel=\"noopener\">電波法 第1条\u003c/a>\u003c/figcaption>\u003cblockquote>（目的）\u003cbr>第一条　この法律は、電波の公平且つ能率的な利用を確保することによつて、公共の福祉を増進することを目的とする。\u003c/blockquote>\u003c/figure>\n\u003cp>「公平」はみんなで分け合って使えること、「能率的」はむだなく使えることです。電波は限られた資源なので、決まりを守って使うことで、社会全体の役に立ちます。これを「公共の福祉を増進する」といいます。\u003c/p>\n\u003ch3 id=\"H01-3\">用語の定義\u003c/h3>\n\u003cp>電波法の第 2 条で、6 つの言葉の意味が決められています。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>言葉\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>電波\u003c/td>\u003ctd>300 万メガヘルツ以下の周波数の電磁波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線電信\u003c/td>\u003ctd>電波を利用して、符号を送り、又は受けるための通信設備\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線電話\u003c/td>\u003ctd>電波を利用して、音声その他の音響を送り、又は受けるための通信設備\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線設備\u003c/td>\u003ctd>無線電信、無線電話その他電波を送り、又は受けるための電気的設備\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線局\u003c/td>\u003ctd>無線設備と、無線設備の操作を行う者の総体。受信のみを目的とするものを含まない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線従事者\u003c/td>\u003ctd>無線設備の操作又はその監督を行う者で、総務大臣の免許を受けたもの\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2\" target=\"_blank\" rel=\"noopener\">電波法 第2条\u003c/a>\u003c/figcaption>\u003cblockquote>（定義）\u003cbr>第二条　この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。\u003cbr>一　「電波」とは、三百万メガヘルツ以下の周波数の電磁波をいう。\u003cbr>二　「無線電信」とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。\u003cbr>三　「無線電話」とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。\u003cbr>四　「無線設備」とは、無線電信、無線電話その他電波を送り、又は受けるための電気的設備をいう。\u003cbr>五　「無線局」とは、無線設備及び無線設備の操作を行う者の総体をいう。但し、受信のみを目的とするものを含まない。\u003cbr>六　「無線従事者」とは、無線設備の操作又はその監督を行う者であつて、総務大臣の免許を受けたものをいう。\u003c/blockquote>\u003c/figure>\n\u003cp>覚えるこつ：\u003c/p>\n\u003cul>\u003cli>無線電信は「符号」、無線電話は「音声その他の音響」を送ります。\u003c/li>\u003cli>無線設備は「電気的設備」です。無線局は、設備と人（操作を行う者）をあわせた「総体」です。\u003c/li>\u003cli>受信のみを目的とするものは、無線局ではありません。聞くだけなら免許は要りません。\u003c/li>\u003cli>無線従事者は、試験に受かっただけではなく、総務大臣の「免許を受けた」人です。\u003c/li>\u003cli>300 万メガヘルツは、3,000 ギガヘルツ（3 テラヘルツ）です。\u003c/li>\u003c/ul>\n\u003ch3 id=\"H01-4\">アマチュア業務とアマチュア局\u003c/h3>\n\u003cp>アマチュア無線の業務は、電波法施行規則の第 3 条で決められています。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_3-Pr_1-It_15\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第3条第1項第15号\u003c/a>\u003c/figcaption>\u003cblockquote>宇宙無線通信の業務以外の無線通信業務を次のとおり分類し、それぞれ当該各号に定めるとおり定義する。\u003cbr>十五　アマチュア業務　金銭上の利益のためでなく、もつぱら個人的な無線技術の興味によつて行う自己訓練、通信及び技術的研究その他総務大臣が別に告示する業務を行う無線通信業務をいう。\u003c/blockquote>\u003c/figure>\n\u003cp>ポイントは「金銭上の利益のためでなく」と「個人的な無線技術の興味によって」の 2 つです。お金をもらう仕事や、会社の連絡には使えません。\u003c/p>\n\u003cp>アマチュア業務を行う無線局が、アマチュア局です（電波法施行規則 第 4 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4-Pr_1-It_24\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第4条第1項第24号\u003c/a>\u003c/figcaption>\u003cblockquote>無線局の種別を次のとおり定め、それぞれ当該各号に定めるとおり定義する。\u003cbr>二十四　アマチュア局　アマチュア業務を行う無線局をいう。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H01-1","title":"電波法と命令"},{"id":"H01-2","title":"電波法の目的"},{"id":"H01-3","title":"用語の定義"},{"id":"H01-4","title":"アマチュア業務とアマチュア局"}],"search":[{"id":"","title":"","text":"法規の試験は、電波法と、電波法にもとづく命令（政令や総務省令）から出ます。この章では、電波法がなんのための法律か（目的）と、法律の中で使う言葉の意味（定義）を覚えます。"},{"id":"H01-1","title":"電波法と命令","text":"電波法と命令 電波のきまりは、国会が作る法律（電波法）と、それを細かく決める命令に分かれています。この問題集で根拠に出てくるのは、次の 7 つです。 名前種類おもな中身電波法法律電波を使うときの基本のきまり電波法施行令政令無線従事者が操作できる範囲など電波法施行規則総務省令無線通信の業務や無線局の種類の定義など無線局運用規則総務省令呼出しのしかたなど、運用のきまり無線従事者規則総務省令国家試験や免許証のきまり無線局免許手続規則総務省令免許の申請や再免許の手続き無線設備規則総務省令電波の質、送信設備や受信設備の条件"},{"id":"H01-2","title":"電波法の目的","text":"電波法の目的 電波法の第 1 条に、目的が書かれています。 電波法 第1条（目的） 第一条 この法律は、電波の公平且つ能率的な利用を確保することによつて、公共の福祉を増進することを目的とする。 「公平」はみんなで分け合って使えること、「能率的」はむだなく使えることです。電波は限られた資源なので、決まりを守って使うことで、社会全体の役に立ちます。これを「公共の福祉を増進する」といいます。"},{"id":"H01-3","title":"用語の定義","text":"用語の定義 電波法の第 2 条で、6 つの言葉の意味が決められています。 言葉意味電波300 万メガヘルツ以下の周波数の電磁波無線電信電波を利用して、符号を送り、又は受けるための通信設備無線電話電波を利用して、音声その他の音響を送り、又は受けるための通信設備無線設備無線電信、無線電話その他電波を送り、又は受けるための電気的設備無線局無線設備と、無線設備の操作を行う者の総体。受信のみを目的とするものを含まない無線従事者無線設備の操作又はその監督を行う者で、総務大臣の免許を受けたもの 電波法 第2条（定義） 第二条 この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。 一 「電波」とは、三百万メガヘルツ以下の周波数の電磁波をいう。 二 「無線電信」とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。 三 「無線電話」とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。 四 「無線設備」とは、無線電信、無線電話その他電波を送り、又は受けるための電気的設備をいう。 五 「無線局」とは、無線設備及び無線設備の操作を行う者の総体をいう。但し、受信のみを目的とするものを含まない。 六 「無線従事者」とは、無線設備の操作又はその監督を行う者であつて、総務大臣の免許を受けたものをいう。 覚えるこつ： 無線電信は「符号」、無線電話は「音声その他の音響」を送ります。無線設備は「電気的設備」です。無線局は、設備と人（操作を行う者）をあわせた「総体」です。受信のみを目的とするものは、無線局ではありません。聞くだけなら免許は要りません。無線従事者は、試験に受かっただけではなく、総務大臣の「免許を受けた」人です。300 万メガヘルツは、3,000 ギガヘルツ（3 テラヘルツ）です。"},{"id":"H01-4","title":"アマチュア業務とアマチュア局","text":"アマチュア業務とアマチュア局 アマチュア無線の業務は、電波法施行規則の第 3 条で決められています。 電波法施行規則 第3条第1項第15号宇宙無線通信の業務以外の無線通信業務を次のとおり分類し、それぞれ当該各号に定めるとおり定義する。 十五 アマチュア業務 金銭上の利益のためでなく、もつぱら個人的な無線技術の興味によつて行う自己訓練、通信及び技術的研究その他総務大臣が別に告示する業務を行う無線通信業務をいう。 ポイントは「金銭上の利益のためでなく」と「個人的な無線技術の興味によって」の 2 つです。お金をもらう仕事や、会社の連絡には使えません。 アマチュア業務を行う無線局が、アマチュア局です（電波法施行規則 第 4 条）。 電波法施行規則 第4条第1項第24号無線局の種別を次のとおり定め、それぞれ当該各号に定めるとおり定義する。 二十四 アマチュア局 アマチュア業務を行う無線局をいう。"}],"only":""},{"id":"H02","subject":"法規","num":2,"title":"無線局の免許","html":"\u003cp>電波を出す無線局を開くには、総務大臣の免許が要ります。この章では、免許が要る無線局と要らない無線局、免許を受けるまでの手続き、免許の有効期間、免許を受けたあとの変更と廃止のきまりを覚えます。\u003c/p>\n\u003ch3 id=\"H02-1\">免許が要る無線局\u003c/h3>\n\u003cp>無線局を開設しようとする者は、総務大臣の免許を受けなければなりません（電波法第 4 条）。ただし、次の無線局は免許が要りません。\u003c/p>\n\u003cul>\u003cli>発射する電波が著しく微弱な無線局で、総務省令で定めるもの\u003c/li>\u003cli>26.9 MHz から 27.2 MHz までの周波数で空中線電力が 0.5 W 以下の無線局のうち、総務省令で定めるもので、適合表示無線設備（技適マークの付いた無線設備）だけを使うもの（市民ラジオ）\u003c/li>\u003cli>空中線電力が 1 W 以下の無線局のうち総務省令で定めるもので、呼出符号を自動で送る機能などをもち、適合表示無線設備だけを使うもの（特定小電力無線局など）\u003c/li>\u003cli>登録を受けて開設する無線局（登録局）\u003c/li>\u003c/ul>\n\u003cp>アマチュア局は、出力が小さくても、技適のある無線機だけを使っても、免許が要ります。\u003c/p>\n\u003cdetails class=\"law\">\u003csummary>電波法 第4条第1項（条文を開く）\u003c/summary>\u003cblockquote>無線局を開設しようとする者は、総務大臣の免許を受けなければならない。ただし、次に掲げる無線局については、この限りでない。\u003cbr>一　発射する電波が著しく微弱な無線局で総務省令で定めるもの\u003cbr>二　二十六・九メガヘルツから二十七・二メガヘルツまでの周波数の電波を使用し、かつ、空中線電力が〇・五ワット以下である無線局のうち総務省令で定めるものであつて、第三十八条の七第一項（第三十八条の三十一第四項において準用する場合を含む。）、第三十八条の二十六（第三十八条の三十一第六項において準用する場合を含む。）若しくは第三十八条の三十五又は第三十八条の四十四第三項の規定により表示が付されている無線設備（第三十八条の二十三第一項（第三十八条の二十九、第三十八条の三十一第四項及び第六項並びに第三十八条の三十八において準用する場合を含む。）の規定により表示が付されていないものとみなされたものを除く。以下「適合表示無線設備」という。）のみを使用するもの\u003cbr>三　空中線電力が一ワット以下である無線局のうち総務省令で定めるものであつて、第四条の三の規定により指定された呼出符号又は呼出名称を自動的に送信し、又は受信する機能その他総務省令で定める機能を有することにより他の無線局にその運用を阻害するような混信その他の妨害を与えないように運用することができるもので、かつ、適合表示無線設備のみを使用するもの\u003cbr>四　第二十七条の二十一第一項の登録を受けて開設する無線局（以下「登録局」という。）\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_4-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"H02-2\">免許を与えない場合\u003c/h3>\n\u003cp>日本の国籍を有しない人、外国政府、外国の法人や団体などには、無線局の免許を与えません（電波法第 5 条第 1 項）。ただし、このきまりはアマチュア無線局には適用されません（同条第 2 項）。外国籍の人でも、アマチュア局の免許を受けられます。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_5-Pr_2-It_2\" target=\"_blank\" rel=\"noopener\">電波法 第5条第2項第2号\u003c/a>\u003c/figcaption>\u003cblockquote>前項の規定は、次に掲げる無線局については、適用しない。\u003cbr>二　アマチュア無線局（個人的な興味によつて無線通信を行うために開設する無線局をいう。以下同じ。）\u003c/blockquote>\u003c/figure>\n\u003cp>次の者には、免許を与えないことができます（同条第 3 項）。\u003c/p>\n\u003cul>\u003cli>電波法か放送法に規定する罪を犯して罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から 2 年を経過しない者\u003c/li>\u003cli>電波法の規定により無線局の免許の取消しを受け、その取消しの日から 2 年を経過しない者\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_5-Pr_3-It_1\" target=\"_blank\" rel=\"noopener\">電波法 第5条第3項第1号\u003c/a>\u003c/figcaption>\u003cblockquote>次の各号のいずれかに該当する者には、無線局の免許を与えないことができる。\u003cbr>一　この法律又は放送法（昭和二十五年法律第百三十二号）に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H02-3\">免許を受けるまで\u003c/h3>\n\u003cp>ふつうの手続きは、次の順に進みます。\u003c/p>\n\u003col>\u003cli>申請：目的、通信の相手方と通信事項、無線設備の設置場所、電波の型式と希望する周波数の範囲・空中線電力、無線設備の工事設計などを書いて、総務大臣に出す（電波法第 6 条）\u003c/li>\u003cli>審査：工事設計が技術基準に合っているか、周波数を割り当てられるかなどを調べる（電波法第 7 条）\u003c/li>\u003cli>予備免許：工事落成の期限、電波の型式と周波数、識別信号（呼出符号など）、空中線電力、運用許容時間を指定して与える（電波法第 8 条）\u003c/li>\u003cli>落成後の検査：工事が終わったら届け出て、検査を受ける（電波法第 10 条）\u003c/li>\u003cli>免許：検査で問題がなければ、免許が与えられる（電波法第 12 条）\u003c/li>\u003c/ol>\n\u003cp>工事落成の期限を過ぎてから 2 週間以内に落成の届出がないと、免許は拒否されます（電波法第 11 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_8-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第8条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>総務大臣は、前条の規定により審査した結果、その申請が同条第一項各号又は第二項各号に適合していると認めるときは、申請者に対し、次に掲げる事項を指定して、無線局の予備免許を与える。\u003cbr>一　工事落成の期限\u003cbr>二　電波の型式及び周波数\u003cbr>三　呼出符号（標識符号を含む。）、呼出名称その他の総務省令で定める識別信号（以下「識別信号」という。）\u003cbr>四　空中線電力\u003cbr>五　運用許容時間\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_11\" target=\"_blank\" rel=\"noopener\">電波法 第11条\u003c/a>\u003c/figcaption>\u003cblockquote>（免許の拒否）\u003cbr>第十一条　第八条第一項第一号の期限（同条第二項の規定による期限の延長があつたときは、その期限）経過後二週間以内に前条の規定による届出がないときは、総務大臣は、その無線局の免許を拒否しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>アマチュア局の申請書では、開設を必要とする理由、通信の相手方、希望する運用許容時間、運用開始の予定期日を省略できます（無線局免許手続規則第 15 条）。\u003c/p>\n\u003ch4>技適のある無線機だけを使うとき\u003c/h4>\n\u003cp>適合表示無線設備だけを使う無線局は、簡易な手続きで免許を受けられます（電波法第 15 条）。審査で適合と認められれば、予備免許も落成後の検査もなく、免許が与えられます（無線局免許手続規則第 15 条の 4）。技適のある無線機で開局するときは、この手続きになります。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000015#Mp-Ch_2-Se_1_2-At_15_4-Pr_3\" target=\"_blank\" rel=\"noopener\">無線局免許手続規則 第15条の4第3項\u003c/a>\u003c/figcaption>\u003cblockquote>法第八条に規定する予備免許、法第九条に規定する工事設計の変更、法第十条に規定する落成後の検査及び法第十一条に規定する免許の拒否の各手続は、第一項の免許については、適用しない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H02-4\">免許の有効期間と再免許\u003c/h3>\n\u003cp>アマチュア局の免許の有効期間は、免許の日から 5 年です（電波法第 13 条、電波法施行規則第 7 条）。続けて使うときは、再免許を申請します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_13-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第13条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>免許の有効期間は、免許の日から起算して五年を超えない範囲内において総務省令で定める。ただし、再免許を妨げない。\u003c/blockquote>\u003c/figure>\n\u003cp>アマチュア局の再免許の申請は、免許の有効期間が満了する前 1 か月以上 6 か月を超えない期間に行います。満了日の 6 か月前から 1 か月前までの間です（人工衛星等のアマチュア局を除く）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000015#Mp-Ch_2-Se_2-At_18-Pr_1-It_1\" target=\"_blank\" rel=\"noopener\">無線局免許手続規則 第18条第1項第1号\u003c/a>\u003c/figcaption>\u003cblockquote>再免許の申請は、次の各号に掲げる無線局の種別に従い、それぞれ当該各号に掲げる期間に行わなければならない。ただし、免許の有効期間が一年以内である無線局については、その有効期間満了前一箇月までに行うことができる。\u003cbr>一　アマチュア局（人工衛星等のアマチュア局を除く。）　免許の有効期間満了前一箇月以上六箇月を超えない期間\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H02-5\">免許記録\u003c/h3>\n\u003cp>総務大臣は、免許を与えると、免許の内容を記録した電磁的記録（免許記録）を作り、免許人に通知します（電波法第 14 条）。以前は紙の免許状が交付されていましたが、いまは電子の記録です。古い問題集には免許状の問題（返納の期限など）がありますが、いまのきまりとは違います。\u003c/p>\n\u003cp>免許記録に記録される事項は、次のとおりです。\u003c/p>\n\u003cul>\u003cli>免許の年月日と免許の番号\u003c/li>\u003cli>免許人の氏名又は名称と住所\u003c/li>\u003cli>無線局の種別と、無線局の目的\u003c/li>\u003cli>通信の相手方と通信事項\u003c/li>\u003cli>無線設備の設置場所\u003c/li>\u003cli>免許の有効期間\u003c/li>\u003cli>識別信号（呼出符号など）\u003c/li>\u003cli>電波の型式と周波数、空中線電力、運用許容時間\u003c/li>\u003c/ul>\n\u003cp>免許人は、免許記録に記録されている事項を証明した書面の交付を請求できます（電波法第 14 条の 2）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_14_2\" target=\"_blank\" rel=\"noopener\">電波法 第14条の2\u003c/a>\u003c/figcaption>\u003cblockquote>（証明書の交付）\u003cbr>第十四条の二　免許人は、総務省令で定めるところにより、総務大臣に対し、前条又は第二十七条の五第二項の規定により作成された当該免許人に係る電磁的記録（以下「免許記録」という。）に記録されている事項を証明した書面の交付を請求することができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H02-6\">変更と廃止\u003c/h3>\n\u003cp>免許人が、無線局の目的、通信の相手方、通信事項、無線設備の設置場所を変更するとき、又は無線設備の変更の工事をするときは、あらかじめ総務大臣の許可を受けなければなりません（電波法第 17 条）。設置場所の変更や変更の工事の許可を受けたら、検査を受けて許可の内容に合っていると認められるまで、その無線設備を運用できません（電波法第 18 条。総務省令で定める場合を除く）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_17-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第17条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>免許人は、無線局の目的、通信の相手方、通信事項、放送事項、放送区域若しくは無線設備の設置場所の変更若しくは第六条第二項第六号に掲げる事項の変更（総務省令で定める軽微な変更を除く。）をし、又は無線設備の変更の工事をしようとするときは、あらかじめ、総務大臣の許可を受けなければならない。ただし、次に掲げる事項を内容とする無線局の目的の変更は、これを行うことができない。\u003cbr>一　基幹放送局以外の無線局が基幹放送をすることとすること。\u003cbr>二　基幹放送局が基幹放送をしないこととすること。\u003c/blockquote>\u003c/figure>\n\u003cp>許可などで免許の内容が変わると、総務大臣が免許記録を変更して通知します。それ以外で免許記録の事項に変更が生じたとき（免許人の氏名が変わったときなど）は、免許人が遅滞なく届け出ます（電波法第 21 条）。\u003c/p>\n\u003cp>無線局を廃止するときは、その旨を総務大臣に届け出ます（電波法第 22 条）。廃止すると、免許は効力を失います（電波法第 23 条）。免許の効力がなくなったら、免許人であった者は、遅滞なく空中線を撤去するなど、電波を出せないようにする措置をとります（電波法第 78 条、電波法施行規則第 42 条の 4）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_78\" target=\"_blank\" rel=\"noopener\">電波法 第78条\u003c/a>\u003c/figcaption>\u003cblockquote>（電波の発射の防止）\u003cbr>第七十八条　無線局の免許等がその効力を失つたときは、免許人等であつた者は、遅滞なく空中線の撤去その他の総務省令で定める電波の発射を防止するために必要な措置を講じなければならない。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H02-1","title":"免許が要る無線局"},{"id":"H02-2","title":"免許を与えない場合"},{"id":"H02-3","title":"免許を受けるまで"},{"id":"H02-4","title":"免許の有効期間と再免許"},{"id":"H02-5","title":"免許記録"},{"id":"H02-6","title":"変更と廃止"}],"search":[{"id":"","title":"","text":"電波を出す無線局を開くには、総務大臣の免許が要ります。この章では、免許が要る無線局と要らない無線局、免許を受けるまでの手続き、免許の有効期間、免許を受けたあとの変更と廃止のきまりを覚えます。"},{"id":"H02-1","title":"免許が要る無線局","text":"免許が要る無線局 無線局を開設しようとする者は、総務大臣の免許を受けなければなりません（電波法第 4 条）。ただし、次の無線局は免許が要りません。 発射する電波が著しく微弱な無線局で、総務省令で定めるもの26.9 MHz から 27.2 MHz までの周波数で空中線電力が 0.5 W 以下の無線局のうち、総務省令で定めるもので、適合表示無線設備（技適マークの付いた無線設備）だけを使うもの（市民ラジオ）空中線電力が 1 W 以下の無線局のうち総務省令で定めるもので、呼出符号を自動で送る機能などをもち、適合表示無線設備だけを使うもの（特定小電力無線局など）登録を受けて開設する無線局（登録局） アマチュア局は、出力が小さくても、技適のある無線機だけを使っても、免許が要ります。 電波法 第4条第1項（条文を開く）無線局を開設しようとする者は、総務大臣の免許を受けなければならない。ただし、次に掲げる無線局については、この限りでない。 一 発射する電波が著しく微弱な無線局で総務省令で定めるもの 二 二十六・九メガヘルツから二十七・二メガヘルツまでの周波数の電波を使用し、かつ、空中線電力が〇・五ワット以下である無線局のうち総務省令で定めるものであつて、第三十八条の七第一項（第三十八条の三十一第四項において準用する場合を含む。）、第三十八条の二十六（第三十八条の三十一第六項において準用する場合を含む。）若しくは第三十八条の三十五又は第三十八条の四十四第三項の規定により表示が付されている無線設備（第三十八条の二十三第一項（第三十八条の二十九、第三十八条の三十一第四項及び第六項並びに第三十八条の三十八において準用する場合を含む。）の規定により表示が付されていないものとみなされたものを除く。以下「適合表示無線設備」という。）のみを使用するもの 三 空中線電力が一ワット以下である無線局のうち総務省令で定めるものであつて、第四条の三の規定により指定された呼出符号又は呼出名称を自動的に送信し、又は受信する機能その他総務省令で定める機能を有することにより他の無線局にその運用を阻害するような混信その他の妨害を与えないように運用することができるもので、かつ、適合表示無線設備のみを使用するもの 四 第二十七条の二十一第一項の登録を受けて開設する無線局（以下「登録局」という。）e-Gov 法令検索で読む"},{"id":"H02-2","title":"免許を与えない場合","text":"免許を与えない場合 日本の国籍を有しない人、外国政府、外国の法人や団体などには、無線局の免許を与えません（電波法第 5 条第 1 項）。ただし、このきまりはアマチュア無線局には適用されません（同条第 2 項）。外国籍の人でも、アマチュア局の免許を受けられます。 電波法 第5条第2項第2号前項の規定は、次に掲げる無線局については、適用しない。 二 アマチュア無線局（個人的な興味によつて無線通信を行うために開設する無線局をいう。以下同じ。） 次の者には、免許を与えないことができます（同条第 3 項）。 電波法か放送法に規定する罪を犯して罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から 2 年を経過しない者電波法の規定により無線局の免許の取消しを受け、その取消しの日から 2 年を経過しない者 電波法 第5条第3項第1号次の各号のいずれかに該当する者には、無線局の免許を与えないことができる。 一 この法律又は放送法（昭和二十五年法律第百三十二号）に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者"},{"id":"H02-3","title":"免許を受けるまで","text":"免許を受けるまで ふつうの手続きは、次の順に進みます。 申請：目的、通信の相手方と通信事項、無線設備の設置場所、電波の型式と希望する周波数の範囲・空中線電力、無線設備の工事設計などを書いて、総務大臣に出す（電波法第 6 条）審査：工事設計が技術基準に合っているか、周波数を割り当てられるかなどを調べる（電波法第 7 条）予備免許：工事落成の期限、電波の型式と周波数、識別信号（呼出符号など）、空中線電力、運用許容時間を指定して与える（電波法第 8 条）落成後の検査：工事が終わったら届け出て、検査を受ける（電波法第 10 条）免許：検査で問題がなければ、免許が与えられる（電波法第 12 条） 工事落成の期限を過ぎてから 2 週間以内に落成の届出がないと、免許は拒否されます（電波法第 11 条）。 電波法 第8条第1項総務大臣は、前条の規定により審査した結果、その申請が同条第一項各号又は第二項各号に適合していると認めるときは、申請者に対し、次に掲げる事項を指定して、無線局の予備免許を与える。 一 工事落成の期限 二 電波の型式及び周波数 三 呼出符号（標識符号を含む。）、呼出名称その他の総務省令で定める識別信号（以下「識別信号」という。） 四 空中線電力 五 運用許容時間 電波法 第11条（免許の拒否） 第十一条 第八条第一項第一号の期限（同条第二項の規定による期限の延長があつたときは、その期限）経過後二週間以内に前条の規定による届出がないときは、総務大臣は、その無線局の免許を拒否しなければならない。 アマチュア局の申請書では、開設を必要とする理由、通信の相手方、希望する運用許容時間、運用開始の予定期日を省略できます（無線局免許手続規則第 15 条）。 技適のある無線機だけを使うとき 適合表示無線設備だけを使う無線局は、簡易な手続きで免許を受けられます（電波法第 15 条）。審査で適合と認められれば、予備免許も落成後の検査もなく、免許が与えられます（無線局免許手続規則第 15 条の 4）。技適のある無線機で開局するときは、この手続きになります。 無線局免許手続規則 第15条の4第3項法第八条に規定する予備免許、法第九条に規定する工事設計の変更、法第十条に規定する落成後の検査及び法第十一条に規定する免許の拒否の各手続は、第一項の免許については、適用しない。"},{"id":"H02-4","title":"免許の有効期間と再免許","text":"免許の有効期間と再免許 アマチュア局の免許の有効期間は、免許の日から 5 年です（電波法第 13 条、電波法施行規則第 7 条）。続けて使うときは、再免許を申請します。 電波法 第13条第1項免許の有効期間は、免許の日から起算して五年を超えない範囲内において総務省令で定める。ただし、再免許を妨げない。 アマチュア局の再免許の申請は、免許の有効期間が満了する前 1 か月以上 6 か月を超えない期間に行います。満了日の 6 か月前から 1 か月前までの間です（人工衛星等のアマチュア局を除く）。 無線局免許手続規則 第18条第1項第1号再免許の申請は、次の各号に掲げる無線局の種別に従い、それぞれ当該各号に掲げる期間に行わなければならない。ただし、免許の有効期間が一年以内である無線局については、その有効期間満了前一箇月までに行うことができる。 一 アマチュア局（人工衛星等のアマチュア局を除く。） 免許の有効期間満了前一箇月以上六箇月を超えない期間"},{"id":"H02-5","title":"免許記録","text":"免許記録 総務大臣は、免許を与えると、免許の内容を記録した電磁的記録（免許記録）を作り、免許人に通知します（電波法第 14 条）。以前は紙の免許状が交付されていましたが、いまは電子の記録です。古い問題集には免許状の問題（返納の期限など）がありますが、いまのきまりとは違います。 免許記録に記録される事項は、次のとおりです。 免許の年月日と免許の番号免許人の氏名又は名称と住所無線局の種別と、無線局の目的通信の相手方と通信事項無線設備の設置場所免許の有効期間識別信号（呼出符号など）電波の型式と周波数、空中線電力、運用許容時間 免許人は、免許記録に記録されている事項を証明した書面の交付を請求できます（電波法第 14 条の 2）。 電波法 第14条の2（証明書の交付） 第十四条の二 免許人は、総務省令で定めるところにより、総務大臣に対し、前条又は第二十七条の五第二項の規定により作成された当該免許人に係る電磁的記録（以下「免許記録」という。）に記録されている事項を証明した書面の交付を請求することができる。"},{"id":"H02-6","title":"変更と廃止","text":"変更と廃止 免許人が、無線局の目的、通信の相手方、通信事項、無線設備の設置場所を変更するとき、又は無線設備の変更の工事をするときは、あらかじめ総務大臣の許可を受けなければなりません（電波法第 17 条）。設置場所の変更や変更の工事の許可を受けたら、検査を受けて許可の内容に合っていると認められるまで、その無線設備を運用できません（電波法第 18 条。総務省令で定める場合を除く）。 電波法 第17条第1項免許人は、無線局の目的、通信の相手方、通信事項、放送事項、放送区域若しくは無線設備の設置場所の変更若しくは第六条第二項第六号に掲げる事項の変更（総務省令で定める軽微な変更を除く。）をし、又は無線設備の変更の工事をしようとするときは、あらかじめ、総務大臣の許可を受けなければならない。ただし、次に掲げる事項を内容とする無線局の目的の変更は、これを行うことができない。 一 基幹放送局以外の無線局が基幹放送をすることとすること。 二 基幹放送局が基幹放送をしないこととすること。 許可などで免許の内容が変わると、総務大臣が免許記録を変更して通知します。それ以外で免許記録の事項に変更が生じたとき（免許人の氏名が変わったときなど）は、免許人が遅滞なく届け出ます（電波法第 21 条）。 無線局を廃止するときは、その旨を総務大臣に届け出ます（電波法第 22 条）。廃止すると、免許は効力を失います（電波法第 23 条）。免許の効力がなくなったら、免許人であった者は、遅滞なく空中線を撤去するなど、電波を出せないようにする措置をとります（電波法第 78 条、電波法施行規則第 42 条の 4）。 電波法 第78条（電波の発射の防止） 第七十八条 無線局の免許等がその効力を失つたときは、免許人等であつた者は、遅滞なく空中線の撤去その他の総務省令で定める電波の発射を防止するために必要な措置を講じなければならない。"}],"only":""},{"id":"H03","subject":"法規","num":3,"title":"無線設備","html":"\u003cp>無線設備には、電波の質や送信の強さなどについて、守るべき技術の基準があります。この章では、電波の型式の記号、周波数の表し方、電波の質、空中線電力、送信設備と受信設備の条件を覚えます。\u003c/p>\n\u003ch3 id=\"H03-1\">電波の型式\u003c/h3>\n\u003cp>電波の型式は、3 つの記号を順に並べて表します（電波法施行規則第 4 条の 2）。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>位置\u003c/th>\u003cth>表すもの\u003c/th>\u003cth>おもな記号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1 文字目\u003c/td>\u003ctd>主搬送波の変調の型式\u003c/td>\u003ctd>A：振幅変調の両側波帯、H：全搬送波による単側波帯、R：低減搬送波による単側波帯、J：抑圧搬送波による単側波帯、F：周波数変調、G：位相変調、N：無変調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 文字目\u003c/td>\u003ctd>主搬送波を変調する信号の性質\u003c/td>\u003ctd>0：変調信号のないもの、1：デジタル信号の単一チャネルで、変調のための副搬送波を使用しないもの、2：デジタル信号の単一チャネルで、変調のための副搬送波を使用するもの、3：アナログ信号の単一チャネル\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 文字目\u003c/td>\u003ctd>伝送情報の型式\u003c/td>\u003ctd>N：無情報、A：電信（聴覚受信）、B：電信（自動受信）、C：ファクシミリ、D：データ伝送・遠隔測定・遠隔指令、E：電話、F：テレビジョン\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>アマチュア無線でよく使う型式は、次のとおりです。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>型式\u003c/th>\u003cth>意味\u003c/th>\u003cth>使い方の例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A1A\u003c/td>\u003ctd>振幅変調の両側波帯・デジタル信号の単一チャネル（副搬送波なし）・電信（聴覚受信）\u003c/td>\u003ctd>モールス符号の電信（CW）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A3E\u003c/td>\u003ctd>振幅変調の両側波帯・アナログ信号の単一チャネル・電話\u003c/td>\u003ctd>AM の電話\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J3E\u003c/td>\u003ctd>抑圧搬送波による単側波帯・アナログ信号の単一チャネル・電話\u003c/td>\u003ctd>SSB の電話\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F3E\u003c/td>\u003ctd>周波数変調・アナログ信号の単一チャネル・電話\u003c/td>\u003ctd>FM の電話（UV-5R Mini もこれ）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F1B\u003c/td>\u003ctd>周波数変調・デジタル信号の単一チャネル（副搬送波なし）・電信（自動受信）\u003c/td>\u003ctd>無線テレタイプなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F2D\u003c/td>\u003ctd>周波数変調・デジタル信号の単一チャネル（副搬送波あり）・データ伝送\u003c/td>\u003ctd>パケット通信など\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>電波法施行規則 第4条の2第1項（条文を開く）\u003c/summary>\u003cblockquote>電波の主搬送波の変調の型式、主搬送波を変調する信号の性質及び伝送情報の型式は、次の各号に掲げるように分類し、それぞれ当該各号に掲げる記号をもつて表示する。ただし、主搬送波を変調する信号の性質を表示する記号は、対応する算用数字をもつて表示することがあるものとする。\u003cbr>一　主搬送波の変調の型式｜記号\u003cbr>（１）　無変調｜Ｎ\u003cbr>（２）　振幅変調\u003cbr>（一）　両側波帯｜Ａ\u003cbr>（二）　全搬送波による単側波帯｜Ｈ\u003cbr>（三）　低減搬送波による単側波帯｜Ｒ\u003cbr>（四）　抑圧搬送波による単側波帯｜Ｊ\u003cbr>（五）　独立側波帯｜Ｂ\u003cbr>（六）　残留側波帯｜Ｃ\u003cbr>（３）　角度変調\u003cbr>（一）　周波数変調｜Ｆ\u003cbr>（二）　位相変調｜Ｇ\u003cbr>（４）　同時に、又は一定の順序で振幅変調及び角度変調を行うもの｜Ｄ\u003cbr>（５）　パルス変調\u003cbr>（一）　無変調パルス列｜Ｐ\u003cbr>（二）　変調パルス列\u003cbr>ア　振幅変調｜Ｋ\u003cbr>イ　幅変調又は時間変調｜Ｌ\u003cbr>ウ　位置変調又は位相変調｜Ｍ\u003cbr>エ　パルスの期間中に搬送波を角度変調するもの｜Ｑ\u003cbr>オ　アからエまでの各変調の組合せ又は他の方法によつて変調するもの｜Ｖ\u003cbr>（６）　（１）から（５）までに該当しないものであつて、同時に、又は一定の順序で振幅変調、角度変調又はパルス変調のうちの二以上を組み合わせて行うもの｜Ｗ\u003cbr>（７）　その他のもの｜Ｘ\u003cbr>二　主搬送波を変調する信号の性質｜記号\u003cbr>（１）　変調信号のないもの｜〇\u003cbr>（２）　デイジタル信号である単一チヤネルのもの\u003cbr>（一）　変調のための副搬送波を使用しないもの｜一\u003cbr>（二）　変調のための副搬送波を使用するもの｜二\u003cbr>（３）　アナログ信号である単一チヤネルのもの｜三\u003cbr>（４）　デイジタル信号である二以上のチヤネルのもの｜七\u003cbr>（５）　アナログ信号である二以上のチヤネルのもの｜八\u003cbr>（６）　デイジタル信号の一又は二以上のチヤネルとアナログ信号の一又は二以上のチヤネルを複合したもの｜九\u003cbr>（７）　その他のもの｜Ｘ\u003cbr>三　伝送情報の型式｜記号\u003cbr>（１）　無情報｜Ｎ\u003cbr>（２）　電信\u003cbr>（一）　聴覚受信を目的とするもの｜Ａ\u003cbr>（二）　自動受信を目的とするもの｜Ｂ\u003cbr>（３）　フアクシミリ｜Ｃ\u003cbr>（４）　データ伝送、遠隔測定又は遠隔指令｜Ｄ\u003cbr>（５）　電話（音響の放送を含む。）｜Ｅ\u003cbr>（６）　テレビジヨン（映像に限る。）｜Ｆ\u003cbr>（７）　（１）から（６）までの型式の組合せのもの｜Ｗ\u003cbr>（８）　その他のもの｜Ｘ\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_2-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003ch3 id=\"H03-2\">周波数の表し方と周波数帯\u003c/h3>\n\u003cp>電波の周波数は、3,000 kHz 以下は kHz、3,000 kHz を超え 3,000 MHz 以下は MHz、3,000 MHz を超え 3,000 GHz 以下は GHz で表します（電波法施行規則第 4 条の 3）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_3-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第4条の3第1項\u003c/a>\u003c/figcaption>\u003cblockquote>電波の周波数は、三、〇〇〇ｋＨｚ以下のものはｋＨｚ、三、〇〇〇ｋＨｚをこえ三、〇〇〇ＭＨｚ以下のものはＭＨｚ、三、〇〇〇ＭＨｚをこえ三、〇〇〇ＧＨｚ以下のものはＧＨｚで表示する。ただし、周波数の使用上特に必要がある場合は、この表示方法によらないことができる。\u003c/blockquote>\u003c/figure>\n\u003cp>周波数は、次のような周波数帯に分けられます。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>周波数の範囲\u003c/th>\u003cth>略称\u003c/th>\u003cth>メートルによる区分\u003c/th>\u003cth>ふつうの呼び方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>300 kHz を超え 3,000 kHz 以下\u003c/td>\u003ctd>MF\u003c/td>\u003ctd>ヘクトメートル波\u003c/td>\u003ctd>中波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 MHz を超え 30 MHz 以下\u003c/td>\u003ctd>HF\u003c/td>\u003ctd>デカメートル波\u003c/td>\u003ctd>短波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30 MHz を超え 300 MHz 以下\u003c/td>\u003ctd>VHF\u003c/td>\u003ctd>メートル波\u003c/td>\u003ctd>超短波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>300 MHz を超え 3,000 MHz 以下\u003c/td>\u003ctd>UHF\u003c/td>\u003ctd>デシメートル波\u003c/td>\u003ctd>極超短波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 GHz を超え 30 GHz 以下\u003c/td>\u003ctd>SHF\u003c/td>\u003ctd>センチメートル波\u003c/td>\u003ctd>マイクロ波\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>144 MHz 帯は VHF、430 MHz 帯は UHF です。\u003c/p>\n\u003ch3 id=\"H03-3\">電波の質\u003c/h3>\n\u003cp>送信設備に使う電波の周波数の偏差及び幅、高調波の強度などの「電波の質」は、総務省令で定めるところに適合しなければなりません（電波法第 28 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_3-At_28\" target=\"_blank\" rel=\"noopener\">電波法 第28条\u003c/a>\u003c/figcaption>\u003cblockquote>（電波の質）\u003cbr>第二十八条　送信設備に使用する電波の周波数の偏差及び幅、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>電波の質にかかわる言葉は、電波法施行規則第 2 条で決められています。\u003c/p>\n\u003cul>\u003cli>周波数の許容偏差：発射によって占有する周波数帯の中央の周波数が、割当周波数からずれてもよい最大の量。百万分率かヘルツで表す\u003c/li>\u003cli>占有周波数帯幅：その上限より上と下限より下に出る平均電力が、それぞれ全平均電力の 0.5 パーセントになる周波数帯幅\u003c/li>\u003cli>スプリアス発射：必要周波数帯の外に出る電波で、情報の伝送に影響を与えずに低減できるもの。高調波発射、低調波発射、寄生発射、相互変調積を含み、帯域外発射を含まない\u003c/li>\u003cli>帯域外発射：必要周波数帯のすぐ外に出る電波で、変調の過程で生じるもの\u003c/li>\u003cli>不要発射：スプリアス発射と帯域外発射のこと\u003c/li>\u003c/ul>\n\u003cp>周波数の許容偏差、占有周波数帯幅の許容値、スプリアス発射と不要発射の強度の許容値は、無線設備規則第 5 条から第 7 条（と別表）で決められています。\u003c/p>\n\u003ch3 id=\"H03-4\">空中線電力\u003c/h3>\n\u003cp>空中線電力には、尖頭電力、平均電力、搬送波電力、規格電力があります（電波法施行規則第 2 条）。\u003c/p>\n\u003cul>\u003cli>尖頭電力（pX）：変調の包絡線がいちばん高いところでの、無線周波数 1 サイクルの間の平均の電力\u003c/li>\u003cli>平均電力（pY）：変調に使う最低周波数の周期にくらべて十分長い時間（ふつうは約 10 分の 1 秒）で平均した電力\u003c/li>\u003cli>搬送波電力（pZ）：変調のない状態での、無線周波数 1 サイクルの間の平均の電力\u003c/li>\u003c/ul>\n\u003cp>どの電力で表すかは、電波の型式で決まっています（電波法施行規則第 4 条の 4）。アマチュア局では、A1A と J3E は尖頭電力、A3E と F3E は平均電力です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_2-Pr_1-It_68\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第2条第1項第68号\u003c/a>\u003c/figcaption>\u003cblockquote>電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。\u003cbr>六十八　「空中線電力」とは、尖頭電力、平均電力、搬送波電力又は規格電力をいう。\u003c/blockquote>\u003c/figure>\n\u003cp>アマチュア局の送信設備の空中線電力の許容偏差は、上限が 20 パーセントで、下限は決められていません（無線設備規則第 14 条）。\u003c/p>\n\u003ch3 id=\"H03-5\">送信設備の条件\u003c/h3>\n\u003cp>周波数を許容偏差の中に保つため、送信装置と発振回路は、次の条件に合っていなければなりません（無線設備規則第 15 条）。\u003c/p>\n\u003cul>\u003cli>送信装置は、できる限り電源電圧や負荷の変化によって発振周波数に影響を与えないもの\u003c/li>\u003cli>発振回路の方式は、できる限り外囲の温度や湿度の変化によって影響を受けないもの\u003c/li>\u003cli>移動局（移動するアマチュア局を含む）の送信装置は、実際上起こり得る振動や衝撃によっても、周波数を許容偏差の中に保つもの\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_2-At_15-Pr_3\" target=\"_blank\" rel=\"noopener\">無線設備規則 第15条第3項\u003c/a>\u003c/figcaption>\u003cblockquote>移動局（移動するアマチュア局を含む。）の送信装置は、実際上起り得る振動又は衝撃によつても周波数をその許容偏差内に維持するものでなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>音声などで搬送波を変調するときは、変調波の尖頭値で（±）100 パーセントを超えない範囲に保ちます。また、アマチュア局の送信装置は、通信に秘匿性を与える機能をもってはいけません（無線設備規則第 18 条）。暗号やスクランブルの機能がある無線機では、使わないようにします。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_2-At_18-Pr_2\" target=\"_blank\" rel=\"noopener\">無線設備規則 第18条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>アマチュア局の送信装置は、通信に秘匿性を与える機能を有してはならない。\u003c/blockquote>\u003c/figure>\n\u003cp>送信空中線の型式と構成は、次の 3 つに合っていなければなりません（無線設備規則第 20 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_3-At_20\" target=\"_blank\" rel=\"noopener\">無線設備規則 第20条\u003c/a>\u003c/figcaption>\u003cblockquote>（送信空中線の型式及び構成等）\u003cbr>第二十条　送信空中線の型式及び構成は、左の各号に適合するものでなければならない。\u003cbr>一　空中線の利得及び能率がなるべく大であること。\u003cbr>二　整合が十分であること。\u003cbr>三　満足な指向特性が得られること。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H03-6\">受信設備の条件\u003c/h3>\n\u003cp>受信設備は、副次的に発する電波や高周波電流が、総務省令で定める限度を超えて、ほかの無線設備の機能に支障を与えてはいけません（電波法第 29 条）。その限度は、受信空中線と電気的常数の等しい擬似空中線回路を使って測ったとき、その回路の電力が 4 ナノワット以下です（無線設備規則第 24 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_3-At_24-Pr_1\" target=\"_blank\" rel=\"noopener\">無線設備規則 第24条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>法第二十九条に規定する副次的に発する電波が他の無線設備の機能に支障を与えない限度は、受信空中線と電気的常数の等しい疑似空中線回路を使用して測定した場合に、その回路の電力が四ナノワット以下でなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>受信設備は、なるべく次の条件に合っていなければなりません（無線設備規則第 25 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_3-At_25\" target=\"_blank\" rel=\"noopener\">無線設備規則 第25条\u003c/a>\u003c/figcaption>\u003cblockquote>（その他の条件）\u003cbr>第二十五条　受信設備は、なるべく左の各号に適合するものでなければならない。\u003cbr>一　内部雑音が小さいこと。\u003cbr>二　感度が十分であること。\u003cbr>三　選択度が適正であること。\u003cbr>四　了解度が十分であること。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H03-1","title":"電波の型式"},{"id":"H03-2","title":"周波数の表し方と周波数帯"},{"id":"H03-3","title":"電波の質"},{"id":"H03-4","title":"空中線電力"},{"id":"H03-5","title":"送信設備の条件"},{"id":"H03-6","title":"受信設備の条件"}],"search":[{"id":"","title":"","text":"無線設備には、電波の質や送信の強さなどについて、守るべき技術の基準があります。この章では、電波の型式の記号、周波数の表し方、電波の質、空中線電力、送信設備と受信設備の条件を覚えます。"},{"id":"H03-1","title":"電波の型式","text":"電波の型式 電波の型式は、3 つの記号を順に並べて表します（電波法施行規則第 4 条の 2）。 位置表すものおもな記号1 文字目主搬送波の変調の型式A：振幅変調の両側波帯、H：全搬送波による単側波帯、R：低減搬送波による単側波帯、J：抑圧搬送波による単側波帯、F：周波数変調、G：位相変調、N：無変調2 文字目主搬送波を変調する信号の性質0：変調信号のないもの、1：デジタル信号の単一チャネルで、変調のための副搬送波を使用しないもの、2：デジタル信号の単一チャネルで、変調のための副搬送波を使用するもの、3：アナログ信号の単一チャネル3 文字目伝送情報の型式N：無情報、A：電信（聴覚受信）、B：電信（自動受信）、C：ファクシミリ、D：データ伝送・遠隔測定・遠隔指令、E：電話、F：テレビジョン アマチュア無線でよく使う型式は、次のとおりです。 型式意味使い方の例A1A振幅変調の両側波帯・デジタル信号の単一チャネル（副搬送波なし）・電信（聴覚受信）モールス符号の電信（CW）A3E振幅変調の両側波帯・アナログ信号の単一チャネル・電話AM の電話J3E抑圧搬送波による単側波帯・アナログ信号の単一チャネル・電話SSB の電話F3E周波数変調・アナログ信号の単一チャネル・電話FM の電話（UV-5R Mini もこれ）F1B周波数変調・デジタル信号の単一チャネル（副搬送波なし）・電信（自動受信）無線テレタイプなどF2D周波数変調・デジタル信号の単一チャネル（副搬送波あり）・データ伝送パケット通信など 電波法施行規則 第4条の2第1項（条文を開く）電波の主搬送波の変調の型式、主搬送波を変調する信号の性質及び伝送情報の型式は、次の各号に掲げるように分類し、それぞれ当該各号に掲げる記号をもつて表示する。ただし、主搬送波を変調する信号の性質を表示する記号は、対応する算用数字をもつて表示することがあるものとする。 一 主搬送波の変調の型式｜記号 （１） 無変調｜Ｎ （２） 振幅変調 （一） 両側波帯｜Ａ （二） 全搬送波による単側波帯｜Ｈ （三） 低減搬送波による単側波帯｜Ｒ （四） 抑圧搬送波による単側波帯｜Ｊ （五） 独立側波帯｜Ｂ （六） 残留側波帯｜Ｃ （３） 角度変調 （一） 周波数変調｜Ｆ （二） 位相変調｜Ｇ （４） 同時に、又は一定の順序で振幅変調及び角度変調を行うもの｜Ｄ （５） パルス変調 （一） 無変調パルス列｜Ｐ （二） 変調パルス列 ア 振幅変調｜Ｋ イ 幅変調又は時間変調｜Ｌ ウ 位置変調又は位相変調｜Ｍ エ パルスの期間中に搬送波を角度変調するもの｜Ｑ オ アからエまでの各変調の組合せ又は他の方法によつて変調するもの｜Ｖ （６） （１）から（５）までに該当しないものであつて、同時に、又は一定の順序で振幅変調、角度変調又はパルス変調のうちの二以上を組み合わせて行うもの｜Ｗ （７） その他のもの｜Ｘ 二 主搬送波を変調する信号の性質｜記号 （１） 変調信号のないもの｜〇 （２） デイジタル信号である単一チヤネルのもの （一） 変調のための副搬送波を使用しないもの｜一 （二） 変調のための副搬送波を使用するもの｜二 （３） アナログ信号である単一チヤネルのもの｜三 （４） デイジタル信号である二以上のチヤネルのもの｜七 （５） アナログ信号である二以上のチヤネルのもの｜八 （６） デイジタル信号の一又は二以上のチヤネルとアナログ信号の一又は二以上のチヤネルを複合したもの｜九 （７） その他のもの｜Ｘ 三 伝送情報の型式｜記号 （１） 無情報｜Ｎ （２） 電信 （一） 聴覚受信を目的とするもの｜Ａ （二） 自動受信を目的とするもの｜Ｂ （３） フアクシミリ｜Ｃ （４） データ伝送、遠隔測定又は遠隔指令｜Ｄ （５） 電話（音響の放送を含む。）｜Ｅ （６） テレビジヨン（映像に限る。）｜Ｆ （７） （１）から（６）までの型式の組合せのもの｜Ｗ （８） その他のもの｜Ｘe-Gov 法令検索で読む"},{"id":"H03-2","title":"周波数の表し方と周波数帯","text":"周波数の表し方と周波数帯 電波の周波数は、3,000 kHz 以下は kHz、3,000 kHz を超え 3,000 MHz 以下は MHz、3,000 MHz を超え 3,000 GHz 以下は GHz で表します（電波法施行規則第 4 条の 3）。 電波法施行規則 第4条の3第1項電波の周波数は、三、〇〇〇ｋＨｚ以下のものはｋＨｚ、三、〇〇〇ｋＨｚをこえ三、〇〇〇ＭＨｚ以下のものはＭＨｚ、三、〇〇〇ＭＨｚをこえ三、〇〇〇ＧＨｚ以下のものはＧＨｚで表示する。ただし、周波数の使用上特に必要がある場合は、この表示方法によらないことができる。 周波数は、次のような周波数帯に分けられます。 周波数の範囲略称メートルによる区分ふつうの呼び方300 kHz を超え 3,000 kHz 以下MFヘクトメートル波中波3 MHz を超え 30 MHz 以下HFデカメートル波短波30 MHz を超え 300 MHz 以下VHFメートル波超短波300 MHz を超え 3,000 MHz 以下UHFデシメートル波極超短波3 GHz を超え 30 GHz 以下SHFセンチメートル波マイクロ波 144 MHz 帯は VHF、430 MHz 帯は UHF です。"},{"id":"H03-3","title":"電波の質","text":"電波の質 送信設備に使う電波の周波数の偏差及び幅、高調波の強度などの「電波の質」は、総務省令で定めるところに適合しなければなりません（電波法第 28 条）。 電波法 第28条（電波の質） 第二十八条 送信設備に使用する電波の周波数の偏差及び幅、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。 電波の質にかかわる言葉は、電波法施行規則第 2 条で決められています。 周波数の許容偏差：発射によって占有する周波数帯の中央の周波数が、割当周波数からずれてもよい最大の量。百万分率かヘルツで表す占有周波数帯幅：その上限より上と下限より下に出る平均電力が、それぞれ全平均電力の 0.5 パーセントになる周波数帯幅スプリアス発射：必要周波数帯の外に出る電波で、情報の伝送に影響を与えずに低減できるもの。高調波発射、低調波発射、寄生発射、相互変調積を含み、帯域外発射を含まない帯域外発射：必要周波数帯のすぐ外に出る電波で、変調の過程で生じるもの不要発射：スプリアス発射と帯域外発射のこと 周波数の許容偏差、占有周波数帯幅の許容値、スプリアス発射と不要発射の強度の許容値は、無線設備規則第 5 条から第 7 条（と別表）で決められています。"},{"id":"H03-4","title":"空中線電力","text":"空中線電力 空中線電力には、尖頭電力、平均電力、搬送波電力、規格電力があります（電波法施行規則第 2 条）。 尖頭電力（pX）：変調の包絡線がいちばん高いところでの、無線周波数 1 サイクルの間の平均の電力平均電力（pY）：変調に使う最低周波数の周期にくらべて十分長い時間（ふつうは約 10 分の 1 秒）で平均した電力搬送波電力（pZ）：変調のない状態での、無線周波数 1 サイクルの間の平均の電力 どの電力で表すかは、電波の型式で決まっています（電波法施行規則第 4 条の 4）。アマチュア局では、A1A と J3E は尖頭電力、A3E と F3E は平均電力です。 電波法施行規則 第2条第1項第68号電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。 六十八 「空中線電力」とは、尖頭電力、平均電力、搬送波電力又は規格電力をいう。 アマチュア局の送信設備の空中線電力の許容偏差は、上限が 20 パーセントで、下限は決められていません（無線設備規則第 14 条）。"},{"id":"H03-5","title":"送信設備の条件","text":"送信設備の条件 周波数を許容偏差の中に保つため、送信装置と発振回路は、次の条件に合っていなければなりません（無線設備規則第 15 条）。 送信装置は、できる限り電源電圧や負荷の変化によって発振周波数に影響を与えないもの発振回路の方式は、できる限り外囲の温度や湿度の変化によって影響を受けないもの移動局（移動するアマチュア局を含む）の送信装置は、実際上起こり得る振動や衝撃によっても、周波数を許容偏差の中に保つもの 無線設備規則 第15条第3項移動局（移動するアマチュア局を含む。）の送信装置は、実際上起り得る振動又は衝撃によつても周波数をその許容偏差内に維持するものでなければならない。 音声などで搬送波を変調するときは、変調波の尖頭値で（±）100 パーセントを超えない範囲に保ちます。また、アマチュア局の送信装置は、通信に秘匿性を与える機能をもってはいけません（無線設備規則第 18 条）。暗号やスクランブルの機能がある無線機では、使わないようにします。 無線設備規則 第18条第2項アマチュア局の送信装置は、通信に秘匿性を与える機能を有してはならない。 送信空中線の型式と構成は、次の 3 つに合っていなければなりません（無線設備規則第 20 条）。 無線設備規則 第20条（送信空中線の型式及び構成等） 第二十条 送信空中線の型式及び構成は、左の各号に適合するものでなければならない。 一 空中線の利得及び能率がなるべく大であること。 二 整合が十分であること。 三 満足な指向特性が得られること。"},{"id":"H03-6","title":"受信設備の条件","text":"受信設備の条件 受信設備は、副次的に発する電波や高周波電流が、総務省令で定める限度を超えて、ほかの無線設備の機能に支障を与えてはいけません（電波法第 29 条）。その限度は、受信空中線と電気的常数の等しい擬似空中線回路を使って測ったとき、その回路の電力が 4 ナノワット以下です（無線設備規則第 24 条）。 無線設備規則 第24条第1項法第二十九条に規定する副次的に発する電波が他の無線設備の機能に支障を与えない限度は、受信空中線と電気的常数の等しい疑似空中線回路を使用して測定した場合に、その回路の電力が四ナノワット以下でなければならない。 受信設備は、なるべく次の条件に合っていなければなりません（無線設備規則第 25 条）。 無線設備規則 第25条（その他の条件） 第二十五条 受信設備は、なるべく左の各号に適合するものでなければならない。 一 内部雑音が小さいこと。 二 感度が十分であること。 三 選択度が適正であること。 四 了解度が十分であること。"}],"only":""},{"id":"H04","subject":"法規","num":4,"title":"無線従事者","html":"\u003cp>無線設備を操作するには、人の資格（無線従事者の免許）が要ります。この章では、アマチュア無線技士の資格ごとに操作できる範囲と、無線従事者の免許と免許証のきまりを覚えます。\u003c/p>\n\u003ch3 id=\"H04-1\">操作には資格が要る\u003c/h3>\n\u003cp>アマチュア無線局の無線設備の操作は、無線従事者でなければ行ってはいけません（電波法第 39 条の 13）。ただし、外国の資格をもつ人が操作する場合や、総務省令で定める場合（体験運用など）は例外です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_39_13\" target=\"_blank\" rel=\"noopener\">電波法 第39条の13\u003c/a>\u003c/figcaption>\u003cblockquote>（アマチュア無線局の無線設備の操作）\u003cbr>第三十九条の十三　アマチュア無線局の無線設備の操作は、次条の定めるところにより、無線従事者でなければ行つてはならない。ただし、外国において同条第一項第五号に掲げる資格に相当する資格として総務省令で定めるものを有する者が総務省令で定めるところによりアマチュア無線局の無線設備の操作を行うとき、その他総務省令で定める場合は、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003cp>無線従事者のうち、アマチュア無線の資格は、第一級から第四級までのアマチュア無線技士です（電波法第 40 条）。\u003c/p>\n\u003ch3 id=\"H04-2\">資格ごとの操作の範囲\u003c/h3>\n\u003cp>資格ごとに操作できる範囲は、電波法施行令第 3 条で決められています。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>資格\u003c/th>\u003cth>操作の範囲（アマチュア無線局の無線設備）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>第一級（1アマ）\u003c/td>\u003ctd>すべての操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二級（2アマ）\u003c/td>\u003ctd>空中線電力 200 ワット以下の無線設備の操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第三級（3アマ）\u003c/td>\u003ctd>空中線電力 50 ワット以下の無線設備で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使うものの操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第四級（4アマ）\u003c/td>\u003ctd>次の無線設備の操作（モールス符号による通信操作を除く）。空中線電力 10 ワット以下で 21 MHz から 30 MHz まで又は 8 MHz 以下の周波数の電波を使うもの。空中線電力 20 ワット以下で 30 MHz を超える周波数の電波を使うもの\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"law\">\u003csummary>電波法施行令 第3条第3項（表の一部）（条文を開く）\u003c/summary>\u003cblockquote>次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。\u003cbr>資格｜操作の範囲\u003cbr>第一級アマチュア無線技士｜アマチュア無線局の無線設備の操作\u003cbr>第二級アマチュア無線技士｜アマチュア無線局の空中線電力二百ワット以下の無線設備の操作\u003cbr>第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作\u003cbr>第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一　空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二　空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>4アマで、144 MHz 帯と 430 MHz 帯は 20 ワットまで操作できます。モールス符号の通信はできません。\u003c/p>\n\u003ch3 id=\"H04-3\">無線従事者の免許\u003c/h3>\n\u003cp>無線従事者になろうとする者は、総務大臣の免許を受けなければなりません（電波法第 41 条）。免許を受けられるのは、国家試験に合格した者、認定を受けた養成課程を修了した者などです。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_41-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第41条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線従事者になろうとする者は、総務大臣の免許を受けなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>次の者には、無線従事者の免許を与えないことができます（電波法第 42 条）。\u003c/p>\n\u003cul>\u003cli>電波法第 9 章の罪を犯して罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から 2 年を経過しない者\u003c/li>\u003cli>電波法第 79 条の規定で無線従事者の免許を取り消され、取消しの日から 2 年を経過しない者\u003c/li>\u003cli>著しく心身に欠陥があって無線従事者たるに適しない者\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_42\" target=\"_blank\" rel=\"noopener\">電波法 第42条\u003c/a>\u003c/figcaption>\u003cblockquote>（免許を与えない場合）\u003cbr>第四十二条　次の各号のいずれかに該当する者に対しては、無線従事者の免許を与えないことができる。\u003cbr>一　第九章の罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者\u003cbr>二　第七十九条第一項第一号又は第二号の規定により無線従事者の免許を取り消され、取消しの日から二年を経過しない者\u003cbr>三　著しく心身に欠陥があつて無線従事者たるに適しない者\u003c/blockquote>\u003c/figure>\n\u003cp>免許を与えると、免許証が交付されます。免許証の交付を受けた者は、無線設備の操作に関する知識と技術の向上を図るように努めなければなりません（無線従事者規則第 47 条）。\u003c/p>\n\u003ch3 id=\"H04-4\">免許証のきまり\u003c/h3>\n\u003cp>無線従事者は、業務に従事しているときは、免許証を携帯していなければなりません（電波法施行規則第 38 条第 11 項）。アマチュア無線では、運用しているときに持っています。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_38-Pr_11\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第38条第11項\u003c/a>\u003c/figcaption>\u003cblockquote>無線従事者は、その業務に従事しているときは、無線従事者の免許証（法第三十九条又は法第五十条の規定により船舶局無線従事者証明を要することとされた者については、無線従事者の免許証及び船舶局無線従事者証明書）を携帯していなければならない。\u003c/blockquote>\u003c/figure>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>こんなとき\u003c/th>\u003cth>すること\u003c/th>\u003cth>根拠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>氏名が変わった、免許証を汚した・破った・失った\u003c/td>\u003ctd>再交付を申請する（申請書、免許証（失ったときは除く）、写真 1 枚など）\u003c/td>\u003ctd>無線従事者規則第 50 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>免許の取消しの処分を受けた\u003c/td>\u003ctd>処分を受けた日から 10 日以内に、免許証を返納する\u003c/td>\u003ctd>無線従事者規則第 51 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>再交付を受けたあと、失った免許証を見つけた\u003c/td>\u003ctd>見つけた日から 10 日以内に、見つけた免許証を返納する\u003c/td>\u003ctd>無線従事者規則第 51 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線従事者が死亡した\u003c/td>\u003ctd>届出義務者が、遅滞なく免許証を返納する\u003c/td>\u003ctd>無線従事者規則第 51 条\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/402M50001000018#Mp-Ch_5-At_51-Pr_1\" target=\"_blank\" rel=\"noopener\">無線従事者規則 第51条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線従事者は、免許の取消しの処分を受けたときは、その処分を受けた日から十日以内にその免許証を総務大臣又は総合通信局長に返納しなければならない。免許証の再交付を受けた後失った免許証を発見したときも同様とする。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H04-5\">免許の取消しと業務の停止\u003c/h3>\n\u003cp>総務大臣は、無線従事者が電波法や命令、処分に違反したとき、不正な手段で免許を受けたときなどは、その免許を取り消し、又は 3 か月以内の期間を定めて業務に従事することを停止できます（電波法第 79 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_79-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第79条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>総務大臣は、無線従事者が左の各号の一に該当するときは、その免許を取り消し、又は三箇月以内の期間を定めてその業務に従事することを停止することができる。\u003cbr>一　この法律若しくはこの法律に基く命令又はこれらに基く処分に違反したとき。\u003cbr>二　不正な手段により免許を受けたとき。\u003cbr>三　第四十二条第三号に該当するに至つたとき。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H04-6\">体験運用\u003c/h3>\n\u003cp>資格のない人でも、無線従事者の指揮の下で、アマチュア局の無線設備を操作できる場合があります（電波法施行規則第 34 条の 10）。条件は次のとおりです。\u003c/p>\n\u003cul>\u003cli>科学技術に対する理解と関心を深めることを目的として、一時的に行うこと\u003c/li>\u003cli>指揮する無線従事者が操作できる範囲の中であること（モールス符号の操作を除く）\u003c/li>\u003cli>連絡の設定と終了の通信操作は、指揮する無線従事者が行うこと\u003c/li>\u003cli>操作する人が、免許の欠格事由（罰金以上の刑から 2 年以内など）に当たらないこと\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>電波法施行規則 第34条の10第1項第1号（条文を開く）\u003c/summary>\u003cblockquote>法第三十九条の十三ただし書の総務省令で定める場合は、次の各号に掲げる場合とする。\u003cbr>一　アマチュア局（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局を除く。以下この項において同じ。）の無線設備の操作をその操作ができる資格を有する無線従事者の指揮（立会い（これに相当する適切な措置を執るものを含む。）をするものに限る。以下この号及び次項において同じ。）の下に行う場合であつて、次に掲げる条件に適合するとき。\u003cbr>　（１）　科学技術に対する理解と関心を深めることを目的として一時的に行われるものであること。\u003cbr>　（２）　当該無線設備の操作を指揮する無線従事者の行うことができる無線設備の操作（モールス符号を送り、又は受ける無線電信の操作を除く。）の範囲内であること。\u003cbr>　（３）　当該無線設備の操作のうち、連絡の設定及び終了に関する通信操作については、当該無線設備の操作を指揮する無線従事者が行うこと。\u003cbr>　（４）　当該無線設備の操作を行う者が、法第五条第三項各号のいずれか又は法第四十二条第一号若しくは第二号に該当する者でないこと。\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_5-At_34_10-Pr_1-It_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>","sections":[{"id":"H04-1","title":"操作には資格が要る"},{"id":"H04-2","title":"資格ごとの操作の範囲"},{"id":"H04-3","title":"無線従事者の免許"},{"id":"H04-4","title":"免許証のきまり"},{"id":"H04-5","title":"免許の取消しと業務の停止"},{"id":"H04-6","title":"体験運用"}],"search":[{"id":"","title":"","text":"無線設備を操作するには、人の資格（無線従事者の免許）が要ります。この章では、アマチュア無線技士の資格ごとに操作できる範囲と、無線従事者の免許と免許証のきまりを覚えます。"},{"id":"H04-1","title":"操作には資格が要る","text":"操作には資格が要る アマチュア無線局の無線設備の操作は、無線従事者でなければ行ってはいけません（電波法第 39 条の 13）。ただし、外国の資格をもつ人が操作する場合や、総務省令で定める場合（体験運用など）は例外です。 電波法 第39条の13（アマチュア無線局の無線設備の操作） 第三十九条の十三 アマチュア無線局の無線設備の操作は、次条の定めるところにより、無線従事者でなければ行つてはならない。ただし、外国において同条第一項第五号に掲げる資格に相当する資格として総務省令で定めるものを有する者が総務省令で定めるところによりアマチュア無線局の無線設備の操作を行うとき、その他総務省令で定める場合は、この限りでない。 無線従事者のうち、アマチュア無線の資格は、第一級から第四級までのアマチュア無線技士です（電波法第 40 条）。"},{"id":"H04-2","title":"資格ごとの操作の範囲","text":"資格ごとの操作の範囲 資格ごとに操作できる範囲は、電波法施行令第 3 条で決められています。 資格操作の範囲（アマチュア無線局の無線設備）第一級（1アマ）すべての操作第二級（2アマ）空中線電力 200 ワット以下の無線設備の操作第三級（3アマ）空中線電力 50 ワット以下の無線設備で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使うものの操作第四級（4アマ）次の無線設備の操作（モールス符号による通信操作を除く）。空中線電力 10 ワット以下で 21 MHz から 30 MHz まで又は 8 MHz 以下の周波数の電波を使うもの。空中線電力 20 ワット以下で 30 MHz を超える周波数の電波を使うもの 電波法施行令 第3条第3項（表の一部）（条文を開く）次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。 資格｜操作の範囲 第一級アマチュア無線技士｜アマチュア無線局の無線設備の操作 第二級アマチュア無線技士｜アマチュア無線局の空中線電力二百ワット以下の無線設備の操作 第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作 第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一 空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二 空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するものe-Gov 法令検索で読む 4アマで、144 MHz 帯と 430 MHz 帯は 20 ワットまで操作できます。モールス符号の通信はできません。"},{"id":"H04-3","title":"無線従事者の免許","text":"無線従事者の免許 無線従事者になろうとする者は、総務大臣の免許を受けなければなりません（電波法第 41 条）。免許を受けられるのは、国家試験に合格した者、認定を受けた養成課程を修了した者などです。 電波法 第41条第1項無線従事者になろうとする者は、総務大臣の免許を受けなければならない。 次の者には、無線従事者の免許を与えないことができます（電波法第 42 条）。 電波法第 9 章の罪を犯して罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から 2 年を経過しない者電波法第 79 条の規定で無線従事者の免許を取り消され、取消しの日から 2 年を経過しない者著しく心身に欠陥があって無線従事者たるに適しない者 電波法 第42条（免許を与えない場合） 第四十二条 次の各号のいずれかに該当する者に対しては、無線従事者の免許を与えないことができる。 一 第九章の罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者 二 第七十九条第一項第一号又は第二号の規定により無線従事者の免許を取り消され、取消しの日から二年を経過しない者 三 著しく心身に欠陥があつて無線従事者たるに適しない者 免許を与えると、免許証が交付されます。免許証の交付を受けた者は、無線設備の操作に関する知識と技術の向上を図るように努めなければなりません（無線従事者規則第 47 条）。"},{"id":"H04-4","title":"免許証のきまり","text":"免許証のきまり 無線従事者は、業務に従事しているときは、免許証を携帯していなければなりません（電波法施行規則第 38 条第 11 項）。アマチュア無線では、運用しているときに持っています。 電波法施行規則 第38条第11項無線従事者は、その業務に従事しているときは、無線従事者の免許証（法第三十九条又は法第五十条の規定により船舶局無線従事者証明を要することとされた者については、無線従事者の免許証及び船舶局無線従事者証明書）を携帯していなければならない。 こんなときすること根拠氏名が変わった、免許証を汚した・破った・失った再交付を申請する（申請書、免許証（失ったときは除く）、写真 1 枚など）無線従事者規則第 50 条免許の取消しの処分を受けた処分を受けた日から 10 日以内に、免許証を返納する無線従事者規則第 51 条再交付を受けたあと、失った免許証を見つけた見つけた日から 10 日以内に、見つけた免許証を返納する無線従事者規則第 51 条無線従事者が死亡した届出義務者が、遅滞なく免許証を返納する無線従事者規則第 51 条 無線従事者規則 第51条第1項無線従事者は、免許の取消しの処分を受けたときは、その処分を受けた日から十日以内にその免許証を総務大臣又は総合通信局長に返納しなければならない。免許証の再交付を受けた後失った免許証を発見したときも同様とする。"},{"id":"H04-5","title":"免許の取消しと業務の停止","text":"免許の取消しと業務の停止 総務大臣は、無線従事者が電波法や命令、処分に違反したとき、不正な手段で免許を受けたときなどは、その免許を取り消し、又は 3 か月以内の期間を定めて業務に従事することを停止できます（電波法第 79 条）。 電波法 第79条第1項総務大臣は、無線従事者が左の各号の一に該当するときは、その免許を取り消し、又は三箇月以内の期間を定めてその業務に従事することを停止することができる。 一 この法律若しくはこの法律に基く命令又はこれらに基く処分に違反したとき。 二 不正な手段により免許を受けたとき。 三 第四十二条第三号に該当するに至つたとき。"},{"id":"H04-6","title":"体験運用","text":"体験運用 資格のない人でも、無線従事者の指揮の下で、アマチュア局の無線設備を操作できる場合があります（電波法施行規則第 34 条の 10）。条件は次のとおりです。 科学技術に対する理解と関心を深めることを目的として、一時的に行うこと指揮する無線従事者が操作できる範囲の中であること（モールス符号の操作を除く）連絡の設定と終了の通信操作は、指揮する無線従事者が行うこと操作する人が、免許の欠格事由（罰金以上の刑から 2 年以内など）に当たらないこと 電波法施行規則 第34条の10第1項第1号（条文を開く）法第三十九条の十三ただし書の総務省令で定める場合は、次の各号に掲げる場合とする。 一 アマチュア局（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局を除く。以下この項において同じ。）の無線設備の操作をその操作ができる資格を有する無線従事者の指揮（立会い（これに相当する適切な措置を執るものを含む。）をするものに限る。以下この号及び次項において同じ。）の下に行う場合であつて、次に掲げる条件に適合するとき。 （１） 科学技術に対する理解と関心を深めることを目的として一時的に行われるものであること。 （２） 当該無線設備の操作を指揮する無線従事者の行うことができる無線設備の操作（モールス符号を送り、又は受ける無線電信の操作を除く。）の範囲内であること。 （３） 当該無線設備の操作のうち、連絡の設定及び終了に関する通信操作については、当該無線設備の操作を指揮する無線従事者が行うこと。 （４） 当該無線設備の操作を行う者が、法第五条第三項各号のいずれか又は法第四十二条第一号若しくは第二号に該当する者でないこと。e-Gov 法令検索で読む"}],"only":""},{"id":"H05","subject":"法規","num":5,"title":"運用のきまり","html":"\u003cp>免許を受けた無線局は、免許記録に記録されたとおりに運用します。この章では、免許記録の範囲を超えてよい通信、混信の防止、通信の秘密、備え付ける書類、無線通信の原則を覚えます。\u003c/p>\n\u003ch3 id=\"H05-1\">免許記録のとおりに運用する\u003c/h3>\n\u003cp>無線局は、免許記録に記録されている目的、通信の相手方、通信事項の範囲を超えて運用してはいけません（電波法第 52 条）。ただし、次の通信は例外です。\u003c/p>\n\u003cul>\u003cli>遭難通信、緊急通信、安全通信（船舶や航空機の危険にかかわる通信）\u003c/li>\u003cli>非常通信\u003c/li>\u003cli>放送の受信\u003c/li>\u003cli>その他総務省令で定める通信\u003c/li>\u003c/ul>\n\u003cdetails class=\"law\">\u003csummary>電波法 第52条第1項（条文を開く）\u003c/summary>\u003cblockquote>無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。\u003cbr>一　遭難通信（船舶又は航空機が重大かつ急迫の危険に陥つた場合に遭難信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）\u003cbr>二　緊急通信（船舶又は航空機が重大かつ急迫の危険に陥るおそれがある場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）\u003cbr>三　安全通信（船舶又は航空機の航行に対する重大な危険を予防するために安全信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）\u003cbr>四　非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。）\u003cbr>五　放送の受信\u003cbr>六　その他総務省令で定める通信\u003c/blockquote>\u003cp>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_52-Pr_1\" target=\"_blank\" rel=\"noopener\">e-Gov 法令検索で読む\u003c/a>\u003c/p>\u003c/details>\n\u003cp>運用するときは、次のことも守ります（電波法第 53 条から第 55 条）。\u003c/p>\n\u003cul>\u003cli>無線設備の設置場所、識別信号、電波の型式、周波数は、免許記録のとおりにする（遭難通信を除く）\u003c/li>\u003cli>空中線電力は、免許記録の範囲内で、通信を行うため必要最小のものにする（遭難通信を除く）\u003c/li>\u003cli>免許記録に記録されている運用許容時間内に運用する（第 52 条の例外の通信などを除く）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_54\" target=\"_blank\" rel=\"noopener\">電波法 第54条\u003c/a>\u003c/figcaption>\u003cblockquote>第五十四条　無線局を運用する場合においては、空中線電力は、次の各号の定めるところによらなければならない。ただし、遭難通信については、この限りでない。\u003cbr>一　免許記録等に記録されているものの範囲内であること。\u003cbr>二　通信を行うため必要最小のものであること。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H05-2\">非常通信\u003c/h3>\n\u003cp>非常通信は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合に、有線通信を利用できないか、利用することが著しく困難なときに、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行う無線通信です（電波法第 52 条第 4 号）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_52-Pr_1-It_4\" target=\"_blank\" rel=\"noopener\">電波法 第52条第1項第4号\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。\u003cbr>四　非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。）\u003c/blockquote>\u003c/figure>\n\u003cp>「有線通信を利用することができないか、これを利用することが著しく困難であるとき」が条件です。有線通信が使えるときは、非常通信になりません。\u003c/p>\n\u003ch3 id=\"H05-3\">混信の防止と擬似空中線\u003c/h3>\n\u003cp>無線局は、ほかの無線局などに、その運用を阻害するような混信その他の妨害を与えないように運用しなければなりません（電波法第 56 条）。ただし、遭難通信、緊急通信、安全通信、非常通信は例外です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_56-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第56条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、他の無線局又は電波天文業務（宇宙から発する電波の受信を基礎とする天文学のための当該電波の受信の業務をいう。）の用に供する受信設備その他の総務省令で定める受信設備（無線局のものを除く。）で総務大臣が指定するものにその運用を阻害するような混信その他の妨害を与えないように運用しなければならない。但し、第五十二条第一号から第四号までに掲げる通信については、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003cp>無線設備の機器の試験や調整のために運用するときは、なるべく擬似空中線回路（ダミーロード）を使います（電波法第 57 条）。擬似空中線回路は、電波を空間に出さずに、送信機の出力を受け止める装置です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_57\" target=\"_blank\" rel=\"noopener\">電波法 第57条\u003c/a>\u003c/figcaption>\u003cblockquote>（擬似空中線回路の使用）\u003cbr>第五十七条　無線局は、次に掲げる場合には、なるべく擬似空中線回路を使用しなければならない。\u003cbr>一　無線設備の機器の試験又は調整を行うために運用するとき。\u003cbr>二　実験等無線局を運用するとき。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H05-4\">暗語の禁止と秘密の保護\u003c/h3>\n\u003cp>アマチュア無線局の行う通信には、暗語を使用してはいけません（電波法第 58 条）。暗語は、当事者だけに意味が分かる言葉や符号です。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_58\" target=\"_blank\" rel=\"noopener\">電波法 第58条\u003c/a>\u003c/figcaption>\u003cblockquote>（アマチュア無線局の通信）\u003cbr>第五十八条　アマチュア無線局の行う通信には、暗語を使用してはならない。\u003c/blockquote>\u003c/figure>\n\u003cp>何人も、法律に別段の定めがある場合を除いて、特定の相手方に対して行われる無線通信を傍受して、その存在や内容を漏らしたり、窃用（自分のために使うこと）したりしてはいけません（電波法第 59 条）。受信だけの人にも当てはまります。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_59\" target=\"_blank\" rel=\"noopener\">電波法 第59条\u003c/a>\u003c/figcaption>\u003cblockquote>（秘密の保護）\u003cbr>第五十九条　何人も法律に別段の定めがある場合を除くほか、特定の相手方に対して行われる無線通信（電気通信事業法第四条第一項又は第百六十四条第三項の通信であるものを除く。第百九条並びに第百九条の二第二項及び第三項において同じ。）を傍受してその存在若しくは内容を漏らし、又はこれを窃用してはならない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H05-5\">備え付ける書類\u003c/h3>\n\u003cp>無線局には、正確な時計、無線業務日誌その他総務省令で定める書類を備え付けておかなければなりません（電波法第 60 条）。ただし、総務大臣が告示で定める無線局は、これらの全部又は一部の備付けを省略できます（電波法施行規則第 38 条の 2）。\u003c/p>\n\u003cp>アマチュア局（人工衛星等のアマチュア局を除く）に備え付ける書類は、免許記録です（電波法施行規則第 38 条第 1 項）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_38-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第38条第1項（表の一部）\u003c/a>\u003c/figcaption>\u003cblockquote>法第六十条の規定により無線局に備え付けておかなければならない書類は、次の表の上欄の無線局につき、それぞれ同表の下欄に掲げるとおりとする。\u003cbr>無線局｜業務書類\u003cbr>五　アマチュア局｜（一）　免許記録（二）　無線局の免許の申請書の添付書類の写し（再免許を受けた無線局にあつては、最近の再免許の申請に係るもの）（１）（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局（以下この項において「人工衛星等のアマチュア局」という。）の場合に限る。）（三）　一の項の（三）に掲げる書類（１）（人工衛星等のアマチュア局の場合に限る。）\u003c/blockquote>\u003c/figure>\n\u003cp>移動するアマチュア局は、送信装置のある場所（運用するとき）か、無線設備の常置場所に免許記録を備え付けます。個人が開設する移動するアマチュア局は、免許人が携帯する機器（スマートフォンなど）に免許記録を表示させる方法や、免許記録の写し、免許事項証明書を携帯する方法でもかまいません（電波法施行規則第 38 条第 3 項・第 4 項）。\u003c/p>\n\u003ch3 id=\"H05-6\">無線通信の原則\u003c/h3>\n\u003cp>無線局運用規則第 10 条で、無線通信の原則が決められています。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_10\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第10条\u003c/a>\u003c/figcaption>\u003cblockquote>（無線通信の原則）\u003cbr>第十条　必要のない無線通信は、これを行なつてはならない。\u003cbr>２　無線通信に使用する用語は、できる限り簡潔でなければならない。\u003cbr>３　無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。\u003cbr>４　無線通信は、正確に行うものとし、通信上の誤りを知つたときは、直ちに訂正しなければならない。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H05-1","title":"免許記録のとおりに運用する"},{"id":"H05-2","title":"非常通信"},{"id":"H05-3","title":"混信の防止と擬似空中線"},{"id":"H05-4","title":"暗語の禁止と秘密の保護"},{"id":"H05-5","title":"備え付ける書類"},{"id":"H05-6","title":"無線通信の原則"}],"search":[{"id":"","title":"","text":"免許を受けた無線局は、免許記録に記録されたとおりに運用します。この章では、免許記録の範囲を超えてよい通信、混信の防止、通信の秘密、備え付ける書類、無線通信の原則を覚えます。"},{"id":"H05-1","title":"免許記録のとおりに運用する","text":"免許記録のとおりに運用する 無線局は、免許記録に記録されている目的、通信の相手方、通信事項の範囲を超えて運用してはいけません（電波法第 52 条）。ただし、次の通信は例外です。 遭難通信、緊急通信、安全通信（船舶や航空機の危険にかかわる通信）非常通信放送の受信その他総務省令で定める通信 電波法 第52条第1項（条文を開く）無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。 一 遭難通信（船舶又は航空機が重大かつ急迫の危険に陥つた場合に遭難信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。） 二 緊急通信（船舶又は航空機が重大かつ急迫の危険に陥るおそれがある場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。） 三 安全通信（船舶又は航空機の航行に対する重大な危険を予防するために安全信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。） 四 非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。） 五 放送の受信 六 その他総務省令で定める通信e-Gov 法令検索で読む 運用するときは、次のことも守ります（電波法第 53 条から第 55 条）。 無線設備の設置場所、識別信号、電波の型式、周波数は、免許記録のとおりにする（遭難通信を除く）空中線電力は、免許記録の範囲内で、通信を行うため必要最小のものにする（遭難通信を除く）免許記録に記録されている運用許容時間内に運用する（第 52 条の例外の通信などを除く） 電波法 第54条第五十四条 無線局を運用する場合においては、空中線電力は、次の各号の定めるところによらなければならない。ただし、遭難通信については、この限りでない。 一 免許記録等に記録されているものの範囲内であること。 二 通信を行うため必要最小のものであること。"},{"id":"H05-2","title":"非常通信","text":"非常通信 非常通信は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合に、有線通信を利用できないか、利用することが著しく困難なときに、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行う無線通信です（電波法第 52 条第 4 号）。 電波法 第52条第1項第4号無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。 四 非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。） 「有線通信を利用することができないか、これを利用することが著しく困難であるとき」が条件です。有線通信が使えるときは、非常通信になりません。"},{"id":"H05-3","title":"混信の防止と擬似空中線","text":"混信の防止と擬似空中線 無線局は、ほかの無線局などに、その運用を阻害するような混信その他の妨害を与えないように運用しなければなりません（電波法第 56 条）。ただし、遭難通信、緊急通信、安全通信、非常通信は例外です。 電波法 第56条第1項無線局は、他の無線局又は電波天文業務（宇宙から発する電波の受信を基礎とする天文学のための当該電波の受信の業務をいう。）の用に供する受信設備その他の総務省令で定める受信設備（無線局のものを除く。）で総務大臣が指定するものにその運用を阻害するような混信その他の妨害を与えないように運用しなければならない。但し、第五十二条第一号から第四号までに掲げる通信については、この限りでない。 無線設備の機器の試験や調整のために運用するときは、なるべく擬似空中線回路（ダミーロード）を使います（電波法第 57 条）。擬似空中線回路は、電波を空間に出さずに、送信機の出力を受け止める装置です。 電波法 第57条（擬似空中線回路の使用） 第五十七条 無線局は、次に掲げる場合には、なるべく擬似空中線回路を使用しなければならない。 一 無線設備の機器の試験又は調整を行うために運用するとき。 二 実験等無線局を運用するとき。"},{"id":"H05-4","title":"暗語の禁止と秘密の保護","text":"暗語の禁止と秘密の保護 アマチュア無線局の行う通信には、暗語を使用してはいけません（電波法第 58 条）。暗語は、当事者だけに意味が分かる言葉や符号です。 電波法 第58条（アマチュア無線局の通信） 第五十八条 アマチュア無線局の行う通信には、暗語を使用してはならない。 何人も、法律に別段の定めがある場合を除いて、特定の相手方に対して行われる無線通信を傍受して、その存在や内容を漏らしたり、窃用（自分のために使うこと）したりしてはいけません（電波法第 59 条）。受信だけの人にも当てはまります。 電波法 第59条（秘密の保護） 第五十九条 何人も法律に別段の定めがある場合を除くほか、特定の相手方に対して行われる無線通信（電気通信事業法第四条第一項又は第百六十四条第三項の通信であるものを除く。第百九条並びに第百九条の二第二項及び第三項において同じ。）を傍受してその存在若しくは内容を漏らし、又はこれを窃用してはならない。"},{"id":"H05-5","title":"備え付ける書類","text":"備え付ける書類 無線局には、正確な時計、無線業務日誌その他総務省令で定める書類を備え付けておかなければなりません（電波法第 60 条）。ただし、総務大臣が告示で定める無線局は、これらの全部又は一部の備付けを省略できます（電波法施行規則第 38 条の 2）。 アマチュア局（人工衛星等のアマチュア局を除く）に備え付ける書類は、免許記録です（電波法施行規則第 38 条第 1 項）。 電波法施行規則 第38条第1項（表の一部）法第六十条の規定により無線局に備え付けておかなければならない書類は、次の表の上欄の無線局につき、それぞれ同表の下欄に掲げるとおりとする。 無線局｜業務書類 五 アマチュア局｜（一） 免許記録（二） 無線局の免許の申請書の添付書類の写し（再免許を受けた無線局にあつては、最近の再免許の申請に係るもの）（１）（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局（以下この項において「人工衛星等のアマチュア局」という。）の場合に限る。）（三） 一の項の（三）に掲げる書類（１）（人工衛星等のアマチュア局の場合に限る。） 移動するアマチュア局は、送信装置のある場所（運用するとき）か、無線設備の常置場所に免許記録を備え付けます。個人が開設する移動するアマチュア局は、免許人が携帯する機器（スマートフォンなど）に免許記録を表示させる方法や、免許記録の写し、免許事項証明書を携帯する方法でもかまいません（電波法施行規則第 38 条第 3 項・第 4 項）。"},{"id":"H05-6","title":"無線通信の原則","text":"無線通信の原則 無線局運用規則第 10 条で、無線通信の原則が決められています。 無線局運用規則 第10条（無線通信の原則） 第十条 必要のない無線通信は、これを行なつてはならない。 ２ 無線通信に使用する用語は、できる限り簡潔でなければならない。 ３ 無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。 ４ 無線通信は、正確に行うものとし、通信上の誤りを知つたときは、直ちに訂正しなければならない。"}],"only":""},{"id":"H06","subject":"法規","num":6,"title":"通信のしかた","html":"\u003cp>無線電話で交信するときの呼出しと応答のしかたは、無線局運用規則で決められています。この章では、無線電話で使う略語、電波を出す前にすること、呼出し・応答・一括呼出し（CQ）の順番、試験電波の出し方を覚えます。\u003c/p>\n\u003ch3 id=\"H06-1\">無線電話の略語\u003c/h3>\n\u003cp>無線電話による通信の業務用語には、無線局運用規則の別表第四号の略語を使います（無線局運用規則第 14 条）。モールス符号による通信（無線電信）の略符号と、次のように対応しています。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>無線電話の略語\u003c/th>\u003cth>無線電信の略符号\u003c/th>\u003cth>使うとき\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>各局\u003c/td>\u003ctd>CQ\u003c/td>\u003ctd>相手を決めずに呼び出す\u003c/td>\u003c/tr>\u003ctr>\u003ctd>こちらは\u003c/td>\u003ctd>DE\u003c/td>\u003ctd>このあとに自局の呼出符号を言う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>どうぞ\u003c/td>\u003ctd>K\u003c/td>\u003ctd>送信を終えて、相手の送信を待つ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>了解 又は OK\u003c/td>\u003ctd>R\u003c/td>\u003ctd>受信した\u003c/td>\u003c/tr>\u003ctr>\u003ctd>お待ちください\u003c/td>\u003ctd>AS（上に線）\u003c/td>\u003ctd>少し待ってほしい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>反復\u003c/td>\u003ctd>RPT\u003c/td>\u003ctd>もう一度送ってほしい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ただいま試験中\u003c/td>\u003ctd>EX\u003c/td>\u003ctd>試験電波を出す\u003c/td>\u003c/tr>\u003ctr>\u003ctd>本日は晴天なり\u003c/td>\u003ctd>VVV\u003c/td>\u003ctd>試験電波で送る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>訂正\u003c/td>\u003ctd>HH（上に線）\u003c/td>\u003ctd>送信をまちがえた\u003c/td>\u003c/tr>\u003ctr>\u003ctd>さようなら\u003c/td>\u003ctd>VA（上に線）\u003c/td>\u003ctd>通信を終わる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>非常\u003c/td>\u003ctd>OSO（上に線）\u003c/td>\u003ctd>非常の場合の無線通信\u003c/td>\u003c/tr>\u003ctr>\u003ctd>誰かこちらを呼びましたか\u003c/td>\u003ctd>QRZ?\u003c/td>\u003ctd>呼んだ局が分からない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>明りょう度\u003c/td>\u003ctd>QRK\u003c/td>\u003ctd>声の聞きやすさ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>感度\u003c/td>\u003ctd>QSA\u003c/td>\u003ctd>電波の強さ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>上に線の付いた略符号は、つなげて 1 つの符号として送るものです。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第14条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。\u003c/blockquote>\u003c/figure>\n\u003cp>無線電話による通信の方法は、特に決まりがあるものを除き、無線電信の通信の方法の規定を準用します（無線局運用規則第 18 条）。条文に「DE」とあるところは、無線電話では「こちらは」と言います。\u003c/p>\n\u003cp>語を 1 字ずつ区切って送るときは、なるべく通話表を使います（第 14 条第 4 項）。和文は「朝日のア」「いろはのイ」、欧文は「ALFA」「BRAVO」などです（別表第五号）。\u003c/p>\n\u003ch3 id=\"H06-2\">電波を出す前に\u003c/h3>\n\u003cp>相手局を呼び出そうとするときは、電波を発射する前に、受信機を最良の感度に調整し、自局が発射しようとする電波の周波数などで聴守して、他の通信に混信を与えないことを確かめます（無線局運用規則第 19 条の 2）。混信を与えるおそれがあるときは、その通信が終わってから呼び出します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_19_2-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第19条の2第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、相手局を呼び出そうとするときは、電波を発射する前に、受信機を最良の感度に調整し、自局の発射しようとする電波の周波数その他必要と認める周波数によつて聴守し、他の通信に混信を与えないことを確かめなければならない。ただし、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行なう場合並びに海上移動業務以外の業務において他の通信に混信を与えないことが確実である電波により通信を行なう場合は、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H06-3\">呼出しと応答\u003c/h3>\n\u003cp>呼出しは、次の順に送ります（無線局運用規則第 20 条）。\u003c/p>\n\u003col>\u003cli>相手局の呼出符号　3 回以下\u003c/li>\u003cli>こちらは　1 回\u003c/li>\u003cli>自局の呼出符号　3 回以下\u003c/li>\u003c/ol>\n\u003cp>自局への呼出しを受けたら、直ちに応答します。応答は、次の順に送ります（第 23 条）。\u003c/p>\n\u003col>\u003cli>相手局の呼出符号　3 回以下\u003c/li>\u003cli>こちらは　1 回\u003c/li>\u003cli>自局の呼出符号　1 回\u003c/li>\u003c/ol>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_2\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第23条第2項\u003c/a>\u003c/figcaption>\u003cblockquote>前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。\u003cbr>一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　一回\u003c/blockquote>\u003c/figure>\n\u003cp>応答のあと、すぐに通報を受信できるときは「どうぞ」を送ります。すぐに受信できないときは、「どうぞ」の代わりに「お待ちください」と、待ってほしいおよその時間（分）を送ります。10 分以上待ってもらうときは、その理由も簡単に送ります（第 23 条第 3 項）。\u003c/p>\n\u003cp>例（自局 JA1〇〇〇 が、相手局 JA1△△△ を呼ぶとき）\u003c/p>\n\u003cblockquote>呼出し：JA1△△△　JA1△△△　JA1△△△　こちらは　JA1〇〇〇　JA1〇〇〇　JA1〇〇〇　どうぞ\u003cbr>応答：JA1〇〇〇　JA1〇〇〇　JA1〇〇〇　こちらは　JA1△△△　どうぞ\u003c/blockquote>\n\u003ch3 id=\"H06-4\">一括呼出し（CQ）\u003c/h3>\n\u003cp>相手を決めずに各局へ呼びかけるときは、次の順に送ります（無線局運用規則第 127 条。アマチュア局には第 261 条で準用）。\u003c/p>\n\u003col>\u003cli>各局　3 回\u003c/li>\u003cli>こちらは　1 回\u003c/li>\u003cli>自局の呼出符号　3 回以下\u003c/li>\u003cli>どうぞ　1 回\u003c/li>\u003c/ol>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_1-At_127-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第127条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>免許記録に記録されている通信の相手方である無線局を一括して呼び出そうとするときは、左の事項を順次送信するものとする。\u003cbr>一　ＣＱ　三回\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　三回以下\u003cbr>四　Ｋ　一回\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H06-5\">呼出しのやり直しと中止\u003c/h3>\n\u003cul>\u003cli>呼出しは 1 分間以上の間隔をおいて 2 回反復でき、反復しても応答がないときは、少なくとも 3 分間の間隔をおいてから再開します（無線局運用規則第 21 条。海上移動業務の規定で、ほかの業務もできる限りこれに準じます）\u003c/li>\u003cli>自局の呼出しが、すでに行われているほかの通信に混信を与えていると通知を受けたら、直ちに呼出しを中止します。試験や調整のための電波も同じです（第 22 条）\u003c/li>\u003cli>自局への呼出しか確実でない呼出しを受けたら、その呼出しが反復され、自局への呼出しだと確実に分かるまで、応答してはいけません（第 26 条）\u003c/li>\u003cli>自局への呼出しだが、呼出局の呼出符号が不確実なときは、相手局の呼出符号の代わりに「誰かこちらを呼びましたか」を使って、直ちに応答します（第 26 条）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_22-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第22条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、自局の呼出しが他の既に行われている通信に混信を与える旨の通知を受けたときは、直ちにその呼出しを中止しなければならない。無線設備の機器の試験又は調整のための電波の発射についても同様とする。\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_26\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第26条\u003c/a>\u003c/figcaption>\u003cblockquote>（不確実な呼出しに対する応答）\u003cbr>第二十六条　無線局は、自局に対する呼出しであることが確実でない呼出しを受信したときは、その呼出しが反覆され、且つ、自局に対する呼出しであることが確実に判明するまで応答してはならない。\u003cbr>２　自局に対する呼出しを受信した場合において、呼出局の呼出符号が不確実であるときは、応答事項のうち相手局の呼出符号の代りに「ＱＲＺ？」を使用して、直ちに応答しなければならない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H06-6\">試験電波の出し方\u003c/h3>\n\u003cp>無線機器の試験や調整のために電波を出すときは、次の順に行います（無線局運用規則第 39 条）。\u003c/p>\n\u003col>\u003cli>発射する前に、その周波数などで聴守し、他の無線局の通信に混信を与えないことを確かめる\u003c/li>\u003cli>「ただいま試験中」3 回、「こちらは」1 回、自局の呼出符号 3 回を送る\u003c/li>\u003cli>さらに 1 分間聴守し、他の無線局から停止の請求がないことを確かめる\u003c/li>\u003cli>「本日は晴天なり」の連続と、自局の呼出符号 1 回を送る。この送信は 10 秒間を超えないようにする（海上移動業務以外の局は、必要があれば 10 秒間を超えてもよい）\u003c/li>\u003c/ol>\n\u003cp>試験や調整の間は、しばしばその周波数で聴守して、停止の要求がないかを確かめます。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_1\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第39条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。\u003cbr>一　ＥＸ　三回\u003cbr>二　ＤＥ　一回\u003cbr>三　自局の呼出符号　三回\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H06-7\">長い送信と簡単な呼出し\u003c/h3>\n\u003cp>長時間続けて通報を送信するときは、アマチュア局では 10 分ごとを標準として、「こちらは」と自局の呼出符号を送ります（無線局運用規則第 30 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_30\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第30条\u003c/a>\u003c/figcaption>\u003cblockquote>（長時間の送信）\u003cbr>第三十条　無線局は、長時間継続して通報を送信するときは、三十分（アマチュア局にあつては十分）ごとを標準として適当に「ＤＥ」及び自局の呼出符号を送信しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>空中線電力 50 ワット以下の無線設備で呼出しや応答を行い、確実に連絡の設定ができると認められるときは、呼出しの「こちらは」と自局の呼出符号、又は応答の相手局の呼出符号を省略できます。呼出しで省略したときは、その通信中に少なくとも 1 回以上、自局の呼出符号を送ります（第 126 条の 2。アマチュア局には第 261 条で準用）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_1-At_126_2\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第126条の2\u003c/a>\u003c/figcaption>\u003cblockquote>（呼出し又は応答の簡易化）\u003cbr>第百二十六条の二　空中線電力五十ワツト以下の無線設備を使用して呼出し又は応答を行う場合において、確実に連絡の設定ができると認められるときは、第二十条第一項第二号及び第三号又は第二十三条第二項第一号に掲げる事項の送信を省略することができる。\u003cbr>２　前項の規定により第二十条第一項第二号及び第三号に掲げる事項の送信を省略した無線局は、その通信中少なくとも一回以上自局の呼出符号を送信しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>通信が終わったら「さようなら」を送ります。ただし、海上移動業務以外では省略できます（第 38 条）。\u003c/p>","sections":[{"id":"H06-1","title":"無線電話の略語"},{"id":"H06-2","title":"電波を出す前に"},{"id":"H06-3","title":"呼出しと応答"},{"id":"H06-4","title":"一括呼出し（CQ）"},{"id":"H06-5","title":"呼出しのやり直しと中止"},{"id":"H06-6","title":"試験電波の出し方"},{"id":"H06-7","title":"長い送信と簡単な呼出し"}],"search":[{"id":"","title":"","text":"無線電話で交信するときの呼出しと応答のしかたは、無線局運用規則で決められています。この章では、無線電話で使う略語、電波を出す前にすること、呼出し・応答・一括呼出し（CQ）の順番、試験電波の出し方を覚えます。"},{"id":"H06-1","title":"無線電話の略語","text":"無線電話の略語 無線電話による通信の業務用語には、無線局運用規則の別表第四号の略語を使います（無線局運用規則第 14 条）。モールス符号による通信（無線電信）の略符号と、次のように対応しています。 無線電話の略語無線電信の略符号使うとき各局CQ相手を決めずに呼び出すこちらはDEこのあとに自局の呼出符号を言うどうぞK送信を終えて、相手の送信を待つ了解 又は OKR受信したお待ちくださいAS（上に線）少し待ってほしい反復RPTもう一度送ってほしいただいま試験中EX試験電波を出す本日は晴天なりVVV試験電波で送る訂正HH（上に線）送信をまちがえたさようならVA（上に線）通信を終わる非常OSO（上に線）非常の場合の無線通信誰かこちらを呼びましたかQRZ?呼んだ局が分からない明りょう度QRK声の聞きやすさ感度QSA電波の強さ 上に線の付いた略符号は、つなげて 1 つの符号として送るものです。 無線局運用規則 第14条第1項無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。 無線電話による通信の方法は、特に決まりがあるものを除き、無線電信の通信の方法の規定を準用します（無線局運用規則第 18 条）。条文に「DE」とあるところは、無線電話では「こちらは」と言います。 語を 1 字ずつ区切って送るときは、なるべく通話表を使います（第 14 条第 4 項）。和文は「朝日のア」「いろはのイ」、欧文は「ALFA」「BRAVO」などです（別表第五号）。"},{"id":"H06-2","title":"電波を出す前に","text":"電波を出す前に 相手局を呼び出そうとするときは、電波を発射する前に、受信機を最良の感度に調整し、自局が発射しようとする電波の周波数などで聴守して、他の通信に混信を与えないことを確かめます（無線局運用規則第 19 条の 2）。混信を与えるおそれがあるときは、その通信が終わってから呼び出します。 無線局運用規則 第19条の2第1項無線局は、相手局を呼び出そうとするときは、電波を発射する前に、受信機を最良の感度に調整し、自局の発射しようとする電波の周波数その他必要と認める周波数によつて聴守し、他の通信に混信を与えないことを確かめなければならない。ただし、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行なう場合並びに海上移動業務以外の業務において他の通信に混信を与えないことが確実である電波により通信を行なう場合は、この限りでない。"},{"id":"H06-3","title":"呼出しと応答","text":"呼出しと応答 呼出しは、次の順に送ります（無線局運用規則第 20 条）。 相手局の呼出符号 3 回以下こちらは 1 回自局の呼出符号 3 回以下 自局への呼出しを受けたら、直ちに応答します。応答は、次の順に送ります（第 23 条）。 相手局の呼出符号 3 回以下こちらは 1 回自局の呼出符号 1 回 無線局運用規則 第23条第2項前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。 一 相手局の呼出符号 三回以下（海上移動業務にあつては二回以下） 二 ＤＥ 一回 三 自局の呼出符号 一回 応答のあと、すぐに通報を受信できるときは「どうぞ」を送ります。すぐに受信できないときは、「どうぞ」の代わりに「お待ちください」と、待ってほしいおよその時間（分）を送ります。10 分以上待ってもらうときは、その理由も簡単に送ります（第 23 条第 3 項）。 例（自局 JA1〇〇〇 が、相手局 JA1△△△ を呼ぶとき） 呼出し：JA1△△△ JA1△△△ JA1△△△ こちらは JA1〇〇〇 JA1〇〇〇 JA1〇〇〇 どうぞ 応答：JA1〇〇〇 JA1〇〇〇 JA1〇〇〇 こちらは JA1△△△ どうぞ"},{"id":"H06-4","title":"一括呼出し（CQ）","text":"一括呼出し（CQ） 相手を決めずに各局へ呼びかけるときは、次の順に送ります（無線局運用規則第 127 条。アマチュア局には第 261 条で準用）。 各局 3 回こちらは 1 回自局の呼出符号 3 回以下どうぞ 1 回 無線局運用規則 第127条第1項免許記録に記録されている通信の相手方である無線局を一括して呼び出そうとするときは、左の事項を順次送信するものとする。 一 ＣＱ 三回 二 ＤＥ 一回 三 自局の呼出符号 三回以下 四 Ｋ 一回"},{"id":"H06-5","title":"呼出しのやり直しと中止","text":"呼出しのやり直しと中止 呼出しは 1 分間以上の間隔をおいて 2 回反復でき、反復しても応答がないときは、少なくとも 3 分間の間隔をおいてから再開します（無線局運用規則第 21 条。海上移動業務の規定で、ほかの業務もできる限りこれに準じます）自局の呼出しが、すでに行われているほかの通信に混信を与えていると通知を受けたら、直ちに呼出しを中止します。試験や調整のための電波も同じです（第 22 条）自局への呼出しか確実でない呼出しを受けたら、その呼出しが反復され、自局への呼出しだと確実に分かるまで、応答してはいけません（第 26 条）自局への呼出しだが、呼出局の呼出符号が不確実なときは、相手局の呼出符号の代わりに「誰かこちらを呼びましたか」を使って、直ちに応答します（第 26 条） 無線局運用規則 第22条第1項無線局は、自局の呼出しが他の既に行われている通信に混信を与える旨の通知を受けたときは、直ちにその呼出しを中止しなければならない。無線設備の機器の試験又は調整のための電波の発射についても同様とする。 無線局運用規則 第26条（不確実な呼出しに対する応答） 第二十六条 無線局は、自局に対する呼出しであることが確実でない呼出しを受信したときは、その呼出しが反覆され、且つ、自局に対する呼出しであることが確実に判明するまで応答してはならない。 ２ 自局に対する呼出しを受信した場合において、呼出局の呼出符号が不確実であるときは、応答事項のうち相手局の呼出符号の代りに「ＱＲＺ？」を使用して、直ちに応答しなければならない。"},{"id":"H06-6","title":"試験電波の出し方","text":"試験電波の出し方 無線機器の試験や調整のために電波を出すときは、次の順に行います（無線局運用規則第 39 条）。 発射する前に、その周波数などで聴守し、他の無線局の通信に混信を与えないことを確かめる「ただいま試験中」3 回、「こちらは」1 回、自局の呼出符号 3 回を送るさらに 1 分間聴守し、他の無線局から停止の請求がないことを確かめる「本日は晴天なり」の連続と、自局の呼出符号 1 回を送る。この送信は 10 秒間を超えないようにする（海上移動業務以外の局は、必要があれば 10 秒間を超えてもよい） 試験や調整の間は、しばしばその周波数で聴守して、停止の要求がないかを確かめます。 無線局運用規則 第39条第1項無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。 一 ＥＸ 三回 二 ＤＥ 一回 三 自局の呼出符号 三回"},{"id":"H06-7","title":"長い送信と簡単な呼出し","text":"長い送信と簡単な呼出し 長時間続けて通報を送信するときは、アマチュア局では 10 分ごとを標準として、「こちらは」と自局の呼出符号を送ります（無線局運用規則第 30 条）。 無線局運用規則 第30条（長時間の送信） 第三十条 無線局は、長時間継続して通報を送信するときは、三十分（アマチュア局にあつては十分）ごとを標準として適当に「ＤＥ」及び自局の呼出符号を送信しなければならない。 空中線電力 50 ワット以下の無線設備で呼出しや応答を行い、確実に連絡の設定ができると認められるときは、呼出しの「こちらは」と自局の呼出符号、又は応答の相手局の呼出符号を省略できます。呼出しで省略したときは、その通信中に少なくとも 1 回以上、自局の呼出符号を送ります（第 126 条の 2。アマチュア局には第 261 条で準用）。 無線局運用規則 第126条の2（呼出し又は応答の簡易化） 第百二十六条の二 空中線電力五十ワツト以下の無線設備を使用して呼出し又は応答を行う場合において、確実に連絡の設定ができると認められるときは、第二十条第一項第二号及び第三号又は第二十三条第二項第一号に掲げる事項の送信を省略することができる。 ２ 前項の規定により第二十条第一項第二号及び第三号に掲げる事項の送信を省略した無線局は、その通信中少なくとも一回以上自局の呼出符号を送信しなければならない。 通信が終わったら「さようなら」を送ります。ただし、海上移動業務以外では省略できます（第 38 条）。"}],"only":""},{"id":"H07","subject":"法規","num":7,"title":"アマチュア局のきまりと非常通信","html":"\u003cp>アマチュア局には、ほかの無線局にはない決まりがあります。この章では、アマチュア局の運用のきまり（無線局運用規則第 8 章）と、災害のときの非常の場合の無線通信を覚えます。\u003c/p>\n\u003ch3 id=\"H07-1\">アマチュア局の運用のきまり\u003c/h3>\n\u003cp>無線局運用規則の第 257 条から第 260 条が、アマチュア局だけの決まりです。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>決まり\u003c/th>\u003cth>中身\u003c/th>\u003cth>根拠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>発射の制限\u003c/td>\u003ctd>発射の占有する周波数帯幅に含まれるどんなエネルギーの発射も、その局が動作を許された周波数帯から逸脱してはいけない\u003c/td>\u003ctd>第 257 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>発射の中止\u003c/td>\u003ctd>自局の電波が、ほかの無線局の運用や放送の受信に支障を与え、又は与えるおそれがあるときは、すみやかにその周波数による電波の発射を中止する（遭難通信などを除く）\u003c/td>\u003ctd>第 258 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>使用区別\u003c/td>\u003ctd>電波の型式と周波数の使用区別は、告示（アマチュアバンドの使用区別）による\u003c/td>\u003ctd>第 258 条の 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>禁止する通報\u003c/td>\u003ctd>送信する通報は、他人の依頼によるものであってはいけない（非常の事態での人命の救助などに必要な通報などを除く）\u003c/td>\u003ctd>第 259 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線設備の操作\u003c/td>\u003ctd>無線設備の操作を行う者は、免許人（社団のときは、その構成員）以外の者であってはいけない\u003c/td>\u003ctd>第 260 条\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_258\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第258条\u003c/a>\u003c/figcaption>\u003cblockquote>第二百五十八条　アマチュア局は、自局の発射する電波が他の無線局の運用又は放送の受信に支障を与え、若しくは与える虞があるときは、すみやかに当該周波数による電波の発射を中止しなければならない。但し、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行う場合は、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_259\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第259条\u003c/a>\u003c/figcaption>\u003cblockquote>（禁止する通報）\u003cbr>第二百五十九条　アマチュア局の送信する通報は、他人の依頼によるものであつてはならない。ただし、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合における、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通報及び人工衛星に開設するアマチュア局の送信する通報は、この限りでない。\u003c/blockquote>\u003c/figure>\n\u003cp>使用区別の告示をもとに、日本アマチュア無線連盟（JARL）がバンドプランをまとめています。たとえば、144 MHz 帯や 430 MHz 帯の中でも、FM の電話を使える周波数は決まっています。\u003c/p>\n\u003ch3 id=\"H07-2\">非常の場合の無線通信\u003c/h3>\n\u003cp>総務大臣は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合に、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を、無線局に行わせることができます（電波法第 74 条）。このとき、国はその通信に要した実費を弁償します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_74\" target=\"_blank\" rel=\"noopener\">電波法 第74条\u003c/a>\u003c/figcaption>\u003cblockquote>（非常の場合の無線通信）\u003cbr>第七十四条　総務大臣は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合においては、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を無線局に行わせることができる。\u003cbr>２　総務大臣が前項の規定により無線局に通信を行わせたときは、国は、その通信に要した実費を弁償しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>この通信の方法は、無線局運用規則の第 129 条から第 136 条で決められています（アマチュア局には第 261 条で準用）。\u003c/p>\n\u003cul>\u003cli>連絡を設定するための呼出しや応答は、呼出事項や応答事項の前に「非常」を 3 回送ります（第 131 条。条文の記号は、無線電話では「非常」）\u003c/li>\u003cli>「非常」を前に付けた呼出しを受信した無線局は、応答する場合を除いて、その通信に混信を与えるおそれのある電波の発射を停止して、傍受します（第 132 条）\u003c/li>\u003cli>通報は、決められた優先順位で送ります。第 1 位は人命の救助に関する通報、第 2 位は天災の予報に関する通報です（第 129 条）\u003c/li>\u003cli>非常通信の取扱いを始めたあと、有線通信の状態が復旧したら、すみやかに取扱いを停止します（第 136 条）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_132\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第132条\u003c/a>\u003c/figcaption>\u003cblockquote>（「〔記号〕」を受信した場合の措置）\u003cbr>第百三十二条　「〔記号〕」を前置した呼出しを受信した無線局は、応答する場合を除く外、これに混信を与える虞のある電波の発射を停止して傍受しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_136\" target=\"_blank\" rel=\"noopener\">無線局運用規則 第136条\u003c/a>\u003c/figcaption>\u003cblockquote>（取扱の停止）\u003cbr>第百三十六条　非常通信の取扱を開始した後、有線通信の状態が復旧した場合は、すみやかにその取扱を停止しなければならない。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H07-3\">非常通信を行ったら報告する\u003c/h3>\n\u003cp>遭難通信、緊急通信、安全通信、非常通信を行ったときは、総務大臣に報告しなければなりません（電波法第 80 条）。電波法に違反して運用している無線局を見つけたときも、報告します。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_80-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第80条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>無線局の免許人等は、次に掲げる場合は、総務省令で定める手続により、総務大臣に報告しなければならない。\u003cbr>一　遭難通信、緊急通信、安全通信又は非常通信を行つたとき（第七十条の七第一項、第七十条の八第一項又は第七十条の九第一項の規定により無線局を運用させた免許人等以外の者が行つたときを含む。）。\u003cbr>二　この法律又はこの法律に基づく命令の規定に違反して運用した無線局を認めたとき。\u003cbr>三　無線局が外国において、あらかじめ総務大臣が告示した以外の運用の制限をされたとき。\u003c/blockquote>\u003c/figure>","sections":[{"id":"H07-1","title":"アマチュア局の運用のきまり"},{"id":"H07-2","title":"非常の場合の無線通信"},{"id":"H07-3","title":"非常通信を行ったら報告する"}],"search":[{"id":"","title":"","text":"アマチュア局には、ほかの無線局にはない決まりがあります。この章では、アマチュア局の運用のきまり（無線局運用規則第 8 章）と、災害のときの非常の場合の無線通信を覚えます。"},{"id":"H07-1","title":"アマチュア局の運用のきまり","text":"アマチュア局の運用のきまり 無線局運用規則の第 257 条から第 260 条が、アマチュア局だけの決まりです。 決まり中身根拠発射の制限発射の占有する周波数帯幅に含まれるどんなエネルギーの発射も、その局が動作を許された周波数帯から逸脱してはいけない第 257 条発射の中止自局の電波が、ほかの無線局の運用や放送の受信に支障を与え、又は与えるおそれがあるときは、すみやかにその周波数による電波の発射を中止する（遭難通信などを除く）第 258 条使用区別電波の型式と周波数の使用区別は、告示（アマチュアバンドの使用区別）による第 258 条の 2禁止する通報送信する通報は、他人の依頼によるものであってはいけない（非常の事態での人命の救助などに必要な通報などを除く）第 259 条無線設備の操作無線設備の操作を行う者は、免許人（社団のときは、その構成員）以外の者であってはいけない第 260 条 無線局運用規則 第258条第二百五十八条 アマチュア局は、自局の発射する電波が他の無線局の運用又は放送の受信に支障を与え、若しくは与える虞があるときは、すみやかに当該周波数による電波の発射を中止しなければならない。但し、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行う場合は、この限りでない。 無線局運用規則 第259条（禁止する通報） 第二百五十九条 アマチュア局の送信する通報は、他人の依頼によるものであつてはならない。ただし、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合における、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通報及び人工衛星に開設するアマチュア局の送信する通報は、この限りでない。 使用区別の告示をもとに、日本アマチュア無線連盟（JARL）がバンドプランをまとめています。たとえば、144 MHz 帯や 430 MHz 帯の中でも、FM の電話を使える周波数は決まっています。"},{"id":"H07-2","title":"非常の場合の無線通信","text":"非常の場合の無線通信 総務大臣は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合に、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を、無線局に行わせることができます（電波法第 74 条）。このとき、国はその通信に要した実費を弁償します。 電波法 第74条（非常の場合の無線通信） 第七十四条 総務大臣は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合においては、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を無線局に行わせることができる。 ２ 総務大臣が前項の規定により無線局に通信を行わせたときは、国は、その通信に要した実費を弁償しなければならない。 この通信の方法は、無線局運用規則の第 129 条から第 136 条で決められています（アマチュア局には第 261 条で準用）。 連絡を設定するための呼出しや応答は、呼出事項や応答事項の前に「非常」を 3 回送ります（第 131 条。条文の記号は、無線電話では「非常」）「非常」を前に付けた呼出しを受信した無線局は、応答する場合を除いて、その通信に混信を与えるおそれのある電波の発射を停止して、傍受します（第 132 条）通報は、決められた優先順位で送ります。第 1 位は人命の救助に関する通報、第 2 位は天災の予報に関する通報です（第 129 条）非常通信の取扱いを始めたあと、有線通信の状態が復旧したら、すみやかに取扱いを停止します（第 136 条） 無線局運用規則 第132条（「〔記号〕」を受信した場合の措置） 第百三十二条 「〔記号〕」を前置した呼出しを受信した無線局は、応答する場合を除く外、これに混信を与える虞のある電波の発射を停止して傍受しなければならない。 無線局運用規則 第136条（取扱の停止） 第百三十六条 非常通信の取扱を開始した後、有線通信の状態が復旧した場合は、すみやかにその取扱を停止しなければならない。"},{"id":"H07-3","title":"非常通信を行ったら報告する","text":"非常通信を行ったら報告する 遭難通信、緊急通信、安全通信、非常通信を行ったときは、総務大臣に報告しなければなりません（電波法第 80 条）。電波法に違反して運用している無線局を見つけたときも、報告します。 電波法 第80条第1項無線局の免許人等は、次に掲げる場合は、総務省令で定める手続により、総務大臣に報告しなければならない。 一 遭難通信、緊急通信、安全通信又は非常通信を行つたとき（第七十条の七第一項、第七十条の八第一項又は第七十条の九第一項の規定により無線局を運用させた免許人等以外の者が行つたときを含む。）。 二 この法律又はこの法律に基づく命令の規定に違反して運用した無線局を認めたとき。 三 無線局が外国において、あらかじめ総務大臣が告示した以外の運用の制限をされたとき。"}],"only":""},{"id":"H08","subject":"法規","num":8,"title":"監督と罰則","html":"\u003cp>総務大臣は、電波のきまりが守られるように、無線局を監督しています。この章では、電波の発射の停止、検査、無線局の運用の停止と免許の取消し、報告、罰則を覚えます。\u003c/p>\n\u003ch3 id=\"H08-1\">電波の発射の停止と技術基準適合命令\u003c/h3>\n\u003cp>総務大臣は、無線局の発射する電波の質が総務省令で定めるものに適合していないと認めるときは、その無線局に臨時に電波の発射の停止を命じることができます（電波法第 72 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_72\" target=\"_blank\" rel=\"noopener\">電波法 第72条\u003c/a>\u003c/figcaption>\u003cblockquote>（電波の発射の停止）\u003cbr>第七十二条　総務大臣は、無線局の発射する電波の質が第二十八条の総務省令で定めるものに適合していないと認めるときは、当該無線局に対して臨時に電波の発射の停止を命ずることができる。\u003cbr>２　総務大臣は、前項の命令を受けた無線局からその発射する電波の質が第二十八条の総務省令の定めるものに適合するに至つた旨の申出を受けたときは、その無線局に電波を試験的に発射させなければならない。\u003cbr>３　総務大臣は、前項の規定により発射する電波の質が第二十八条の総務省令で定めるものに適合しているときは、直ちに第一項の停止を解除しなければならない。\u003c/blockquote>\u003c/figure>\n\u003cp>電波の質が適合するようになったと申し出があると、総務大臣はその無線局に電波を試験的に発射させ、適合していれば直ちに停止を解除します。\u003c/p>\n\u003cp>また、無線設備が技術基準に適合していないと認めるときは、免許人に、無線設備の修理その他の必要な措置をとるよう命じることができます（電波法第 71 条の 5）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_71_5\" target=\"_blank\" rel=\"noopener\">電波法 第71条の5\u003c/a>\u003c/figcaption>\u003cblockquote>（技術基準適合命令）\u003cbr>第七十一条の五　総務大臣は、無線設備が第三章に定める技術基準に適合していないと認めるときは、当該無線設備を使用する無線局の免許人等に対し、その技術基準に適合するように当該無線設備の修理その他の必要な措置をとるべきことを命ずることができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H08-2\">検査\u003c/h3>\n\u003cp>総務大臣は、総務省令で定める時期ごとに、職員を無線局に派遣して、無線設備などを検査させます（定期検査。電波法第 73 条第 1 項）。アマチュア局は、定期検査を行わない無線局です（電波法施行規則第 41 条の 2 の 6）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_41_2_6-Pr_1-It_22\" target=\"_blank\" rel=\"noopener\">電波法施行規則 第41条の2の6第1項第22号\u003c/a>\u003c/figcaption>\u003cblockquote>法第七十三条第一項の総務省令で定める無線局は、次のとおりとする。\u003cbr>二十二　アマチュア局\u003c/blockquote>\u003c/figure>\n\u003cp>ただし、電波の発射の停止を命じたとき、その解除の申出があったとき、技術基準適合命令を出したときなど、特に必要があるときは、職員を派遣して検査させることがあります（臨時検査。第 73 条第 5 項）。\u003c/p>\n\u003ch3 id=\"H08-3\">運用の停止と免許の取消し\u003c/h3>\n\u003cp>総務大臣は、免許人が電波法や放送法、それにもとづく命令や処分に違反したときは、3 か月以内の期間を定めて無線局の運用の停止を命じ、又は期間を定めて運用許容時間、周波数、空中線電力を制限できます（電波法第 76 条第 1 項）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_76-Pr_1\" target=\"_blank\" rel=\"noopener\">電波法 第76条第1項\u003c/a>\u003c/figcaption>\u003cblockquote>総務大臣は、免許人等がこの法律、放送法若しくはこれらの法律に基づく命令又はこれらに基づく処分に違反したときは、三月以内の期間を定めて無線局の運用の停止を命じ、又は期間を定めて運用許容時間、周波数若しくは空中線電力を制限することができる。\u003c/blockquote>\u003c/figure>\n\u003cp>次のときは、免許を取り消すことができます（第 76 条第 4 項）。\u003c/p>\n\u003cul>\u003cli>正当な理由がないのに、無線局の運用を引き続き 6 か月以上休止したとき\u003c/li>\u003cli>不正な手段で無線局の免許や変更の許可などを受けたとき\u003c/li>\u003cli>運用の停止の命令や制限に従わないとき\u003c/li>\u003cli>電波法か放送法の罪で罰金以上の刑に処せられたとき（第 5 条第 3 項第 1 号に当たるに至ったとき）\u003c/li>\u003c/ul>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_76-Pr_4\" target=\"_blank\" rel=\"noopener\">電波法 第76条第4項\u003c/a>\u003c/figcaption>\u003cblockquote>総務大臣は、免許人（包括免許人を除く。）が次の各号のいずれかに該当するときは、その免許を取り消すことができる。\u003cbr>一　正当な理由がないのに、無線局の運用を引き続き六月以上休止したとき。\u003cbr>二　不正な手段により無線局の免許若しくは第十七条の許可を受け、又は第十九条の規定による指定の変更を行わせたとき。\u003cbr>三　第一項の規定による命令又は制限に従わないとき。\u003cbr>四　免許人が第五条第三項第一号に該当するに至つたとき。\u003cbr>五　特定地上基幹放送局の免許人が第七条第二項第四号ロに適合しなくなつたとき。\u003c/blockquote>\u003c/figure>\n\u003cp>人の資格（無線従事者の免許）の取消しと業務の停止は、第 4 章（電波法第 79 条）で学びました。\u003c/p>\n\u003ch3 id=\"H08-4\">報告\u003c/h3>\n\u003cp>無線局の免許人は、次のときに総務大臣に報告しなければなりません（電波法第 80 条）。\u003c/p>\n\u003cul>\u003cli>遭難通信、緊急通信、安全通信、非常通信を行ったとき\u003c/li>\u003cli>電波法や命令の規定に違反して運用した無線局を認めたとき\u003c/li>\u003cli>無線局が外国で、あらかじめ総務大臣が告示した以外の運用の制限をされたとき\u003c/li>\u003c/ul>\n\u003cp>また総務大臣は、無線通信の秩序の維持などのため必要があると認めるときは、免許人に無線局に関する報告を求めることができます（電波法第 81 条）。\u003c/p>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_81\" target=\"_blank\" rel=\"noopener\">電波法 第81条\u003c/a>\u003c/figcaption>\u003cblockquote>第八十一条　総務大臣は、無線通信の秩序の維持その他無線局の適正な運用を確保するため必要があると認めるときは、免許人等に対し、無線局に関し報告を求めることができる。\u003c/blockquote>\u003c/figure>\n\u003ch3 id=\"H08-5\">罰則\u003c/h3>\n\u003cp>電波法に違反すると、罰せられることがあります。以前は「懲役」と書かれていましたが、刑法の改正で、いまは「拘禁刑」です。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>違反\u003c/th>\u003cth>罰則\u003c/th>\u003cth>根拠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>免許がないのに無線局を開設した\u003c/td>\u003ctd>1 年以下の拘禁刑又は 100 万円以下の罰金\u003c/td>\u003ctd>電波法第 110 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>免許記録の範囲を超えて運用した（目的外の通信など）\u003c/td>\u003ctd>1 年以下の拘禁刑又は 100 万円以下の罰金\u003c/td>\u003ctd>電波法第 110 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無線局の取扱中に係る無線通信の秘密を漏らし、又は窃用した\u003c/td>\u003ctd>1 年以下の拘禁刑又は 50 万円以下の罰金\u003c/td>\u003ctd>電波法第 109 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>わいせつな通信を発した\u003c/td>\u003ctd>2 年以下の拘禁刑又は 100 万円以下の罰金\u003c/td>\u003ctd>電波法第 108 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資格がないのにアマチュア無線局の無線設備の操作を行った\u003c/td>\u003ctd>30 万円以下の罰金\u003c/td>\u003ctd>電波法第 113 条\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"law\">\u003cfigcaption>\u003ca href=\"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_9-At_110-Pr_1-It_
