ion":"K08-2","fixed":false},{"id":"K08-08","subject":"無線工学","chapter":"K08","text":"\u003cp>八木・宇田空中線で、電波が最も強く出る方向はどれか。\u003c/p>","choices":["導波器の方向","反射器の方向","素子と平行な方向","全方向に同じ"],"answer":0,"explain":"\u003cp>八木・宇田空中線は、導波器の方向に鋭い指向性（単一指向性）をもちます。\u003c/p>","refs":[],"section":"K08-2","fixed":false},{"id":"K08-09","subject":"無線工学","chapter":"K08","text":"\u003cp>空中線を物理的に短くするため、途中に入れて電気的な長さを長くする部品はどれか。\u003c/p>","choices":["延長コイル","短縮コンデンサ","抵抗器","ダイオード"],"answer":0,"explain":"\u003cp>コイル（延長コイル）を入れると、短い空中線でも電気的に長くできます。ハンディ機のホイップ空中線などに使います。反対に、空中線を電気的に短くするときはコンデンサを入れます。\u003c/p>","refs":[],"section":"K08-2","fixed":false},{"id":"K08-10","subject":"無線工学","chapter":"K08","text":"\u003cp>同軸ケーブルの説明として、正しいものはどれか。\u003c/p>","choices":["不平衡形の給電線で、特性インピーダンスは 50 Ω や 75 Ω のものが多い。","平衡形の給電線で、特性インピーダンスは 300 Ω のものが多い。","2 本の導線を平行に並べた給電線である。","直流しか通さない給電線である。"],"answer":0,"explain":"\u003cp>同軸ケーブルは、中心の導体を網線で包んだ不平衡形の給電線です。2 本の導線を平行に並べたものは平行二線式給電線（平衡形）です。\u003c/p>","refs":[],"section":"K08-3","fixed":false},{"id":"K08-11","subject":"無線工学","chapter":"K08","text":"\u003cp>平衡形の空中線に、不平衡形の同軸ケーブルをつなぐときに使うものはどれか。\u003c/p>","choices":["バラン","低域フィルタ","延長コイル","ダミーロード"],"answer":0,"explain":"\u003cp>バラン（平衡不平衡変換器）を使って、平衡形と不平衡形をつなぎます。\u003c/p>","refs":[],"section":"K08-3","fixed":false},{"id":"K08-12","subject":"無線工学","chapter":"K08","text":"\u003cp>定在波比（SWR）の説明として、正しいものはどれか。\u003c/p>","choices":["1 に近いほど、空中線と給電線の整合がよい。","0 に近いほど、空中線と給電線の整合がよい。","値が大きいほど、空中線と給電線の整合がよい。","空中線から出る電波の周波数を表す。"],"answer":0,"explain":"\u003cp>SWR は 1 以上の値で、1 に近いほど整合がよく、反射が少ないことを表します。\u003c/p>","refs":[],"section":"K08-4","fixed":false},{"id":"K08-13","subject":"無線工学","chapter":"K08","text":"\u003cp>空中線と給電線の整合がとれていないときに起こることとして、正しいものはどれか。\u003c/p>","choices":["電力の一部が反射して、給電線に定在波ができる。","空中線電力が大きくなる。","電波の周波数が変わる。","給電線から高調波がなくなる。"],"answer":0,"explain":"\u003cp>整合がとれていないと、電力の一部が空中線で反射して送信機側に戻り、給電線の上に定在波ができます。空中線から出る電力は小さくなります。\u003c/p>","refs":[],"section":"K08-4","fixed":false},{"id":"K09-01","subject":"無線工学","chapter":"K09","text":"\u003cp>電離層を、地上から低い順に並べたものはどれか。\u003c/p>","choices":["D 層、E 層、F 層","F 層、E 層、D 層","E 層、D 層、F 層","D 層、F 層、E 層"],"answer":0,"explain":"\u003cp>低いほうから D 層（60〜90 km）、E 層（約 100 km）、F 層（200〜400 km）です。\u003c/p>","refs":[],"section":"K09-2","fixed":false},{"id":"K09-02","subject":"無線工学","chapter":"K09","text":"\u003cp>昼間だけ現れ、中波や短波の低い周波数の電波を吸収する電離層はどれか。\u003c/p>","choices":["D 層","E 層","F 層","スポラジック E 層"],"answer":0,"explain":"\u003cp>D 層はいちばん低い電離層で、昼間だけ現れ、低い周波数の電波を吸収します。夜に中波の放送が遠くまで届くのは、D 層が消えるからです。\u003c/p>","refs":[],"section":"K09-2","fixed":false},{"id":"K09-03","subject":"無線工学","chapter":"K09","text":"\u003cp>夜間も残り、短波の電波を反射して遠くまで届ける電離層はどれか。\u003c/p>","choices":["F 層","D 層","E 層","対流圏"],"answer":0,"explain":"\u003cp>F 層はいちばん高い電離層で、夜も残り、短波の遠距離通信に使われます。\u003c/p>","refs":[],"section":"K09-2","fixed":false},{"id":"K09-04","subject":"無線工学","chapter":"K09","text":"\u003cp>スポラジック E 層（Es 層）の説明として、正しいものはどれか。\u003c/p>","choices":["初夏から夏の昼間によく現れ、VHF の電波を反射して遠くまで届けることがある。","冬の夜だけに現れ、中波の電波を吸収する。","一年中いつも同じ強さで現れ、UHF の電波を反射する。","地表のすぐ近くにでき、電波をさえぎる。"],"answer":0,"explain":"\u003cp>Es 層は、E 層の高さに突然現れる電子密度の高い層です。ふだんは突き抜ける 50 MHz 帯などの VHF の電波を反射し、遠くの局と交信できることがあります。\u003c/p>","refs":[],"section":"K09-2","fixed":false},{"id":"K09-05","subject":"無線工学","chapter":"K09","text":"\u003cp>144 MHz 帯や 430 MHz 帯の電波の、おもな伝わり方はどれか。\u003c/p>","choices":["直接波（見通しのきく範囲）","F 層の反射波","D 層の反射波","地表波"],"answer":0,"explain":"\u003cp>VHF や UHF の電波は、ふつう電離層を突き抜けるので、おもに直接波で伝わります。\u003c/p>","refs":[],"section":"K09-3","fixed":false},{"id":"K09-06","subject":"無線工学","chapter":"K09","text":"\u003cp>VHF の通信で、空中線を高い場所に設置するとどうなるか。\u003c/p>","choices":["見通し距離が長くなり、遠くまで届きやすくなる。","見通し距離が短くなる。","電離層で反射しやすくなる。","電波の周波数が高くなる。"],"answer":0,"explain":"\u003cp>空中線が高いほど、見通し距離が長くなります。VHF・UHF では、空中線の高さが通信距離を大きく左右します。\u003c/p>","refs":[],"section":"K09-3","fixed":false},{"id":"K09-07","subject":"無線工学","chapter":"K09","text":"\u003cp>送信と受信の空中線がどちらも地上 9 m の高さにあるとき、電波の見通し距離に最も近いものはどれか。見通し距離〔km〕≒ 4.12 ×（√h1 ＋ √h2）とする。\u003c/p>","choices":["約 25 km","約 12 km","約 75 km","約 4 km"],"answer":0,"explain":"\u003cp>√9 ＝ 3 なので、4.12 × (3 ＋ 3) ≒ 24.7 km、約 25 km です。\u003c/p>","refs":[],"section":"K09-3","fixed":false},{"id":"K09-08","subject":"無線工学","chapter":"K09","text":"\u003cp>フェージングの説明として、正しいものはどれか。\u003c/p>","choices":["受信する電波の強さが、時間とともに変化する現象","送信機の周波数が、時間とともにずれる現象","太陽の表面の爆発で、短波の通信が突然できなくなる現象","空中線から電力が反射して戻る現象"],"answer":0,"explain":"\u003cp>フェージングは、いくつもの経路を通った電波が干渉することなどで、受信する電波の強さが変化する現象です。受信機の AGC で影響を減らせます。\u003c/p>","refs":[],"section":"K09-4","fixed":false},{"id":"K09-09","subject":"無線工学","chapter":"K09","text":"\u003cp>デリンジャー現象の説明として、正しいものはどれか。\u003c/p>","choices":["太陽の表面の爆発で D 層の電子密度が急に高くなり、昼間の地域の短波の通信が突然できなくなる。","夏の昼間に E 層の高さに突然層が現れ、VHF の電波が遠くまで届く。","夜になると D 層が消え、中波の電波が遠くまで届く。","雨や雪で、SHF の電波が弱くなる。"],"answer":0,"explain":"\u003cp>デリンジャー現象は、太陽フレアによって D 層で短波が吸収されて起こり、数分から数十分続きます。2 番目はスポラジック E 層の説明です。\u003c/p>","refs":[],"section":"K09-4","fixed":false},{"id":"K09-10","subject":"無線工学","chapter":"K09","text":"\u003cp>磁気嵐の説明として、正しいものはどれか。\u003c/p>","choices":["地球の磁気が乱れて電離層が乱れ、短波の通信が長いあいだ不安定になる。","太陽の表面の爆発で、短波の通信が数分間だけできなくなる。","雷の放電による雑音で、中波の受信ができなくなる。","空中線の近くの磁石によって、電波の向きが変わる。"],"answer":0,"explain":"\u003cp>磁気嵐は、地球の磁気（地磁気）の乱れで電離層が乱れる現象で、数日にわたることもあります。数分から数十分で終わるのはデリンジャー現象です。\u003c/p>","refs":[],"section":"K09-4","fixed":false},{"id":"K09-11","subject":"無線工学","chapter":"K09","text":"\u003cp>短波の電波の「跳躍距離」の説明として、正しいものはどれか。\u003c/p>","choices":["送信点から、電離層の反射波が最初に地上に戻ってくる地点までの距離","地表波が届く最も遠い地点までの距離","送信空中線から電離層までの高さ","見通し距離の 2 倍の距離"],"answer":0,"explain":"\u003cp>跳躍距離は、送信点から反射波が最初に戻る地点までの距離です。地表波が届かなくなる地点から、この地点までは電波が届かず、不感地帯といいます。\u003c/p>","refs":[],"section":"K09-4","fixed":false},{"id":"K09-12","subject":"無線工学","chapter":"K09","text":"\u003cp>地表波の性質として、正しいものはどれか。\u003c/p>","choices":["周波数が低いほど、遠くまで届く。","周波数が高いほど、遠くまで届く。","電離層で反射して伝わる。","周波数に関係なく、同じ距離まで届く。"],"answer":0,"explain":"\u003cp>地表波は地面に沿って伝わり、周波数が高いほど地面での損失が大きくなって、遠くまで届かなくなります。\u003c/p>","refs":[],"section":"K09-1","fixed":false},{"id":"K10-01","subject":"無線工学","chapter":"K10","text":"\u003cp>回路の電圧と電流を測るときの、電圧計と電流計のつなぎ方として、正しいものはどれか。\u003c/p>","choices":["電圧計は測る部分に並列に、電流計は回路に直列につなぐ。","電圧計は回路に直列に、電流計は測る部分に並列につなぐ。","電圧計も電流計も、直列につなぐ。","電圧計も電流計も、並列につなぐ。"],"answer":0,"explain":"\u003cp>電圧は 2 点の間の差なので並列に、電流は回路を流れる量なので直列に入れて測ります。\u003c/p>","refs":[],"section":"K10-1","fixed":false},{"id":"K10-02","subject":"無線工学","chapter":"K10","text":"\u003cp>電圧計の内部抵抗について、正しいものはどれか。\u003c/p>","choices":["大きいほど、測る回路に影響を与えにくい。","小さいほど、測る回路に影響を与えにくい。","零であることが望ましい。","測る回路の抵抗と同じ値がよい。"],"answer":0,"explain":"\u003cp>電圧計は並列につなぐので、内部抵抗が大きいほど電圧計に流れる電流が少なく、測る回路に影響しにくくなります。\u003c/p>","refs":[],"section":"K10-1","fixed":false},{"id":"K10-03","subject":"無線工学","chapter":"K10","text":"\u003cp>電流計の内部抵抗について、正しいものはどれか。\u003c/p>","choices":["小さいほど、測る回路に影響を与えにくい。","大きいほど、測る回路に影響を与えにくい。","無限大であることが望ましい。","測る回路の抵抗の 10 倍以上がよい。"],"answer":0,"explain":"\u003cp>電流計は直列につなぐので、内部抵抗が小さいほど回路の電流を変えにくくなります。\u003c/p>","refs":[],"section":"K10-1","fixed":false},{"id":"K10-04","subject":"無線工学","chapter":"K10","text":"\u003cp>値の見当がつかない電圧をテスターで測るときの扱いとして、正しいものはどれか。\u003c/p>","choices":["いちばん大きな測定範囲から測り始める。","いちばん小さな測定範囲から測り始める。","抵抗の測定範囲で測る。","電流の測定範囲で測る。"],"answer":0,"explain":"\u003cp>小さな測定範囲で大きな電圧を測ると、テスターがこわれることがあります。大きな範囲から始め、だんだん小さくします。\u003c/p>","refs":[],"section":"K10-1","fixed":false},{"id":"K10-05","subject":"無線工学","chapter":"K10","text":"\u003cp>テスターで抵抗の値を測るときの注意として、正しいものはどれか。\u003c/p>","choices":["回路の電源を切ってから測る。","回路の電源を入れたまま測る。","交流電圧の測定範囲で測る。","回路に電流計と直列につないで測る。"],"answer":0,"explain":"\u003cp>抵抗はテスターの中の電池で測るので、回路の電源は切ります。電源を入れたままだと、正しく測れず、テスターをこわすこともあります。\u003c/p>","refs":[],"section":"K10-2","fixed":false},{"id":"K10-06","subject":"無線工学","chapter":"K10","text":"\u003cp>SWR メーター（通過形電力計）を入れる場所として、正しいものはどれか。\u003c/p>","choices":["送信機と空中線の間（給電線の途中）","送信機の電源の入力","受信機のスピーカーの端子","空中線の先端"],"answer":0,"explain":"\u003cp>SWR メーターは送信機と空中線の間に入れ、進行波と反射波から SWR を測ります。\u003c/p>","refs":[],"section":"K10-3","fixed":false},{"id":"K10-07","subject":"無線工学","chapter":"K10","text":"\u003cp>擬似空中線（ダミーロード）の説明として、正しいものはどれか。\u003c/p>","choices":["空中線の代わりに送信機につなぐ抵抗器で、電波をほとんど空間に出さずに、送信機の調整や試験ができる。","遠くまで電波を届けるための、利得の大きい空中線である。","受信機の感度をよくするための増幅器である。","空中線の長さを電気的に長くするためのコイルである。"],"answer":0,"explain":"\u003cp>擬似空中線は、送信機の電力を熱に変える抵抗器です。ほかの無線局に混信を与えずに調整できます。\u003c/p>","refs":[],"section":"K10-4","fixed":false},{"id":"K10-08","subject":"無線工学","chapter":"K10","text":"\u003cp>50 Ω の同軸ケーブルを使う送信機の調整に使う擬似空中線のインピーダンスとして、適当なものはどれか。\u003c/p>","choices":["50 Ω","0 Ω","300 Ω","1,000 Ω"],"answer":0,"explain":"\u003cp>擬似空中線は、給電線と同じインピーダンス（ふつう 50 Ω）にします。整合がとれて、送信機の電力をきちんと受け止められます。\u003c/p>","refs":[],"section":"K10-4","fixed":false},{"id":"K10-09","subject":"無線工学","chapter":"K10","text":"\u003cp>空中線を調整して、SWR をどのような値に近づけるとよいか。\u003c/p>","choices":["1","0","3","できる限り大きな値"],"answer":0,"explain":"\u003cp>SWR は 1 に近いほど整合がよく、反射が少なくなります。\u003c/p>","refs":[],"section":"K10-3","fixed":false},{"id":"K10-10","subject":"無線工学","chapter":"K10","text":"\u003cp>無線設備の保守として、適当でないものはどれか。\u003c/p>","choices":["空中線をつながずに送信して、送信機の調子を確かめる。","空中線や給電線のつなぎ目に、ゆるみやさびがないか確かめる。","同軸ケーブルのコネクタから雨水が入らないようにする。","落雷のおそれがあるときは、空中線を無線機から外して接地する。"],"answer":0,"explain":"\u003cp>空中線（又は擬似空中線）をつながずに送信すると、電力が反射して送信機がこわれることがあります。\u003c/p>","refs":[],"section":"K10-5","fixed":false},{"id":"H09-01","subject":"法規","chapter":"H09","text":"\u003cp>第三級アマチュア無線技士が操作を行うことができるものはどれか。\u003c/p>","choices":["空中線電力 50 ワットの無線設備で、7 MHz 帯の A1A 電波によるモールス符号の通信操作","空中線電力 100 ワットの無線設備で、7 MHz 帯の A1A 電波によるモールス符号の通信操作","空中線電力 50 ワットの無線設備で、14 MHz 帯の A1A 電波によるモールス符号の通信操作","空中線電力 50 ワットの無線設備で、10 MHz 帯の A1A 電波によるモールス符号の通信操作"],"answer":0,"explain":"\u003cp>3アマは、空中線電力 50 ワット以下で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使う無線設備を操作でき、モールス符号の通信もできます。7 MHz 帯は 8 MHz 以下です。14 MHz 帯と 10 MHz 帯は 8 MHz を超え 18 MHz 未満なので範囲外で、100 ワットは 50 ワットを超えます。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作"]}],"section":"H09-1","fixed":false},{"id":"H09-02","subject":"法規","chapter":"H09","text":"\u003cp>モールス無線通信に使わなければならない符号として、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["無線局運用規則別表第一号に掲げるモールス符号","日本アマチュア無線連盟が定めるモールス符号","通信の相手方と取り決めたモールス符号","無線機の製造者が定めるモールス符号"],"answer":0,"explain":"\u003cp>モールス無線通信には、無線局運用規則の別表第一号に掲げるモールス符号を用いなければなりません。\u003c/p>","refs":[{"label":"無線局運用規則 第12条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_12","lines":["（モールス符号の使用）","第十二条　モールス無線電信による通信（以下「モールス無線通信」という。）には、別表第一号に掲げるモールス符号を用いなければならない。"]}],"section":"H09-1","fixed":false},{"id":"H09-03","subject":"法規","chapter":"H09","text":"\u003cp>無線局運用規則別表第一号に規定するモールス符号の線（長点）の長さは、短点いくつ分に等しいか。\u003c/p>","choices":["3","2","5","7"],"answer":0,"explain":"\u003cp>線の長さは、短点 3 つ分です。1 つの符号の中の線や点の間隔は短点 1 つ分、符号と符号の間隔は 3 つ分、語と語の間隔は 7 つ分です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号の注","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["一　符号の線及び間隔","　１　一線の長さは、三点に等しい。","　２　一符号を作る各線又は点の間隔は、一点に等しい。","　３　二符号の間隔は、三点に等しい。","　４　二語の間隔は、七点に等しい。"]}],"section":"H09-2","fixed":false},{"id":"H09-04","subject":"法規","chapter":"H09","text":"\u003cp>モールス符号で、語と語の間隔は、短点いくつ分に等しいか。\u003c/p>","choices":["7","1","3","5"],"answer":0,"explain":"\u003cp>語と語の間隔は、短点 7 つ分です。文字と文字（符号と符号）の間隔の 3 つ分と、まちがえないようにします。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号の注","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["一　符号の線及び間隔","　１　一線の長さは、三点に等しい。","　２　一符号を作る各線又は点の間隔は、一点に等しい。","　３　二符号の間隔は、三点に等しい。","　４　二語の間隔は、七点に等しい。"]}],"section":"H09-2","fixed":false},{"id":"H09-05","subject":"法規","chapter":"H09","text":"\u003cp>モールス符号で、1 つの符号（1 文字）を作る各線又は点の間隔は、短点いくつ分に等しいか。\u003c/p>","choices":["1","2","3","7"],"answer":0,"explain":"\u003cp>1 つの符号の中の線と点の間隔は、短点 1 つ分です。符号と符号の間は 3 つ分あけるので、文字の切れ目が分かります。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号の注","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["一　符号の線及び間隔","　１　一線の長さは、三点に等しい。","　２　一符号を作る各線又は点の間隔は、一点に等しい。","　３　二符号の間隔は、三点に等しい。","　４　二語の間隔は、七点に等しい。"]}],"section":"H09-2","fixed":false},{"id":"H09-06","subject":"法規","chapter":"H09","text":"\u003cp>次のモールス符号が表す略符号はどれか。\u003cbr>「－・－・　－－・－」\u003c/p>","choices":["CQ","CY","KQ","YQ"],"answer":0,"explain":"\u003cp>C は －・－・、Q は －－・－ です。CQ は各局あての一般呼出しです。Y は －・－－、K は －・－ なので、まちがえないようにします。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["一　文字","－・－・｜Ｃ","－・－｜Ｋ","－－・－｜Ｑ","－・－－｜Ｙ"]}],"section":"H09-3","fixed":false},{"id":"H09-07","subject":"法規","chapter":"H09","text":"\u003cp>次のモールス符号が表す数字はどれか。\u003cbr>「・・・－－」\u003c/p>","choices":["3","2","7","8"],"answer":0,"explain":"\u003cp>数字は点と線を合わせて 5 つです。点 3 つに線 2 つは 3 です。2 は ・・－－－、7 は －－・・・、8 は －－－・・ です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["二　数字","・・－－－｜２","・・・－－｜３","－－・・・｜７","－－－・・｜８"]}],"section":"H09-3","fixed":false},{"id":"H09-08","subject":"法規","chapter":"H09","text":"\u003cp>次のモールス符号が表す略符号はどれか。\u003cbr>「－・・　・」\u003c/p>","choices":["DE","NE","DI","BE"],"answer":0,"explain":"\u003cp>D は －・・、E は ・ です。DE は「……から」の意味で、自局の呼出符号の前に置きます。N は －・、I は ・・、B は －・・・ です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第一号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_1","lines":["一　文字","－・・・｜Ｂ","－・・｜Ｄ","・｜Ｅ","・・｜Ｉ","－・｜Ｎ"]}],"section":"H09-3","fixed":false},{"id":"H09-09","subject":"法規","chapter":"H09","text":"\u003cp>無線電信通信の業務用語について、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["別表第二号に定める略符号を使い、略符号と同意義の他の語辞を使ってはならない。","通信の相手方が了解すれば、どのような略語を使ってもよい。","略符号は使わず、すべて普通の言葉で送らなければならない。","アマチュア局は、略符号を使ってはならない。"],"answer":0,"explain":"\u003cp>無線電信通信の業務用語には、別表第二号の略符号を使います。同じ意味のほかの言葉を使ってはいけません。\u003c/p>","refs":[{"label":"無線局運用規則 第13条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_13","lines":["（業務用語）","第十三条　無線電信による通信（以下「無線電信通信」という。）の業務用語には、別表第二号に定める略語又は符号（以下「略符号」という。）を使用するものとする。ただし、デジタル選択呼出装置による通信（以下「デジタル選択呼出通信」という。）及び狭帯域直接印刷電信による通信（以下「狭帯域直接印刷電信通信」という。）については、この限りでない。","２　無線電信通信においては、前項の略符号と同意義の他の語辞を使用してはならない。ただし、航空、航空の準備及び航空の安全に関する情報を送信するための固定業務以外の固定業務においては、別に告示する略符号の使用を妨げない。"]}],"section":"H09-4","fixed":false},{"id":"H09-10","subject":"法規","chapter":"H09","text":"\u003cp>文字の上に線を付けた略符号（AR など）の送り方として、正しいものはどれか。\u003c/p>","choices":["その全部を 1 つの符号として、続けて送信する。","1 文字ずつ、語と語の間隔をあけて送信する。","線の部分を長く伸ばして送信する。","2 回ずつ繰り返して送信する。"],"answer":0,"explain":"\u003cp>文字の上に線を付けた略符号は、全部を 1 符号として送信するモールス符号です。AR なら、A と R の間をあけずに ・－・－・ と送ります。\u003c/p>","refs":[{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["注１※を付した略符号は，航空移動業務並びに航空，航空の準備及び航空の安全に関する情報を送信するための固定業務において使用してはならない。２文字の上に線を付した略符号は，その全部を１符号として送信するモールス符号とする。","注文字の上に線を付した略符号は，その全部を１符号として送信するモールス符号とする。"]}],"section":"H09-4","fixed":false},{"id":"H09-11","subject":"法規","chapter":"H09","text":"\u003cp>モールス無線通信で、通報を欧文で送信するとき、通報の終わりに送信する略符号はどれか。\u003c/p>","choices":["AR（上に線）","VA（上に線）","AS（上に線）","HH（上に線）"],"answer":0,"explain":"\u003cp>通報は、欧文の場合は AR（送信の終了符号）で終わります。VA は通信の完了、AS は待機の要求、HH は訂正の符号です。\u003c/p>","refs":[{"label":"無線局運用規則 第29条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_29-Pr_3","lines":["前項の送信において、通報は、和文の場合は「ラタ（上に線）」、欧文の場合は「ＡＲ（上に線）」をもつて終るものとする。"]},{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["略符号｜意義","ＡＲ（上に線）｜送信の終了符号"]}],"section":"H09-7","fixed":false},{"id":"H09-12","subject":"法規","chapter":"H09","text":"\u003cp>モールス無線通信で、欧文を手送りで送信している途中に、誤って送信したことを知ったときの扱いとして、正しいものはどれか。\u003c/p>","choices":["HH（上に線）を前置して、正しく送信した適当の語字から更に送信する。","RPT を前置して、通報の初めから更に送信する。","VA（上に線）を送信して、通信を終わる。","誤った部分は訂正せず、通報の終わりに正しい語字を送信する。"],"answer":0,"explain":"\u003cp>欧文の手送り（と自動機による送信）では、HH（訂正符号）を前に置いて、正しく送った適当な語字から送り直します。和文の手送りでは、別の訂正符号を使います。\u003c/p>","refs":[{"label":"無線局運用規則 第31条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_31","lines":["（誤送の訂正）","第三十一条　送信中において誤つた送信をしたことを知つたときは、左に掲げる略符号を前置して正しく送信した適当の語字から更に送信しなければならない。","一　手送による和文の送信の場合は、ラタ（上に線）","二　自動機（自動的にモールス符号を送信又は受信するものをいう。以下同じ。）による送信及び手送による欧文の送信の場合は、ＨＨ（上に線）"]}],"section":"H09-7","fixed":false},{"id":"H09-13","subject":"法規","chapter":"H09","text":"\u003cp>モールス無線通信で、通信が終了したときに送信する略符号はどれか（海上移動業務以外では省略できる）。\u003c/p>","choices":["VA（上に線）","AR（上に線）","BT（上に線）","KA（上に線）"],"answer":0,"explain":"\u003cp>通信が終わったら、通信の完了符号 VA を送ります。海上移動業務以外の業務では省略できます。AR は送信（通報）の終了、BT は分離、KA は送信開始の符号です。\u003c/p>","refs":[{"label":"無線局運用規則 第38条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_38","lines":["（通信の終了）","第三十八条　通信が終了したときは、「ＶＡ（上に線）」を送信するものとする。ただし、海上移動業務以外の業務においては、これを省略することができる。"]},{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["略符号｜意義","ＶＡ（上に線）｜通信の完了符号"]}],"section":"H09-7","fixed":false},{"id":"H09-14","subject":"法規","chapter":"H09","text":"\u003cp>無線電信で呼出しに応答する際、直ちに通報を受信することができない事由があるときに、「K」の代わりに送信するものはどれか。\u003c/p>","choices":["AS（上に線）及び分で表した概略の待つべき時間","QRT 及び秒で表した概略の待つべき時間","VA（上に線）及び自局の呼出符号","NIL 及び受信できない理由"],"answer":0,"explain":"\u003cp>K の代わりに、AS（送信の待機を要求する符号）と、分で表した待ってほしいおよその時間を送ります。待つ時間が 10 分以上のときは、理由も簡単に送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第23条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_3","lines":["前項の応答に際して直ちに通報を受信しようとするときは、応答事項の次に「Ｋ」を送信するものとする。但し、直ちに通報を受信することができない事由があるときは、「Ｋ」の代りに「ＡＳ（上に線）」及び分で表わす概略の待つべき時間を送信するものとする。概略の待つべき時間が十分以上のときは、その理由を簡単に送信しなければならない。"]}],"section":"H09-6","fixed":false},{"id":"H09-15","subject":"法規","chapter":"H09","text":"\u003cp>無線電信による呼出しの方法（呼出事項）として、無線局運用規則に規定されているものはどれか（海上移動業務以外の場合）。\u003c/p>","choices":["相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 3 回以下","相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 1 回","相手局の呼出符号 1 回、DE 3 回、自局の呼出符号 1 回","CQ 3 回、DE 1 回、自局の呼出符号 3 回以下"],"answer":0,"explain":"\u003cp>呼出しは、相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 3 回以下です。自局の呼出符号が 1 回なのは応答、CQ で始まるのは一括呼出しです。\u003c/p>","refs":[{"label":"無線局運用規則 第20条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_20-Pr_1","lines":["呼出しは、順次送信する次に掲げる事項（以下「呼出事項」という。）によつて行うものとする。","一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）","二　ＤＥ　一回","三　自局の呼出符号　三回以下（海上移動業務にあつては二回以下）"]}],"section":"H09-6","fixed":false},{"id":"H09-16","subject":"法規","chapter":"H09","text":"\u003cp>無線電信による呼出しに対する応答（応答事項）として、正しいものはどれか（海上移動業務以外の場合）。\u003c/p>","choices":["相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 1 回","相手局の呼出符号 3 回以下、DE 1 回、自局の呼出符号 3 回以下","相手局の呼出符号 1 回、DE 1 回、自局の呼出符号 3 回以下","自局の呼出符号 3 回以下、DE 1 回、相手局の呼出符号 1 回"],"answer":0,"explain":"\u003cp>応答では、自局の呼出符号は 1 回です。呼出しでは自局の呼出符号を 3 回以下送るので、ちがいに注意します。\u003c/p>","refs":[{"label":"無線局運用規則 第23条第2項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_2","lines":["前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。","一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）","二　ＤＥ　一回","三　自局の呼出符号　一回"]}],"section":"H09-6","fixed":false},{"id":"H09-17","subject":"法規","chapter":"H09","text":"\u003cp>無線電信により試験電波を発射するとき、聴守して混信を与えないことを確かめた後、最初に送信する事項はどれか。\u003c/p>","choices":["EX 3 回、DE 1 回、自局の呼出符号 3 回","VVV の連続、自局の呼出符号 1 回","CQ 3 回、DE 1 回、自局の呼出符号 3 回","EX 1 回、DE 1 回、自局の呼出符号 1 回"],"answer":0,"explain":"\u003cp>はじめに EX 3 回、DE 1 回、自局の呼出符号 3 回を送り、さらに 1 分間聴守します。停止の請求がなければ、VVV の連続と自局の呼出符号 1 回を送ります（10 秒間以内）。\u003c/p>","refs":[{"label":"無線局運用規則 第39条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_1","lines":["無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。","一　ＥＸ　三回","二　ＤＥ　一回","三　自局の呼出符号　三回"]}],"section":"H09-8","fixed":false},{"id":"H09-18","subject":"法規","chapter":"H09","text":"\u003cp>Q 符号を問いの意義に使用するときの扱いとして、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["Q 符号の次に問符を付けなければならない。","Q 符号の前に問符を付けなければならない。","Q 符号を 2 回続けて送信しなければならない。","Q 符号の次に K を付けなければならない。"],"answer":0,"explain":"\u003cp>問いの意味で使うときは、QRL? のように、Q 符号の次に問符（？）を付けます。\u003c/p>","refs":[{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["注１（１）を付したＱ符号は，航空移動業務並びに航空，航空の準備及び航空の安全に関する情報を送信するための固定業務において使用してはならない。２（２）を付したＱ符号は，海上移動業務において使用してはならない。３Ｑ符号を問いの意義に使用するときは，Ｑ符号の次に問符をつけなければならない。"]}],"section":"H09-5","fixed":false},{"id":"H09-19","subject":"法規","chapter":"H09","text":"\u003cp>「こちらの伝送は、混信を受けていますか。」を表す Q 符号はどれか。\u003c/p>","choices":["QRM?","QRN?","QSB?","QRL?"],"answer":0,"explain":"\u003cp>混信は QRM です。QRN は空電、QSB はフェージング、QRL は「通信中ですか」です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["Ｑ符号｜意義","問い｜答え又は通知","ＱＲＬ｜そちらは，通信中ですか。｜こちらは，通信中です（又はこちらは，……（名称又は呼出符号）と通信中です。）。妨害しないでください。","ＱＲＭ｜こちらの伝送は，混信を受けていますか。｜そちらの伝送は，１　混信を受けていません。２　少し混信を受けています。３　かなりの混信を受けています。４　強い混信を受けています。５　非常に強い混信を受けています。","ＱＲＮ｜そちらは，空電に妨げられていますか。｜こちらは，１　空電に妨げられていません。２　少し空電に妨げられています。３　かなり空電に妨げられています。４　強い空電に妨げられています。５　非常に強い空電に妨げられています。","ＱＳＢ｜こちらの信号には，フェージングがありますか。｜そちらの信号には，フェージングがあります。"]}],"section":"H09-5","fixed":false},{"id":"H09-20","subject":"法規","chapter":"H09","text":"\u003cp>Q 符号「QSB」の意義（答え又は通知）はどれか。\u003c/p>","choices":["そちらの信号には、フェージングがあります。","こちらは、空電に妨げられています。","そちらの伝送は、混信を受けています。","他の周波数に変更して伝送してください。"],"answer":0,"explain":"\u003cp>QSB はフェージングです。空電は QRN、混信は QRM、周波数の変更は QSY です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["Ｑ符号｜意義","問い｜答え又は通知","ＱＲＭ｜こちらの伝送は，混信を受けていますか。｜そちらの伝送は，１　混信を受けていません。２　少し混信を受けています。３　かなりの混信を受けています。４　強い混信を受けています。５　非常に強い混信を受けています。","ＱＲＮ｜そちらは，空電に妨げられていますか。｜こちらは，１　空電に妨げられていません。２　少し空電に妨げられています。３　かなり空電に妨げられています。４　強い空電に妨げられています。５　非常に強い空電に妨げられています。","ＱＳＢ｜こちらの信号には，フェージングがありますか。｜そちらの信号には，フェージングがあります。","ＱＳＹ｜こちらは，他の周波数に変更して伝送しましようか。｜他の周波数（又は……ｋＨｚ（若しくはＭＨｚ））に変更して伝送してください。"]}],"section":"H09-5","fixed":false},{"id":"H09-21","subject":"法規","chapter":"H09","text":"\u003cp>Q 符号「QRL?」の意義はどれか。\u003c/p>","choices":["そちらは、通信中ですか。","誰がこちらを呼んでいますか。","こちらは、送信を中止しましょうか。","そちらは、用意ができましたか。"],"answer":0,"explain":"\u003cp>QRL? は「そちらは、通信中ですか。」です。答えの QRL は「こちらは、通信中です。妨害しないでください。」です。誰が呼んでいるかは QRZ?、送信の中止は QRT、用意は QRV です。\u003c/p>","refs":[{"label":"無線局運用規則 別表第二号（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mpat_2","lines":["Ｑ符号｜意義","問い｜答え又は通知","ＱＲＬ｜そちらは，通信中ですか。｜こちらは，通信中です（又はこちらは，……（名称又は呼出符号）と通信中です。）。妨害しないでください。","ＱＲＴ｜こちらは，送信を中止しましようか。｜送信を中止してください。","ＱＲＶ｜そちらは，用意ができましたか。｜こちらは，用意ができました。","ＱＲＺ｜誰がこちらを呼んでいますか。｜そちらは，……から（……ｋＨｚ（又はＭＨｚ）で）呼ばれています。"]}],"section":"H09-5","fixed":false},{"id":"H10-01","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章に規定する、国際電気通信連合の文書はどれか。\u003c/p>","choices":["国際電気通信連合憲章、国際電気通信連合条約及び業務規則","国際電気通信連合憲章、国際電気通信連合条約及び各国の電波法","国際電気通信連合憲章、無線通信規則及び各国の電波法施行規則","国際電気通信連合条約、ITU-R 勧告及び決議"],"answer":0,"explain":"\u003cp>連合の文書は、憲章、条約、業務規則の 3 つです。各国の電波法は、それぞれの国の法令です。\u003c/p>","refs":[{"label":"通信憲章 第4条第1項（29）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=9","site":"ITU の原文（英語）","lines":["（訳）連合の文書は、国際電気通信連合憲章、国際電気通信連合条約及び業務規則とする。","The instruments of the Union are: – this Constitution of the International Telecommunication Union, – the Convention of the International Telecommunication Union, and – the Administrative Regulations."]}],"section":"H10-1","fixed":false},{"id":"H10-02","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章に規定する業務規則に当たるものはどれか。\u003c/p>","choices":["国際電気通信規則及び無線通信規則","無線通信規則及び電波法施行規則","国際電気通信規則及び電波法","無線通信規則及び無線局運用規則"],"answer":0,"explain":"\u003cp>業務規則は、国際電気通信規則と無線通信規則です。すべての構成国を拘束します。電波法施行規則や無線局運用規則は、日本の法令です。\u003c/p>","refs":[{"label":"通信憲章 第4条第3項（31）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=10","site":"ITU の原文（英語）","lines":["（訳）憲章と条約の規定は、さらに、電気通信の利用を規律し、すべての構成国を拘束する次の業務規則の規定によって補足される。国際電気通信規則、無線通信規則。","The provisions of both this Constitution and the Convention are further complemented by those of the Administrative Regulations, enumerated below, which regulate the use of telecommunications and shall be binding on all Member States: – International Telecommunication Regulations, – Radio Regulations."]}],"section":"H10-1","fixed":false},{"id":"H10-03","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章の規定と無線通信規則の規定との間に矛盾がある場合の扱いとして、憲章に規定されているものはどれか。\u003c/p>","choices":["憲章が優先する。","無線通信規則が優先する。","後から改正されたほうが優先する。","各国の主管庁が、どちらによるかを決める。"],"answer":0,"explain":"\u003cp>憲章と、条約又は業務規則（無線通信規則など）が矛盾するときは、憲章が優先します。条約と業務規則が矛盾するときは、条約が優先します。\u003c/p>","refs":[{"label":"通信憲章 第4条第4項（32）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=10","site":"ITU の原文（英語）","lines":["（訳）憲章の規定と、条約又は業務規則の規定との間に矛盾がある場合には、憲章が優先する。条約の規定と業務規則の規定との間に矛盾がある場合には、条約が優先する。","In the case of inconsistency between a provision of this Constitution and a provision of the Convention or of the Administrative Regulations, the Constitution shall prevail. In the case of inconsistency between a provision of the Convention and a provision of the Administrative Regulations, the Convention shall prevail."]}],"section":"H10-1","fixed":false},{"id":"H10-04","subject":"法規","chapter":"H10","text":"\u003cp>電波法と、電波に関する条約との関係について、電波法に規定されているものはどれか。\u003c/p>","choices":["電波に関し条約に別段の定めがあるときは、その規定による。","条約に別段の定めがあっても、電波法の規定による。","条約は、アマチュア局には適用しない。","条約と電波法のどちらによるかは、免許人が選ぶ。"],"answer":0,"explain":"\u003cp>電波法第 3 条は、電波に関して条約に別段の定めがあるときは、その規定によると決めています。\u003c/p>","refs":[{"label":"電波法 第3条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_3","lines":["（電波に関する条約）","第三条　電波に関し条約に別段の定があるときは、その規定による。"]}],"section":"H10-1","fixed":false},{"id":"H10-05","subject":"法規","chapter":"H10","text":"\u003cp>電波法施行規則に規定する「無線通信規則」の定義はどれか。\u003c/p>","choices":["国際電気通信連合憲章に規定する無線通信規則をいう。","無線局運用規則のうち、無線通信の方法を定めた部分をいう。","総務大臣が告示する無線通信のきまりをいう。","日本アマチュア無線連盟が定める運用のきまりをいう。"],"answer":0,"explain":"\u003cp>電波法令でいう「無線通信規則」は、国際電気通信連合憲章に規定する無線通信規則（業務規則の 1 つ）です。\u003c/p>","refs":[{"label":"電波法施行規則 第2条第1項第3号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_2-Pr_1-It_3","lines":["電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。","三　「無線通信規則」とは、国際電気通信連合憲章に規定する無線通信規則をいう。"]}],"section":"H10-1","fixed":false},{"id":"H10-06","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章に規定する「有害な混信」の定義はどれか。\u003c/p>","choices":["無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信","無線通信規則に従わずに運用する無線局の受信に、雑音を生じさせる混信","放送の受信に、わずかでも雑音を生じさせるすべての電波","アマチュア局どうしの通信の間で生じる混信"],"answer":0,"explain":"\u003cp>有害な混信は、無線航行業務などの安全業務の機能を危うくするか、無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、妨げ、反復的に中断させる混信です。無線通信規則にも同じ定義があります。\u003c/p>","refs":[{"label":"通信憲章 附属書（1003）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=62","site":"ITU の原文（英語）","lines":["（訳）有害な混信：無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信","Harmful Interference: Interference which endangers the functioning of a radionavigation service or of other safety services or seriously degrades, obstructs or repeatedly interrupts a radiocommunication service operating in accordance with the Radio Regulations."]},{"label":"無線通信規則 第1条（1.169）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=33","site":"ITU の原文（英語）","lines":["（訳）有害な混信：無線航行業務その他の安全業務の機能を危うくし、又は無線通信規則に従って運用する無線通信業務に重大な悪影響を与え、これを妨げ、若しくは反復的に中断させる混信（通信憲章と同じ定義）","harmful interference: Interference which endangers the functioning of a radionavigation service or of other safety services or seriously degrades, obstructs, or repeatedly interrupts a radiocommunication service operating in accordance with Radio Regulations (CS)."]}],"section":"H10-2","fixed":false},{"id":"H10-07","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章に規定する有害な混信の防止について、正しいものはどれか。\u003c/p>","choices":["すべての局は、その目的のいかんを問わず、他の構成国などの無線業務又は無線通信に有害な混信を生じさせないように設置し、及び運用しなければならない。","公衆通信の業務を行う局に限り、有害な混信を生じさせないように運用しなければならない。","アマチュア局は、有害な混信の防止の規定から除かれる。","有害な混信を生じさせても、免許を受けた周波数を使っていれば問題はない。"],"answer":0,"explain":"\u003cp>目的にかかわらず、すべての局に、有害な混信を生じさせないように設置し、運用する義務があります。アマチュア局も同じです。\u003c/p>","refs":[{"label":"通信憲章 第45条第1項（197）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=49","site":"ITU の原文（英語）","lines":["（訳）すべての局は、その目的のいかんを問わず、他の構成国、認められた事業体又は無線業務を行うその他の正当に許可された事業体の無線業務又は無線通信で、無線通信規則に従って運用されるものに、有害な混信を生じさせないように設置し、及び運用しなければならない。","All stations, whatever their purpose, must be established and operated in such a manner as not to cause harmful interference to the radio services or communications of other Member States or of recognized operating agencies, or of other duly authorized operating agencies which carry on a radio service, and which operate in accordance with the provisions of the Radio Regulations."]}],"section":"H10-2","fixed":false},{"id":"H10-08","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章で、有害な混信を生じさせないよう、構成国が実行可能なすべての措置をとる必要を認めている対象として、正しいものはどれか。\u003c/p>","choices":["無線局だけでなく、あらゆる種類の電気機器及び電気設備の運用","無線局のうち、放送局の運用に限る。","送信機の製造に限る。","船舶と航空機の電気設備に限る。"],"answer":0,"explain":"\u003cp>構成国は、あらゆる種類の電気機器と電気設備の運用が、有害な混信を生じさせることを防ぐため、実行可能なすべての措置をとる必要があることを認めています。\u003c/p>","refs":[{"label":"通信憲章 第45条第3項（199）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=49","site":"ITU の原文（英語）","lines":["（訳）さらに、構成国は、あらゆる種類の電気機器と電気設備の運用が、197 の無線業務又は無線通信に有害な混信を生じさせることを防ぐため、実行可能なすべての措置をとる必要があることを認める。","Further, the Member States recognize the necessity of taking all practicable steps to prevent the operation of electrical apparatus and installations of all kinds from causing harmful interference to the radio services or communications mentioned in No. 197 above."]}],"section":"H10-2","fixed":false},{"id":"H10-09","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則で、すべての局に禁止されているものはどれか。\u003c/p>","choices":["識別表示のない信号の伝送（第 19 条に定める場合を除く。）","満足な業務を確保するために必要な電力による伝送","識別信号を付けた、機器の調整のための伝送","遭難の呼出しに応答するための伝送"],"answer":0,"explain":"\u003cp>不要な伝送、過剰な信号、虚偽やまぎらわしい信号、識別表示のない信号の伝送は、すべての局に禁止されています。送信局は、必要な電力だけを輻射します。\u003c/p>","refs":[{"label":"無線通信規則 第15条（15.1）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=262","site":"ITU の原文（英語）","lines":["（訳）すべての局は、不要な伝送、過剰な信号の伝送、虚偽の信号やまぎらわしい信号の伝送、識別表示のない信号の伝送（第19条に定める場合を除く。）を行ってはならない。","All stations are forbidden to carry out unnecessary transmissions, or the transmission of superfluous signals, or the transmission of false or misleading signals, or the transmission of signals without identification (except as provided for in Article 19)."]},{"label":"無線通信規則 第15条（15.2）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=262","site":"ITU の原文（英語）","lines":["（訳）送信局は、満足な業務を確保するために必要な電力だけを輻射しなければならない。","Transmitting stations shall radiate only as much power as is necessary to ensure a satisfactory service."]}],"section":"H10-2","fixed":false},{"id":"H10-10","subject":"法規","chapter":"H10","text":"\u003cp>遭難の呼出し及び通報の取扱いについて、国際電気通信連合憲章に規定されているものはどれか。\u003c/p>","choices":["無線局は、遭難の呼出し及び通報を、いずれから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う。","無線局は、自国の局から発せられた遭難の呼出しに限り、受信して応答する義務を負う。","遭難の呼出しの優先順位は、各国の主管庁が局ごとに決める。","アマチュア局は、遭難の呼出しを受信しても応答してはならない。"],"answer":0,"explain":"\u003cp>遭難の呼出しと通報は、どこから発せられたものでも、絶対的な優先順位で受信し、応答し、直ちに必要な措置をとります。\u003c/p>","refs":[{"label":"通信憲章 第46条（200）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=49","site":"ITU の原文（英語）","lines":["（訳）無線局は、遭難の呼出し及び通報を、どこから発せられたかを問わず、絶対的な優先順位で受信し、同じように応答し、直ちに必要な措置をとる義務を負う。","Radio stations shall be obliged to accept, with absolute priority, distress calls and messages regardless of their origin, to reply in the same manner to such messages, and immediately to take such action in regard thereto as may be required."]}],"section":"H10-3","fixed":false},{"id":"H10-11","subject":"法規","chapter":"H10","text":"\u003cp>国際電気通信連合憲章で、構成国がその確保のため、使用する電気通信のシステムに適合するすべての可能な措置をとることを約束しているものはどれか。\u003c/p>","choices":["国際通信の秘密","国際通信の料金の無料化","アマチュア局の最大電力の統一","すべての局の運用時間の統一"],"answer":0,"explain":"\u003cp>構成国は、国際通信の秘密を確保するため、すべての可能な措置をとることを約束しています。アマチュア局の最大電力は、各国の主管庁が定めます。\u003c/p>","refs":[{"label":"通信憲章 第37条第1項（184）","url":"https://www.itu.int/en/council/Documents/basic-texts-2023/Constitution-E.pdf#page=44","site":"ITU の原文（英語）","lines":["（訳）構成国は、国際通信の秘密を確保するため、使用する電気通信のシステムに適合するすべての可能な措置をとることを約束する。","Member States agree to take all possible measures, compatible with the system of telecommunication used, with a view to ensuring the secrecy of international correspondence."]}],"section":"H10-3","fixed":false},{"id":"H10-12","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則で、個人又はいかなる企業も、その局が属する国の政府が発給する許可書なしに行ってはならないとされているものはどれか。\u003c/p>","choices":["送信局の設置又は運用","受信機の購入","放送の受信","無線従事者の国家試験の受験"],"answer":0,"explain":"\u003cp>送信局は、その局が属する国の政府が発給する許可書（日本では無線局の免許）がなければ、設置も運用もできません。\u003c/p>","refs":[{"label":"無線通信規則 第18条（18.1）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=274","site":"ITU の原文（英語）","lines":["（訳）個人又はいかなる企業も、その局が属する国の政府が（又は政府に代わって）、適当な形式で、かつ、この規則に従って発給する許可書なしに、送信局を設置し、又は運用してはならない（ただし、18.2、18.8 及び 18.11 を参照）。","No transmitting station may be established or operated by a private person or by any enterprise without a licence issued in an appropriate form and in conformity with the provisions of these Regulations by or on behalf of the government of the country to which the station in question is subject (however, see Nos. 18.2, 18.8 and 18.11)."]}],"section":"H10-4","fixed":false},{"id":"H10-13","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則に規定するアマチュア業務の定義はどれか。\u003c/p>","choices":["アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務","無線技術に興味をもつ者が、金銭上の利益を得るために行う、技術研究のための無線通信業務","正当に許可された者が行う、無線機器の販売と修理のための無線通信業務","国の機関が行う、非常の場合の通信のための無線通信業務"],"answer":0,"explain":"\u003cp>アマチュア業務は、金銭上の利益を求めず、個人的な目的で無線技術に興味をもつ、正当に許可された者が行う自己訓練、相互通信、技術研究のための業務です。\u003c/p>","refs":[{"label":"無線通信規則 第1条（1.56）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=23","site":"ITU の原文（英語）","lines":["（訳）アマチュア業務：アマチュア、すなわち、無線技術に興味をもち、もっぱら個人的な目的で、金銭上の利益を求めずに行う、正当に許可された者が行う自己訓練、相互通信及び技術研究のための無線通信業務","amateur service: A radiocommunication service for the purpose of self-training, intercommunication and technical investigations carried out by amateurs, that is, by duly authorized persons interested in radio technique solely with a personal aim and without pecuniary interest."]}],"section":"H10-5","fixed":false},{"id":"H10-14","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則に規定する、異なる国のアマチュア局の間の伝送の内容として、正しいものはどれか。\u003c/p>","choices":["アマチュア業務の目的に付随する通信及び個人的な性質の通信に限る。","業務上の通信及び商業上の通信に限る。","第三者のための通信に限る。","内容に制限はない。"],"answer":0,"explain":"\u003cp>異なる国のアマチュア局の間の伝送は、アマチュア業務の目的に付随する通信と、個人的な性質の通信に限られます。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.2）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）異なる国のアマチュア局の間の伝送は、1.56 に定めるアマチュア業務の目的に付随する通信と、個人的な性質の通信に限る。","Transmissions between amateur stations of different countries shall be limited to communications incidental to the purposes of the amateur service, as defined in No. 1.56 and to remarks of a personal character."]}],"section":"H10-5","fixed":false},{"id":"H10-15","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則で、異なる国のアマチュア局の間の伝送について規定されているものはどれか。\u003c/p>","choices":["その意味を隠すために暗号化してはならない（アマチュア衛星業務の地球指令局と宇宙局との間で交わす制御信号を除く。）。","必ず暗号化しなければならない。","相手局が同意すれば、意味を隠すために暗号化してもよい。","暗号化するかどうかは、各局が自由に決めてよい。"],"answer":0,"explain":"\u003cp>異なる国のアマチュア局の間の伝送は、意味を隠すために暗号化してはいけません。例外は、アマチュア衛星を制御するための信号です。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.2A）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）異なる国のアマチュア局の間の伝送は、その意味を隠すために暗号化してはならない。ただし、アマチュア衛星業務の地球指令局と宇宙局との間で交わす制御信号は除く。","Transmissions between amateur stations of different countries shall not be encoded for the purpose of obscuring their meaning, except for control signals exchanged between earth command stations and space stations in the amateur-satellite service."]}],"section":"H10-5","fixed":false},{"id":"H10-16","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則で、アマチュア局が第三者のための国際通信の送信に使用できるとされている場合はどれか。\u003c/p>","choices":["緊急の場合又は災害救助の場合に限る。","いつでも使用できる。","料金を受け取る場合に限る。","一切使用できない。"],"answer":0,"explain":"\u003cp>アマチュア局が第三者のための国際通信を送信できるのは、緊急の場合と災害救助の場合だけです。主管庁は、この規定を自国のアマチュア局に適用するかどうかを決められます。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.3）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）アマチュア局は、緊急の場合又は災害救助の場合に限り、第三者のための国際通信の送信に使用することができる。主管庁は、自国の管轄下のアマチュア局にこの規定を適用するかどうかを決めることができる。","Amateur stations may be used for transmitting international communications on behalf of third parties only in case of emergencies or disaster relief. An administration may determine the applicability of this provision to amateur stations under its jurisdiction."]}],"section":"H10-5","fixed":false},{"id":"H10-17","subject":"法規","chapter":"H10","text":"\u003cp>アマチュア局の最大電力について、無線通信規則に規定されているものはどれか。\u003c/p>","choices":["関係の主管庁が定める。","無線通信規則で、すべての国について 1 キロワットと定めている。","国際電気通信連合の事務総局長が定める。","アマチュア局の免許人が自由に定める。"],"answer":0,"explain":"\u003cp>アマチュア局の最大電力は、関係の主管庁（日本では総務省）が定めます。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.7）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）アマチュア局の最大電力は、関係の主管庁が定める。","The maximum power of amateur stations shall be fixed by the administrations concerned."]}],"section":"H10-5","fixed":false},{"id":"H10-18","subject":"法規","chapter":"H10","text":"\u003cp>アマチュア局の呼出符号の伝送について、無線通信規則に規定されているものはどれか。\u003c/p>","choices":["その伝送の間、短い間隔で自局の呼出符号を伝送しなければならない。","伝送の初めに 1 回だけ、自局の呼出符号を伝送すればよい。","1 時間ごとに、自局の呼出符号を伝送しなければならない。","自局の呼出符号は、相手局から求められたときだけ伝送すればよい。"],"answer":0,"explain":"\u003cp>アマチュア局は、伝送の間、短い間隔で自局の呼出符号を伝送します。日本の無線局運用規則では、長い時間送信するとき、10 分ごとを標準として呼出符号を送ります。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.9）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）アマチュア局は、その伝送の間、短い間隔で自局の呼出符号を伝送しなければならない。","During the course of their transmissions, amateur stations shall transmit their call sign at short intervals."]}],"section":"H10-5","fixed":false},{"id":"H10-19","subject":"法規","chapter":"H10","text":"\u003cp>アマチュア局を運用するための許可を受けようとする者に、モールス符号による送信及び受信の能力を示すことを求めるかどうかについて、無線通信規則に規定されているものはどれか。\u003c/p>","choices":["主管庁が決める。","すべての国で、必ず求めなければならない。","すべての国で、求めてはならない。","国際電気通信連合が試験を行って決める。"],"answer":0,"explain":"\u003cp>モールス符号の送受信の能力を示させるかどうかは、各国の主管庁が決めます。主管庁は、アマチュア局を運用しようとする者の運用上と技術上の資格を確かめます。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.5）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）主管庁は、アマチュア局を運用するための許可を受けようとする者が、モールス符号による文の送信と受信の能力を示さなければならないかどうかを決める。","Administrations shall determine whether or not a person seeking a licence to operate an amateur station shall demonstrate the ability to send and receive texts in Morse code signals."]},{"label":"無線通信規則 第25条（25.6）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）主管庁は、アマチュア局を運用しようとする者の運用上と技術上の資格を確かめなければならない。能力の基準の指針は、ITU-R 勧告 M.1544 の最新版にある。","Administrations shall verify the operational and technical qualifications of any person wishing to operate an amateur station. Guidance for standards of competence may be found in the most recent version of Recommendation ITU-R M.1544."]}],"section":"H10-5","fixed":false},{"id":"H10-20","subject":"法規","chapter":"H10","text":"\u003cp>アマチュア局に適用される規定として、無線通信規則に規定されているものはどれか。\u003c/p>","choices":["通信憲章、通信条約及び無線通信規則の関係するすべての条と規定","無線通信規則の第 25 条の規定だけ","通信憲章の規定だけ","アマチュア局には、国際的な規定は適用されない。"],"answer":0,"explain":"\u003cp>通信憲章、通信条約、無線通信規則の関係するすべての規定が、アマチュア局に適用されます。第 25 条は、アマチュア業務に特有のきまりです。\u003c/p>","refs":[{"label":"無線通信規則 第25条（25.8）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=334","site":"ITU の原文（英語）","lines":["（訳）通信憲章、通信条約及びこの規則の関係するすべての条と規定は、アマチュア局に適用する。","All pertinent Articles and provisions of the Constitution, the Convention and of these Regulations shall apply to amateur stations."]}],"section":"H10-5","fixed":false},{"id":"H10-21","subject":"法規","chapter":"H10","text":"\u003cp>無線通信規則で、周波数の分配のために世界を分けた地域のうち、日本が入るものはどれか。\u003c/p>","choices":["第三地域","第一地域","第二地域","第四地域"],"answer":0,"explain":"\u003cp>世界は第一地域から第三地域までの 3 つに分けられています。第三地域は A 線と C 線の間の地域（ロシアなどを除く）で、日本はここに入ります。第一地域はヨーロッパやアフリカなど、第二地域は南北アメリカなどです。\u003c/p>","refs":[{"label":"無線通信規則 第5条（5.2）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=46","site":"ITU の原文（英語）","lines":["（訳）周波数の分配のため、世界を、次の地図と 5.3 から 5.9 までに示す三つの地域に分ける。","For the allocation of frequencies the world has been divided into three Regions as shown on the following map and described in Nos. 5.3 to 5.9:"]},{"label":"無線通信規則 第5条（5.5）","url":"https://search.itu.int/history/HistoryDigitalCollectionDocLibrary/1.49.48.en.101.pdf#page=47","site":"ITU の原文（英語）","lines":["（訳）第三地域：東は C 線、西は A 線で区切られた地域。ただし、アルメニア、アゼルバイジャン、ロシア連邦、ジョージア、カザフスタン、モンゴル、ウズベキスタン、トルコ、キルギス、タジキスタン、トルクメニスタン及びウクライナの領域と、ロシア連邦の北の地域を除く。また、この境界の外にあるイランの領域の部分を含む。","Region 3: Region 3 includes the area limited on the east by line C and on the west by line A, except any of the territory of Armenia, Azerbaijan, the Russian Federation, Georgia, Kazakhstan, Mongolia, Uzbekistan, Türkiye, Kyrgyzstan, Tajikistan, Turkmenistan and Ukraine and the area to the north of Russian Federation. It also includes that part of the territory of the Islamic Republic of Iran lying outside of those limits."]}],"section":"H10-6","fixed":false},{"id":"K11-01","subject":"無線工学","chapter":"K11","text":"\u003cp>まっすぐな導線に電流を流したとき、導線のまわりにできる磁界の向きが分かる法則はどれか。\u003c/p>","choices":["右ねじの法則","フレミングの左手の法則","フレミングの右手の法則","オームの法則"],"answer":0,"explain":"\u003cp>電流の向きに右ねじを進めると、ねじを回す向きが磁界の向きです。フレミングの左手の法則は電磁力、右手の法則は誘導起電力の向きです。\u003c/p>","refs":[],"section":"K11-1","fixed":false},{"id":"K11-02","subject":"無線工学","chapter":"K11","text":"\u003cp>コイルに電流を流して作る磁界を強くする方法として、正しいものはどれか。\u003c/p>","choices":["コイルの中に鉄心を入れる。","コイルの巻数を少なくする。","コイルに流す電流を小さくする。","コイルの中に銅の棒を入れる。"],"answer":0,"explain":"\u003cp>鉄心を入れると、磁界が強くなります。巻数を多くしたり、電流を大きくしたりしても強くなります。銅は磁石に付かない金属で、磁界を強くしません。\u003c/p>","refs":[],"section":"K11-1","fixed":false},{"id":"K11-03","subject":"無線工学","chapter":"K11","text":"\u003cp>フレミングの左手の法則で、中指が表すものはどれか。\u003c/p>","choices":["電流の向き","磁界の向き","導線に働く力の向き","導線の動く向き"],"answer":0,"explain":"\u003cp>中指が電流、人差し指が磁界、親指が力の向きです（電・磁・力）。導線の動く向きは、右手の法則の親指です。\u003c/p>","refs":[],"section":"K11-2","fixed":false},{"id":"K11-04","subject":"無線工学","chapter":"K11","text":"\u003cp>磁界の中に、磁界と直角に置いた導線に流す電流を 2 倍にすると、導線に働く力は何倍になるか。\u003c/p>","choices":["2 倍","1/2 倍","4 倍","変わらない。"],"answer":0,"explain":"\u003cp>電磁力は、磁束密度、電流、導線の長さに比例します（F ＝ B × I × l）。電流が 2 倍なら、力も 2 倍です。\u003c/p>","refs":[],"section":"K11-2","fixed":false},{"id":"K11-05","subject":"無線工学","chapter":"K11","text":"\u003cp>磁界の中の電流に働く力（電磁力）を利用しているものはどれか。\u003c/p>","choices":["電動機（モーター）","発電機","変圧器","ダイナミックマイクロホン"],"answer":0,"explain":"\u003cp>電動機は、電流に働く電磁力で回ります。発電機、変圧器、ダイナミックマイクロホンは、電磁誘導を利用しています。\u003c/p>","refs":[],"section":"K11-2","fixed":false},{"id":"K11-06","subject":"無線工学","chapter":"K11","text":"\u003cp>コイルに生じる誘導起電力の大きさについて、正しいものはどれか。\u003c/p>","choices":["コイルを貫く磁束の変化が速いほど大きい。","コイルを貫く磁束の変化が遅いほど大きい。","磁束が変化しなくても、磁束が強ければ大きい。","コイルの巻数が少ないほど大きい。"],"answer":0,"explain":"\u003cp>誘導起電力は、磁束の変化の速さと巻数に比例します（ファラデーの法則）。磁束が変化しないと、起電力は生じません。\u003c/p>","refs":[],"section":"K11-3","fixed":false},{"id":"K11-07","subject":"無線工学","chapter":"K11","text":"\u003cp>電磁誘導で生じる起電力の向きについて、正しいもの（レンツの法則）はどれか。\u003c/p>","choices":["起電力によって流れる電流が、コイルを貫く磁束の変化を妨げる向きに生じる。","起電力によって流れる電流が、コイルを貫く磁束の変化を助ける向きに生じる。","磁束の向きと関係なく、いつも同じ向きに生じる。","磁束が増えるときも減るときも、同じ向きに生じる。"],"answer":0,"explain":"\u003cp>誘導電流は、磁束の変化を打ち消す（妨げる）向きに流れます。磁束が増えるときと減るときで、向きは逆になります。\u003c/p>","refs":[],"section":"K11-3","fixed":false},{"id":"K11-08","subject":"無線工学","chapter":"K11","text":"\u003cp>磁界の中で導線を動かしたときに生じる起電力の向きが分かる法則と、それを利用したものの組合せとして、正しいものはどれか。\u003c/p>","choices":["フレミングの右手の法則・発電機","フレミングの左手の法則・発電機","フレミングの右手の法則・電動機","右ねじの法則・電動機"],"answer":0,"explain":"\u003cp>導線を動かして生じる起電力の向きは、フレミングの右手の法則で分かり、発電機に利用されています。電動機は左手の法則（電磁力）です。\u003c/p>","refs":[],"section":"K11-3","fixed":false},{"id":"K11-09","subject":"無線工学","chapter":"K11","text":"\u003cp>変圧器の 2 次コイルに電圧が生じるしくみとして、正しいものはどれか。\u003c/p>","choices":["1 次コイルの電流の変化で鉄心の中の磁束が変化し、2 次コイルに起電力が生じる（相互誘導）。","1 次コイルの電子が、鉄心を通って 2 次コイルへ流れる。","2 次コイルの中にある電池から、電圧が出る。","1 次コイルに直流を流したときだけ、2 次コイルに電圧が生じる。"],"answer":0,"explain":"\u003cp>変圧器は相互誘導を利用しています。直流では磁束が変化しないので、2 次コイルに電圧は生じません。\u003c/p>","refs":[],"section":"K11-3","fixed":false},{"id":"K11-10","subject":"無線工学","chapter":"K11","text":"\u003cp>2 つの点電荷の間に働く力は、電荷の間の距離を 2 倍にすると、何倍になるか。\u003c/p>","choices":["1/4 倍","1/2 倍","2 倍","4 倍"],"answer":0,"explain":"\u003cp>クーロンの法則で、力は距離の 2 乗に反比例します。距離が 2 倍なら、力は 1/(2 × 2) ＝ 1/4 倍です。\u003c/p>","refs":[],"section":"K11-4","fixed":false},{"id":"K11-11","subject":"無線工学","chapter":"K11","text":"\u003cp>回路を金属のケースで囲んで接地し、外の電界の影響を受けないようにすることを何というか。\u003c/p>","choices":["静電遮へい","静電誘導","電磁誘導","帯電"],"answer":0,"explain":"\u003cp>導体で囲んで接地すると、外の電界の影響が中に及びません。これを静電遮へいといいます。静電誘導は、帯電した物を近づけると導体に電荷が現れる現象です。\u003c/p>","refs":[],"section":"K11-4","fixed":false},{"id":"K11-12","subject":"無線工学","chapter":"K11","text":"\u003cp>平行に向かい合わせた 2 枚の電極でできたコンデンサで、電極の間隔を 1/2 にすると、静電容量は何倍になるか（ほかの条件は変えない）。\u003c/p>","choices":["2 倍","1/2 倍","1/4 倍","4 倍"],"answer":0,"explain":"\u003cp>静電容量は電極の間隔に反比例します（C ＝ ε × S ÷ d）。間隔を 1/2 にすると、静電容量は 2 倍です。\u003c/p>","refs":[],"section":"K11-4","fixed":false},{"id":"K11-13","subject":"無線工学","chapter":"K11","text":"\u003cp>入力電力が 1 W、出力電力が 10 W の増幅器の電力利得はどれか。\u003c/p>","choices":["10 dB","1 dB","3 dB","20 dB"],"answer":0,"explain":"\u003cp>電力の比は 10 倍です。10 × log₁₀10 ＝ 10 dB です。20 dB は電力の比が 100 倍のときです。\u003c/p>","refs":[],"section":"K11-5","fixed":false},{"id":"K11-14","subject":"無線工学","chapter":"K11","text":"\u003cp>電力利得が 3 dB の増幅器に 5 W を入力したとき、出力電力はおよそいくらか。\u003c/p>","choices":["10 W","8 W","15 W","50 W"],"answer":0,"explain":"\u003cp>3 dB は電力の約 2 倍です。5 × 2 ＝ 10 W です。dB の値をそのまま足したり（5 ＋ 3）、かけたり（5 × 3）しないようにします。\u003c/p>","refs":[],"section":"K11-5","fixed":false},{"id":"K11-15","subject":"無線工学","chapter":"K11","text":"\u003cp>電力利得が 10 dB の増幅器と 3 dB の増幅器を続けてつないだとき、全体の電力の増幅度はおよそ何倍か。\u003c/p>","choices":["20 倍","13 倍","30 倍","7 倍"],"answer":0,"explain":"\u003cp>全体の利得は 10 ＋ 3 ＝ 13 dB です。倍率では 10 倍 × 2 倍 ＝ 20 倍です。\u003c/p>","refs":[],"section":"K11-5","fixed":false},{"id":"K12-01","subject":"無線工学","chapter":"K12","text":"\u003cp>トランジスタのエミッタ接地増幅回路の特徴として、正しいものはどれか。\u003c/p>","choices":["電力利得が大きく、出力の位相が入力と逆になる。","電圧増幅度は約 1 で、入力インピーダンスが高く、出力インピーダンスが低い。","電流増幅率は 1 より少し小さく、高い周波数の特性がよい。","入力と出力の位相が同じで、電力利得は 1 より小さい。"],"answer":0,"explain":"\u003cp>エミッタ接地は、電流増幅率と電力利得が大きく、いちばんよく使われます。出力の位相は反転します。電圧増幅度が約 1 なのはコレクタ接地、電流増幅率が 1 より少し小さいのはベース接地です。\u003c/p>","refs":[],"section":"K12-1","fixed":false},{"id":"K12-02","subject":"無線工学","chapter":"K12","text":"\u003cp>コレクタ接地増幅回路（エミッタホロワ）の特徴として、正しいものはどれか。\u003c/p>","choices":["入力インピーダンスが高く、出力インピーダンスが低い。電圧増幅度は約 1 である。","入力インピーダンスが低く、出力インピーダンスが高い。電圧増幅度が大きい。","電流増幅率が 1 より少し小さく、高い周波数の特性がよい。","出力の位相が入力と逆になり、電力利得がいちばん大きい。"],"answer":0,"explain":"\u003cp>エミッタホロワは、入力インピーダンスが高く出力インピーダンスが低いので、インピーダンスの変換に使います。電圧はほとんど増幅しません。\u003c/p>","refs":[],"section":"K12-1","fixed":false},{"id":"K12-03","subject":"無線工学","chapter":"K12","text":"\u003cp>トランジスタのベース接地増幅回路の特徴として、正しいものはどれか。\u003c/p>","choices":["電流増幅率は 1 より少し小さく、高い周波数の特性がよい。","電流増幅率が大きく、出力の位相が入力と逆になる。","入力インピーダンスが高く、電圧増幅度は約 1 である。","入力をコレクタに、出力をエミッタから取り出す。"],"answer":0,"explain":"\u003cp>ベース接地は、エミッタから入力しコレクタから出力します。電流増幅率は 1 より少し小さいのですが、高い周波数でよく働きます。\u003c/p>","refs":[],"section":"K12-1","fixed":false},{"id":"K12-04","subject":"無線工学","chapter":"K12","text":"\u003cp>トランジスタのベース電流が 20 μA のとき、コレクタ電流が 2 mA 流れた。直流電流増幅率 hFE はいくらか。\u003c/p>","choices":["100","10","40","1,000"],"answer":0,"explain":"\u003cp>hFE ＝ IC ÷ IB ＝ 2 mA ÷ 0.02 mA ＝ 100 です。単位をそろえて（20 μA ＝ 0.02 mA）計算します。\u003c/p>","refs":[],"section":"K12-1","fixed":false},{"id":"K12-05","subject":"無線工学","chapter":"K12","text":"\u003cp>トランジスタのベース電流が 0.05 mA、コレクタ電流が 5 mA のとき、エミッタ電流はいくらか。\u003c/p>","choices":["5.05 mA","4.95 mA","0.05 mA","100 mA"],"answer":0,"explain":"\u003cp>エミッタ電流は、ベース電流とコレクタ電流の和です。0.05 ＋ 5 ＝ 5.05 mA です。100 は直流電流増幅率（5 ÷ 0.05）で、電流ではありません。\u003c/p>","refs":[],"section":"K12-1","fixed":false},{"id":"K12-06","subject":"無線工学","chapter":"K12","text":"\u003cp>電信（A1A）の送信機の電力増幅器に、C 級増幅を使うことができる理由として、正しいものはどれか。\u003c/p>","choices":["電信の電波は、出ている間の振幅が一定なので、ひずみの大きい C 級増幅でも差し支えない。","C 級増幅は、ひずみがいちばん少ないから。","C 級増幅は、効率がいちばん悪いが、周波数が安定するから。","電信の電波は、SSB と同じように直線性のよい増幅が必要だから。"],"answer":0,"explain":"\u003cp>C 級増幅は効率がいちばんよいのですが、ひずみが大きい増幅です。電信や FM のように振幅が変わらない電波なら使えます。SSB には直線性のよい増幅が要ります。\u003c/p>","refs":[],"section":"K12-2","fixed":false},{"id":"K12-07","subject":"無線工学","chapter":"K12","text":"\u003cp>電信送信機で、キーイングの操作に合わせて電波を断続する回路を、発振器ではなく後ろの段の増幅器に入れる主な理由はどれか。\u003c/p>","choices":["発振器を直接キーイングすると、送信周波数が変動しやすいから。","発振器をキーイングすると、送信機の出力が大きくなりすぎるから。","後ろの段をキーイングすると、高調波が増えるから。","発振器は、キーイングしても電波が止まらないから。"],"answer":0,"explain":"\u003cp>発振器を直接キーイングすると、キーイングのたびに周波数がわずかにずれる（チャープ）ことがあります。発振器は動かし続け、後ろの段でキーイングします。\u003c/p>","refs":[],"section":"K12-2","fixed":false},{"id":"K12-08","subject":"無線工学","chapter":"K12","text":"\u003cp>電信送信機でキークリックが生じる主な原因はどれか。\u003c/p>","choices":["キーイングで、電波の立ち上がりと立ち下がりが急すぎる。","電鍵を押している時間が長すぎる。","受信機の BFO の周波数がずれている。","空中線の SWR が 1 に近い。"],"answer":0,"explain":"\u003cp>電波の立ち上がりと立ち下がりが急だと、側波帯が広がり、近くの周波数に「カチッ」という妨害を与えます。\u003c/p>","refs":[],"section":"K12-3","fixed":false},{"id":"K12-09","subject":"無線工学","chapter":"K12","text":"\u003cp>キークリックを防ぐ方法として、適当なものはどれか。\u003c/p>","choices":["キーイング回路にキークリック防止回路（低域フィルタなど）を入れ、電波の立ち上がりと立ち下がりをなだらかにする。","送信機の出力を大きくする。","受信機の BFO の周波数を変える。","キーイングの速度を速くする。"],"answer":0,"explain":"\u003cp>コイル、コンデンサ、抵抗などで作る防止回路で、キーイングの波形をなだらかにします。\u003c/p>","refs":[],"section":"K12-3","fixed":false},{"id":"K12-10","subject":"無線工学","chapter":"K12","text":"\u003cp>電信送信機の「チャープ（チャーピング）」の説明として、正しいものはどれか。\u003c/p>","choices":["キーイングにともなって、送信周波数がわずかに変動する現象","キーイングにともなって、高調波が強く出る現象","受信した電波の強さが、ゆっくり強くなったり弱くなったりする現象","電鍵の接点から火花が出る現象"],"answer":0,"explain":"\u003cp>チャープは、キーイングのたびに周波数がずれ、受信音の高さが変わる現象です。後ろの段でキーイングする、緩衝増幅器を入れる、電源を安定にするなどで防ぎます。電波の強さがゆっくり変わるのは、フェージングです。\u003c/p>","refs":[],"section":"K12-3","fixed":false},{"id":"K12-11","subject":"無線工学","chapter":"K12","text":"\u003cp>電信（A1A）の電波を受信するときに使う BFO（うなり周波数発振器）の働きとして、正しいものはどれか。\u003c/p>","choices":["中間周波数と少しちがう周波数の信号を加えて、うなりを作り、モールス符号を音にする。","受信する電波の強さが変わっても、出力をほぼ一定にする。","影像周波数による妨害を減らす。","自動車の点火プラグなどから出るパルス状の雑音を消す。"],"answer":0,"explain":"\u003cp>電信の電波は音の信号を含まないので、BFO の信号とのうなりで音にします。出力を一定にするのは AGC、パルス雑音を消すのはノイズブランカです。\u003c/p>","refs":[],"section":"K12-4","fixed":false},{"id":"K12-12","subject":"無線工学","chapter":"K12","text":"\u003cp>中間周波数が 455 kHz の受信機で電信（A1A）の電波を受信するとき、BFO の周波数を 456 kHz にすると、聞こえるうなりの周波数はいくらか。\u003c/p>","choices":["1 kHz","455 kHz","911 kHz","0.5 kHz"],"answer":0,"explain":"\u003cp>聞こえるのは、BFO の周波数と中間周波数の差です。456 － 455 ＝ 1 kHz です。和の 911 kHz は聞こえる音ではありません。\u003c/p>","refs":[],"section":"K12-4","fixed":false},{"id":"K12-13","subject":"無線工学","chapter":"K12","text":"\u003cp>電信を受信するとき、中間周波増幅器に帯域幅の狭いフィルタを使う目的として、正しいものはどれか。\u003c/p>","choices":["選択度をよくして、近くの周波数の電波による混信を減らす。","受信機の感度を下げて、雑音を大きくする。","BFO を使わずに、モールス符号を音にする。","送信周波数を安定にする。"],"answer":0,"explain":"\u003cp>電信の電波は占有周波数帯幅が狭いので、帯域の狭いフィルタで目的の電波だけを通し、混信を減らします。\u003c/p>","refs":[],"section":"K12-4","fixed":false},{"id":"K12-14","subject":"無線工学","chapter":"K12","text":"\u003cp>受信機の RIT（クラリファイア）の働きとして、正しいものはどれか。\u003c/p>","choices":["送信周波数を変えずに、受信周波数だけを少し変える。","受信周波数を変えずに、送信周波数だけを大きく変える。","受信した電波の強さを示す。","電波が来ていないときの雑音を消す。"],"answer":0,"explain":"\u003cp>RIT は、受信周波数だけを少し動かして、相手の周波数のずれに合わせます。電波の強さを示すのは S メーター、雑音を消すのはスケルチです。\u003c/p>","refs":[],"section":"K12-5","fixed":false},{"id":"K12-15","subject":"無線工学","chapter":"K12","text":"\u003cp>受信機のノイズブランカの働きとして、正しいものはどれか。\u003c/p>","choices":["自動車の点火プラグなどから出るパルス状の雑音を消す。","強すぎる電波を弱めて、ひずみを防ぐ。","受信周波数を少し動かす。","中間周波数を変える。"],"answer":0,"explain":"\u003cp>ノイズブランカは、パルス状の雑音を消す回路です。強すぎる電波を弱めるのはアッテネータ、受信周波数を少し動かすのは RIT です。\u003c/p>","refs":[],"section":"K12-5","fixed":false},{"id":"K13-01","subject":"無線工学","chapter":"K13","text":"\u003cp>高周波の電流の測定に、最も適している指示電気計器はどれか。\u003c/p>","choices":["熱電対形","可動コイル形","可動鉄片形","整流形"],"answer":0,"explain":"\u003cp>熱電対形は、電流で熱線を熱し、熱電対の起電力で指示するので、高周波の電流の実効値を測れます。可動コイル形は直流、可動鉄片形は商用周波数の交流、整流形は低い周波数の交流に使います。\u003c/p>","refs":[],"section":"K13-1","fixed":false},{"id":"K13-02","subject":"無線工学","chapter":"K13","text":"\u003cp>指示電気計器と、おもに測るものの組合せとして、正しいものはどれか。\u003c/p>","choices":["可動コイル形 ― 直流","可動鉄片形 ― 高周波の電流","熱電対形 ― 直流だけ","整流形 ― 高周波の電流"],"answer":0,"explain":"\u003cp>可動コイル形は直流の計器です。熱電対形は高周波の電流も直流も交流も測れるので、「直流だけ」は誤りです。\u003c/p>","refs":[],"section":"K13-1","fixed":false},{"id":"K13-03","subject":"無線工学","chapter":"K13","text":"\u003cp>可動コイル形計器のしくみとして、正しいものはどれか。\u003c/p>","choices":["永久磁石の磁界の中に置いたコイルに電流を流し、電磁力でコイルと指針を動かす。","固定したコイルの磁界で、鉄片を動かす。","電流で熱線を熱し、熱電対に生じる起電力を測る。","電極の間に働く静電力で、指針を動かす。"],"answer":0,"explain":"\u003cp>可動コイル形は、磁界の中の電流に働く電磁力（フレミングの左手の法則）を利用しています。鉄片を動かすのは可動鉄片形、熱電対を使うのは熱電対形、静電力は静電形です。\u003c/p>","refs":[],"section":"K13-1","fixed":false},{"id":"K13-04","subject":"無線工学","chapter":"K13","text":"\u003cp>電流計の測定範囲を広げるために使う分流器のつなぎ方として、正しいものはどれか。\u003c/p>","choices":["電流計に並列につなぐ。","電流計に直列につなぐ。","電圧計に直列につなぐ。","電源に並列につなぐ。"],"answer":0,"explain":"\u003cp>分流器は、電流の一部を電流計の外へ分けて流すため、電流計に並列につなぎます。電圧計に直列につなぐのは倍率器です。\u003c/p>","refs":[],"section":"K13-2","fixed":false},{"id":"K13-05","subject":"無線工学","chapter":"K13","text":"\u003cp>内部抵抗 1 Ω、最大目盛り 10 mA の電流計で、50 mA まで測れるようにするための分流器の抵抗の値はどれか。\u003c/p>","choices":["0.25 Ω","0.2 Ω","4 Ω","5 Ω"],"answer":0,"explain":"\u003cp>測定範囲を n ＝ 50 ÷ 10 ＝ 5 倍にするので、分流器は r ÷ (n － 1) ＝ 1 ÷ 4 ＝ 0.25 Ω です。電流計に 10 mA、分流器に 40 mA が流れます。\u003c/p>","refs":[],"section":"K13-2","fixed":false},{"id":"K13-06","subject":"無線工学","chapter":"K13","text":"\u003cp>電圧計の測定範囲を広げるために使う倍率器のつなぎ方として、正しいものはどれか。\u003c/p>","choices":["電圧計に直列につなぐ。","電圧計に並列につなぐ。","電流計に並列につなぐ。","測る回路と並列に、電圧計とは別につなぐ。"],"answer":0,"explain":"\u003cp>倍率器は、電圧の一部を受け持つため、電圧計に直列につなぎます。\u003c/p>","refs":[],"section":"K13-2","fixed":false},{"id":"K13-07","subject":"無線工学","chapter":"K13","text":"\u003cp>内部抵抗 5 kΩ、最大目盛り 5 V の電圧計で、25 V まで測れるようにするための倍率器の抵抗の値はどれか。\u003c/p>","choices":["20 kΩ","25 kΩ","1.25 kΩ","5 kΩ"],"answer":0,"explain":"\u003cp>測定範囲を n ＝ 25 ÷ 5 ＝ 5 倍にするので、倍率器は (n － 1) × r ＝ 4 × 5 kΩ ＝ 20 kΩ です。電圧計に 5 V、倍率器に 20 V がかかります。\u003c/p>","refs":[],"section":"K13-2","fixed":false},{"id":"K13-08","subject":"無線工学","chapter":"K13","text":"\u003cp>一般の回路計（テスター）で、直接測ることができないものはどれか。\u003c/p>","choices":["高周波の電流","直流の電圧","低い周波数の交流の電圧","抵抗"],"answer":0,"explain":"\u003cp>回路計は、直流の電流と電圧、交流の電圧（整流器で直流にする）、抵抗を測れます。高周波の電流は測れません。\u003c/p>","refs":[],"section":"K13-3","fixed":false},{"id":"K13-09","subject":"無線工学","chapter":"K13","text":"\u003cp>回路計（テスター）で抵抗を測るとき、測る前に行うこととして、正しいものはどれか。\u003c/p>","choices":["2 本のテスト棒の先をつないで、指針を 0 Ω に合わせる。","2 本のテスト棒を離したまま、指針を 0 Ω に合わせる。","切り替えスイッチを交流電圧の範囲にする。","測る回路の電源を入れる。"],"answer":0,"explain":"\u003cp>抵抗を測る前に、テスト棒の先を短絡させて 0 Ω 調整をします。抵抗を測るときは、回路の電源を切っておきます。\u003c/p>","refs":[],"section":"K13-3","fixed":false},{"id":"K13-10","subject":"無線工学","chapter":"K13","text":"\u003cp>周波数カウンタ（計数形周波数計）のしくみとして、正しいものはどれか。\u003c/p>","choices":["正確に決めた時間（ゲート時間）の間に、入力信号のパルスの数を数えて周波数を表示する。","発振器のコイルを共振回路に近づけ、メーターの指示が下がる周波数を読む。","電圧の波形を画面に表示して、その周期を読む。","進行波と反射波の電力から周波数を求める。"],"answer":0,"explain":"\u003cp>周波数カウンタは、ゲート時間の間のパルスの数を数えます。時間の基準は水晶発振器です。メーターの指示が下がるのを読むのはディップメータ、波形を表示するのはオシロスコープです。\u003c/p>","refs":[],"section":"K13-4","fixed":false},{"id":"K13-11","subject":"無線工学","chapter":"K13","text":"\u003cp>周波数カウンタで、ゲート時間 0.1 秒の間に 14,500 個のパルスを数えた。測った周波数はいくらか。\u003c/p>","choices":["145 kHz","1.45 kHz","14.5 kHz","1.45 MHz"],"answer":0,"explain":"\u003cp>周波数は、数えた数 ÷ ゲート時間です。14,500 ÷ 0.1 ＝ 145,000 Hz ＝ 145 kHz です。\u003c/p>","refs":[],"section":"K13-4","fixed":false},{"id":"K13-12","subject":"無線工学","chapter":"K13","text":"\u003cp>ディップメータで測るものとして、正しいものはどれか。\u003c/p>","choices":["同調回路や空中線などの共振回路の共振周波数","送信機の出力電力","給電線の特性インピーダンス","電池の電圧"],"answer":0,"explain":"\u003cp>ディップメータのコイルを共振回路に近づけ、共振したところでメーターの指示が下がる（ディップ）周波数を読みます。\u003c/p>","refs":[],"section":"K13-4","fixed":false},{"id":"K13-13","subject":"無線工学","chapter":"K13","text":"\u003cp>オシロスコープで正弦波の波形を見ると、1 周期が横 4 目盛りであった。横 1 目盛りが 0.5 ms のとき、この正弦波の周波数はいくらか。\u003c/p>","choices":["500 Hz","2 kHz","250 Hz","125 Hz"],"answer":0,"explain":"\u003cp>周期は 4 × 0.5 ＝ 2 ms です。周波数は 1 ÷ 0.002 ＝ 500 Hz です。2 kHz は 1 目盛り（0.5 ms）を周期とした誤りです。\u003c/p>","refs":[],"section":"K13-5","fixed":false},{"id":"K13-14","subject":"無線工学","chapter":"K13","text":"\u003cp>オシロスコープで AM の電波の波形を見ると、振幅（山から谷まで）のいちばん大きいところが 12 目盛り、いちばん小さいところが 4 目盛りであった。変調度はいくらか。\u003c/p>","choices":["50 %","33 %","67 %","75 %"],"answer":0,"explain":"\u003cp>変調度 ＝ (A － B) ÷ (A ＋ B) × 100 ＝ (12 － 4) ÷ (12 ＋ 4) × 100 ＝ 50 % です。\u003c/p>","refs":[],"section":"K13-5","fixed":false},{"id":"K13-15","subject":"無線工学","chapter":"K13","text":"\u003cp>標準信号発生器（SG）の使い方として、正しいものはどれか。\u003c/p>","choices":["周波数と出力の大きさが正確に分かる信号を受信機に加えて、受信機の感度や選択度を測る。","送信機の出力に入れて、送信機の電力を吸収する。","空中線の代わりにつないで、SWR を 1 にする。","電池の代わりに、無線機に電源を供給する。"],"answer":0,"explain":"\u003cp>標準信号発生器は、正確な周波数と大きさの高周波の信号を出し、受信機の性能を測るのに使います。送信機の電力を吸収するのは擬似空中線です。\u003c/p>","refs":[],"section":"K13-5","fixed":false},{"id":"K13-16","subject":"無線工学","chapter":"K13","text":"\u003cp>通過形電力計で、進行波の電力が 100 W、反射波の電力が 4 W であった。SWR はいくらか。\u003c/p>","choices":["1.5","1.04","1.2","2.0"],"answer":0,"explain":"\u003cp>反射係数 Γ ＝ √(4 ÷ 100) ＝ 0.2 です。SWR ＝ (1 ＋ 0.2) ÷ (1 － 0.2) ＝ 1.5 です。空中線に送られる電力は 100 － 4 ＝ 96 W です。\u003c/p>","refs":[],"section":"K13-6","fixed":false},{"id":"K13-17","subject":"無線工学","chapter":"K13","text":"\u003cp>50 Ω の擬似空中線に送信機をつなぎ、擬似空中線の両端の電圧（実効値）を測ると 20 V であった。送信機の出力電力はいくらか。\u003c/p>","choices":["8 W","0.4 W","2.5 W","1,000 W"],"answer":0,"explain":"\u003cp>電力は P ＝ V² ÷ R ＝ 20 × 20 ÷ 50 ＝ 8 W です。0.4 は電流（20 ÷ 50 ＝ 0.4 A）で、電力ではありません。\u003c/p>","refs":[],"section":"K13-6","fixed":false},{"id":"K13-18","subject":"無線工学","chapter":"K13","text":"\u003cp>真値が 100 V の電圧を測ったところ、98 V であった。誤差率はいくらか。\u003c/p>","choices":["－2 %","＋2 %","－0.98 %","＋98 %"],"answer":0,"explain":"\u003cp>誤差率 ＝ (測定値 － 真値) ÷ 真値 × 100 ＝ (98 － 100) ÷ 100 × 100 ＝ －2 % です。測定値が真値より小さいので、マイナスになります。\u003c/p>","refs":[],"section":"K13-7","fixed":false},{"id":"K14-01","subject":"無線工学","chapter":"K14","text":"\u003cp>第三級アマチュア無線技士が操作を行うことができる周波数帯の組合せとして、正しいものはどれか（空中線電力は 50 ワット以下とする）。\u003c/p>","choices":["7 MHz 帯と 21 MHz 帯","10 MHz 帯と 14 MHz 帯","7 MHz 帯と 14 MHz 帯","14 MHz 帯と 21 MHz 帯"],"answer":0,"explain":"\u003cp>3アマは、18 MHz 以上又は 8 MHz 以下の周波数です。7 MHz 帯は 8 MHz 以下、21 MHz 帯は 18 MHz 以上です。10 MHz 帯と 14 MHz 帯は、その間なので操作できません。\u003c/p>","refs":[],"section":"K14-1","fixed":false},{"id":"K14-02","subject":"無線工学","chapter":"K14","text":"\u003cp>7 MHz 用の半波長ダイポール空中線の全体の長さとして、計算上の値に最も近いものはどれか。\u003c/p>","choices":["約 21 m","約 43 m","約 11 m","約 7 m"],"answer":0,"explain":"\u003cp>波長は 300 ÷ 7 ≒ 42.9 m で、その半分は約 21.4 m です。43 m は 1 波長、11 m は 4 分の 1 波長です。\u003c/p>","refs":[],"section":"K14-2","fixed":false},{"id":"K14-03","subject":"無線工学","chapter":"K14","text":"\u003cp>7 MHz 用の 1/4 波長垂直接地空中線の長さとして、計算上の値に最も近いものはどれか。\u003c/p>","choices":["約 10.7 m","約 21.4 m","約 42.9 m","約 5.4 m"],"answer":0,"explain":"\u003cp>波長は 300 ÷ 7 ≒ 42.9 m で、その 4 分の 1 は約 10.7 m です。21.4 m は 2 分の 1 波長です。\u003c/p>","refs":[],"section":"K14-2","fixed":false},{"id":"K14-04","subject":"無線工学","chapter":"K14","text":"\u003cp>トラップ付きダイポール空中線のトラップ（コイルとコンデンサの並列共振回路）の働きとして、正しいものはどれか。\u003c/p>","choices":["トラップの共振周波数ではインピーダンスがとても高くなって外側の導線を切り離し、それより低い周波数ではコイルとして働く。","トラップの共振周波数ではインピーダンスが最小になって、外側の導線にだけ電流を流す。","送信機から出る高調波を吸収して、熱に変える。","給電線の SWR を測って表示する。"],"answer":0,"explain":"\u003cp>並列共振回路は、共振周波数でインピーダンスが最大になります。高い周波数帯では内側だけ、低い周波数帯ではトラップが延長コイルの役をして全体が働くので、1 本で 2 つの周波数帯に使えます。\u003c/p>","refs":[],"section":"K14-2","fixed":false},{"id":"K14-05","subject":"無線工学","chapter":"K14","text":"\u003cp>アンテナチューナ（空中線整合器）の働きとして、正しいものはどれか。\u003c/p>","choices":["空中線系のインピーダンスを、送信機の出力インピーダンスに合わせる。","受信機の感度をよくするために、受信した電波を増幅する。","送信する電波の周波数を整数倍にする。","空中線の向きを変えて、指向性を変える。"],"answer":0,"explain":"\u003cp>アンテナチューナは、インピーダンスを合わせて（整合をとって）、送信機の電力を空中線系に送れるようにします。\u003c/p>","refs":[],"section":"K14-2","fixed":false},{"id":"K14-06","subject":"無線工学","chapter":"K14","text":"\u003cp>臨界周波数の説明として、正しいものはどれか。\u003c/p>","choices":["電波を垂直に発射したとき、電離層で反射されて地上に戻ってくる最高の周波数","ある 2 地点の間で、電離層の反射波で通信できる最高の周波数","電離層での吸収が大きくて、通信できなくなる周波数","地表波が遠くまで届く最高の周波数"],"answer":0,"explain":"\u003cp>臨界周波数は、真上に発射した電波が反射して戻る最高の周波数で、電離層の電子密度が高いほど高くなります。2 地点の間で使える最高の周波数は MUF です。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-07","subject":"無線工学","chapter":"K14","text":"\u003cp>MUF（最高使用周波数）の説明として、正しいものはどれか。\u003c/p>","choices":["ある 2 地点の間で、電離層の反射波を使って通信できる最高の周波数","ある 2 地点の間で、電離層の反射波を使って通信できる最低の周波数","電波を垂直に発射したとき、電離層で反射されて戻ってくる最低の周波数","送信機が出すことのできる最高の周波数"],"answer":0,"explain":"\u003cp>MUF より高い周波数は電離層を突き抜けてしまいます。最低の周波数は LUF です。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-08","subject":"無線工学","chapter":"K14","text":"\u003cp>遠く離れた 2 地点の間の MUF と、臨界周波数との関係について、正しいものはどれか。\u003c/p>","choices":["電波は斜めに入射するほど高い周波数でも反射されるので、MUF は臨界周波数より高い。","MUF は、いつも臨界周波数と等しい。","MUF は、いつも臨界周波数より低い。","MUF と臨界周波数は、関係がない。"],"answer":0,"explain":"\u003cp>真上に出すと反射しない周波数でも、斜めに入射すると反射されることがあります。そのため、遠い 2 地点の間の MUF は臨界周波数より高くなります。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-09","subject":"無線工学","chapter":"K14","text":"\u003cp>短波の通信で、安定して使いやすいとされる最適使用周波数（FOT）は、MUF のおよそ何 % か。\u003c/p>","choices":["85 %","50 %","100 %","120 %"],"answer":0,"explain":"\u003cp>FOT は MUF の 85 % ぐらいです。MUF ちょうどの周波数は、電離層の少しの変化で突き抜けてしまうことがあるので、少し低い周波数を使います。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-10","subject":"無線工学","chapter":"K14","text":"\u003cp>短波の通信で、ある周波数（LUF）より低い周波数が使えなくなる主な原因はどれか。\u003c/p>","choices":["低い周波数ほど、電離層（D 層など）での吸収が大きくなるから。","低い周波数ほど、電離層を突き抜けやすくなるから。","低い周波数ほど、地表波が強くなりすぎるから。","低い周波数ほど、送信機の出力が小さくなるから。"],"answer":0,"explain":"\u003cp>低い周波数の電波は、D 層などで吸収されやすくなります。電離層を突き抜けるのは、高すぎる周波数（MUF を超える周波数）です。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-11","subject":"無線工学","chapter":"K14","text":"\u003cp>短波帯の電波の跳躍距離と周波数の関係について、正しいものはどれか（同じ電離層の状態のとき）。\u003c/p>","choices":["周波数が高いほど、跳躍距離は長くなる。","周波数が高いほど、跳躍距離は短くなる。","跳躍距離は、周波数に関係なく一定である。","跳躍距離は、空中線の高さだけで決まる。"],"answer":0,"explain":"\u003cp>周波数が高いほど、斜めに浅く入射した電波しか反射されないので、反射波が地上に戻る点は遠くなります。\u003c/p>","refs":[],"section":"K14-3","fixed":false},{"id":"K14-12","subject":"無線工学","chapter":"K14","text":"\u003cp>短波の電波の伝わり方の、昼と夜のちがいについて、正しいものはどれか。\u003c/p>","choices":["夜は昼に比べて MUF が低くなるので、7 MHz 帯などの低い周波数が遠距離の通信に向く。","夜は昼に比べて MUF が高くなるので、28 MHz 帯などの高い周波数が遠距離の通信に向く。","夜は D 層が強くなり、低い周波数の電波が吸収される。","昼と夜で、電離層の状態は変わらない。"],"answer":0,"explain":"\u003cp>夜は F 層の電子密度が下がって MUF が低くなり、D 層も消えるので、低い周波数が遠くまで届きます。昼は MUF が高く、高い周波数が使えます。\u003c/p>","refs":[],"section":"K14-4","fixed":false},{"id":"K14-13","subject":"無線工学","chapter":"K14","text":"\u003cp>太陽の黒点の数と短波の電波の伝わり方について、正しいものはどれか。\u003c/p>","choices":["黒点の数は約 11 年の周期で増減し、多い時期は MUF が高くなって、28 MHz 帯などで遠距離の通信がしやすくなる。","黒点の数は約 11 年の周期で増減し、多い時期は MUF が低くなって、28 MHz 帯は使えなくなる。","黒点の数は約 3 年の周期で増減するが、短波の電波の伝わり方には関係がない。","黒点の数は約 50 年の周期で増減し、少ない時期ほど高い周波数で遠距離の通信がしやすい。"],"answer":0,"explain":"\u003cp>黒点が多い時期は、太陽の活動が活発で電離層の電子密度が高くなり、MUF が上がります。\u003c/p>","refs":[],"section":"K14-4","fixed":false}]};</script>
<script>
'use strict';
const D = window.HAM;
const QBY = new Map(D.questions.map(q => [q.id, q])), CHBY = new Map(D.chapters.map(c => [c.id, c]));
const $app = document.getElementById('app');

// 記録はこのブラウザーの localStorage だけに置く。使えない（プライベートモードなど）ときも動くようにする
const KEY = D.app.storageKey;
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(KEY + k); } catch { /* 使えない */ } },
};
// 解いた記録は 4アマと 3アマで共通（3アマは 4アマの章を含むので、同じ問題の記録をそのまま使う）。
// 練習の設定と模擬試験の結果は資格ごと。4アマは前からの名前（prefs・mock）のまま、ほかは「.資格」を付けて置く
const keyOf = (k, id) => id === D.licenses[0].id ? k : `${k}.${id}`;
let stats = store.get('stats', {});           // 問題の番号 → { n: 解いた回数, ok: 正解の回数, last: 最後の結果 1/0, t: 時刻 }
let L, QS, CHS, SUBJECTS, prefs;              // いまの資格と、その問題・章・科目（本番の形）・練習の設定
let sess = null;                              // 練習
let exam = null, timer = 0, skipHash = false; // 模擬試験
function useLicense(id) {
  L = D.licenses.find(l => l.id === id) || D.licenses[0];
  const set = new Set(L.chapters);
  CHS = D.chapters.filter(c => set.has(c.id));
  QS = D.questions.filter(q => set.has(q.chapter));
  SUBJECTS = L.exam.subjects;
  prefs = Object.assign({ subj: '', chapters: null, n: 10, order: 'random' }, store.get(keyOf('prefs', L.id), {}));
  if (prefs.chapters) prefs.chapters = prefs.chapters.filter(c => set.has(c));
  store.set('lic', L.id);
  document.getElementById('lic').hidden = D.licenses.length < 2; // 資格が 1 つだけのアプリは切り替えを出さない
  document.getElementById('lic').innerHTML = D.licenses.map(l => `<button type="button" data-lic="${esc(l.id)}" aria-pressed="${l === L}" title="${esc(l.name)}">${esc(l.short)}</button>`).join('');
}
const savePrefs = () => store.set(keyOf('prefs', L.id), prefs);
const mockKey = () => keyOf('mock', L.id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const qOf = id => QBY.get(id);
const chOf = q => CHBY.get(q.chapter);
const chLabel = c => `第${c.num}章 ${c.title}`;
const textOnly = h => h.replace(/<br>/g, ' ').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
const snippet = (q, n = 44) => { const t = textOnly(q.text).replace(/\s+/g, ' ').trim(); return esc(t.length > n ? t.slice(0, n) + '…' : t); };
const orderFor = q => { const o = q.choices.map((_, i) => i); return q.fixed ? o : shuffle(o); };
const chaptersFor = subj => CHS.filter(c => !subj || c.subject === subj);
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtMin = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)} 分 ${s % 60} 秒`; };
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
// 本番の形の説明。科目で問題数と合格点が同じ資格（4アマ）と、ちがう資格（3アマ）で言い方を変える
const sameForm = () => SUBJECTS.every(s => s.count === SUBJECTS[0].count && s.pass === SUBJECTS[0].pass);
const passText = (word = '合格') => sameForm()
  ? `1 問 ${SUBJECTS[0].points} 点で各科目 ${SUBJECTS[0].count * SUBJECTS[0].points} 点満点、両方の科目で ${SUBJECTS[0].pass} 点以上なら${word}です。`
  : `1 問 ${SUBJECTS[0].points} 点で、${SUBJECTS.map(s => `${s.name}は ${s.count * s.points} 点満点で ${s.pass} 点以上`).join('、')}なら${word}です。`;
const countText = () => sameForm() ? `${SUBJECTS.map(s => s.name).join('と')}が各 ${SUBJECTS[0].count} 問` : SUBJECTS.map(s => `${s.name} ${s.count} 問`).join('と');

function record(id, ok) {
  const s = stats[id] || { n: 0, ok: 0, last: 0, t: 0 };
  s.n += 1; s.ok += ok ? 1 : 0; s.last = ok ? 1 : 0; s.t = Date.now();
  stats[id] = s;
  store.set('stats', stats);
}
function summary(list) {
  return { total: list.length, done: list.filter(q => stats[q.id]).length, right: list.filter(q => stats[q.id]?.last === 1).length };
}
const bar = (v, total, label) => `<div class="bar" role="img" aria-label="${esc(label || `${total} 問中 ${v} 問`)}"><i style="width:${total ? v * 100 / total : 0}%"></i></div>`;
const examText = () => `本番は${countText()}、合わせて ${L.exam.minutes} 分です。${passText()}`;
const onlyBadge = c => c.only ? `<span class="badge" title="${esc(c.only)}で増える範囲">${esc(c.only)}</span>` : '';

// ── ホーム ─────────────────────────────────────────
function viewHome() {
  const wrongN = QS.filter(q => stats[q.id]?.last === 0).length;
  const extra = CHS.filter(c => c.only), base = D.licenses[0], others = D.licenses.filter(l => l !== L);
  $app.innerHTML = `<h2>${esc(L.short)}の練習問題と教科書</h2>
  <p>${esc(L.name)}（${esc(L.short)}）の国家試験に向けた、非公式の練習問題と教科書です。${esc(examText())}</p>
  ${extra.length ? `<p>${esc(L.short)}の試験の範囲は、${esc(base.short)}の範囲を含みます。この問題集では、${esc(base.short)}の ${CHS.length - extra.length} 章に、${esc(L.short)}で増える ${extra.length} 章（${extra.map(c => `「${esc(c.title)}」`).join('')}）を足しています。${esc(base.short)}で解いた記録は、${esc(L.short)}でもそのまま使えます。</p>` : ''}
  ${L.video ? `<p>動画でも見られます：YouTube「<a href="${esc(L.video.url)}" target="_blank" rel="noopener">${esc(L.video.title)}</a>」（${esc(L.video.length)}）。試験の形と取り方、この問題集の使い方を説明しています。</p>` : ''}
  ${L.scenes ? `<section class="scenes"><h3>${esc(L.short)}が必要な場面</h3>
  ${L.scenes.lead ? `<p>${L.scenes.lead}</p>` : ''}
  <ul>${L.scenes.items.map(h => `<li>${h}</li>`).join('')}</ul>
  ${L.scenes.note ? `<p class="hint">${L.scenes.note}</p>` : ''}</section>` : ''}
  <p class="status">${esc(L.status)}</p>
  <div class="actions">${others.map(l => `<button type="button" data-act="lic" data-v="${esc(l.id)}">${esc(l.short)}（${esc(l.name)}）に切り替える</button>`).join('')}</div>
  <div class="cards">${SUBJECTS.map(s => {
    const list = QS.filter(q => q.subject === s.name), m = summary(list);
    return `<section class="card"><h3>${esc(s.name)}</h3>
      <p class="meta">${chaptersFor(s.name).length} 章・${list.length} 問</p>
      <p>解いた問題 ${m.done} / ${m.total}　最後に正解 ${m.right}</p>
      ${bar(m.right, m.total, `${m.total} 問中 ${m.right} 問が最後に正解`)}
      <a class="btn" href="#/practice" data-act="pick-subject" data-v="${esc(s.name)}">${esc(s.name)}を練習する</a></section>`;
  }).join('')}</div>
  <div class="actions">
    <a class="btn primary" href="#/mock">模擬試験を受ける</a>
    <a class="btn" href="#/review">まちがえた問題を復習する（${wrongN} 問）</a>
    <a class="btn" href="#/book">教科書を読む</a>
  </div>`;
}

// ── 練習 ─────────────────────────────────────────
function viewPractice(args) {
  if (args[0] === 'run' && sess) return sess.done ? viewResult() : viewQuestion();
  if (args[0] === 'result' && sess?.done) return viewResult();
  const chs = chaptersFor(prefs.subj);
  const chosen = new Set(prefs.chapters || chs.map(c => c.id));
  const radio = (name, value, label, on) => `<label class="pill"><input type="radio" name="${name}" value="${esc(value)}"${on ? ' checked' : ''}> ${esc(label)}</label>`;
  $app.innerHTML = `<h2>練習</h2>
  <form id="setup">
    <fieldset><legend>科目</legend>${[['', '両方'], ...SUBJECTS.map(s => [s.name, s.name])].map(([v, t]) => radio('subj', v, t, v === prefs.subj)).join('')}</fieldset>
    <fieldset><legend>章</legend>
      <div class="chk">${chs.map(c => {
        const list = QS.filter(q => q.chapter === c.id), m = summary(list);
        return `<label><input type="checkbox" name="ch" value="${c.id}"${chosen.has(c.id) ? ' checked' : ''}><span>${esc(c.subject)}　${esc(chLabel(c))}${onlyBadge(c)}<small>${list.length} 問・解いた ${m.done}・最後に正解 ${m.right}</small></span></label>`;
      }).join('')}</div>
      <div class="actions"><button type="button" data-act="all-ch">すべて選ぶ</button><button type="button" data-act="no-ch">すべて外す</button></div>
    </fieldset>
    <fieldset><legend>問題の数</legend>${[5, 10, 20, 0].map(n => radio('n', n, n ? `${n} 問` : 'すべて', n === prefs.n)).join('')}</fieldset>
    <fieldset><legend>出し方</legend>${radio('order', 'random', 'ばらばらに', prefs.order !== 'weak')}${radio('order', 'weak', 'まだできていない問題から', prefs.order === 'weak')}</fieldset>
    <p class="hint" id="setupCount" aria-live="polite"></p>
    <button class="primary" type="submit">始める</button>
  </form>`;
  updateCount();
}

function pickBalanced(pool, n) {
  // 章ごとに順番に 1 問ずつ取り、いろいろな章から出す。出す順は章の順（本番も分野ごとに並ぶ）
  const groups = new Map();
  for (const q of shuffle(pool)) { if (!groups.has(q.chapter)) groups.set(q.chapter, []); groups.get(q.chapter).push(q); }
  const lists = [...groups.values()], out = [];
  while (out.length < n && lists.some(g => g.length)) for (const g of lists) if (g.length && out.length < n) out.push(g.shift());
  const at = id => CHS.findIndex(c => c.id === id);
  return out.sort((a, b) => at(a.chapter) - at(b.chapter)).map(q => q.id);
}
function startExam() {

async function importRecords(file) {
  const msg = t => { const el = document.getElementById('ioMsg'); if (el) el.textContent = t; };
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== D.app.exportApp || typeof d.stats !== 'object') throw new Error();
    // 同じ問題は、解いた回数の多いほうを残す
    for (const [id, s] of Object.entries(d.stats)) if (QBY.has(id) && (!stats[id] || s.n > stats[id].n)) stats[id] = s;
    store.set('stats', stats);
    for (const l of D.licenses) {
      const incoming = d.mocks?.[l.id] ?? (l === D.licenses[0] ? d.mock : null);
      if (!Array.isArray(incoming)) continue;
      const seen = new Set(), mock = [...store.get(keyOf('mock', l.id), []), ...incoming].filter(h => !seen.has(h.d) && seen.add(h.d)).sort((a, b) => b.d - a.d).slice(0, 30);
      store.set(keyOf('mock', l.id), mock);
    }
    viewReview();
    msg('記録を読み込みました。');
  } catch { msg('このファイルは読み込めませんでした。「記録を書き出す」で作ったファイルを選んでください。'); }
}
