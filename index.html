Ch_1-At_4_4-Pr_1","lines":["空中線電力は、電波の型式のうち主搬送波の変調の型式及び主搬送波を変調する信号の性質が次の上欄に掲げる記号で表される電波を使用する送信設備について、それぞれ同表の下欄に掲げる電力をもつて表示する。","記号｜空中線電力","主搬送波の変調の型式｜主搬送波を変調する信号の性質","Ｊ｜尖頭電力（ｐＸ）"]}],"section":"H03-4","fixed":false},{"id":"H03-14","subject":"法規","chapter":"H03","text":"\u003cp>アマチュア局の送信設備の空中線電力の許容偏差はどれか。\u003c/p>","choices":["上限 20 パーセント、下限は定めなし","上限 10 パーセント、下限 20 パーセント","上限 20 パーセント、下限 20 パーセント","上限 5 パーセント、下限 10 パーセント"],"answer":0,"explain":"\u003cp>アマチュア局の送信設備は、上限が 20 パーセントで、下限は決められていません。指定された電力より少ないぶんには、許容偏差の問題になりません。\u003c/p>","refs":[{"label":"無線設備規則 第14条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["空中線電力の許容偏差は、次の表の上欄に掲げる送信設備の区別に従い、それぞれ同表の下欄に掲げるとおりとする。","送信設備｜許容偏差","上限（パーセント）｜下限（パーセント）","八　次に掲げる送信設備（一）　アマチュア局の送信設備（二）　一四二・九三ＭＨｚを超え一四二・九九ＭＨｚ以下、一四六・九三ＭＨｚを超え一四六・九九ＭＨｚ以下、一六九・三九ＭＨｚを超え一六九・八一ＭＨｚ以下、三一二ＭＨｚを超え三一五・二五ＭＨｚ以下、四〇一ＭＨｚを超え四〇二ＭＨｚ以下、四〇五ＭＨｚを超え四〇六ＭＨｚ以下又は四三三・〇五ＭＨｚを超え四三四・七九ＭＨｚ以下の周波数の電波を使用する特定小電力無線局の送信設備（三）　二、四〇〇ＭＨｚ以上二、四八三・五ＭＨｚ以下の周波数の電波を使用する小電力データ通信システムの無線局の送信設備（四）　超広帯域無線システムの無線局の送信設備｜二〇"]}],"section":"H03-4","fixed":false},{"id":"H03-15","subject":"法規","chapter":"H03","text":"\u003cp>アマチュア局の送信装置について、無線設備規則に規定されているものはどれか。\u003c/p>","choices":["通信に秘匿性を与える機能を有してはならない。","通信に秘匿性を与える機能を備えなければならない。","総務大臣の許可を受ければ、通信に秘匿性を与える機能を使用できる。","430 MHz 帯に限り、通信に秘匿性を与える機能を使用できる。"],"answer":0,"explain":"\u003cp>アマチュア局の送信装置は、通信に秘匿性を与える機能をもってはいけません。アマチュア無線は、だれでも内容が分かる通信で行います。\u003c/p>","refs":[{"label":"無線設備規則 第18条第2項","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_2-At_18-Pr_2","lines":["アマチュア局の送信装置は、通信に秘匿性を与える機能を有してはならない。"]}],"section":"H03-5","fixed":false},{"id":"H03-16","subject":"法規","chapter":"H03","text":"\u003cp>送信空中線の型式及び構成が適合しなければならない条件として、無線設備規則に規定されていないものはどれか。\u003c/p>","choices":["空中線の高さができる限り低いこと。","空中線の利得及び能率がなるべく大であること。","整合が十分であること。","満足な指向特性が得られること。"],"answer":0,"explain":"\u003cp>決められているのは、利得と能率がなるべく大きいこと、整合が十分であること、満足な指向特性が得られることの 3 つです。空中線の高さについての決まりはありません。\u003c/p>","refs":[{"label":"無線設備規則 第20条","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_3-At_20","lines":["（送信空中線の型式及び構成等）","第二十条　送信空中線の型式及び構成は、左の各号に適合するものでなければならない。","一　空中線の利得及び能率がなるべく大であること。","二　整合が十分であること。","三　満足な指向特性が得られること。"]}],"section":"H03-5","fixed":false},{"id":"H03-17","subject":"法規","chapter":"H03","text":"\u003cp>移動するアマチュア局の送信装置が、周波数を許容偏差の中に保つために適合しなければならない条件はどれか。\u003c/p>","choices":["実際上起こり得る振動又は衝撃によっても、周波数をその許容偏差内に維持するものであること。","外部の照明の明るさによって、発振周波数が変わらないものであること。","送信の時間が 1 回 5 分以内に制限されるものであること。","空中線電力を 1 ワット以下に保つものであること。"],"answer":0,"explain":"\u003cp>移動局（移動するアマチュア局を含む）の送信装置は、振動や衝撃があっても周波数を許容偏差内に保たなければなりません。ほかに、電源電圧や負荷の変化、温度や湿度の変化による影響をできる限り受けないことも求められます。\u003c/p>","refs":[{"label":"無線設備規則 第15条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_2-Se_2-At_15-Pr_3","lines":["移動局（移動するアマチュア局を含む。）の送信装置は、実際上起り得る振動又は衝撃によつても周波数をその許容偏差内に維持するものでなければならない。"]}],"section":"H03-5","fixed":false},{"id":"H03-18","subject":"法規","chapter":"H03","text":"\u003cp>受信設備が副次的に発する電波について、他の無線設備の機能に支障を与えない限度はどれか。受信空中線と電気的常数の等しい擬似空中線回路を使って測った場合とする。\u003c/p>","choices":["その回路の電力が 4 ナノワット以下","その回路の電力が 4 マイクロワット以下","その回路の電力が 4 ミリワット以下","その回路の電力が 40 ミリワット以下"],"answer":0,"explain":"\u003cp>4 ナノワット（10 億分の 4 ワット）以下です。\u003c/p>","refs":[{"label":"無線設備規則 第24条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_3-At_24-Pr_1","lines":["法第二十九条に規定する副次的に発する電波が他の無線設備の機能に支障を与えない限度は、受信空中線と電気的常数の等しい疑似空中線回路を使用して測定した場合に、その回路の電力が四ナノワット以下でなければならない。"]}],"section":"H03-6","fixed":false},{"id":"H03-19","subject":"法規","chapter":"H03","text":"\u003cp>受信設備がなるべく適合しなければならない条件として、無線設備規則に規定されていないものはどれか。\u003c/p>","choices":["空中線電力が十分であること。","内部雑音が小さいこと。","感度が十分であること。","選択度が適正であること。"],"answer":0,"explain":"\u003cp>受信設備の条件は、内部雑音が小さいこと、感度が十分であること、選択度が適正であること、了解度が十分であることの 4 つです。空中線電力は送信の強さで、受信設備の条件ではありません。\u003c/p>","refs":[{"label":"無線設備規則 第25条","url":"https://laws.e-gov.go.jp/law/325M50080000018#Mp-Ch_3-At_25","lines":["（その他の条件）","第二十五条　受信設備は、なるべく左の各号に適合するものでなければならない。","一　内部雑音が小さいこと。","二　感度が十分であること。","三　選択度が適正であること。","四　了解度が十分であること。"]}],"section":"H03-6","fixed":false},{"id":"H04-01","subject":"法規","chapter":"H04","text":"\u003cp>アマチュア無線局の無線設備の操作について、電波法に規定されているものはどれか（外国の資格をもつ者の操作など、総務省令で定める場合を除く）。\u003c/p>","choices":["無線従事者でなければ行ってはならない。","無線局の免許人であれば、資格がなくても行うことができる。","18 歳以上の者であれば、だれでも行うことができる。","空中線電力が 1 ワット以下であれば、だれでも行うことができる。"],"answer":0,"explain":"\u003cp>アマチュア無線局の無線設備の操作は、無線従事者でなければ行ってはいけません。局の免許（アマチュア局の免許）と、人の資格（無線従事者の免許）は別のものです。\u003c/p>","refs":[{"label":"電波法 第39条の13","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_39_13","lines":["（アマチュア無線局の無線設備の操作）","第三十九条の十三　アマチュア無線局の無線設備の操作は、次条の定めるところにより、無線従事者でなければ行つてはならない。ただし、外国において同条第一項第五号に掲げる資格に相当する資格として総務省令で定めるものを有する者が総務省令で定めるところによりアマチュア無線局の無線設備の操作を行うとき、その他総務省令で定める場合は、この限りでない。"]}],"section":"H04-1","fixed":false},{"id":"H04-02","subject":"法規","chapter":"H04","text":"\u003cp>第四級アマチュア無線技士が操作を行うことができる、30 MHz を超える周波数の電波を使用するアマチュア無線局の無線設備の空中線電力の上限はどれか。\u003c/p>","choices":["20 ワット","10 ワット","50 ワット","200 ワット"],"answer":0,"explain":"\u003cp>4アマは、30 MHz を超える周波数では空中線電力 20 ワット以下の無線設備を操作できます。144 MHz 帯と 430 MHz 帯は、30 MHz を超える周波数です。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一　空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二　空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの"]}],"section":"H04-2","fixed":false},{"id":"H04-03","subject":"法規","chapter":"H04","text":"\u003cp>第四級アマチュア無線技士が操作を行うことができる、21 MHz から 30 MHz まで又は 8 MHz 以下の周波数の電波を使用するアマチュア無線局の無線設備の空中線電力の上限はどれか。\u003c/p>","choices":["10 ワット","20 ワット","50 ワット","100 ワット"],"answer":0,"explain":"\u003cp>4アマは、21 MHz から 30 MHz まで又は 8 MHz 以下の周波数では、空中線電力 10 ワット以下です。30 MHz を超える周波数は 20 ワット以下です。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一　空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二　空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの"]}],"section":"H04-2","fixed":false},{"id":"H04-04","subject":"法規","chapter":"H04","text":"\u003cp>第四級アマチュア無線技士の操作の範囲から除かれているものはどれか。\u003c/p>","choices":["モールス符号による通信操作","144 MHz 帯の F3E 電波による無線電話の通信操作","430 MHz 帯の F3E 電波による無線電話の通信操作","空中線電力 5 ワットの無線電話の通信操作"],"answer":0,"explain":"\u003cp>4アマの操作の範囲は「モールス符号による通信操作を除く」とされています。モールス符号の通信には、3アマ以上の資格が要ります。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第四級アマチュア無線技士｜アマチュア無線局の無線設備で次に掲げるものの操作（モールス符号による通信操作を除く。）一　空中線電力十ワット以下の無線設備で二十一メガヘルツから三十メガヘルツまで又は八メガヘルツ以下の周波数の電波を使用するもの二　空中線電力二十ワット以下の無線設備で三十メガヘルツを超える周波数の電波を使用するもの"]}],"section":"H04-2","fixed":false},{"id":"H04-05","subject":"法規","chapter":"H04","text":"\u003cp>第三級アマチュア無線技士の操作の範囲として、正しいものはどれか。\u003c/p>","choices":["空中線電力 50 ワット以下の無線設備で、18 MHz 以上又は 8 MHz 以下の周波数の電波を使用するものの操作","空中線電力 200 ワット以下の無線設備の操作","空中線電力 20 ワット以下の無線設備で、30 MHz を超える周波数の電波を使用するものの操作に限る","空中線電力 50 ワット以下の無線設備で、30 MHz を超える周波数の電波を使用するものの操作に限る"],"answer":0,"explain":"\u003cp>3アマは、空中線電力 50 ワット以下で、18 MHz 以上又は 8 MHz 以下の周波数です。200 ワット以下は 2アマの範囲です。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第三級アマチュア無線技士｜アマチュア無線局の空中線電力五十ワット以下の無線設備で十八メガヘルツ以上又は八メガヘルツ以下の周波数の電波を使用するものの操作"]}],"section":"H04-2","fixed":false},{"id":"H04-06","subject":"法規","chapter":"H04","text":"\u003cp>第二級アマチュア無線技士の操作の範囲として、正しいものはどれか。\u003c/p>","choices":["アマチュア無線局の空中線電力 200 ワット以下の無線設備の操作","アマチュア無線局の空中線電力 100 ワット以下の無線設備の操作","アマチュア無線局の空中線電力 500 ワット以下の無線設備の操作","アマチュア無線局のすべての無線設備の操作"],"answer":0,"explain":"\u003cp>2アマは 200 ワット以下です。すべての無線設備の操作ができるのは 1アマです。\u003c/p>","refs":[{"label":"電波法施行令 第3条第3項（表の一部）","url":"https://laws.e-gov.go.jp/law/413CO0000000245#Mp-At_3-Pr_3","lines":["次の表の上欄に掲げる資格の無線従事者は、それぞれ同表の下欄に掲げる無線設備の操作を行うことができる。","資格｜操作の範囲","第二級アマチュア無線技士｜アマチュア無線局の空中線電力二百ワット以下の無線設備の操作"]}],"section":"H04-2","fixed":false},{"id":"H04-07","subject":"法規","chapter":"H04","text":"\u003cp>無線従事者になろうとする者について、電波法に規定されているものはどれか。\u003c/p>","choices":["総務大臣の免許を受けなければならない。","国家試験に合格すれば、免許を受けなくても無線従事者となる。","日本アマチュア無線連盟に登録しなければならない。","無線局の免許を受ければ、無線従事者となる。"],"answer":0,"explain":"\u003cp>無線従事者になるには、総務大臣の免許を受けます。国家試験に合格したり、養成課程を修了したりすると、免許を受けられるようになります。\u003c/p>","refs":[{"label":"電波法 第41条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_41-Pr_1","lines":["無線従事者になろうとする者は、総務大臣の免許を受けなければならない。"]}],"section":"H04-3","fixed":false},{"id":"H04-08","subject":"法規","chapter":"H04","text":"\u003cp>次の文の [ ] に入る期間はどれか。\u003cbr>「電波法第 79 条の規定により無線従事者の免許を取り消され、取消しの日から [ ] を経過しない者には、無線従事者の免許を与えないことができる。」\u003c/p>","choices":["2 年","6 か月","1 年","5 年"],"answer":0,"explain":"\u003cp>2 年です。電波法の罪で罰金以上の刑に処せられ、執行を終わるなどした日から 2 年を経過しない者も同じです。\u003c/p>","refs":[{"label":"電波法 第42条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_4-At_42","lines":["（免許を与えない場合）","第四十二条　次の各号のいずれかに該当する者に対しては、無線従事者の免許を与えないことができる。","一　第九章の罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者","二　第七十九条第一項第一号又は第二号の規定により無線従事者の免許を取り消され、取消しの日から二年を経過しない者","三　著しく心身に欠陥があつて無線従事者たるに適しない者"]}],"section":"H04-3","fixed":false},{"id":"H04-09","subject":"法規","chapter":"H04","text":"\u003cp>無線従事者がその業務に従事しているときの免許証の扱いとして、規定されているものはどれか。\u003c/p>","choices":["免許証を携帯していなければならない。","免許証を無線設備のある場所に掲示しなければならない。","免許証を自宅に保管し、求められたら 1 週間以内に示せばよい。","免許証を総合通信局に預けておかなければならない。"],"answer":0,"explain":"\u003cp>業務に従事しているときは、免許証を携帯していなければなりません。\u003c/p>","refs":[{"label":"電波法施行規則 第38条第11項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_38-Pr_11","lines":["無線従事者は、その業務に従事しているときは、無線従事者の免許証（法第三十九条又は法第五十条の規定により船舶局無線従事者証明を要することとされた者については、無線従事者の免許証及び船舶局無線従事者証明書）を携帯していなければならない。"]}],"section":"H04-4","fixed":false},{"id":"H04-10","subject":"法規","chapter":"H04","text":"\u003cp>無線従事者が免許証の再交付を申請できる場合として、無線従事者規則に規定されているものはどれか。\u003c/p>","choices":["氏名に変更を生じたとき","住所に変更を生じたとき","免許証の有効期間が満了したとき","上の級の国家試験に合格したとき"],"answer":0,"explain":"\u003cp>再交付を申請できるのは、氏名に変更を生じたときと、免許証を汚し、破り、又は失ったときです。住所は免許証の再交付の理由になりません。無線従事者の免許には有効期間がありません。\u003c/p>","refs":[{"label":"無線従事者規則 第50条第1項","url":"https://laws.e-gov.go.jp/law/402M50001000018#Mp-Ch_5-At_50-Pr_1","lines":["無線従事者は、氏名に変更を生じたとき又は免許証を汚し、破り、若しくは失ったために免許証の再交付を受けようとするときは、別表第十一号様式の申請書に次に掲げる書類を添えて総務大臣又は総合通信局長に提出しなければならない。","一　免許証（免許証を失った場合を除く。）","二　写真一枚","三　氏名の変更の事実を証する書類（氏名に変更を生じたときに限る。）"]}],"section":"H04-4","fixed":false},{"id":"H04-11","subject":"法規","chapter":"H04","text":"\u003cp>無線従事者が免許の取消しの処分を受けたとき、その免許証を返納しなければならない期限はどれか。\u003c/p>","choices":["処分を受けた日から 10 日以内","処分を受けた日から 7 日以内","処分を受けた日から 1 か月以内","処分を受けた日から 3 か月以内"],"answer":0,"explain":"\u003cp>10 日以内に、総務大臣又は総合通信局長に返納します。\u003c/p>","refs":[{"label":"無線従事者規則 第51条第1項","url":"https://laws.e-gov.go.jp/law/402M50001000018#Mp-Ch_5-At_51-Pr_1","lines":["無線従事者は、免許の取消しの処分を受けたときは、その処分を受けた日から十日以内にその免許証を総務大臣又は総合通信局長に返納しなければならない。免許証の再交付を受けた後失った免許証を発見したときも同様とする。"]}],"section":"H04-4","fixed":false},{"id":"H04-12","subject":"法規","chapter":"H04","text":"\u003cp>免許証の再交付を受けた無線従事者が、失った免許証を発見したときの扱いとして、正しいものはどれか。\u003c/p>","choices":["発見した日から 10 日以内に、発見した免許証を返納する。","発見した免許証を、予備として保管しておく。","再交付を受けた免許証を、10 日以内に返納する。","発見した免許証を破棄して、その旨を届け出る。"],"answer":0,"explain":"\u003cp>再交付を受けたあとで、失った免許証を発見したときも、10 日以内に返納します。返すのは発見した古い免許証です。\u003c/p>","refs":[{"label":"無線従事者規則 第51条第1項","url":"https://laws.e-gov.go.jp/law/402M50001000018#Mp-Ch_5-At_51-Pr_1","lines":["無線従事者は、免許の取消しの処分を受けたときは、その処分を受けた日から十日以内にその免許証を総務大臣又は総合通信局長に返納しなければならない。免許証の再交付を受けた後失った免許証を発見したときも同様とする。"]}],"section":"H04-4","fixed":false},{"id":"H04-13","subject":"法規","chapter":"H04","text":"\u003cp>総務大臣が、電波法に違反した無線従事者に対して行うことができる処分として、正しいものはどれか。\u003c/p>","choices":["免許を取り消し、又は 3 か月以内の期間を定めて業務に従事することを停止する。","免許を取り消し、又は 6 か月以内の期間を定めて業務に従事することを停止する。","1 年以内の期間を定めて、無線局の運用を停止する。","免許の有効期間を短くする。"],"answer":0,"explain":"\u003cp>無線従事者には、免許の取消しか、3 か月以内の業務の従事停止ができます。無線局（局の免許）の運用停止とは別のきまりです。\u003c/p>","refs":[{"label":"電波法 第79条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_79-Pr_1","lines":["総務大臣は、無線従事者が左の各号の一に該当するときは、その免許を取り消し、又は三箇月以内の期間を定めてその業務に従事することを停止することができる。","一　この法律若しくはこの法律に基く命令又はこれらに基く処分に違反したとき。","二　不正な手段により免許を受けたとき。","三　第四十二条第三号に該当するに至つたとき。"]}],"section":"H04-5","fixed":false},{"id":"H04-14","subject":"法規","chapter":"H04","text":"\u003cp>資格のない者が、無線従事者の指揮の下でアマチュア局の無線設備を操作する場合（体験運用）、連絡の設定及び終了に関する通信操作を行うのはだれか。\u003c/p>","choices":["操作を指揮する無線従事者","操作を行う資格のない者","相手局の無線従事者","だれが行ってもよい。"],"answer":0,"explain":"\u003cp>資格のない人が操作するときも、交信の始まりと終わり（連絡の設定と終了）は、指揮する無線従事者が行います。\u003c/p>","refs":[{"label":"電波法施行規則 第34条の10第1項第1号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_5-At_34_10-Pr_1-It_1","lines":["法第三十九条の十三ただし書の総務省令で定める場合は、次の各号に掲げる場合とする。","一　アマチュア局（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局を除く。以下この項において同じ。）の無線設備の操作をその操作ができる資格を有する無線従事者の指揮（立会い（これに相当する適切な措置を執るものを含む。）をするものに限る。以下この号及び次項において同じ。）の下に行う場合であつて、次に掲げる条件に適合するとき。","　（１）　科学技術に対する理解と関心を深めることを目的として一時的に行われるものであること。","　（２）　当該無線設備の操作を指揮する無線従事者の行うことができる無線設備の操作（モールス符号を送り、又は受ける無線電信の操作を除く。）の範囲内であること。","　（３）　当該無線設備の操作のうち、連絡の設定及び終了に関する通信操作については、当該無線設備の操作を指揮する無線従事者が行うこと。","　（４）　当該無線設備の操作を行う者が、法第五条第三項各号のいずれか又は法第四十二条第一号若しくは第二号に該当する者でないこと。"]}],"section":"H04-6","fixed":false},{"id":"H04-15","subject":"法規","chapter":"H04","text":"\u003cp>無線従事者の免許証の交付を受けた者が努めなければならないこととして、無線従事者規則に規定されているものはどれか。\u003c/p>","choices":["無線設備の操作に関する知識及び技術の向上を図ること","毎年 1 回、無線設備の講習を受けること","5 年ごとに、免許証を書き換えること","月に 1 回以上、無線局を運用すること"],"answer":0,"explain":"\u003cp>免許証の交付を受けた者は、無線設備の操作に関する知識と技術の向上を図るように努めなければなりません。\u003c/p>","refs":[{"label":"無線従事者規則 第47条第2項","url":"https://laws.e-gov.go.jp/law/402M50001000018#Mp-Ch_5-At_47-Pr_2","lines":["前項の規定により免許証の交付を受けた者は、無線設備の操作に関する知識及び技術の向上を図るように努めなければならない。"]}],"section":"H04-3","fixed":false},{"id":"H05-01","subject":"法規","chapter":"H05","text":"\u003cp>無線局が、免許記録に記録されている目的、通信の相手方又は通信事項の範囲を超えて運用することができる通信はどれか。\u003c/p>","choices":["非常通信","他人から依頼を受けた通報の送信","商品の売買に関する通信","会社の業務の連絡"],"answer":0,"explain":"\u003cp>範囲を超えてよいのは、遭難通信、緊急通信、安全通信、非常通信、放送の受信、その他総務省令で定める通信です。\u003c/p>","refs":[{"label":"電波法 第52条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_52-Pr_1","lines":["無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。","一　遭難通信（船舶又は航空機が重大かつ急迫の危険に陥つた場合に遭難信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）","二　緊急通信（船舶又は航空機が重大かつ急迫の危険に陥るおそれがある場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）","三　安全通信（船舶又は航空機の航行に対する重大な危険を予防するために安全信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。以下同じ。）","四　非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。）","五　放送の受信","六　その他総務省令で定める通信"]}],"section":"H05-1","fixed":false},{"id":"H05-02","subject":"法規","chapter":"H05","text":"\u003cp>電波法に規定する「非常通信」の説明として、正しいものはどれか。\u003c/p>","choices":["非常の事態が発生し、又は発生するおそれがある場合に、有線通信を利用できないか又は利用することが著しく困難なとき、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信","非常の事態が発生した場合に、有線通信が利用できるかどうかにかかわらず、災害の状況を知らせるために行われる無線通信","船舶又は航空機が重大かつ急迫の危険に陥った場合に、遭難信号を前置して行われる無線通信","非常の事態に備えて、毎日決まった時刻に行われる訓練の無線通信"],"answer":0,"explain":"\u003cp>非常通信は「有線通信を利用することができないか又はこれを利用することが著しく困難であるとき」に行います。船舶や航空機の危険の通信は遭難通信です。\u003c/p>","refs":[{"label":"電波法 第52条第1項第4号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_52-Pr_1-It_4","lines":["無線局は、免許記録に記録されている目的又は通信の相手方若しくは通信事項（特定地上基幹放送局については放送事項）の範囲を超えて運用してはならない。ただし、次に掲げる通信については、この限りでない。","四　非常通信（地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。以下同じ。）"]}],"section":"H05-2","fixed":false},{"id":"H05-03","subject":"法規","chapter":"H05","text":"\u003cp>無線局を運用する場合、無線設備の設置場所、識別信号、電波の型式及び周波数はどのようにしなければならないか（遭難通信を除く）。\u003c/p>","choices":["免許記録に記録されているところによる。","通信の相手方と打ち合わせたところによる。","混信が少なければ、自由に変えてよい。","日本アマチュア無線連盟が定めるところによる。"],"answer":0,"explain":"\u003cp>設置場所、識別信号、電波の型式、周波数は、免許記録に記録されているところによらなければなりません。\u003c/p>","refs":[{"label":"電波法 第53条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_53","lines":["第五十三条　無線局を運用する場合においては、無線設備の設置場所、識別信号、電波の型式及び周波数は、その無線局の免許記録又は登録記録（次条第一号及び第百三条の二第四項第二号において「免許記録等」という。）に記録されているところによらなければならない。ただし、遭難通信については、この限りでない。"]}],"section":"H05-1","fixed":false},{"id":"H05-04","subject":"法規","chapter":"H05","text":"\u003cp>無線局を運用する場合の空中線電力について、電波法に規定されているものはどれか（遭難通信を除く）。\u003c/p>","choices":["免許記録に記録されているものの範囲内で、通信を行うため必要最小のものであること。","免許記録に記録されているものの範囲内で、できる限り大きいものであること。","相手局が受信しやすいよう、常に最大のものであること。","免許記録に記録されているものの 2 倍以内であること。"],"answer":0,"explain":"\u003cp>空中線電力は、免許記録の範囲内で、通信を行うため必要最小のものにします。強すぎる電力は、ほかの無線局への混信のもとになります。\u003c/p>","refs":[{"label":"電波法 第54条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_54","lines":["第五十四条　無線局を運用する場合においては、空中線電力は、次の各号の定めるところによらなければならない。ただし、遭難通信については、この限りでない。","一　免許記録等に記録されているものの範囲内であること。","二　通信を行うため必要最小のものであること。"]}],"section":"H05-1","fixed":false},{"id":"H05-05","subject":"法規","chapter":"H05","text":"\u003cp>無線局の運用について、電波法第 55 条に規定されているものはどれか。\u003c/p>","choices":["免許記録に記録されている運用許容時間内でなければ、運用してはならない（非常通信などの場合を除く）。","1 日に 8 時間を超えて運用してはならない。","夜間は運用してはならない。","運用許容時間は、免許人が自由に決めてよい。"],"answer":0,"explain":"\u003cp>運用許容時間は、運用することができる時間です。その時間内でなければ運用できません。ただし、第 52 条の例外の通信などは除きます。\u003c/p>","refs":[{"label":"電波法 第55条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_55","lines":["第五十五条　無線局は、免許記録に記録されている運用許容時間内でなければ、運用してはならない。ただし、第五十二条各号に掲げる通信を行う場合及び総務省令で定める場合は、この限りでない。"]}],"section":"H05-1","fixed":false},{"id":"H05-06","subject":"法規","chapter":"H05","text":"\u003cp>混信等の防止について、電波法に規定されているものはどれか。\u003c/p>","choices":["無線局は、他の無線局等にその運用を阻害するような混信その他の妨害を与えないように運用しなければならない。","混信を与えても、相手局の同意があればかまわない。","混信を与えないよう、空中線電力はできる限り大きくしなければならない。","混信の防止は、送信機の製造者が責任を負う。"],"answer":0,"explain":"\u003cp>ほかの無線局などに、運用を阻害するような混信その他の妨害を与えないように運用します。遭難通信、緊急通信、安全通信、非常通信は例外です。\u003c/p>","refs":[{"label":"電波法 第56条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_56-Pr_1","lines":["無線局は、他の無線局又は電波天文業務（宇宙から発する電波の受信を基礎とする天文学のための当該電波の受信の業務をいう。）の用に供する受信設備その他の総務省令で定める受信設備（無線局のものを除く。）で総務大臣が指定するものにその運用を阻害するような混信その他の妨害を与えないように運用しなければならない。但し、第五十二条第一号から第四号までに掲げる通信については、この限りでない。"]}],"section":"H05-3","fixed":false},{"id":"H05-07","subject":"法規","chapter":"H05","text":"\u003cp>無線局が、なるべく擬似空中線回路を使用しなければならないのはどのときか。\u003c/p>","choices":["無線設備の機器の試験又は調整を行うために運用するとき。","非常通信を行うとき。","他の無線局と交信するとき。","移動して運用するとき。"],"answer":0,"explain":"\u003cp>試験や調整のときは、なるべく擬似空中線回路を使って、電波を空間に出さないようにします。実験等無線局を運用するときも同じです。\u003c/p>","refs":[{"label":"電波法 第57条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_57","lines":["（擬似空中線回路の使用）","第五十七条　無線局は、次に掲げる場合には、なるべく擬似空中線回路を使用しなければならない。","一　無線設備の機器の試験又は調整を行うために運用するとき。","二　実験等無線局を運用するとき。"]}],"section":"H05-3","fixed":false},{"id":"H05-08","subject":"法規","chapter":"H05","text":"\u003cp>アマチュア無線局の行う通信について、電波法に規定されているものはどれか。\u003c/p>","choices":["暗語を使用してはならない。","暗語は、相手局の同意があれば使用できる。","暗語は、非常通信に限り使用しなければならない。","暗語は、外国の無線局と通信するときに限り使用できる。"],"answer":0,"explain":"\u003cp>アマチュア無線局の通信には、暗語を使用してはいけません。だれが聞いても分かる言葉で通信します。\u003c/p>","refs":[{"label":"電波法 第58条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_58","lines":["（アマチュア無線局の通信）","第五十八条　アマチュア無線局の行う通信には、暗語を使用してはならない。"]}],"section":"H05-4","fixed":false},{"id":"H05-09","subject":"法規","chapter":"H05","text":"\u003cp>無線通信の秘密の保護について、電波法に規定されているものはどれか（法律に別段の定めがある場合を除く）。\u003c/p>","choices":["何人も、特定の相手方に対して行われる無線通信を傍受して、その存在若しくは内容を漏らし、又はこれを窃用してはならない。","無線従事者だけは、傍受した無線通信の内容を漏らしてはならない。","受信のみを行う者は、傍受した無線通信の内容を自由に漏らしてよい。","傍受した無線通信の内容は、1 年を過ぎれば漏らしてよい。"],"answer":0,"explain":"\u003cp>「何人も」なので、無線従事者だけでなく、受信だけの人も含めてすべての人に当てはまります。\u003c/p>","refs":[{"label":"電波法 第59条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_5-Se_1-At_59","lines":["（秘密の保護）","第五十九条　何人も法律に別段の定めがある場合を除くほか、特定の相手方に対して行われる無線通信（電気通信事業法第四条第一項又は第百六十四条第三項の通信であるものを除く。第百九条並びに第百九条の二第二項及び第三項において同じ。）を傍受してその存在若しくは内容を漏らし、又はこれを窃用してはならない。"]}],"section":"H05-4","fixed":false},{"id":"H05-10","subject":"法規","chapter":"H05","text":"\u003cp>アマチュア局（人工衛星等のアマチュア局を除く）に備え付けておかなければならない書類として、電波法施行規則に規定されているものはどれか。\u003c/p>","choices":["免許記録","無線従事者国家試験の合格証","無線設備の取扱説明書","無線局の免許の申請書の写し"],"answer":0,"explain":"\u003cp>アマチュア局に備え付ける書類は、免許記録です。申請書の添付書類の写しが要るのは、人工衛星等のアマチュア局です。\u003c/p>","refs":[{"label":"電波法施行規則 第38条第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_38-Pr_1","lines":["法第六十条の規定により無線局に備え付けておかなければならない書類は、次の表の上欄の無線局につき、それぞれ同表の下欄に掲げるとおりとする。","無線局｜業務書類","五　アマチュア局｜（一）　免許記録（二）　無線局の免許の申請書の添付書類の写し（再免許を受けた無線局にあつては、最近の再免許の申請に係るもの）（１）（人工衛星に開設するアマチュア局及び人工衛星に開設するアマチュア局の無線設備を遠隔操作するアマチュア局（以下この項において「人工衛星等のアマチュア局」という。）の場合に限る。）（三）　一の項の（三）に掲げる書類（１）（人工衛星等のアマチュア局の場合に限る。）"]}],"section":"H05-5","fixed":false},{"id":"H05-11","subject":"法規","chapter":"H05","text":"\u003cp>個人が開設する移動するアマチュア局の免許記録の備付けの方法として、電波法施行規則で認められているものはどれか。\u003c/p>","choices":["免許記録に係る免許事項証明書を、免許人が携帯する方法","免許の番号を、無線機の本体に書いておく方法","運用するたびに、総合通信局に電話で確かめる方法","呼出符号を記録した名刺を携帯する方法"],"answer":0,"explain":"\u003cp>免許人が携帯する機器に免許記録を表示させる方法、免許記録の写しや免許事項証明書を携帯する方法などが認められています。\u003c/p>","refs":[{"label":"電波法施行規則 第38条第4項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_38-Pr_4","lines":["個人が開設する移動するアマチュア局にあつては、前項の規定による免許記録の備付けは、次に掲げるいずれかの方法により、免許記録の備付けとすることができる。ただし、免許記録の写しについては、総務大臣が定める方法により電子情報処理組織を使用して作成するものであつて、当該免許記録に記録されている事項と当該免許記録の写しに記録又は記載がされている事項が変わらないものに限る。","一　免許記録を、免許人が携帯する電子計算機その他の機器（当該免許記録の一覧性を確保して表示できる大きさのものであつて、当該免許記録を当該免許記録に係る免許事項証明書の様式と同等程度に大きく、かつ、見やすく表示できるものに限る。）に必要に応じ直ちに表示させる方法","二　電磁的記録による免許記録の写しを、免許人が携帯する電子計算機その他の機器（当該免許記録の一覧性を確保して表示できる大きさのものであつて、当該免許記録を当該免許記録に係る免許事項証明書の様式と同等程度に大きく、かつ、見やすく表示できるものに限る。）に必要に応じ直ちに表示させる方法","三　書面等による免許記録の写し（当該免許記録に係る免許事項証明書の様式と同等程度の大きさであつて、かつ、見やすいものに限る。）を、免許人が携帯する方法","四　当該免許記録に係る免許事項証明書を、免許人が携帯する方法"]}],"section":"H05-5","fixed":false},{"id":"H05-12","subject":"法規","chapter":"H05","text":"\u003cp>無線局運用規則に規定する「無線通信の原則」に当たらないものはどれか。\u003c/p>","choices":["無線通信に使用する用語は、できる限り詳しく丁寧でなければならない。","必要のない無線通信は、これを行ってはならない。","無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。","無線通信は正確に行うものとし、通信上の誤りを知ったときは、直ちに訂正しなければならない。"],"answer":0,"explain":"\u003cp>用語は「できる限り簡潔でなければならない」とされています。「詳しく丁寧」ではありません。\u003c/p>","refs":[{"label":"無線局運用規則 第10条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_10","lines":["（無線通信の原則）","第十条　必要のない無線通信は、これを行なつてはならない。","２　無線通信に使用する用語は、できる限り簡潔でなければならない。","３　無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。","４　無線通信は、正確に行うものとし、通信上の誤りを知つたときは、直ちに訂正しなければならない。"]}],"section":"H05-6","fixed":false},{"id":"H05-13","subject":"法規","chapter":"H05","text":"\u003cp>無線通信を行うときに、無線局運用規則でその出所を明らかにするために付けなければならないとされているものはどれか。\u003c/p>","choices":["自局の識別信号","運用している場所の住所","免許人の氏名","無線設備の型式"],"answer":0,"explain":"\u003cp>無線通信を行うときは、自局の識別信号（呼出符号など）を付けて、どこの局の通信かを明らかにします。\u003c/p>","refs":[{"label":"無線局運用規則 第10条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_10-Pr_3","lines":["無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。"]}],"section":"H05-6","fixed":false},{"id":"H06-01","subject":"法規","chapter":"H06","text":"\u003cp>無線電話による通信で、無線電信の略符号「DE」に相当する略語はどれか。\u003c/p>","choices":["こちらは","どうぞ","各局","了解"],"answer":0,"explain":"\u003cp>「DE」は「こちらは」です。「どうぞ」は K、「各局」は CQ、「了解」は R に相当します。\u003c/p>","refs":[{"label":"無線局運用規則 第14条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。"]}],"section":"H06-1","fixed":false},{"id":"H06-02","subject":"法規","chapter":"H06","text":"\u003cp>無線電話による通信で、無線電信の略符号「K」に相当する略語はどれか。\u003c/p>","choices":["どうぞ","こちらは","さようなら","お待ちください"],"answer":0,"explain":"\u003cp>「K」は「どうぞ」です。送信を終えて、相手の送信を待つときに使います。\u003c/p>","refs":[{"label":"無線局運用規則 第14条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。"]}],"section":"H06-1","fixed":false},{"id":"H06-03","subject":"法規","chapter":"H06","text":"\u003cp>無線電話による通信で、相手を決めずに各局を呼び出すときに使う略語で、無線電信の「CQ」に相当するものはどれか。\u003c/p>","choices":["各局","非常","こちらは","誰かこちらを呼びましたか"],"answer":0,"explain":"\u003cp>「CQ」は「各局」です。「誰かこちらを呼びましたか」は QRZ? に相当します。\u003c/p>","refs":[{"label":"無線局運用規則 第14条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。"]}],"section":"H06-1","fixed":false},{"id":"H06-04","subject":"法規","chapter":"H06","text":"\u003cp>無線電話で試験電波を発射するときに連続して送る略語で、無線電信の「VVV」に相当するものはどれか。\u003c/p>","choices":["本日は晴天なり","ただいま試験中","反復","了解"],"answer":0,"explain":"\u003cp>「VVV」は「本日は晴天なり」です。「ただいま試験中」は EX に相当し、試験電波の初めに 3 回送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第14条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["無線電話による通信（以下「無線電話通信」という。）の業務用語には、別表第四号に定める略語を使用するものとする。"]}],"section":"H06-1","fixed":false},{"id":"H06-05","subject":"法規","chapter":"H06","text":"\u003cp>無線局が相手局を呼び出そうとするとき、電波を発射する前にしなければならないこととして、正しいものはどれか。\u003c/p>","choices":["受信機を最良の感度に調整し、自局の発射しようとする電波の周波数その他必要と認める周波数によって聴守し、他の通信に混信を与えないことを確かめる。","送信機の出力を最大にして、相手局に確実に届くことを確かめる。","試験電波を 1 分間発射して、送信機の調子を確かめる。","総合通信局に、呼出しを行うことを届け出る。"],"answer":0,"explain":"\u003cp>電波を出す前に聴守して、ほかの通信に混信を与えないことを確かめます。混信を与えるおそれがあるときは、その通信が終わるまで呼び出しません。\u003c/p>","refs":[{"label":"無線局運用規則 第19条の2第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_19_2-Pr_1","lines":["無線局は、相手局を呼び出そうとするときは、電波を発射する前に、受信機を最良の感度に調整し、自局の発射しようとする電波の周波数その他必要と認める周波数によつて聴守し、他の通信に混信を与えないことを確かめなければならない。ただし、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行なう場合並びに海上移動業務以外の業務において他の通信に混信を与えないことが確実である電波により通信を行なう場合は、この限りでない。"]}],"section":"H06-2","fixed":false},{"id":"H06-06","subject":"法規","chapter":"H06","text":"\u003cp>アマチュア局が無線電話で呼出しを行うとき、順次送信する事項として、正しいものはどれか。\u003c/p>","choices":["相手局の呼出符号 3 回以下、こちらは 1 回、自局の呼出符号 3 回以下","相手局の呼出符号 3 回以下、こちらは 1 回、自局の呼出符号 1 回","自局の呼出符号 3 回以下、こちらは 1 回、相手局の呼出符号 3 回以下","相手局の呼出符号 1 回、こちらは 3 回、自局の呼出符号 1 回"],"answer":0,"explain":"\u003cp>呼出しは「相手局 3 回以下・こちらは 1 回・自局 3 回以下」です。自局の呼出符号を 1 回にするのは応答のときです。\u003c/p>","refs":[{"label":"無線局運用規則 第20条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_20-Pr_1","lines":["呼出しは、順次送信する次に掲げる事項（以下「呼出事項」という。）によつて行うものとする。","一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）","二　ＤＥ　一回","三　自局の呼出符号　三回以下（海上移動業務にあつては二回以下）"]}],"section":"H06-3","fixed":false},{"id":"H06-07","subject":"法規","chapter":"H06","text":"\u003cp>アマチュア局が無線電話で応答を行うとき、順次送信する事項として、正しいものはどれか。\u003c/p>","choices":["相手局の呼出符号 3 回以下、こちらは 1 回、自局の呼出符号 1 回","相手局の呼出符号 3 回以下、こちらは 1 回、自局の呼出符号 3 回以下","相手局の呼出符号 1 回、こちらは 1 回、自局の呼出符号 3 回以下","自局の呼出符号 1 回、こちらは 1 回、相手局の呼出符号 3 回以下"],"answer":0,"explain":"\u003cp>応答は「相手局 3 回以下・こちらは 1 回・自局 1 回」です。\u003c/p>","refs":[{"label":"無線局運用規則 第23条第2項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_2","lines":["前項の規定による応答は、順次送信する次に掲げる事項（以下「応答事項」という。）によつて行うものとする。","一　相手局の呼出符号　三回以下（海上移動業務にあつては二回以下）","二　ＤＥ　一回","三　自局の呼出符号　一回"]}],"section":"H06-3","fixed":false},{"id":"H06-08","subject":"法規","chapter":"H06","text":"\u003cp>応答の際、直ちに通報を受信することができない事由があるときに送信するものとして、正しいものはどれか。\u003c/p>","choices":["「どうぞ」の代わりに、「お待ちください」と分で表したおよその待つべき時間","「どうぞ」の代わりに、「さようなら」","「どうぞ」のあとに、「反復」","何も送信せずに、相手局が待つのにまかせる"],"answer":0,"explain":"\u003cp>すぐに受信できないときは「お待ちください」と、待ってほしい時間（分）を送ります。10 分以上のときは、理由も簡単に送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第23条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_23-Pr_3","lines":["前項の応答に際して直ちに通報を受信しようとするときは、応答事項の次に「Ｋ」を送信するものとする。但し、直ちに通報を受信することができない事由があるときは、「Ｋ」の代りに「ＡＳ（上に線）」及び分で表わす概略の待つべき時間を送信するものとする。概略の待つべき時間が十分以上のときは、その理由を簡単に送信しなければならない。"]}],"section":"H06-3","fixed":false},{"id":"H06-09","subject":"法規","chapter":"H06","text":"\u003cp>アマチュア局が無線電話で一括呼出し（各局あての呼出し）を行うとき、順次送信する事項として、正しいものはどれか。\u003c/p>","choices":["各局 3 回、こちらは 1 回、自局の呼出符号 3 回以下、どうぞ 1 回","各局 1 回、こちらは 3 回、自局の呼出符号 1 回、どうぞ 1 回","各局 3 回、こちらは 1 回、自局の呼出符号 1 回、さようなら 1 回","自局の呼出符号 3 回以下、こちらは 1 回、各局 3 回、どうぞ 1 回"],"answer":0,"explain":"\u003cp>CQ（各局）3 回、こちらは 1 回、自局の呼出符号 3 回以下、どうぞ（K）1 回です。\u003c/p>","refs":[{"label":"無線局運用規則 第127条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_1-At_127-Pr_1","lines":["免許記録に記録されている通信の相手方である無線局を一括して呼び出そうとするときは、左の事項を順次送信するものとする。","一　ＣＱ　三回","二　ＤＥ　一回","三　自局の呼出符号　三回以下","四　Ｋ　一回"]}],"section":"H06-4","fixed":false},{"id":"H06-10","subject":"法規","chapter":"H06","text":"\u003cp>自局の呼出しが、他の既に行われている通信に混信を与えている旨の通知を受けたとき、どうしなければならないか。\u003c/p>","choices":["直ちにその呼出しを中止する。","呼出しを 3 回くり返してから中止する。","空中線電力を上げて、呼出しを続ける。","相手局が応答するまで、呼出しを続ける。"],"answer":0,"explain":"\u003cp>直ちに中止します。無線設備の機器の試験や調整のための電波の発射も同じです。\u003c/p>","refs":[{"label":"無線局運用規則 第22条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_22-Pr_1","lines":["無線局は、自局の呼出しが他の既に行われている通信に混信を与える旨の通知を受けたときは、直ちにその呼出しを中止しなければならない。無線設備の機器の試験又は調整のための電波の発射についても同様とする。"]}],"section":"H06-5","fixed":false},{"id":"H06-11","subject":"法規","chapter":"H06","text":"\u003cp>自局に対する呼出しであることが確実でない呼出しを受信したとき、どうしなければならないか。\u003c/p>","choices":["その呼出しが反復され、かつ、自局に対する呼出しであることが確実に判明するまで応答してはならない。","直ちに応答して、自局に対する呼出しかどうかを確かめる。","「さようなら」を送信して、通信を終わる。","1 分間待ってから、必ず応答する。"],"answer":0,"explain":"\u003cp>自局への呼出しだと確実に分かるまで、応答しません。\u003c/p>","refs":[{"label":"無線局運用規則 第26条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_26-Pr_1","lines":["無線局は、自局に対する呼出しであることが確実でない呼出しを受信したときは、その呼出しが反覆され、且つ、自局に対する呼出しであることが確実に判明するまで応答してはならない。"]}],"section":"H06-5","fixed":false},{"id":"H06-12","subject":"法規","chapter":"H06","text":"\u003cp>自局に対する呼出しを受信したが、呼出局の呼出符号が不確実であるときの応答として、正しいものはどれか。\u003c/p>","choices":["相手局の呼出符号の代わりに「誰かこちらを呼びましたか」を使って、直ちに応答する。","呼出局の呼出符号が分かるまで、応答しない。","推測した呼出符号を使って、直ちに応答する。","「反復」を 3 回送信する。"],"answer":0,"explain":"\u003cp>自局への呼出しなのは確かで、相手の呼出符号だけが分からないときは、「誰かこちらを呼びましたか」（QRZ?）を使って直ちに応答します。\u003c/p>","refs":[{"label":"無線局運用規則 第26条第2項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_26-Pr_2","lines":["自局に対する呼出しを受信した場合において、呼出局の呼出符号が不確実であるときは、応答事項のうち相手局の呼出符号の代りに「ＱＲＺ？」を使用して、直ちに応答しなければならない。"]}],"section":"H06-5","fixed":false},{"id":"H06-13","subject":"法規","chapter":"H06","text":"\u003cp>無線電話で試験電波を発射するときの手順として、正しいものはどれか。\u003c/p>","choices":["聴守して混信を与えないことを確かめ、「ただいま試験中」3 回、「こちらは」1 回、自局の呼出符号 3 回を送信し、さらに 1 分間聴守する。","聴守せずに、「本日は晴天なり」を 1 分間連続して送信する。","「ただいま試験中」を 1 回送信したら、すぐに「本日は晴天なり」を連続して送信する。","自局の呼出符号を 10 回送信してから、1 分間聴守する。"],"answer":0,"explain":"\u003cp>聴守 →「ただいま試験中」3 回・「こちらは」1 回・自局の呼出符号 3 回 → 1 分間聴守 → 停止の請求がなければ「本日は晴天なり」の連続と自局の呼出符号 1 回、の順です。\u003c/p>","refs":[{"label":"無線局運用規則 第39条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_1","lines":["無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。","一　ＥＸ　三回","二　ＤＥ　一回","三　自局の呼出符号　三回"]}],"section":"H06-6","fixed":false},{"id":"H06-14","subject":"法規","chapter":"H06","text":"\u003cp>試験電波の発射で、「本日は晴天なり」の連続及び自局の呼出符号の送信は、原則として何秒間を超えてはならないか。\u003c/p>","choices":["10 秒間","5 秒間","30 秒間","60 秒間"],"answer":0,"explain":"\u003cp>原則 10 秒間を超えてはいけません。海上移動業務以外の業務の無線局は、必要があるときは 10 秒間を超えて送信できます。\u003c/p>","refs":[{"label":"無線局運用規則 第39条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_1","lines":["無線局は、無線機器の試験又は調整のため電波の発射を必要とするときは、発射する前に自局の発射しようとする電波の周波数及びその他必要と認める周波数によつて聴守し、他の無線局の通信に混信を与えないことを確かめた後、次の符号を順次送信し、更に一分間聴守を行い、他の無線局から停止の請求がない場合に限り、「ＶＶＶ」の連続及び自局の呼出符号一回を送信しなければならない。この場合において、「ＶＶＶ」の連続及び自局の呼出符号の送信は、十秒間をこえてはならない。","一　ＥＸ　三回","二　ＤＥ　一回","三　自局の呼出符号　三回"]},{"label":"無線局運用規則 第39条第3項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_39-Pr_3","lines":["第一項後段の規定にかかわらず、海上移動業務以外の業務の無線局にあつては、必要があるときは、十秒間をこえて「ＶＶＶ」の連続及び自局の呼出符号の送信をすることができる。"]}],"section":"H06-6","fixed":false},{"id":"H06-15","subject":"法規","chapter":"H06","text":"\u003cp>アマチュア局が長時間継続して通報を送信するとき、自局の呼出符号を送信する間隔の標準はどれか。\u003c/p>","choices":["10 分ごと","5 分ごと","30 分ごと","60 分ごと"],"answer":0,"explain":"\u003cp>一般の無線局は 30 分ごと、アマチュア局は 10 分ごとを標準として、「こちらは」と自局の呼出符号を送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第30条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_30","lines":["（長時間の送信）","第三十条　無線局は、長時間継続して通報を送信するときは、三十分（アマチュア局にあつては十分）ごとを標準として適当に「ＤＥ」及び自局の呼出符号を送信しなければならない。"]}],"section":"H06-7","fixed":false},{"id":"H06-16","subject":"法規","chapter":"H06","text":"\u003cp>空中線電力 50 ワット以下の無線設備を使用し、確実に連絡の設定ができると認められるときに、呼出しの「こちらは」と自局の呼出符号の送信を省略した無線局が、しなければならないことはどれか。\u003c/p>","choices":["その通信中に、少なくとも 1 回以上自局の呼出符号を送信する。","通信の終わりに、相手局の呼出符号を 3 回送信する。","省略したことを、総務大臣に届け出る。","次の呼出しでは、自局の呼出符号を 6 回送信する。"],"answer":0,"explain":"\u003cp>呼出しで自局の呼出符号を省略したときは、その通信中に少なくとも 1 回以上、自局の呼出符号を送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第126条の2第2項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_1-At_126_2-Pr_2","lines":["前項の規定により第二十条第一項第二号及び第三号に掲げる事項の送信を省略した無線局は、その通信中少なくとも一回以上自局の呼出符号を送信しなければならない。"]}],"section":"H06-7","fixed":false},{"id":"H06-17","subject":"法規","chapter":"H06","text":"\u003cp>呼出しを反復しても応答がないとき、呼出しを再開するまでにおく間隔として、無線局運用規則の規定（海上移動業務の規定で、ほかの業務もできる限りこれに準じる）に合っているものはどれか。\u003c/p>","choices":["少なくとも 3 分間","少なくとも 10 秒間","少なくとも 30 秒間","少なくとも 1 時間"],"answer":0,"explain":"\u003cp>呼出しは 1 分間以上の間隔をおいて 2 回反復でき、それでも応答がないときは、少なくとも 3 分間の間隔をおいてから再開します。\u003c/p>","refs":[{"label":"無線局運用規則 第21条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_2-At_21","lines":["（呼出しの反復及び再開）","第二十一条　海上移動業務における呼出しは、一分間以上の間隔をおいて二回反復することができる。呼出しを反復しても応答がないときは、少なくとも三分間の間隔をおかなければ、呼出しを再開してはならない。","２　海上移動業務における呼出し以外の呼出しの反復及び再開は、できる限り前項の規定に準じて行うものとする。"]}],"section":"H06-5","fixed":false},{"id":"H06-18","subject":"法規","chapter":"H06","text":"\u003cp>無線電話で語を 1 字ずつ区切って送るとき、なるべく使用するものとされている通話表で、和文の「ア」を送る言い方はどれか。\u003c/p>","choices":["朝日のア","愛知のア","青空のア","アメリカのア"],"answer":0,"explain":"\u003cp>和文通話表では「朝日のア」「いろはのイ」「上野のウ」…と送ります。\u003c/p>","refs":[{"label":"無線局運用規則 第14条第4項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_2-Se_1-At_14-Pr_4","lines":["海上移動業務及び航空移動業務以外の業務の無線電話通信においても、語辞を一字ずつ区切つて送信する場合は、なるべく前項の通話表を使用するものとする。"]}],"section":"H06-1","fixed":false},{"id":"H07-01","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア局の発射の制限について、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["発射の占有する周波数帯幅に含まれているいかなるエネルギーの発射も、その局が動作することを許された周波数帯から逸脱してはならない。","発射の占有する周波数帯幅の半分までは、許された周波数帯から逸脱してもよい。","許された周波数帯の中心の周波数だけを使わなければならない。","占有周波数帯幅は、できる限り広くしなければならない。"],"answer":0,"explain":"\u003cp>電波の幅の端まで含めて、すべてが許された周波数帯の中に入っていなければなりません。バンドの端ぎりぎりの周波数では注意が必要です。\u003c/p>","refs":[{"label":"無線局運用規則 第257条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_257","lines":["（発射の制限等）","第二百五十七条　アマチュア局においては、その発射の占有する周波数帯幅に含まれているいかなるエネルギーの発射も、その局が動作することを許された周波数帯から逸脱してはならない。"]}],"section":"H07-1","fixed":false},{"id":"H07-02","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア局が、自局の発射する電波が放送の受信に支障を与えていることを知ったとき、どうしなければならないか（遭難通信などを行う場合を除く）。\u003c/p>","choices":["すみやかに、当該周波数による電波の発射を中止する。","空中線電力を上げて、通信を続ける。","通信が終わるまで続け、その後に総務大臣に報告する。","放送局に連絡して、放送の周波数を変えてもらう。"],"answer":0,"explain":"\u003cp>ほかの無線局の運用や放送の受信に支障を与え、又は与えるおそれがあるときは、すみやかにその周波数による電波の発射を中止します。\u003c/p>","refs":[{"label":"無線局運用規則 第258条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_258","lines":["第二百五十八条　アマチュア局は、自局の発射する電波が他の無線局の運用又は放送の受信に支障を与え、若しくは与える虞があるときは、すみやかに当該周波数による電波の発射を中止しなければならない。但し、遭難通信、緊急通信、安全通信及び法第七十四条第一項に規定する通信を行う場合は、この限りでない。"]}],"section":"H07-1","fixed":false},{"id":"H07-03","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア局が送信する通報について、無線局運用規則に規定されているものはどれか（非常の事態の場合などを除く）。\u003c/p>","choices":["他人の依頼によるものであってはならない。","他人の依頼によるものでも、無料であれば送信してよい。","家族の依頼によるものに限り、送信してよい。","他人の依頼によるものは、送信前に総務大臣に届け出る。"],"answer":0,"explain":"\u003cp>アマチュア局の通報は、他人の依頼によるものであってはいけません。アマチュア業務は、個人的な興味による通信だからです。\u003c/p>","refs":[{"label":"無線局運用規則 第259条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_259","lines":["（禁止する通報）","第二百五十九条　アマチュア局の送信する通報は、他人の依頼によるものであつてはならない。ただし、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合における、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通報及び人工衛星に開設するアマチュア局の送信する通報は、この限りでない。"]}],"section":"H07-1","fixed":false},{"id":"H07-04","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア局が、他人の依頼による通報を送信することができる場合として、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["地震などの非常の事態が発生し、又は発生するおそれがある場合に、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通報を送信するとき","依頼した人が、アマチュア無線技士の資格をもっているとき","通報の内容が、商品の宣伝であるとき","依頼した人が、通報の料金を支払うとき"],"answer":0,"explain":"\u003cp>非常の事態での人命の救助などに必要な通報は、他人の依頼によるものでも送信できます（人工衛星に開設するアマチュア局の通報も例外です）。\u003c/p>","refs":[{"label":"無線局運用規則 第259条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_259","lines":["（禁止する通報）","第二百五十九条　アマチュア局の送信する通報は、他人の依頼によるものであつてはならない。ただし、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合における、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通報及び人工衛星に開設するアマチュア局の送信する通報は、この限りでない。"]}],"section":"H07-1","fixed":false},{"id":"H07-05","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア局の無線設備の操作を行う者について、無線局運用規則に規定されているものはどれか。\u003c/p>","choices":["免許人（免許人が社団である場合は、その構成員）以外の者であってはならない。","無線従事者であれば、だれでも操作してよい。","免許人の家族であれば、資格がなくても操作してよい。","免許人が認めれば、だれが操作してもよい。"],"answer":0,"explain":"\u003cp>アマチュア局の無線設備を操作するのは、その局の免許人（社団局はその構成員）です。\u003c/p>","refs":[{"label":"無線局運用規則 第260条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_260","lines":["（無線設備の操作）","第二百六十条　アマチュア局の無線設備の操作を行う者は、免許人（免許人が社団である場合は、その構成員）以外の者であつてはならない。"]}],"section":"H07-1","fixed":false},{"id":"H07-06","subject":"法規","chapter":"H07","text":"\u003cp>アマチュア業務に使用する電波の型式及び周波数の使用区別は、どのように定められているか。\u003c/p>","choices":["総務大臣が別に告示するところによる。","免許人が自由に決める。","無線機の製造者が決める。","毎年、国家試験の問題で示される。"],"answer":0,"explain":"\u003cp>使用区別は告示で定められています。JARL のバンドプランは、この告示をもとにまとめたものです。\u003c/p>","refs":[{"label":"無線局運用規則 第258条の2","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_8-At_258_2","lines":["（周波数等の使用区別）","第二百五十八条の二　アマチュア業務に使用する電波の型式及び周波数の使用区別は、別に告示するところによるものとする。"]}],"section":"H07-1","fixed":false},{"id":"H07-07","subject":"法規","chapter":"H07","text":"\u003cp>電波法第 74 条に規定する「非常の場合の無線通信」の説明として、正しいものはどれか。\u003c/p>","choices":["総務大臣が、非常の事態が発生し又は発生するおそれがある場合に、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を無線局に行わせることができる。","免許人が、非常の事態のときに限り、免許なく無線局を開設できる。","非常の事態のときは、すべての無線局が運用を停止しなければならない。","非常の事態のときは、無線従事者の資格がなくても、だれでも無線局を運用できる。"],"answer":0,"explain":"\u003cp>非常の場合の無線通信は、総務大臣が無線局に行わせる通信です。このとき、国は通信に要した実費を弁償します。\u003c/p>","refs":[{"label":"電波法 第74条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_74","lines":["（非常の場合の無線通信）","第七十四条　総務大臣は、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合においては、人命の救助、災害の救援、交通通信の確保又は秩序の維持のために必要な通信を無線局に行わせることができる。","２　総務大臣が前項の規定により無線局に通信を行わせたときは、国は、その通信に要した実費を弁償しなければならない。"]}],"section":"H07-2","fixed":false},{"id":"H07-08","subject":"法規","chapter":"H07","text":"\u003cp>電波法第 74 条第 1 項の規定により、総務大臣が無線局に通信を行わせたときの費用について、正しいものはどれか。\u003c/p>","choices":["国は、その通信に要した実費を弁償しなければならない。","費用はすべて免許人が負担する。","費用は、通信を依頼した人が負担する。","費用は、日本アマチュア無線連盟が負担する。"],"answer":0,"explain":"\u003cp>総務大臣が無線局に通信を行わせたときは、国がその実費を弁償します。\u003c/p>","refs":[{"label":"電波法 第74条第2項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_74-Pr_2","lines":["総務大臣が前項の規定により無線局に通信を行わせたときは、国は、その通信に要した実費を弁償しなければならない。"]}],"section":"H07-2","fixed":false},{"id":"H07-09","subject":"法規","chapter":"H07","text":"\u003cp>電波法第 74 条第 1 項に規定する通信において、無線電話で連絡を設定するための呼出しを行うとき、呼出事項の前に送信するものはどれか。\u003c/p>","choices":["「非常」3 回","「各局」3 回","「緊急」1 回","「ただいま試験中」3 回"],"answer":0,"explain":"\u003cp>呼出事項や応答事項の前に「非常」を 3 回送ります。条文では記号（上に線の付いた OSO）で書かれていて、無線電話ではこれを「非常」と言います（別表第四号）。\u003c/p>","refs":[{"label":"無線局運用規則 第131条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_131","lines":["（前置符号）","第百三十一条　法第七十四条第一項に規定する通信において連絡を設定するための呼出し又は応答は、呼出事項又は応答事項に「〔記号〕」三回を前置して行うものとする。"]}],"section":"H07-2","fixed":false},{"id":"H07-10","subject":"法規","chapter":"H07","text":"\u003cp>「非常」を前置した呼出しを受信した無線局が、応答する場合を除いてしなければならないことはどれか。\u003c/p>","choices":["これに混信を与えるおそれのある電波の発射を停止して、傍受する。","直ちに「非常」を 3 回送信して、ほかの局に知らせる。","自局の通信を続けながら、空中線電力を下げる。","受信機の電源を切る。"],"answer":0,"explain":"\u003cp>応答する場合を除き、混信を与えるおそれのある電波の発射を止めて、その通信を傍受します。\u003c/p>","refs":[{"label":"無線局運用規則 第132条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_132","lines":["（「〔記号〕」を受信した場合の措置）","第百三十二条　「〔記号〕」を前置した呼出しを受信した無線局は、応答する場合を除く外、これに混信を与える虞のある電波の発射を停止して傍受しなければならない。"]}],"section":"H07-2","fixed":false},{"id":"H07-11","subject":"法規","chapter":"H07","text":"\u003cp>電波法第 74 条第 1 項に規定する通信で、通報を送信する優先順位が第 1 位のものはどれか。\u003c/p>","choices":["人命の救助に関する通報","天災の予報に関する通報","電力設備の修理復旧に関する通報","秩序維持のために必要な緊急措置に関する通報"],"answer":0,"explain":"\u003cp>第 1 位は人命の救助に関する通報、第 2 位は天災の予報に関する通報（主要河川の水位に関する通報を含む）、第 3 位は秩序維持のために必要な緊急措置に関する通報です。\u003c/p>","refs":[{"label":"無線局運用規則 第129条第1項","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_129-Pr_1","lines":["法第七十四条第一項に規定する通信における通報の送信の優先順位は、左の通りとする。同順位の内容のものであるときは、受付順又は受信順に従つて送信しなければならない。","一　人命の救助に関する通報","二　天災の予報に関する通報（主要河川の水位に関する通報を含む。）","三　秩序維持のために必要な緊急措置に関する通報","四　遭難者救援に関する通報（日本赤十字社の本社及び支社相互間に発受するものを含む。）","五　電信電話回線の復旧のため緊急を要する通報","六　鉄道線路の復旧、道路の修理、罹災者の輸送、救済物資の緊急輸送等のために必要な通報","七　非常災害地の救援に関し、左の機関相互間に発受する緊急な通報","八　電力設備の修理復旧に関する通報","九　その他の通報"]}],"section":"H07-2","fixed":false},{"id":"H07-12","subject":"法規","chapter":"H07","text":"\u003cp>非常通信の取扱いを開始した後、有線通信の状態が復旧したとき、どうしなければならないか。\u003c/p>","choices":["すみやかに、その取扱いを停止する。","非常の事態が完全に終わるまで、取扱いを続ける。","総務大臣の許可を受けてから、取扱いを停止する。","24 時間は取扱いを続ける。"],"answer":0,"explain":"\u003cp>非常通信は、有線通信が使えないか著しく困難なときの通信です。有線通信が復旧したら、すみやかに停止します。\u003c/p>","refs":[{"label":"無線局運用規則 第136条","url":"https://laws.e-gov.go.jp/law/325M50080000017#Mp-Ch_4-Se_2-At_136","lines":["（取扱の停止）","第百三十六条　非常通信の取扱を開始した後、有線通信の状態が復旧した場合は、すみやかにその取扱を停止しなければならない。"]}],"section":"H07-2","fixed":false},{"id":"H07-13","subject":"法規","chapter":"H07","text":"\u003cp>無線局の免許人が、総務大臣に報告しなければならない場合として、電波法に規定されているものはどれか。\u003c/p>","choices":["非常通信を行ったとき。","一括呼出し（CQ）を行ったとき。","試験電波を発射したとき。","外国のアマチュア局と交信したとき。"],"answer":0,"explain":"\u003cp>遭難通信、緊急通信、安全通信、非常通信を行ったときは、報告します。電波法に違反して運用した無線局を認めたときも報告します。\u003c/p>","refs":[{"label":"電波法 第80条第1項第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_80-Pr_1-It_1","lines":["無線局の免許人等は、次に掲げる場合は、総務省令で定める手続により、総務大臣に報告しなければならない。","一　遭難通信、緊急通信、安全通信又は非常通信を行つたとき（第七十条の七第一項、第七十条の八第一項又は第七十条の九第一項の規定により無線局を運用させた免許人等以外の者が行つたときを含む。）。"]}],"section":"H07-3","fixed":false},{"id":"H08-01","subject":"法規","chapter":"H08","text":"\u003cp>総務大臣は、無線局の発射する電波の質が総務省令で定めるものに適合していないと認めるとき、その無線局に対して何を命ずることができるか。\u003c/p>","choices":["臨時に電波の発射の停止","無線局の免許の取消し","無線従事者の免許の取消し","無線設備の没収"],"answer":0,"explain":"\u003cp>電波の質が適合していないときは、臨時に電波の発射の停止を命じることができます。\u003c/p>","refs":[{"label":"電波法 第72条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_72","lines":["（電波の発射の停止）","第七十二条　総務大臣は、無線局の発射する電波の質が第二十八条の総務省令で定めるものに適合していないと認めるときは、当該無線局に対して臨時に電波の発射の停止を命ずることができる。","２　総務大臣は、前項の命令を受けた無線局からその発射する電波の質が第二十八条の総務省令の定めるものに適合するに至つた旨の申出を受けたときは、その無線局に電波を試験的に発射させなければならない。","３　総務大臣は、前項の規定により発射する電波の質が第二十八条の総務省令で定めるものに適合しているときは、直ちに第一項の停止を解除しなければならない。"]}],"section":"H08-1","fixed":false},{"id":"H08-02","subject":"法規","chapter":"H08","text":"\u003cp>電波の発射の停止を命じられた無線局から、発射する電波の質が適合するに至った旨の申出を受けたとき、総務大臣はどうしなければならないか。\u003c/p>","choices":["その無線局に電波を試験的に発射させる。","その無線局の免許を取り消す。","申出から 3 か月間は、停止を続ける。","申出を受けたら、試験をせずに直ちに停止を解除する。"],"answer":0,"explain":"\u003cp>申出を受けたら、電波を試験的に発射させます。電波の質が適合していれば、直ちに停止を解除します。\u003c/p>","refs":[{"label":"電波法 第72条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_72","lines":["（電波の発射の停止）","第七十二条　総務大臣は、無線局の発射する電波の質が第二十八条の総務省令で定めるものに適合していないと認めるときは、当該無線局に対して臨時に電波の発射の停止を命ずることができる。","２　総務大臣は、前項の命令を受けた無線局からその発射する電波の質が第二十八条の総務省令の定めるものに適合するに至つた旨の申出を受けたときは、その無線局に電波を試験的に発射させなければならない。","３　総務大臣は、前項の規定により発射する電波の質が第二十八条の総務省令で定めるものに適合しているときは、直ちに第一項の停止を解除しなければならない。"]}],"section":"H08-1","fixed":false},{"id":"H08-03","subject":"法規","chapter":"H08","text":"\u003cp>総務大臣が、無線設備が技術基準に適合していないと認めるとき、その無線設備を使用する無線局の免許人に対して命ずることができるものはどれか。\u003c/p>","choices":["技術基準に適合するように、無線設備の修理その他の必要な措置をとること","無線設備を製造者に返すこと","無線従事者の資格を取り直すこと","新しい無線機を購入すること"],"answer":0,"explain":"\u003cp>技術基準適合命令といい、修理その他の必要な措置をとるよう命じることができます。\u003c/p>","refs":[{"label":"電波法 第71条の5","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_71_5","lines":["（技術基準適合命令）","第七十一条の五　総務大臣は、無線設備が第三章に定める技術基準に適合していないと認めるときは、当該無線設備を使用する無線局の免許人等に対し、その技術基準に適合するように当該無線設備の修理その他の必要な措置をとるべきことを命ずることができる。"]}],"section":"H08-1","fixed":false},{"id":"H08-04","subject":"法規","chapter":"H08","text":"\u003cp>アマチュア局の定期検査について、正しいものはどれか。\u003c/p>","choices":["アマチュア局は、定期検査を行わない無線局とされている。","アマチュア局は、5 年ごとに定期検査を受けなければならない。","アマチュア局は、毎年定期検査を受けなければならない。","定期検査は、空中線電力 10 ワット以下のアマチュア局だけが受ける。"],"answer":0,"explain":"\u003cp>電波法施行規則で、アマチュア局は定期検査を行わない無線局とされています。ただし、電波の発射の停止を命じられたときなどは、臨時検査を受けることがあります。\u003c/p>","refs":[{"label":"電波法施行規則 第41条の2の6第1項第22号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_41_2_6-Pr_1-It_22","lines":["法第七十三条第一項の総務省令で定める無線局は、次のとおりとする。","二十二　アマチュア局"]}],"section":"H08-2","fixed":false},{"id":"H08-05","subject":"法規","chapter":"H08","text":"\u003cp>総務大臣が無線局の臨時検査を行うことがある場合として、電波法に規定されているものはどれか。\u003c/p>","choices":["電波の発射の停止を命じたとき","免許人が引っ越しをしたとき","無線局が一括呼出しを行ったとき","免許人が無線従事者の上の級の資格を取ったとき"],"answer":0,"explain":"\u003cp>電波の発射の停止を命じたとき、その解除の申出があったとき、技術基準適合命令を出したときなど、特に必要があるときに、職員を派遣して検査させます。\u003c/p>","refs":[{"label":"電波法 第73条第5項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_73-Pr_5","lines":["総務大臣は、第七十一条の五の無線設備の修理その他の必要な措置をとるべきことを命じたとき、前条第一項の電波の発射の停止を命じたとき、同条第二項の申出があつたとき、無線局のある船舶又は航空機が外国へ出港しようとするとき、その他この法律の施行を確保するため特に必要があるときは、その職員を無線局に派遣し、その無線設備等を検査させることができる。"]}],"section":"H08-2","fixed":false},{"id":"H08-06","subject":"法規","chapter":"H08","text":"\u003cp>免許人が電波法に違反したとき、総務大臣が命ずることができる無線局の運用の停止の期間はどれか。\u003c/p>","choices":["3 か月以内の期間","1 か月以内の期間","6 か月以内の期間","1 年以内の期間"],"answer":0,"explain":"\u003cp>3 か月以内の期間を定めて運用の停止を命じ、又は期間を定めて運用許容時間、周波数、空中線電力を制限できます。\u003c/p>","refs":[{"label":"電波法 第76条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_76-Pr_1","lines":["総務大臣は、免許人等がこの法律、放送法若しくはこれらの法律に基づく命令又はこれらに基づく処分に違反したときは、三月以内の期間を定めて無線局の運用の停止を命じ、又は期間を定めて運用許容時間、周波数若しくは空中線電力を制限することができる。"]}],"section":"H08-3","fixed":false},{"id":"H08-07","subject":"法規","chapter":"H08","text":"\u003cp>総務大臣が無線局の免許を取り消すことができる場合として、電波法に規定されているものはどれか。\u003c/p>","choices":["正当な理由がないのに、無線局の運用を引き続き 6 か月以上休止したとき。","1 か月以上、無線局を運用しなかったとき。","免許人が、引っ越しをしたとき。","1 年間に交信した局数が少なかったとき。"],"answer":0,"explain":"\u003cp>正当な理由がないのに引き続き 6 か月以上休止したときは、免許を取り消すことができます。\u003c/p>","refs":[{"label":"電波法 第76条第4項第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_76-Pr_4-It_1","lines":["総務大臣は、免許人（包括免許人を除く。）が次の各号のいずれかに該当するときは、その免許を取り消すことができる。","一　正当な理由がないのに、無線局の運用を引き続き六月以上休止したとき。"]}],"section":"H08-3","fixed":false},{"id":"H08-08","subject":"法規","chapter":"H08","text":"\u003cp>無線局の免許人が総務大臣に報告しなければならない場合として、電波法に規定されているものはどれか。\u003c/p>","choices":["電波法又は電波法に基づく命令の規定に違反して運用した無線局を認めたとき","自局の呼出符号を相手局がまちがえたとき","無線機を新しく購入したとき","1 か月に 100 局以上と交信したとき"],"answer":0,"explain":"\u003cp>違反して運用した無線局を認めたときは報告します。遭難通信、緊急通信、安全通信、非常通信を行ったときも報告します。\u003c/p>","refs":[{"label":"電波法 第80条第1項第2号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_80-Pr_1-It_2","lines":["無線局の免許人等は、次に掲げる場合は、総務省令で定める手続により、総務大臣に報告しなければならない。","二　この法律又はこの法律に基づく命令の規定に違反して運用した無線局を認めたとき。"]}],"section":"H08-4","fixed":false},{"id":"H08-09","subject":"法規","chapter":"H08","text":"\u003cp>総務大臣が、無線通信の秩序の維持その他無線局の適正な運用を確保するため必要があると認めるときに、免許人に対してできることはどれか。\u003c/p>","choices":["無線局に関し報告を求めること","無線局の免許を直ちに取り消すこと","免許人の住所を公表すること","無線従事者の国家試験を受けさせること"],"answer":0,"explain":"\u003cp>必要があると認めるときは、免許人に無線局に関する報告を求めることができます。\u003c/p>","refs":[{"label":"電波法 第81条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_81","lines":["第八十一条　総務大臣は、無線通信の秩序の維持その他無線局の適正な運用を確保するため必要があると認めるときは、免許人等に対し、無線局に関し報告を求めることができる。"]}],"section":"H08-4","fixed":false},{"id":"H08-10","subject":"法規","chapter":"H08","text":"\u003cp>免許がないのに無線局を開設した者に対する罰則として、電波法に規定されているものはどれか。\u003c/p>","choices":["1 年以下の拘禁刑又は 100 万円以下の罰金","6 か月以下の拘禁刑又は 30 万円以下の罰金","3 年以下の拘禁刑又は 150 万円以下の罰金","10 万円以下の過料"],"answer":0,"explain":"\u003cp>免許がないのに無線局を開設したときは、1 年以下の拘禁刑又は 100 万円以下の罰金です。免許がないのに無線局を運用したときも同じです。\u003c/p>","refs":[{"label":"電波法 第110条第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_9-At_110-Pr_1-It_1","lines":["次の各号のいずれかに該当する場合には、当該違反行為をした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。","一　第四条の規定による免許又は第二十七条の二十一第一項の規定による登録がないのに、無線局を開設したとき。"]}],"section":"H08-5","fixed":false},{"id":"H08-11","subject":"法規","chapter":"H08","text":"\u003cp>無線局の取扱中に係る無線通信の秘密を漏らし、又は窃用した者に対する罰則として、電波法に規定されているものはどれか（無線通信の業務に従事する者の場合を除く）。\u003c/p>","choices":["1 年以下の拘禁刑又は 50 万円以下の罰金","2 年以下の拘禁刑又は 100 万円以下の罰金","5 年以下の拘禁刑又は 250 万円以下の罰金","30 万円以下の罰金"],"answer":0,"explain":"\u003cp>1 年以下の拘禁刑又は 50 万円以下の罰金です。無線通信の業務に従事する者が、業務で知った秘密を漏らしたときは、2 年以下の拘禁刑又は 100 万円以下の罰金と重くなります。\u003c/p>","refs":[{"label":"電波法 第109条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_9-At_109","lines":["第百九条　無線局の取扱中に係る無線通信の秘密を漏らし、又は窃用した者は、一年以下の拘禁刑又は五十万円以下の罰金に処する。","２　無線通信の業務に従事する者がその業務に関し知り得た前項の秘密を漏らし、又は窃用したときは、二年以下の拘禁刑又は百万円以下の罰金に処する。"]}],"section":"H08-5","fixed":false},{"id":"H08-12","subject":"法規","chapter":"H08","text":"\u003cp>資格がないのに、アマチュア無線局の無線設備の操作を行った者に対する罰則として、電波法に規定されているものはどれか。\u003c/p>","choices":["30 万円以下の罰金","100 万円以下の罰金","1 年以下の拘禁刑","罰則はない"],"answer":0,"explain":"\u003cp>電波法第 39 条の 13 に違反して無線設備の操作を行ったときは、30 万円以下の罰金です。\u003c/p>","refs":[{"label":"電波法 第113条第1項第20号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_9-At_113-Pr_1-It_20","lines":["次の各号のいずれかに該当する場合には、当該違反行為をした者は、三十万円以下の罰金に処する。","二十　第三十九条第一項若しくは第二項又は第三十九条の十三の規定に違反して、無線設備の操作を行つたとき。"]}],"section":"H08-5","fixed":false},{"id":"K01-01","subject":"無線工学","chapter":"K01","text":"\u003cp>10 Ω の抵抗に 2 A の電流が流れているとき、抵抗の両端の電圧はどれか。\u003c/p>","choices":["20 V","5 V","12 V","0.2 V"],"answer":0,"explain":"\u003cp>オームの法則 V ＝ I × R に入れて、2 × 10 ＝ 20 V です。\u003c/p>","refs":[],"section":"K01-2","fixed":false},{"id":"K01-02","subject":"無線工学","chapter":"K01","text":"\u003cp>12 V の電源に 4 Ω の抵抗をつないだとき、流れる電流はどれか。\u003c/p>","choices":["3 A","48 A","16 A","0.33 A"],"answer":0,"explain":"\u003cp>I ＝ V ÷ R なので、12 ÷ 4 ＝ 3 A です。\u003c/p>","refs":[],"section":"K01-2","fixed":false},{"id":"K01-03","subject":"無線工学","chapter":"K01","text":"\u003cp>ある抵抗に 6 V の電圧を加えたら、0.5 A の電流が流れた。この抵抗の値はどれか。\u003c/p>","choices":["12 Ω","3 Ω","6.5 Ω","0.08 Ω"],"answer":0,"explain":"\u003cp>R ＝ V ÷ I なので、6 ÷ 0.5 ＝ 12 Ω です。\u003c/p>","refs":[],"section":"K01-2","fixed":false},{"id":"K01-04","subject":"無線工学","chapter":"K01","text":"\u003cp>10 Ω と 20 Ω の抵抗を直列につないだときの合成抵抗はどれか。\u003c/p>","choices":["30 Ω","6.7 Ω","15 Ω","200 Ω"],"answer":0,"explain":"\u003cp>直列の合成抵抗は足し算です。10 ＋ 20 ＝ 30 Ω です。\u003c/p>","refs":[],"section":"K01-3","fixed":false},{"id":"K01-05","subject":"無線工学","chapter":"K01","text":"\u003cp>20 Ω の抵抗を 2 本、並列につないだときの合成抵抗はどれか。\u003c/p>","choices":["10 Ω","20 Ω","40 Ω","400 Ω"],"answer":0,"explain":"\u003cp>同じ値の抵抗 2 本の並列は、1 本の半分です。20 ÷ 2 ＝ 10 Ω です。式で求めても (20 × 20) ÷ (20 ＋ 20) ＝ 400 ÷ 40 ＝ 10 Ω です。\u003c/p>","refs":[],"section":"K01-3","fixed":false},{"id":"K01-06","subject":"無線工学","chapter":"K01","text":"\u003cp>30 Ω と 60 Ω の抵抗を並列につないだときの合成抵抗はどれか。\u003c/p>","choices":["20 Ω","45 Ω","90 Ω","1,800 Ω"],"answer":0,"explain":"\u003cp>2 本の並列は「かけ算 ÷ 足し算」です。(30 × 60) ÷ (30 ＋ 60) ＝ 1,800 ÷ 90 ＝ 20 Ω です。いちばん小さい 30 Ω より小さくなっていることも確かめます。\u003c/p>","refs":[],"section":"K01-3","fixed":false},{"id":"K01-07","subject":"無線工学","chapter":"K01","text":"\u003cp>10 Ω の抵抗を 2 本並列につなぎ、それに 15 Ω の抵抗を直列につないだ。全体の合成抵抗はどれか。\u003c/p>","choices":["20 Ω","35 Ω","25 Ω","3.75 Ω"],"answer":0,"explain":"\u003cp>まず並列の部分を求めます。10 Ω が 2 本なので 5 Ω です。それに 15 Ω を直列に足して、5 ＋ 15 ＝ 20 Ω です。\u003c/p>","refs":[],"section":"K01-3","fixed":false},{"id":"K01-08","subject":"無線工学","chapter":"K01","text":"\u003cp>100 V の電源につないだ機器に 3 A の電流が流れている。この機器の電力はどれか。\u003c/p>","choices":["300 W","33 W","103 W","0.03 W"],"answer":0,"explain":"\u003cp>P ＝ V × I なので、100 × 3 ＝ 300 W です。\u003c/p>","refs":[],"section":"K01-4","fixed":false},{"id":"K01-09","subject":"無線工学","chapter":"K01","text":"\u003cp>5 Ω の抵抗に 2 A の電流が流れているとき、抵抗で使われる電力はどれか。\u003c/p>","choices":["20 W","10 W","2.5 W","50 W"],"answer":0,"explain":"\u003cp>P ＝ I × I × R なので、2 × 2 × 5 ＝ 20 W です。先に電圧を求めて（2 × 5 ＝ 10 V）、10 × 2 ＝ 20 W としても同じです。\u003c/p>","refs":[],"section":"K01-4","fixed":false},{"id":"K01-10","subject":"無線工学","chapter":"K01","text":"\u003cp>20 Ω の抵抗の両端に 10 V の電圧を加えたとき、抵抗で使われる電力はどれか。\u003c/p>","choices":["5 W","200 W","2 W","0.5 W"],"answer":0,"explain":"\u003cp>P ＝ V × V ÷ R なので、10 × 10 ÷ 20 ＝ 5 W です。先に電流を求めて（10 ÷ 20 ＝ 0.5 A）、10 × 0.5 ＝ 5 W としても同じです。\u003c/p>","refs":[],"section":"K01-4","fixed":false},{"id":"K01-11","subject":"無線工学","chapter":"K01","text":"\u003cp>量と単位の組合せのうち、誤っているものはどれか。\u003c/p>","choices":["電力：ヘルツ〔Hz〕","電圧：ボルト〔V〕","電流：アンペア〔A〕","抵抗：オーム〔Ω〕"],"answer":0,"explain":"\u003cp>電力の単位はワット〔W〕です。ヘルツ〔Hz〕は周波数の単位です。\u003c/p>","refs":[],"section":"K01-1","fixed":false},{"id":"K01-12","subject":"無線工学","chapter":"K01","text":"\u003cp>145 MHz を kHz で表したものはどれか。\u003c/p>","choices":["145,000 kHz","1.45 kHz","14,500 kHz","145,000,000 kHz"],"answer":0,"explain":"\u003cp>1 MHz は 1,000 kHz です。145 × 1,000 ＝ 145,000 kHz です。\u003c/p>","refs":[],"section":"K01-5","fixed":false},{"id":"K01-13","subject":"無線工学","chapter":"K01","text":"\u003cp>周波数が 50 Hz の交流の周期はどれか。\u003c/p>","choices":["0.02 秒","0.5 秒","2 秒","50 秒"],"answer":0,"explain":"\u003cp>周期は周波数の逆数です。1 ÷ 50 ＝ 0.02 秒です。\u003c/p>","refs":[],"section":"K01-6","fixed":false},{"id":"K01-14","subject":"無線工学","chapter":"K01","text":"\u003cp>消費電力が 50 W の機器を 2 時間使ったときの電力量はどれか。\u003c/p>","choices":["100 Wh","25 Wh","52 Wh","2,500 Wh"],"answer":0,"explain":"\u003cp>電力量は電力 × 時間です。50 × 2 ＝ 100 Wh です。\u003c/p>","refs":[],"section":"K01-4","fixed":false},{"id":"K02-01","subject":"無線工学","chapter":"K02","text":"\u003cp>実効値が 100 V の正弦波交流の、最大値に近いものはどれか。\u003c/p>","choices":["約 141 V","約 71 V","約 100 V","約 200 V"],"answer":0,"explain":"\u003cp>最大値は実効値の √2 倍（約 1.41 倍）です。100 × 1.41 ≒ 141 V です。\u003c/p>","refs":[],"section":"K02-1","fixed":false},{"id":"K02-02","subject":"無線工学","chapter":"K02","text":"\u003cp>正弦波交流の実効値と最大値の関係で、正しいものはどれか。\u003c/p>","choices":["実効値 ＝ 最大値 ÷ √2","実効値 ＝ 最大値 × √2","実効値 ＝ 最大値 ÷ 2","実効値 ＝ 最大値 × 2"],"answer":0,"explain":"\u003cp>実効値は最大値の √2 分の 1（約 0.707 倍）です。\u003c/p>","refs":[],"section":"K02-1","fixed":false},{"id":"K02-03","subject":"無線工学","chapter":"K02","text":"\u003cp>コンデンサの性質として、正しいものはどれか。\u003c/p>","choices":["直流は通さず、交流は周波数が高いほど通しやすい。","直流は通し、交流は周波数が高いほど通しにくい。","直流も交流も、周波数に関係なく同じように通す。","直流は通さず、交流は周波数が高いほど通しにくい。"],"answer":0,"explain":"\u003cp>コンデンサは直流を通しません。交流は通し、周波数が高いほどリアクタンスが小さくなって通しやすくなります。\u003c/p>","refs":[],"section":"K02-2","fixed":false},{"id":"K02-04","subject":"無線工学","chapter":"K02","text":"\u003cp>コイルの性質として、正しいものはどれか。\u003c/p>","choices":["直流は通し、交流は周波数が高いほど通しにくい。","直流は通さず、交流は周波数が高いほど通しやすい。","直流も交流も通さない。","直流は通し、交流は周波数が高いほど通しやすい。"],"answer":0,"explain":"\u003cp>コイルは直流を通します。交流は、周波数が高いほどリアクタンスが大きくなって通しにくくなります。\u003c/p>","refs":[],"section":"K02-3","fixed":false},{"id":"K02-05","subject":"無線工学","chapter":"K02","text":"\u003cp>コイルに加える交流の周波数を 2 倍にすると、コイルのリアクタンスはどうなるか。\u003c/p>","choices":["2 倍になる。","2 分の 1 になる。","4 倍になる。","変わらない。"],"answer":0,"explain":"\u003cp>XL ＝ 2πfL なので、周波数 f に比例します。f が 2 倍なら XL も 2 倍です。\u003c/p>","refs":[],"section":"K02-3","fixed":false},{"id":"K02-06","subject":"無線工学","chapter":"K02","text":"\u003cp>コンデンサに加える交流の周波数を 2 倍にすると、コンデンサのリアクタンスはどうなるか。\u003c/p>","choices":["2 分の 1 になる。","2 倍になる。","4 分の 1 になる。","変わらない。"],"answer":0,"explain":"\u003cp>XC ＝ 1 ÷ (2πfC) なので、周波数 f に反比例します。f が 2 倍なら XC は 2 分の 1 です。\u003c/p>","refs":[],"section":"K02-2","fixed":false},{"id":"K02-07","subject":"無線工学","chapter":"K02","text":"\u003cp>量と単位の組合せで、正しいものはどれか。\u003c/p>","choices":["静電容量：ファラド〔F〕","インダクタンス：ファラド〔F〕","静電容量：ヘンリー〔H〕","リアクタンス：ワット〔W〕"],"answer":0,"explain":"\u003cp>静電容量はファラド、インダクタンスはヘンリー、リアクタンスはオームです。\u003c/p>","refs":[],"section":"K02-2","fixed":false},{"id":"K02-08","subject":"無線工学","chapter":"K02","text":"\u003cp>100 pF のコンデンサを 2 個、並列につないだときの合成静電容量はどれか。\u003c/p>","choices":["200 pF","50 pF","100 pF","10,000 pF"],"answer":0,"explain":"\u003cp>コンデンサの並列は足し算です。100 ＋ 100 ＝ 200 pF です。抵抗の並列とは逆なので注意します。\u003c/p>","refs":[],"section":"K02-2","fixed":false},{"id":"K02-09","subject":"無線工学","chapter":"K02","text":"\u003cp>200 pF のコンデンサを 2 個、直列につないだときの合成静電容量はどれか。\u003c/p>","choices":["100 pF","400 pF","200 pF","40,000 pF"],"answer":0,"explain":"\u003cp>コンデンサの直列は「かけ算 ÷ 足し算」です。(200 × 200) ÷ (200 ＋ 200) ＝ 40,000 ÷ 400 ＝ 100 pF です。同じ値 2 個なら半分になります。\u003c/p>","refs":[],"section":"K02-2","fixed":false},{"id":"K02-10","subject":"無線工学","chapter":"K02","text":"\u003cp>コイルのインダクタンスを L、コンデンサの静電容量を C とするとき、共振周波数 f を表す式はどれか。\u003c/p>","choices":["f ＝ 1 ÷ (2π√(LC))","f ＝ 2π√(LC)","f ＝ 2πLC","f ＝ 1 ÷ (2πLC)"],"answer":0,"explain":"\u003cp>共振周波数は、f ＝ 1 ÷ (2π√(LC)) です。L や C が大きいほど、共振周波数は低くなります。\u003c/p>","refs":[],"section":"K02-4","fixed":false},{"id":"K02-11","subject":"無線工学","chapter":"K02","text":"\u003cp>コイルとコンデンサの直列共振回路で、共振周波数のときの回路のインピーダンスはどうなるか。\u003c/p>","choices":["最小になる。","最大になる。","無限大になる。","共振していないときと変わらない。"],"answer":0,"explain":"\u003cp>直列共振では、コイルとコンデンサのリアクタンスが打ち消し合い、インピーダンスが最小になって、電流が最大になります。\u003c/p>","refs":[],"section":"K02-4","fixed":false},{"id":"K02-12","subject":"無線工学","chapter":"K02","text":"\u003cp>コイルとコンデンサの並列共振回路で、共振周波数のときの回路のインピーダンスはどうなるか。\u003c/p>","choices":["最大になる。","最小になる。","零になる。","共振していないときと変わらない。"],"answer":0,"explain":"\u003cp>並列共振では、共振周波数でインピーダンスが最大になります。直列共振（最小）と逆です。\u003c/p>","refs":[],"section":"K02-4","fixed":false},{"id":"K02-13","subject":"無線工学","chapter":"K02","text":"\u003cp>共振回路のコンデンサの静電容量を大きくすると、共振周波数はどうなるか。\u003c/p>","choices":["低くなる。","高くなる。","変わらない。","零になる。"],"answer":0,"explain":"\u003cp>f ＝ 1 ÷ (2π√(LC)) なので、C を大きくすると f は低くなります。L を大きくしても低くなります。\u003c/p>","refs":[],"section":"K02-4","fixed":false},{"id":"K02-14","subject":"無線工学","chapter":"K02","text":"\u003cp>1 次側の巻数が 100 回、2 次側の巻数が 20 回の変圧器の 1 次側に、100 V の交流を加えた。2 次側に出る電圧はどれか。\u003c/p>","choices":["20 V","500 V","5 V","2,000 V"],"answer":0,"explain":"\u003cp>電圧の比は巻数の比と同じです。100 × 20 ÷ 100 ＝ 20 V です。\u003c/p>","refs":[],"section":"K02-5","fixed":false},{"id":"K03-01","subject":"無線工学","chapter":"K03","text":"\u003cp>半導体の材料として使われるものはどれか。\u003c/p>","choices":["シリコン","銅","ガラス","ゴム"],"answer":0,"explain":"\u003cp>シリコンやゲルマニウムが半導体です。銅は導体、ガラスとゴムは絶縁体です。\u003c/p>","refs":[],"section":"K03-1","fixed":false},{"id":"K03-02","subject":"無線工学","chapter":"K03","text":"\u003cp>N 形半導体で、おもに電気を運ぶものはどれか。\u003c/p>","choices":["自由電子","正孔（ホール）","陽子","中性子"],"answer":0,"explain":"\u003cp>N 形は自由電子、P 形は正孔がおもに電気を運びます。\u003c/p>","refs":[],"section":"K03-1","fixed":false},{"id":"K03-03","subject":"無線工学","chapter":"K03","text":"\u003cp>ダイオードに電流がよく流れる向きとして、正しいものはどれか。\u003c/p>","choices":["アノードからカソードへの向き（順方向）","カソードからアノードへの向き（逆方向）","両方の向きに同じように流れる。","どちらの向きにも流れない。"],"answer":0,"explain":"\u003cp>アノード（P 形）からカソード（N 形）への順方向に電流がよく流れます。逆方向にはほとんど流れません。\u003c/p>","refs":[],"section":"K03-2","fixed":false},{"id":"K03-04","subject":"無線工学","chapter":"K03","text":"\u003cp>交流を直流に変える（整流する）ために使う部品はどれか。\u003c/p>","choices":["整流用ダイオード","発光ダイオード","可変容量ダイオード","コイル"],"answer":0,"explain":"\u003cp>一方向にだけ電流を流すダイオードの性質を使って、交流を直流に変えます。\u003c/p>","refs":[],"section":"K03-2","fixed":false},{"id":"K03-05","subject":"無線工学","chapter":"K03","text":"\u003cp>定電圧回路に使われるダイオードはどれか。\u003c/p>","choices":["ツェナーダイオード","発光ダイオード","可変容量ダイオード","整流用ダイオード"],"answer":0,"explain":"\u003cp>ツェナーダイオードは、逆方向の電圧がある値を超えると電流が流れ、両端の電圧がほぼ一定に保たれます。\u003c/p>","refs":[],"section":"K03-2","fixed":false},{"id":"K03-06","subject":"無線工学","chapter":"K03","text":"\u003cp>可変容量ダイオードの性質として、正しいものはどれか。\u003c/p>","choices":["逆方向に加える電圧の大きさによって、静電容量が変わる。","順方向に電流を流すと光る。","逆方向の電圧がある値を超えると、両端の電圧が一定になる。","温度によって、抵抗の値が大きく変わる。"],"answer":0,"explain":"\u003cp>可変容量ダイオードは、逆方向の電圧で静電容量が変わります。FM の変調や、電子同調に使います。光るのは発光ダイオード、電圧が一定になるのはツェナーダイオードです。\u003c/p>","refs":[],"section":"K03-2","fixed":false},{"id":"K03-07","subject":"無線工学","chapter":"K03","text":"\u003cp>トランジスタの 3 つの電極の名前の組合せで、正しいものはどれか。\u003c/p>","choices":["エミッタ、ベース、コレクタ","ソース、ゲート、ドレイン","アノード、カソード、ゲート","エミッタ、ゲート、ドレイン"],"answer":0,"explain":"\u003cp>トランジスタはエミッタ、ベース、コレクタです。ソース、ゲート、ドレインは FET の電極です。\u003c/p>","refs":[],"section":"K03-3","fixed":false},{"id":"K03-08","subject":"無線工学","chapter":"K03","text":"\u003cp>FET（電界効果トランジスタ）の 3 つの電極の名前の組合せで、正しいものはどれか。\u003c/p>","choices":["ソース、ゲート、ドレイン","エミッタ、ベース、コレクタ","アノード、カソード、ベース","ソース、ベース、コレクタ"],"answer":0,"explain":"\u003cp>FET はソース、ゲート、ドレインです。ゲートの電圧で、ドレインの電流を制御します。\u003c/p>","refs":[],"section":"K03-3","fixed":false},{"id":"K03-09","subject":"無線工学","chapter":"K03","text":"\u003cp>FET の特徴として、正しいものはどれか。\u003c/p>","choices":["入力インピーダンスが高い。","入力インピーダンスが低い。","ベースの電流でコレクタの電流を制御する。","直流でしか動作しない。"],"answer":0,"explain":"\u003cp>FET はゲートの電圧で制御するので、入力側にほとんど電流が流れません。つまり入力インピーダンスが高いのが特徴です。\u003c/p>","refs":[],"section":"K03-3","fixed":false},{"id":"K03-10","subject":"無線工学","chapter":"K03","text":"\u003cp>C 級増幅の特徴として、正しいものはどれか。\u003c/p>","choices":["効率はよいが、ひずみが大きい。","ひずみは少ないが、効率が低い。","効率もよく、ひずみも少ない。","直流しか増幅できない。"],"answer":0,"explain":"\u003cp>C 級増幅は効率がいちばんよいですが、ひずみが大きくなります。電信や FM の電力増幅、周波数逓倍に使います。\u003c/p>","refs":[],"section":"K03-4","fixed":false},{"id":"K03-11","subject":"無線工学","chapter":"K03","text":"\u003cp>SSB（J3E）の送信機の電力増幅に、C 級増幅を使わない理由として、正しいものはどれか。\u003c/p>","choices":["ひずみが大きく、変調の波形がくずれるから。","効率が低すぎるから。","周波数が高い信号を増幅できないから。","大きな電力を出せないから。"],"answer":0,"explain":"\u003cp>SSB は振幅に情報があるので、直線性のよい増幅（A 級、B 級、AB 級）が要ります。C 級はひずみが大きいので使いません。\u003c/p>","refs":[],"section":"K03-4","fixed":false},{"id":"K03-12","subject":"無線工学","chapter":"K03","text":"\u003cp>A 級増幅の特徴として、正しいものはどれか。\u003c/p>","choices":["ひずみは少ないが、効率が低い。","効率はよいが、ひずみが大きい。","2 つの素子を組み合わせないと増幅できない。","周波数逓倍に最も適している。"],"answer":0,"explain":"\u003cp>A 級増幅は波形をそのまま大きくできるので、ひずみが少ないですが、効率は低くなります。\u003c/p>","refs":[],"section":"K03-4","fixed":false},{"id":"K03-13","subject":"無線工学","chapter":"K03","text":"\u003cp>発振回路が発振を続けるために必要なものはどれか。\u003c/p>","choices":["出力の一部を、同じ位相で入力に戻す（正帰還）。","出力の一部を、逆の位相で入力に戻す（負帰還）。","入力と出力を完全に切り離す。","電源を交流にする。"],"answer":0,"explain":"\u003cp>正帰還で、作った交流を入力に戻し続けることで、発振が続きます。負帰還は、増幅を安定させるのに使います。\u003c/p>","refs":[],"section":"K03-5","fixed":false},{"id":"K03-14","subject":"無線工学","chapter":"K03","text":"\u003cp>水晶発振器の特徴として、正しいものはどれか。\u003c/p>","choices":["発振周波数がとても安定している。","発振周波数を広い範囲で自由に変えられる。","大きな電力を直接出せる。","直流を作るのに使う。"],"answer":0,"explain":"\u003cp>水晶発振器は、周波数の安定度が高いのが特徴です。多くの周波数を作りたいときは、水晶発振器を基準にした PLL 周波数シンセサイザを使います。\u003c/p>","refs":[],"section":"K03-5","fixed":false},{"id":"K04-01","subject":"無線工学","chapter":"K04","text":"\u003cp>AM（振幅変調）で、音声の信号に合わせて変化させるものはどれか。\u003c/p>","choices":["搬送波の振幅","搬送波の周波数","搬送波の位相","電源の電圧"],"answer":0,"explain":"\u003cp>AM は、搬送波の振幅（強さ）を音声に合わせて変えます。周波数を変えるのは FM、位相を変えるのは PM（位相変調）です。\u003c/p>","refs":[],"section":"K04-1","fixed":false},{"id":"K04-02","subject":"無線工学","chapter":"K04","text":"\u003cp>FM（周波数変調）で、音声の信号に合わせて変化させるものはどれか。\u003c/p>","choices":["搬送波の周波数","搬送波の振幅","側波帯の数","空中線電力"],"answer":0,"explain":"\u003cp>FM は、搬送波の周波数を音声に合わせて変えます。\u003c/p>","refs":[],"section":"K04-1","fixed":false},{"id":"K04-03","subject":"無線工学","chapter":"K04","text":"\u003cp>FM の電波の特徴として、正しいものはどれか。\u003c/p>","choices":["雑音に強いが、占有周波数帯幅が広い。","雑音に弱いが、占有周波数帯幅が狭い。","搬送波を取り除いて送るので、電力の効率がよい。","振幅の変化で音声を伝える。"],"answer":0,"explain":"\u003cp>FM は、振幅の変化（雑音）を受信側で取り除けるので、雑音に強い方式です。そのかわり、占有周波数帯幅が広くなります。\u003c/p>","refs":[],"section":"K04-1","fixed":false},{"id":"K04-04","subject":"無線工学","chapter":"K04","text":"\u003cp>最高周波数が 3 kHz の音声で AM（A3E）の変調をしたとき、占有周波数帯幅はおよそいくらか。\u003c/p>","choices":["6 kHz","1.5 kHz","3 kHz","9 kHz"],"answer":0,"explain":"\u003cp>AM は搬送波の上下に側波帯ができるので、占有周波数帯幅は最高周波数の 2 倍です。3 × 2 ＝ 6 kHz です。\u003c/p>","refs":[],"section":"K04-1","fixed":false},{"id":"K04-05","subject":"無線工学","chapter":"K04","text":"\u003cp>SSB（J3E）の占有周波数帯幅は、同じ音声で変調した AM（A3E）とくらべてどうか。\u003c/p>","choices":["約 2 分の 1","約 2 倍","約 4 倍","同じ"],"answer":0,"explain":"\u003cp>SSB は片方の側波帯だけを送るので、AM の約半分の幅です。\u003c/p>","refs":[],"section":"K04-1","fixed":false},{"id":"K04-06","subject":"無線工学","chapter":"K04","text":"\u003cp>AM 送信機で過変調になったときに起こることとして、正しいものはどれか。\u003c/p>","choices":["波形がひずみ、占有周波数帯幅が広がって、ほかの通信に混信を与えるおそれがある。","占有周波数帯幅が狭くなり、相手に届かなくなる。","搬送波がなくなり、SSB の電波になる。","送信の周波数が 2 倍になる。"],"answer":0,"explain":"\u003cp>変調度が 100 パーセントを超える過変調では、波形がひずみ、不要な周波数の成分が出て、占有周波数帯幅が広がります。\u003c/p>","refs":[],"section":"K04-2","fixed":false},{"id":"K04-07","subject":"無線工学","chapter":"K04","text":"\u003cp>送信機の緩衝増幅器の働きとして、正しいものはどれか。\u003c/p>","choices":["後ろの段の影響で、発振器の発振周波数が変動するのを防ぐ。","周波数を整数倍にする。","搬送波を打ち消す。","周波数偏移を一定の値以内にする。"],"answer":0,"explain":"\u003cp>緩衝増幅器は、発振器と後ろの段の間に入れて、後ろの段の変化が発振器に伝わらないようにします。\u003c/p>","refs":[],"section":"K04-3","fixed":false},{"id":"K04-08","subject":"無線工学","chapter":"K04","text":"\u003cp>送信機の周波数逓倍器の働きとして、正しいものはどれか。\u003c/p>","choices":["入力の周波数を整数倍にする。","入力の周波数を整数分の 1 にする。","搬送波を取り除く。","空中線との整合をとる。"],"answer":0,"explain":"\u003cp>周波数逓倍器は、周波数を 2 倍、3 倍などの整数倍にします。ひずみの大きい C 級増幅で高調波を作り、必要な倍数の周波数を取り出します。\u003c/p>","refs":[],"section":"K04-3","fixed":false},{"id":"K04-09","subject":"無線工学","chapter":"K04","text":"\u003cp>FM 送信機で、周波数逓倍器によって周波数を 3 倍にしたとき、周波数偏移はどうなるか。\u003c/p>","choices":["3 倍になる。","3 分の 1 になる。","変わらない。","9 倍になる。"],"answer":0,"explain":"\u003cp>周波数を整数倍にすると、周波数偏移も同じ倍数になります。\u003c/p>","refs":[],"section":"K04-4","fixed":false},{"id":"K04-10","subject":"無線工学","chapter":"K04","text":"\u003cp>FM 送信機の IDC 回路（瞬時偏移制御回路）の働きとして、正しいものはどれか。\u003c/p>","choices":["周波数偏移が、決められた値を超えないようにする。","搬送波の周波数を整数倍にする。","送信機の出力の高調波を取り除く。","受信機の雑音を消す。"],"answer":0,"explain":"\u003cp>大きな声を入れても、周波数偏移が決められた値を超えないように制御します。占有周波数帯幅が広がりすぎるのを防ぎます。\u003c/p>","refs":[],"section":"K04-4","fixed":false},{"id":"K04-11","subject":"無線工学","chapter":"K04","text":"\u003cp>SSB 送信機の平衡変調器の働きとして、正しいものはどれか。\u003c/p>","choices":["搬送波を打ち消して、上下の側波帯を取り出す。","片方の側波帯だけを通す。","周波数を整数倍にする。","周波数偏移を一定にする。"],"answer":0,"explain":"\u003cp>平衡変調器で搬送波を打ち消し（抑圧し）、上下の側波帯を出します。そのあとの帯域フィルタで、片方の側波帯だけを通します。\u003c/p>","refs":[],"section":"K04-5","fixed":false},{"id":"K04-12","subject":"無線工学","chapter":"K04","text":"\u003cp>SSB 送信機で、平衡変調器から出た上下の側波帯のうち、片方の側波帯だけを取り出すものはどれか。\u003c/p>","choices":["帯域フィルタ","緩衝増幅器","周波数逓倍器","IDC 回路"],"answer":0,"explain":"\u003cp>帯域フィルタ（BPF）で、必要な側波帯だけを通します。\u003c/p>","refs":[],"section":"K04-5","fixed":false},{"id":"K04-13","subject":"無線工学","chapter":"K04","text":"\u003cp>FM 送信機のプリエンファシスの説明として、正しいものはどれか。\u003c/p>","choices":["送信側で、音声の高い周波数の成分を強めて送る。","送信側で、音声の低い周波数の成分を強めて送る。","受信側で、音声の高い周波数の成分を弱める。","送信側で、搬送波を打ち消す。"],"answer":0,"explain":"\u003cp>送信側で高い音を強め（プリエンファシス）、受信側で元に戻す（ディエンファシス）ことで、雑音を減らします。受信側で弱めるのはディエンファシスです。\u003c/p>","refs":[],"section":"K04-4","fixed":false},{"id":"K05-01","subject":"無線工学","chapter":"K05","text":"\u003cp>受信機の「感度」の説明として、正しいものはどれか。\u003c/p>","choices":["どれだけ弱い電波まで受信できるかを表す能力","近くの周波数の電波と分けて、目的の電波を選び出す能力","送られた音を、どれだけ忠実に再現できるかを表す能力","時間がたっても周波数が変わらないかを表す能力"],"answer":0,"explain":"\u003cp>感度は、弱い電波を受信する能力です。2 番目は選択度、3 番目は忠実度、4 番目は安定度です。\u003c/p>","refs":[],"section":"K05-1","fixed":false},{"id":"K05-02","subject":"無線工学","chapter":"K05","text":"\u003cp>受信機の「選択度」の説明として、正しいものはどれか。\u003c/p>","choices":["近くの周波数の電波と分けて、目的の電波を選び出す能力","どれだけ弱い電波まで受信できるかを表す能力","どれだけ大きな音を出せるかを表す能力","電池がどれだけ長くもつかを表す能力"],"answer":0,"explain":"\u003cp>選択度がよい受信機は、近くの周波数の電波による混信を受けにくくなります。\u003c/p>","refs":[],"section":"K05-1","fixed":false},{"id":"K05-03","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機で、受信した電波を中間周波数に変える部分はどれか。\u003c/p>","choices":["周波数混合器（と局部発振器）","検波器","低周波増幅器","振幅制限器"],"answer":0,"explain":"\u003cp>受信した電波と局部発振器の出力を周波数混合器でまぜて、中間周波数に変えます。これを周波数変換といいます。\u003c/p>","refs":[],"section":"K05-2","fixed":false},{"id":"K05-04","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機の選択度は、おもにどの部分で決まるか。\u003c/p>","choices":["中間周波増幅器","低周波増幅器","局部発振器","スピーカー"],"answer":0,"explain":"\u003cp>一定の中間周波数で、帯域を決めて増幅するので、選択度はおもに中間周波増幅器で決まります。\u003c/p>","refs":[],"section":"K05-2","fixed":false},{"id":"K05-05","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機の高周波増幅器の働きとして、正しいものはどれか。\u003c/p>","choices":["感度をよくし、影像周波数による妨害を減らす。","音声の信号を、スピーカーを鳴らす大きさまで増幅する。","周波数の変化を、音声の信号に変える。","中間周波数を作る。"],"answer":0,"explain":"\u003cp>高周波増幅器は、受信した電波を増幅して感度をよくします。同調回路で目的の周波数を選ぶので、影像周波数による妨害も減らせます。\u003c/p>","refs":[],"section":"K05-2","fixed":false},{"id":"K05-06","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機で、受信周波数が 145.0 MHz、局部発振周波数が 155.7 MHz のとき、中間周波数はどれか。\u003c/p>","choices":["10.7 MHz","300.7 MHz","21.4 MHz","5.35 MHz"],"answer":0,"explain":"\u003cp>中間周波数は、局部発振周波数と受信周波数の差です。155.7 － 145.0 ＝ 10.7 MHz です。\u003c/p>","refs":[],"section":"K05-2","fixed":false},{"id":"K05-07","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機で、受信周波数が 145.0 MHz、中間周波数が 10.7 MHz、局部発振周波数が受信周波数より高いとき、影像周波数はどれか。\u003c/p>","choices":["166.4 MHz","155.7 MHz","134.3 MHz","123.6 MHz"],"answer":0,"explain":"\u003cp>影像周波数は、受信周波数 ＋ 中間周波数 × 2 です。145.0 ＋ 10.7 × 2 ＝ 166.4 MHz です。155.7 MHz は局部発振周波数です。\u003c/p>","refs":[],"section":"K05-3","fixed":false},{"id":"K05-08","subject":"無線工学","chapter":"K05","text":"\u003cp>受信機の AGC（自動利得調整）回路の働きとして、正しいものはどれか。\u003c/p>","choices":["受信する電波の強さが変わっても、出力をほぼ一定に保つ。","電波が来ていないときの雑音を消す。","受信する周波数を、自動で目的の局に合わせる。","送信と受信を自動で切り替える。"],"answer":0,"explain":"\u003cp>AGC は、電波が強いときは利得（増幅の度合い）を下げ、弱いときは上げて、出力をほぼ一定にします。雑音を消すのはスケルチです。\u003c/p>","refs":[],"section":"K05-4","fixed":false},{"id":"K05-09","subject":"無線工学","chapter":"K05","text":"\u003cp>FM 受信機の振幅制限器（リミッタ）の働きとして、正しいものはどれか。\u003c/p>","choices":["振幅を一定にそろえて、振幅の変化として入ってくる雑音を取り除く。","周波数の変化を、音声の信号に変える。","中間周波数を作る。","音声の高い音を強める。"],"answer":0,"explain":"\u003cp>FM は周波数に情報があるので、振幅の変化（雑音）を振幅制限器で取り除けます。これが FM が雑音に強い理由です。\u003c/p>","refs":[],"section":"K05-5","fixed":false},{"id":"K05-10","subject":"無線工学","chapter":"K05","text":"\u003cp>FM 受信機で、周波数の変化を音声の信号に変える（検波する）回路はどれか。\u003c/p>","choices":["周波数弁別器","振幅制限器","平衡変調器","周波数逓倍器"],"answer":0,"explain":"\u003cp>周波数弁別器が、FM の検波器です。平衡変調器と周波数逓倍器は送信機の回路です。\u003c/p>","refs":[],"section":"K05-5","fixed":false},{"id":"K05-11","subject":"無線工学","chapter":"K05","text":"\u003cp>FM 受信機のスケルチ回路の働きとして、正しいものはどれか。\u003c/p>","choices":["電波が来ていないときに出る大きな雑音を消す。","受信する電波の強さが変わっても、出力を一定にする。","影像周波数による妨害を減らす。","送信側で強めた高い音を元に戻す。"],"answer":0,"explain":"\u003cp>FM 受信機は、電波が来ていないと大きな「ザー」という雑音が出ます。スケルチは、このときに音を消す回路です。\u003c/p>","refs":[],"section":"K05-5","fixed":false},{"id":"K05-12","subject":"無線工学","chapter":"K05","text":"\u003cp>SSB（J3E）の電波を受信するとき、検波に使う回路の組合せとして、正しいものはどれか。\u003c/p>","choices":["BFO（うなり周波数発振器）とプロダクト検波器","振幅制限器と周波数弁別器","平衡変調器と帯域フィルタ","IDC 回路と周波数逓倍器"],"answer":0,"explain":"\u003cp>SSB には搬送波がないので、BFO で搬送波の代わりの信号を作って加え、プロダクト検波器で音声を取り出します。振幅制限器と周波数弁別器は FM 受信機の回路です。\u003c/p>","refs":[],"section":"K05-6","fixed":false},{"id":"K05-13","subject":"無線工学","chapter":"K05","text":"\u003cp>スーパーヘテロダイン受信機の検波器の働きとして、正しいものはどれか。\u003c/p>","choices":["中間周波数の信号から、音声の信号を取り出す。","受信した電波を、中間周波数に変える。","音声の信号を、スピーカーを鳴らす大きさまで増幅する。","局部発振器の周波数を安定させる。"],"answer":0,"explain":"\u003cp>検波器は、変調された信号から音声の信号を取り出します。\u003c/p>","refs":[],"section":"K05-2","fixed":false},{"id":"K06-01","subject":"無線工学","chapter":"K06","text":"\u003cp>アマチュア局の電波によって、テレビの受信に障害が出ることを何というか。\u003c/p>","choices":["TVI","BCI","テレホン I","アンプ I"],"answer":0,"explain":"\u003cp>TVI はテレビ、BCI はラジオ（放送）、テレホン I は電話機、アンプ I はオーディオのアンプへの障害です。\u003c/p>","refs":[],"section":"K06-1","fixed":false},{"id":"K06-02","subject":"無線工学","chapter":"K06","text":"\u003cp>BCI の説明として、正しいものはどれか。\u003c/p>","choices":["ラジオ放送の受信に障害を与えること","テレビの受信に障害を与えること","電話機に声が入ること","送信機が目的外の周波数で発振すること"],"answer":0,"explain":"\u003cp>BCI は、ラジオ放送（Broadcast）の受信への障害です。\u003c/p>","refs":[],"section":"K06-1","fixed":false},{"id":"K06-03","subject":"無線工学","chapter":"K06","text":"\u003cp>送信機の「高調波」の説明として、正しいものはどれか。\u003c/p>","choices":["送信周波数の整数倍の周波数の電波","送信周波数の半分の周波数の電波","送信周波数のすぐ近くに出る、変調の過程で生じる電波","受信機の局部発振器から出る電波"],"answer":0,"explain":"\u003cp>高調波は、送信周波数の 2 倍、3 倍などの整数倍の電波です。スプリアス発射の一つです。\u003c/p>","refs":[],"section":"K06-2","fixed":false},{"id":"K06-04","subject":"無線工学","chapter":"K06","text":"\u003cp>145 MHz の電波を送信しているとき、第 2 高調波の周波数はどれか。\u003c/p>","choices":["290 MHz","72.5 MHz","147 MHz","435 MHz"],"answer":0,"explain":"\u003cp>第 2 高調波は 2 倍の周波数です。145 × 2 ＝ 290 MHz です。435 MHz は第 3 高調波です。\u003c/p>","refs":[],"section":"K06-2","fixed":false},{"id":"K06-05","subject":"無線工学","chapter":"K06","text":"\u003cp>送信機から出る高調波による電波障害を防ぐため、送信機の出力と空中線の間に入れるものとして、適当なものはどれか。\u003c/p>","choices":["低域フィルタ（LPF）","高域フィルタ（HPF）","平衡変調器","周波数逓倍器"],"answer":0,"explain":"\u003cp>低域フィルタは、送信周波数より高い周波数（高調波）を通さないので、高調波を減らせます。\u003c/p>","refs":[],"section":"K06-3","fixed":false},{"id":"K06-06","subject":"無線工学","chapter":"K06","text":"\u003cp>短波（HF）の送信による TVI を防ぐため、テレビの空中線の入力に入れるものとして、適当なものはどれか。\u003c/p>","choices":["高域フィルタ（HPF）","低域フィルタ（LPF）","周波数逓倍器","振幅制限器"],"answer":0,"explain":"\u003cp>高域フィルタは、テレビの周波数より低い短波の電波を通さないので、テレビへの短波の電波の入り込みを防げます。\u003c/p>","refs":[],"section":"K06-4","fixed":false},{"id":"K06-07","subject":"無線工学","chapter":"K06","text":"\u003cp>電波障害を防ぐための送信側の対策として、適当でないものはどれか。\u003c/p>","choices":["空中線電力を、できる限り大きくする。","送信機をシールドし、確実に接地する。","過変調にならないようにする。","空中線を、テレビの空中線から離して設置する。"],"answer":0,"explain":"\u003cp>空中線電力は、通信に必要な最小の大きさにします。電力を大きくすると、障害を起こしやすくなります。\u003c/p>","refs":[],"section":"K06-3","fixed":false},{"id":"K06-08","subject":"無線工学","chapter":"K06","text":"\u003cp>AM の送信で過変調になると、電波障害の原因になるのはなぜか。\u003c/p>","choices":["占有周波数帯幅が広がり、近くの周波数に妨害を与えるから。","空中線電力が小さくなるから。","送信周波数が低くなるから。","搬送波がなくなるから。"],"answer":0,"explain":"\u003cp>過変調で波形がひずむと、不要な周波数の成分が出て、占有周波数帯幅が広がります。\u003c/p>","refs":[],"section":"K06-2","fixed":false},{"id":"K06-09","subject":"無線工学","chapter":"K06","text":"\u003cp>アマチュア局の送信中に、近くの家の電話機から送信の声が聞こえた。原因として考えられるものはどれか。\u003c/p>","choices":["強い電波が電話機の中に入り、検波されている。","電話機の電話番号が、送信周波数と同じである。","送信機の空中線電力が小さすぎる。","受信機のスケルチが開いている。"],"answer":0,"explain":"\u003cp>強い電波が電話機や電話線に入り、中の半導体などで検波されて、声が聞こえることがあります。電話機の線にフェライトコアを付けるなどの対策があります。\u003c/p>","refs":[],"section":"K06-2","fixed":false},{"id":"K06-10","subject":"無線工学","chapter":"K06","text":"\u003cp>送信機の「寄生振動」の説明として、正しいものはどれか。\u003c/p>","choices":["目的の周波数とは関係のない周波数で発振すること","送信周波数の整数倍の電波が出ること","変調度が 100 パーセントを超えること","受信機が送信機の電波で動かなくなること"],"answer":0,"explain":"\u003cp>寄生振動は、送信機の増幅回路などが、目的外の周波数で発振してしまうことです。電波障害の原因になります。\u003c/p>","refs":[],"section":"K06-2","fixed":false},{"id":"K06-11","subject":"無線工学","chapter":"K06","text":"\u003cp>電波障害の対策として、受信側（テレビなど）の対策を行うときに、まず必要なことはどれか。\u003c/p>","choices":["相手（テレビなどの持ち主）の了解を得る。","総務大臣の許可を受ける。","相手の家の電源を切る。","自局の空中線電力を最大にする。"],"answer":0,"explain":"\u003cp>受信側の機器は相手の持ち物です。フィルタを入れるなどの対策は、相手の了解を得てから行います。まず自局の送信設備を確かめることも大切です。\u003c/p>","refs":[],"section":"K06-4","fixed":false},{"id":"K07-01","subject":"無線工学","chapter":"K07","text":"\u003cp>次の電池のうち、充電してくり返し使える二次電池はどれか。\u003c/p>","choices":["ニッケル水素電池","マンガン乾電池","アルカリ乾電池","酸化銀電池"],"answer":0,"explain":"\u003cp>ニッケル水素電池、鉛蓄電池、リチウムイオン電池などが二次電池です。乾電池や酸化銀電池（ボタン電池）は一次電池です。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K07-02","subject":"無線工学","chapter":"K07","text":"\u003cp>1.5 V の乾電池 4 個を直列につないだとき、全体の電圧はどれか。\u003c/p>","choices":["6 V","1.5 V","3 V","0.375 V"],"answer":0,"explain":"\u003cp>直列につなぐと、電圧は足し算です。1.5 × 4 ＝ 6 V です。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K07-03","subject":"無線工学","chapter":"K07","text":"\u003cp>12 V・20 Ah の蓄電池 2 個を並列につないだとき、全体の電圧と容量の組合せで、正しいものはどれか。\u003c/p>","choices":["12 V・40 Ah","24 V・20 Ah","24 V・40 Ah","12 V・20 Ah"],"answer":0,"explain":"\u003cp>並列につなぐと、電圧は 1 個のときと同じで、容量は足し算になります。12 V、20 ＋ 20 ＝ 40 Ah です。直列なら 24 V・20 Ah です。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K07-04","subject":"無線工学","chapter":"K07","text":"\u003cp>同じ電池を直列につないだときの容量（Ah）について、正しいものはどれか。\u003c/p>","choices":["1 個のときと同じ。","つないだ個数の倍になる。","つないだ個数分の 1 になる。","零になる。"],"answer":0,"explain":"\u003cp>直列では、電圧は足し算になりますが、容量は 1 個のときと同じです。容量が増えるのは並列のときです。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K07-05","subject":"無線工学","chapter":"K07","text":"\u003cp>容量が 2 Ah の電池で、0.5 A の電流を流し続けると、およそ何時間使えるか。\u003c/p>","choices":["4 時間","1 時間","2.5 時間","10 時間"],"answer":0,"explain":"\u003cp>使える時間 ＝ 容量 ÷ 電流 なので、2 ÷ 0.5 ＝ 4 時間です。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K07-06","subject":"無線工学","chapter":"K07","text":"\u003cp>交流から直流を作る電源装置の構成として、正しい順番はどれか。\u003c/p>","choices":["変圧器 → 整流回路 → 平滑回路 → 定電圧回路","整流回路 → 変圧器 → 定電圧回路 → 平滑回路","平滑回路 → 整流回路 → 変圧器 → 定電圧回路","変圧器 → 平滑回路 → 整流回路 → 定電圧回路"],"answer":0,"explain":"\u003cp>変圧器で電圧を変え、整流回路で一方向の脈流にし、平滑回路で平らにして、定電圧回路で一定の電圧にします。\u003c/p>","refs":[],"section":"K07-2","fixed":false},{"id":"K07-07","subject":"無線工学","chapter":"K07","text":"\u003cp>電源装置の整流回路の働きとして、正しいものはどれか。\u003c/p>","choices":["交流を、一方向に流れる電流（脈流）に変える。","脈流の波を平らにする。","交流の電圧を高くしたり低くしたりする。","出力の電圧を一定に保つ。"],"answer":0,"explain":"\u003cp>整流回路は、ダイオードで交流を一方向の脈流にします。平らにするのは平滑回路、電圧を変えるのは変圧器、一定に保つのは定電圧回路です。\u003c/p>","refs":[],"section":"K07-2","fixed":false},{"id":"K07-08","subject":"無線工学","chapter":"K07","text":"\u003cp>電源装置の平滑回路の働きとして、正しいものはどれか。\u003c/p>","choices":["コンデンサやチョークコイルを使って、脈流の波を平らにする。","ダイオードを使って、交流を一方向の電流に変える。","鉄心に巻いたコイルで、交流の電圧を変える。","高調波を取り除いて、電波障害を防ぐ。"],"answer":0,"explain":"\u003cp>平滑回路は、整流したあとの脈流の波（リップル）を、コンデンサやチョークコイルで平らな直流に近づけます。\u003c/p>","refs":[],"section":"K07-2","fixed":false},{"id":"K07-09","subject":"無線工学","chapter":"K07","text":"\u003cp>ブリッジ整流回路に使うダイオードの数はどれか。\u003c/p>","choices":["4 個","1 個","2 個","3 個"],"answer":0,"explain":"\u003cp>ブリッジ整流は、4 個のダイオードを橋のように組んだ全波整流です。半波整流は 1 個、中点タップ形の全波整流は 2 個です。\u003c/p>","refs":[],"section":"K07-3","fixed":false},{"id":"K07-10","subject":"無線工学","chapter":"K07","text":"\u003cp>半波整流回路と全波整流回路をくらべたときの説明として、正しいものはどれか。\u003c/p>","choices":["全波整流のほうが、脈流の波（リップル）が小さく、平らにしやすい。","半波整流のほうが、脈流の波（リップル）が小さい。","全波整流は、交流の片方の向きだけを使う。","半波整流には、ダイオードが 4 個要る。"],"answer":0,"explain":"\u003cp>全波整流は交流の両方の向きを使うので、半波整流より脈流の波が小さくなります。\u003c/p>","refs":[],"section":"K07-3","fixed":false},{"id":"K07-11","subject":"無線工学","chapter":"K07","text":"\u003cp>鉛蓄電池 1 個（1 セル）の電圧はおよそいくらか。\u003c/p>","choices":["2 V","1.2 V","1.5 V","3.7 V"],"answer":0,"explain":"\u003cp>鉛蓄電池は 1 セル約 2 V で、6 セルを直列にして 12 V にしたものが自動車などで使われます。1.2 V はニッケル水素電池、1.5 V は乾電池、3.7 V はリチウムイオン電池です。\u003c/p>","refs":[],"section":"K07-1","fixed":false},{"id":"K08-01","subject":"無線工学","chapter":"K08","text":"\u003cp>周波数が 145 MHz の電波の波長に、最も近いものはどれか。\u003c/p>","choices":["約 2 m","約 0.5 m","約 1 m","約 4 m"],"answer":0,"explain":"\u003cp>波長〔m〕 ＝ 300 ÷ 周波数〔MHz〕です。300 ÷ 145 ≒ 2.07 m です。\u003c/p>","refs":[],"section":"K08-1","fixed":false},{"id":"K08-02","subject":"無線工学","chapter":"K08","text":"\u003cp>波長が 2 m の電波の周波数はどれか。\u003c/p>","choices":["150 MHz","600 MHz","75 MHz","300 MHz"],"answer":0,"explain":"\u003cp>周波数〔MHz〕 ＝ 300 ÷ 波長〔m〕です。300 ÷ 2 ＝ 150 MHz です。\u003c/p>","refs":[],"section":"K08-1","fixed":false},{"id":"K08-03","subject":"無線工学","chapter":"K08","text":"\u003cp>周波数が 435 MHz の電波の 2 分の 1 波長に、最も近い長さはどれか。\u003c/p>","choices":["約 35 cm","約 69 cm","約 17 cm","約 1.4 m"],"answer":0,"explain":"\u003cp>波長は 300 ÷ 435 ≒ 0.69 m（69 cm）です。その 2 分の 1 なので約 35 cm です。\u003c/p>","refs":[],"section":"K08-1","fixed":false},{"id":"K08-04","subject":"無線工学","chapter":"K08","text":"\u003cp>半波長ダイポール空中線の給電点インピーダンスに、最も近いものはどれか。\u003c/p>","choices":["約 73 Ω","約 36 Ω","約 300 Ω","約 600 Ω"],"answer":0,"explain":"\u003cp>半波長ダイポールは約 73 Ω です。1/4 波長垂直接地空中線は約 36 Ω です。\u003c/p>","refs":[],"section":"K08-2","fixed":false},{"id":"K08-05","subject":"無線工学","chapter":"K08","text":"\u003cp>水平に張った半波長ダイポール空中線の、水平面内の指向性として、正しいものはどれか。\u003c/p>","choices":["導線と直角の方向に強い（8 の字形）","導線の方向に強い","全方向に同じ（無指向性）","一方向だけに鋭い（単一指向性）"],"answer":0,"explain":"\u003cp>半波長ダイポールは、導線と直角の方向に強く電波を出し、導線の方向にはほとんど出しません。8 の字形の指向性です。\u003c/p>","refs":[],"section":"K08-2","fixed":false},{"id":"K08-06","subject":"無線工学","chapter":"K08","text":"\u003cp>1/4 波長垂直接地空中線（グランドプレーン空中線など）の、水平面内の指向性として、正しいものはどれか。\u003c/p>","choices":["全方向に同じ（無指向性）","8 の字形","一方向だけに鋭い（単一指向性）","真上の方向だけに強い"],"answer":0,"explain":"\u003cp>垂直に立てた空中線は、水平面内のどの方向にも同じように電波を出します。移動する局との通信に向いています。\u003c/p>","refs":[],"section":"K08-2","fixed":false},{"id":"K08-07","subject":"無線工学","chapter":"K08","text":"\u003cp>八木・宇田空中線の素子について、正しいものはどれか。\u003c/p>","choices":["導波器は放射器より少し短く、反射器は放射器より少し長い。","導波器は放射器より少し長く、反射器は放射器より少し短い。","導波器も反射器も、放射器と同じ長さにする。","給電するのは反射器である。"],"answer":0,"explain":"\u003cp>給電する素子が放射器です。前に少し短い導波器、後ろに少し長い反射器を置きます。電波は導波器の方向に強く出ます。\u003c/p>","refs":[],"sect
