  ${c.sections.length ? `<nav class="chtoc noprint" aria-label="この章の節"><ol>${c.sections.map(s => `<li><a href="#/book/${c.id}/${s.id}">${esc(s.title)}</a></li>`).join('')}</ol></nav>` : ''}
  <article class="book">${c.html}</article>
  <div class="actions noprint"><button class="primary" type="button" data-act="chapter-practice" data-v="${c.id}">この章の問題を解く（${list.length} 問）</button><button type="button" data-act="print">印刷する</button></div>
  <p class="pager noprint">${prev ? `<a href="#/book/${prev.id}">← ${esc(chLabel(prev))}</a>` : '<span></span>'}${next ? `<a href="#/book/${next.id}">${esc(chLabel(next))} →</a>` : ''}</p>`;
  if (secId) document.getElementById(secId)?.scrollIntoView();
}

// ── 使い方 ─────────────────────────────────────────
function viewHelp() {
  $app.innerHTML = `<h2>使い方</h2>
  <h3>この問題集について</h3>
  <p>${D.licenses.map(l => `${esc(l.name)}（${esc(l.short)}）`).join('と')}の${D.licenses.length > 1 ? '国家試験' : '試験'}に向けて、個人が作った非公式の練習問題と教科書です。${esc(D.app.disclaimer)}とは関係ありません。</p>
  <p>問題は過去の試験問題を写したものではなく、${esc(D.app.basis)}をもとに、新しく作ったものです。${SUBJECTS.filter(s => s.needRefs).map(s => esc(s.name)).join('と')}の問題には、根拠になる条文を付けています。条文は e-Gov 法令検索から ${esc(D.lawsFetched)} に取得したものです。${D.intlChecked ? `国際法規（通信憲章と無線通信規則）は e-Gov にないので、ITU（国際電気通信連合）が発行した英語の原文と、この問題集の日本語訳を載せています（${esc(D.intlChecked)} に確認）。` : ''}</p>
  ${D.licenses.length > 1 ? `<h3>資格の切り替え</h3>
  <p>画面のいちばん上の「${D.licenses.map(l => esc(l.short)).join('」「')}」で切り替えます。${D.licenses.slice(1).map(l => `${esc(l.short)}の範囲は ${esc(D.licenses[0].short)}の範囲を含むので、${esc(l.short)}には ${esc(D.licenses[0].short)}の章もすべて入っています。`).join('')}解いた記録は資格に関係なく共通で、練習の設定と模擬試験の結果は資格ごとに残ります。</p>` : ''}
  <h3>練習</h3>
  <p>科目・章・問題の数を選んで解きます。答えるとすぐに、正解と解説が出ます。「教科書で読む」から関係する節を読み、「問題にもどる」で続きに戻れます。</p>
  <h3>模擬試験</h3>
  <p>${esc(L.short)}の${esc(examText())}模擬試験も同じ形で解き、時間を計って採点します。</p>
  <h3>復習</h3>
  <p>まちがえた問題を集めて、解き直せます。「最後にまちがえた問題」は、いちばん新しい答えがまちがっていた問題です。</p>
  <h3>記録</h3>
  <p>記録は、この端末のこのブラウザーの中だけに保存され、どこにも送られません。ブラウザーの閲覧データを消すと、記録も消えます。ほかの端末に移すときは、「復習」の画面で書き出して読み込みます。</p>
  <h3>キーボード</h3>
  <ul><li>1〜${D.app.choices}：選択肢を選ぶ</li><li>Enter か →：次の問題（練習）</li><li>← と →：前の問題・次の問題（模擬試験）</li></ul>
  ${D.app.helpExam ? `<h3>本番の試験</h3>
  <p>${D.app.helpExam}</p>` : ''}
  ${D.app.related.length || L.video ? `<h3>関連</h3>
  ${D.app.related.map(h => `<p>${h}</p>`).join('')}
  ${L.video ? `<p>YouTube の動画「<a href="${esc(L.video.url)}" target="_blank" rel="noopener">${esc(L.video.title)}</a>」（${esc(L.video.length)}）で、試験の形と取り方、この問題集の使い方を見られます。</p>` : ''}` : ''}`;
}

// ── 画面の切り替え ─────────────────────────────────────
const VIEWS = { home: viewHome, practice: viewPractice, mock: viewMock, review: viewReview, book: viewBook, help: viewHelp };
function route() {
  if (skipHash) { skipHash = false; return; }
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const name = VIEWS[parts[0]] ? parts[0] : 'home';
  if (exam && !exam.done && name !== 'mock') {
    if (!confirm('模擬試験の途中です。やめてほかの画面に移りますか？（答えは採点されません）')) { skipHash = true; location.hash = '#/mock'; return; }
    exam = null;
    clearInterval(timer);
  }
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === name));
  window.scrollTo(0, 0);
  VIEWS[name](parts.slice(1));
  $app.focus({ preventScroll: true });
}

const ACTIONS = {
  'pick-subject': v => { prefs.subj = v; prefs.chapters = null; savePrefs(); },
  'lic': v => switchLicense(v),
  'all-ch': () => { document.querySelectorAll('#setup input[name=ch]').forEach(x => { x.checked = true; }); readSetup(); updateCount(); },
  'no-ch': () => { document.querySelectorAll('#setup input[name=ch]').forEach(x => { x.checked = false; }); readSetup(); updateCount(); },
  'choose': (v, el) => { if (el.getAttribute('aria-disabled') !== 'true') choosePractice(+v); },
  'next': () => nextPractice(),
  'quit': () => {
    const done = sess.ids.filter(id => sess.answers[id] !== undefined);
    if (!done.length) { sess = null; go('#/practice'); return; }
    sess.ids = done; sess.done = true; go('#/practice/result');
  },
  'retry-wrong': () => startSession(shuffle(sess.ids.filter(id => sess.answers[id] !== qOf(id).answer))),
  'retry-same': () => startSession(shuffle(sess.ids)),
  'to-setup': () => { sess = null; },
  'exam-start': () => startExam(),
  'exam-choose': v => { exam.answers[exam.ids[exam.i]] = +v; viewExam(); },
  'exam-go': v => { exam.i = +v; viewExam(); },
  'exam-prev': () => { if (exam.i > 0) { exam.i--; viewExam(); } },
  'exam-next': () => { if (exam.i < exam.ids.length - 1) { exam.i++; viewExam(); } },
  'exam-flag': () => { const id = exam.ids[exam.i]; exam.flags[id] = !exam.flags[id]; viewExam(); },
  'exam-finish': () => {
    const left = exam.ids.filter(id => exam.answers[id] === undefined).length;
    if (left && !confirm(`まだ答えていない問題が ${left} 問あります。採点しますか？`)) return;
    finishExam(false);
  },
  'exam-quit': () => { if (confirm('模擬試験をやめますか？（答えは採点されません）')) { exam = null; clearInterval(timer); go('#/mock'); } },
  'exam-wrong': () => startSession(shuffle(exam.ids.filter(id => exam.answers[id] !== qOf(id).answer))),
  'review-last': () => startSession(shuffle(QS.filter(q => stats[q.id]?.last === 0).map(q => q.id))),
  'review-ever': () => startSession(shuffle(QS.filter(q => stats[q.id] && stats[q.id].ok < stats[q.id].n).map(q => q.id))),
  'solve-one': v => startSession([v]),
  'chapter-practice': v => startSession(shuffle(QS.filter(q => q.chapter === v).map(q => q.id))),
  'print': () => window.print(),
  'export': () => exportRecords(),
  'clear': () => {
    if (!confirm(`解いた記録と模擬試験の結果（${D.licenses.map(l => l.short).join('・')}）を、すべて消しますか？`)) return;
    stats = {}; store.del('stats');
    for (const l of D.licenses) store.del(keyOf('mock', l.id));
    viewReview();
  },
};
// 資格を切り替える。模擬試験の途中なら確かめる。練習の途中のものはやめて、いまの画面を新しい資格で描き直す
// （練習の問題・結果や、新しい資格にない章の教科書を開いていたときは、その画面の入口に戻す）
function switchLicense(id) {
  if (!D.licenses.some(l => l.id === id) || id === L.id) return;
  if (exam && !exam.done && !confirm('模擬試験の途中です。資格を切り替えると、答えは採点されません。切り替えますか？')) return;
  exam = null; clearInterval(timer); sess = null;
  useLicense(id);
  renderFoot();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const keep = parts[0] === 'book' && parts[1] && L.chapters.includes(parts[1]);
  go(keep ? location.hash : `#/${parts[0] && VIEWS[parts[0]] ? parts[0] : ''}`);
}
document.getElementById('lic').addEventListener('click', e => { const b = e.target.closest('[data-lic]'); if (b) switchLicense(b.dataset.lic); });
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !ACTIONS[t.dataset.act]) return;
  if (t.tagName !== 'A') e.preventDefault();
  ACTIONS[t.dataset.act](t.dataset.v, t);
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files[0]) return importRecords(t.files[0]);
  if (!t.closest('#setup')) return;
  if (t.name === 'subj') { prefs.subj = t.value; prefs.chapters = null; savePrefs(); viewPractice([]); return; }
  readSetup();
  updateCount();
});
$app.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  readSetup();
  const pool = poolFromPrefs();
  if (pool.length) startSession(pickQuestions(pool, prefs.n, prefs.order));
});
$app.addEventListener('input', e => { if (e.target.id === 'q') searchBook(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest?.('input, textarea, select')) return;
  const name = location.hash.replace(/^#\/?/, '').split('/')[0];
  const n = '123456789'.indexOf(e.key);
  if (name === 'practice' && sess && !sess.done && document.querySelector('[data-act=choose]')) {
    const id = sess.ids[sess.i], answered = sess.answers[id] !== undefined;
    if (!answered && n >= 0 && n < sess.orders[id].length) { e.preventDefault(); choosePractice(sess.orders[id][n]); }
    else if (answered && (e.key === 'Enter' || e.key === 'ArrowRight') && !e.target.closest('button, a')) { e.preventDefault(); nextPractice(); }
  } else if (name === 'mock' && exam && !exam.done) {
    const id = exam.ids[exam.i];
    if (n >= 0 && n < exam.orders[id].length) { exam.answers[id] = exam.orders[id][n]; viewExam(); }
    else if (e.key === 'ArrowLeft') ACTIONS['exam-prev']();
    else if (e.key === 'ArrowRight') ACTIONS['exam-next']();
  }
});
window.addEventListener('beforeunload', e => { if (exam && !exam.done) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', route);

function renderFoot() {
  document.getElementById('foot').innerHTML = `<p>非公式の練習問題と教科書です。${esc(D.app.disclaimer)}とは関係ありません。問題は過去の試験問題の写しではありません。</p>
<p>法令の本文：e-Gov 法令検索（${esc(D.lawsFetched)} 取得）${D.intlChecked ? `・国際法規：ITU の原文（${esc(D.intlChecked)} 確認）` : ''}・最終更新：${esc(D.generated)}・${esc(L.short)} ${QS.length} 問</p>`;
}
// はじめの資格：アドレスの ?lic=3ama などがあればそれ、なければ前に選んだ資格、なければ 4アマ
const licParam = (() => { try { return new URLSearchParams(location.search).get('lic'); } catch { return null; } })();
useLicense(D.licenses.some(l => l.id === licParam) ? licParam : store.get('lic', D.licenses[0].id));
renderFoot();
route();
</script>
</body>
