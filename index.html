}],"search":[{"id":"","title":"","text":"受信機は、空中線に届いたたくさんの電波の中から目的の電波を選び、声に戻します。この章では、スーパーヘテロダイン受信機のしくみと、FM 受信機・SSB 受信機の回路を覚えます。"},{"id":"K05-1","title":"受信機の性能","text":"受信機の性能 性能意味感度どれだけ弱い電波まで受信できるか選択度近くの周波数の電波と分けて、目的の電波だけを選び出せるか忠実度送られた音を、どれだけ忠実に再現できるか安定度周波数や感度が、時間がたっても変わらないか"},{"id":"K05-2","title":"スーパーヘテロダイン受信機","text":"スーパーヘテロダイン受信機 受信した電波を、いったん一定の周波数（中間周波数）に変えてから増幅する受信機を、スーパーヘテロダイン受信機といいます。 空中線→高周波増幅器→周波数混合器→中間周波増幅器→検波器→低周波増幅器→スピーカー局部発振器→周波数混合器 高周波増幅器：受信した電波を増幅する。感度をよくし、影像周波数による妨害を減らす周波数混合器と局部発振器：受信した電波と局部発振器の出力をまぜて、中間周波数に変える（周波数変換）中間周波増幅器：中間周波数で増幅する。受信機の選択度は、おもにここで決まる検波器：中間周波数の信号から、音声の信号を取り出す低周波増幅器：音声の信号を、スピーカーを鳴らせる大きさまで増幅する 中間周波数は、局部発振周波数と受信周波数の差です。 中間周波数 ＝ 局部発振周波数 － 受信周波数（局部発振周波数が高いとき）"},{"id":"K05-3","title":"影像周波数","text":"影像周波数 局部発振周波数から見て、受信周波数と反対側に中間周波数だけ離れた周波数の電波も、同じ中間周波数に変換されてしまいます。この周波数を影像周波数（イメージ周波数）といい、混信の原因になります。 影像周波数 ＝ 受信周波数 ＋ 中間周波数 × 2（局部発振周波数が受信周波数より高いとき） 例：受信周波数 145.0 MHz、中間周波数 10.7 MHz、局部発振周波数 155.7 MHz のとき、影像周波数は 145.0 ＋ 10.7 × 2 ＝ 166.4 MHz です。 影像周波数による妨害は、高周波増幅器の同調回路の選択度をよくしたり、中間周波数を高くしたりすると減らせます。"},{"id":"K05-4","title":"AGC","text":"AGC 受信する電波の強さが変わっても、出力（音の大きさ）をほぼ一定に保つ回路を、AGC（自動利得調整）回路といいます。フェージングで電波の強さが変わるときに役立ちます。"},{"id":"K05-5","title":"FM 受信機","text":"FM 受信機 空中線→高周波増幅器→周波数混合器→中間周波増幅器→振幅制限器→周波数弁別器→低周波増幅器→スピーカー 振幅制限器（リミッタ）：振幅を一定にそろえて、振幅の変化として入ってくる雑音を取り除く周波数弁別器：周波数の変化を、音声の信号に変える（FM の検波）スケルチ回路：電波が来ていないときに出る大きな雑音を消す（UV-5R Mini のメニュー 2-2 Squelch もこれ）ディエンファシス回路：送信側で強めた高い音を、元に戻す"},{"id":"K05-6","title":"SSB 受信機","text":"SSB 受信機 SSB の電波には搬送波がないので、受信機の中で搬送波の代わりの信号を作って加え、音声を取り出します。この信号を作る発振器を BFO（うなり周波数発振器）、音声を取り出す検波器をプロダクト検波器（積検波器）といいます。電信（A1A）を聞くときも、BFO を使ってモールス符号を音にします。"}],"only":""},{"id":"K06","subject":"無線工学","num":6,"title":"電波障害","html":"\u003cp>アマチュア局の電波が、近所のテレビやラジオ、電話機などに雑音や声を入れてしまうことがあります。これを電波障害といいます。この章では、電波障害の種類と原因、送信側と受信側の対策を覚えます。\u003c/p>\n\u003ch3 id=\"K06-1\">電波障害の種類\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>名前\u003c/th>\u003cth>障害を受けるもの\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TVI\u003c/td>\u003ctd>テレビ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BCI\u003c/td>\u003ctd>ラジオ（放送の受信）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>テレホン I\u003c/td>\u003ctd>電話機\u003c/td>\u003c/tr>\u003ctr>\u003ctd>アンプ I\u003c/td>\u003ctd>オーディオのアンプ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>I は、妨害を表す英語 Interference の頭文字です。\u003c/p>\n\u003ch3 id=\"K06-2\">原因\u003c/h3>\n\u003cp>送信側に原因があるもの\u003c/p>\n\u003cul>\u003cli>高調波：送信周波数の整数倍（2 倍、3 倍など）の周波数の電波。スプリアス発射の一つで、ほかの無線局や放送の周波数に重なると障害になる\u003c/li>\u003cli>寄生振動：送信機が、目的の周波数とは関係のない周波数で発振すること\u003c/li>\u003cli>過変調：占有周波数帯幅が広がり、近くの周波数に妨害を与える\u003c/li>\u003c/ul>\n\u003cp>受信側に原因があるもの\u003c/p>\n\u003cul>\u003cli>強い電波が、テレビやアンプ、電話機の中に入り、半導体などで検波されて、声や雑音が出る\u003c/li>\u003cli>テレビやラジオの受信機の選択度が十分でない\u003c/li>\u003c/ul>\n\u003cp>例：145 MHz の電波の 2 倍の高調波（第 2 高調波）は 290 MHz、3 倍（第 3 高調波）は 435 MHz です。\u003c/p>\n\u003ch3 id=\"K06-3\">送信側の対策\u003c/h3>\n\u003cul>\u003cli>送信機の出力と空中線の間に低域フィルタ（LPF）を入れて、高調波を減らす\u003c/li>\u003cli>送信機を金属のケースに入れて（シールド）、確実に接地（アース）する\u003c/li>\u003cli>過変調にしない。寄生振動が起きないように調整する\u003c/li>\u003cli>空中線を、テレビの空中線や電灯線から離して設置する\u003c/li>\u003cli>空中線電力を、通信に必要な最小の大きさにする\u003c/li>\u003c/ul>\n\u003ch3 id=\"K06-4\">受信側の対策\u003c/h3>\n\u003cul>\u003cli>テレビの空中線の入力に高域フィルタ（HPF）を入れて、テレビより低い周波数（短波など）の電波が入らないようにする\u003c/li>\u003cli>電話機やアンプの線に、フェライトコアを付ける\u003c/li>\u003cli>受信側の対策は、相手の了解を得てから行う\u003c/li>\u003c/ul>\n\u003cp>障害が起きたときは、まず自局の送信設備を確かめ、相手にていねいに対応します。\u003c/p>","sections":[{"id":"K06-1","title":"電波障害の種類"},{"id":"K06-2","title":"原因"},{"id":"K06-3","title":"送信側の対策"},{"id":"K06-4","title":"受信側の対策"}],"search":[{"id":"","title":"","text":"アマチュア局の電波が、近所のテレビやラジオ、電話機などに雑音や声を入れてしまうことがあります。これを電波障害といいます。この章では、電波障害の種類と原因、送信側と受信側の対策を覚えます。"},{"id":"K06-1","title":"電波障害の種類","text":"電波障害の種類 名前障害を受けるものTVIテレビBCIラジオ（放送の受信）テレホン I電話機アンプ Iオーディオのアンプ I は、妨害を表す英語 Interference の頭文字です。"},{"id":"K06-2","title":"原因","text":"原因 送信側に原因があるもの 高調波：送信周波数の整数倍（2 倍、3 倍など）の周波数の電波。スプリアス発射の一つで、ほかの無線局や放送の周波数に重なると障害になる寄生振動：送信機が、目的の周波数とは関係のない周波数で発振すること過変調：占有周波数帯幅が広がり、近くの周波数に妨害を与える 受信側に原因があるもの 強い電波が、テレビやアンプ、電話機の中に入り、半導体などで検波されて、声や雑音が出るテレビやラジオの受信機の選択度が十分でない 例：145 MHz の電波の 2 倍の高調波（第 2 高調波）は 290 MHz、3 倍（第 3 高調波）は 435 MHz です。"},{"id":"K06-3","title":"送信側の対策","text":"送信側の対策 送信機の出力と空中線の間に低域フィルタ（LPF）を入れて、高調波を減らす送信機を金属のケースに入れて（シールド）、確実に接地（アース）する過変調にしない。寄生振動が起きないように調整する空中線を、テレビの空中線や電灯線から離して設置する空中線電力を、通信に必要な最小の大きさにする"},{"id":"K06-4","title":"受信側の対策","text":"受信側の対策 テレビの空中線の入力に高域フィルタ（HPF）を入れて、テレビより低い周波数（短波など）の電波が入らないようにする電話機やアンプの線に、フェライトコアを付ける受信側の対策は、相手の了解を得てから行う 障害が起きたときは、まず自局の送信設備を確かめ、相手にていねいに対応します。"}],"only":""},{"id":"K07","subject":"無線工学","num":7,"title":"電源","html":"\u003cp>無線機を動かすには、直流の電源が要ります。この章では、電池のつなぎ方と、交流から直流を作る電源回路（整流・平滑・定電圧）を覚えます。\u003c/p>\n\u003ch3 id=\"K07-1\">電池\u003c/h3>\n\u003cp>電池には、使い切りの一次電池（乾電池など）と、充電してくり返し使える二次電池（蓄電池）があります。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>電池\u003c/th>\u003cth>種類\u003c/th>\u003cth>1 個（1 セル）の電圧\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>マンガン乾電池、アルカリ乾電池\u003c/td>\u003ctd>一次電池\u003c/td>\u003ctd>1.5 V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ニッケル水素電池\u003c/td>\u003ctd>二次電池\u003c/td>\u003ctd>1.2 V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鉛蓄電池\u003c/td>\u003ctd>二次電池\u003c/td>\u003ctd>2 V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>リチウムイオン電池\u003c/td>\u003ctd>二次電池\u003c/td>\u003ctd>約 3.7 V\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>電池の容量は、どれだけの電流を何時間流せるかで表し、単位はアンペア時〔Ah〕です。例：2 Ah の電池は、0.5 A の電流なら約 2 ÷ 0.5 ＝ 4 時間使えます。\u003c/p>\n\u003cp>電池のつなぎ方は、次のとおりです。\u003c/p>\n\u003cul>\u003cli>直列につなぐと、電圧は足し算になる。容量（Ah）は 1 個のときと同じ\u003c/li>\u003cli>並列につなぐと、電圧は 1 個のときと同じ。容量（Ah）は足し算になる（電圧の同じ電池どうしをつなぐ）\u003c/li>\u003c/ul>\n\u003cp>例：1.5 V の乾電池 4 個を直列にすると 6 V です。12 V・20 Ah の蓄電池 2 個を並列にすると、12 V・40 Ah です。\u003c/p>\n\u003ch3 id=\"K07-2\">交流から直流を作る\u003c/h3>\n\u003cp>家庭のコンセントの交流から、無線機に使う直流を作る装置を電源装置といいます。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"交流 → 変圧器 → 整流回路 → 平滑回路 → 定電圧回路 → 直流\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">交流\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">変圧器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">整流回路\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">平滑回路\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">定電圧回路\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">直流\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>変圧器：交流の電圧を、必要な大きさに変える\u003c/li>\u003cli>整流回路：ダイオードで、交流を一方向の電流（脈流）に変える\u003c/li>\u003cli>平滑回路：コンデンサやチョークコイルで、脈流の波を平らにする\u003c/li>\u003cli>定電圧回路：入力の電圧や負荷が変わっても、出力の電圧を一定に保つ（ツェナーダイオードなどを使う）\u003c/li>\u003c/ul>\n\u003ch3 id=\"K07-3\">整流回路\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>回路\u003c/th>\u003cth>ダイオードの数\u003c/th>\u003cth>しくみ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>半波整流\u003c/td>\u003ctd>1 個\u003c/td>\u003ctd>交流の片方の向きだけを使う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>全波整流（中点タップ形）\u003c/td>\u003ctd>2 個\u003c/td>\u003ctd>変圧器の 2 次側の中点を使い、両方の向きを使う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ブリッジ整流（全波整流）\u003c/td>\u003ctd>4 個\u003c/td>\u003ctd>4 個のダイオードを橋のように組み、両方の向きを使う\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全波整流は、半波整流より脈流の波（リップル）が小さく、平らにしやすくなります。\u003c/p>\n\u003ch3 id=\"K07-4\">電源を使うときの注意\u003c/h3>\n\u003cul>\u003cli>無線機の消費電流より大きな電流を流せる電源を使う（送信のときは、受信のときより電流が大きい）\u003c/li>\u003cli>電圧と、プラス・マイナスの向き（極性）を確かめてからつなぐ\u003c/li>\u003cli>ヒューズは、決められた容量のものを使う\u003c/li>\u003c/ul>","sections":[{"id":"K07-1","title":"電池"},{"id":"K07-2","title":"交流から直流を作る"},{"id":"K07-3","title":"整流回路"},{"id":"K07-4","title":"電源を使うときの注意"}],"search":[{"id":"","title":"","text":"無線機を動かすには、直流の電源が要ります。この章では、電池のつなぎ方と、交流から直流を作る電源回路（整流・平滑・定電圧）を覚えます。"},{"id":"K07-1","title":"電池","text":"電池 電池には、使い切りの一次電池（乾電池など）と、充電してくり返し使える二次電池（蓄電池）があります。 電池種類1 個（1 セル）の電圧マンガン乾電池、アルカリ乾電池一次電池1.5 Vニッケル水素電池二次電池1.2 V鉛蓄電池二次電池2 Vリチウムイオン電池二次電池約 3.7 V 電池の容量は、どれだけの電流を何時間流せるかで表し、単位はアンペア時〔Ah〕です。例：2 Ah の電池は、0.5 A の電流なら約 2 ÷ 0.5 ＝ 4 時間使えます。 電池のつなぎ方は、次のとおりです。 直列につなぐと、電圧は足し算になる。容量（Ah）は 1 個のときと同じ並列につなぐと、電圧は 1 個のときと同じ。容量（Ah）は足し算になる（電圧の同じ電池どうしをつなぐ） 例：1.5 V の乾電池 4 個を直列にすると 6 V です。12 V・20 Ah の蓄電池 2 個を並列にすると、12 V・40 Ah です。"},{"id":"K07-2","title":"交流から直流を作る","text":"交流から直流を作る 家庭のコンセントの交流から、無線機に使う直流を作る装置を電源装置といいます。 交流→変圧器→整流回路→平滑回路→定電圧回路→直流 変圧器：交流の電圧を、必要な大きさに変える整流回路：ダイオードで、交流を一方向の電流（脈流）に変える平滑回路：コンデンサやチョークコイルで、脈流の波を平らにする定電圧回路：入力の電圧や負荷が変わっても、出力の電圧を一定に保つ（ツェナーダイオードなどを使う）"},{"id":"K07-3","title":"整流回路","text":"整流回路 回路ダイオードの数しくみ半波整流1 個交流の片方の向きだけを使う全波整流（中点タップ形）2 個変圧器の 2 次側の中点を使い、両方の向きを使うブリッジ整流（全波整流）4 個4 個のダイオードを橋のように組み、両方の向きを使う 全波整流は、半波整流より脈流の波（リップル）が小さく、平らにしやすくなります。"},{"id":"K07-4","title":"電源を使うときの注意","text":"電源を使うときの注意 無線機の消費電流より大きな電流を流せる電源を使う（送信のときは、受信のときより電流が大きい）電圧と、プラス・マイナスの向き（極性）を確かめてからつなぐヒューズは、決められた容量のものを使う"}],"only":""},{"id":"K08","subject":"無線工学","num":8,"title":"空中線と給電線","html":"\u003cp>空中線（アンテナ）は、送信機の高周波の電力を電波にして空間に出し、空間の電波を受け止める装置です。この章では、波長と空中線の長さ、代表的な空中線の性質、給電線と整合（SWR）を覚えます。\u003c/p>\n\u003ch3 id=\"K08-1\">周波数と波長\u003c/h3>\n\u003cp>電波は、1 秒間に約 30 万 km（3 × 10⁸ m）進みます。波 1 つ分の長さを波長といい、周波数が高いほど短くなります。\u003c/p>\n\u003cdiv class=\"formula\">波長〔m〕 ＝ 300 ÷ 周波数〔MHz〕\u003c/div>\n\u003cp>例：145 MHz の波長は 300 ÷ 145 ≒ 2.07 m、435 MHz の波長は 300 ÷ 435 ≒ 0.69 m です。\u003c/p>\n\u003cp>空中線の長さは、波長を基準に決めます。たとえば 145 MHz の 2 分の 1 波長は約 1 m、4 分の 1 波長は約 50 cm です。\u003c/p>\n\u003ch3 id=\"K08-2\">代表的な空中線\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>空中線\u003c/th>\u003cth>形\u003c/th>\u003cth>給電点インピーダンス\u003c/th>\u003cth>指向性（水平面）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>半波長ダイポール\u003c/td>\u003ctd>2 分の 1 波長の導線の中央から給電する\u003c/td>\u003ctd>約 73 Ω\u003c/td>\u003ctd>水平に張ると、導線と直角の方向に強い（8 の字形）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1/4 波長垂直接地空中線\u003c/td>\u003ctd>4 分の 1 波長の導線を、大地の上に垂直に立てる\u003c/td>\u003ctd>約 36 Ω\u003c/td>\u003ctd>全方向に同じ（無指向性）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>八木・宇田空中線（八木アンテナ）\u003c/td>\u003ctd>放射器（給電する素子）の前に導波器、後ろに反射器を並べる\u003c/td>\u003ctd>構造による\u003c/td>\u003ctd>導波器の方向に鋭い（単一指向性）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>八木・宇田空中線の導波器は放射器より少し短く、反射器は放射器より少し長くします。導波器の数を増やすと、利得が上がり、指向性が鋭くなります\u003c/li>\u003cli>水平に置いた空中線からは水平偏波、垂直に立てた空中線からは垂直偏波の電波が出ます。相手と偏波をそろえると、よく受信できます\u003c/li>\u003cli>グランドプレーン空中線は、大地の代わりに、根元に放射状の導線（ラジアル）を付けた 1/4 波長の垂直空中線です。水平面内は無指向性です\u003c/li>\u003cli>ハンディ機のホイップ空中線や、空中線を短くしたいときは、途中にコイル（延長コイル）を入れて電気的な長さを長くします\u003c/li>\u003c/ul>\n\u003ch3 id=\"K08-3\">給電線\u003c/h3>\n\u003cp>送信機と空中線をつなぐ線を、給電線といいます。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>給電線\u003c/th>\u003cth>形\u003c/th>\u003cth>特性インピーダンス\u003c/th>\u003cth>平衡・不平衡\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>同軸ケーブル\u003c/td>\u003ctd>中心の導体のまわりを、絶縁物をはさんで網線で包んだもの\u003c/td>\u003ctd>50 Ω、75 Ω など\u003c/td>\u003ctd>不平衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平行二線式給電線\u003c/td>\u003ctd>2 本の導線を平行に並べたもの\u003c/td>\u003ctd>200 Ω、300 Ω など\u003c/td>\u003ctd>平衡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>半波長ダイポールのような平衡形の空中線に、同軸ケーブル（不平衡）をつなぐときは、バラン（平衡不平衡変換器）を使います。\u003c/p>\n\u003ch3 id=\"K08-4\">整合と SWR\u003c/h3>\n\u003cp>空中線の給電点インピーダンスと、給電線の特性インピーダンスが等しいことを、整合がとれているといいます。整合がとれていないと、電力の一部が空中線から送信機の側へ戻り（反射）、給電線の上に定在波ができます。\u003c/p>\n\u003cp>定在波の大きさを表すのが定在波比（SWR）です。SWR は 1 以上の値で、1 に近いほど整合がよく、反射が少ないことを表します。SWR は、送信機と空中線の間に SWR メーター（通過形電力計）を入れて測ります。\u003c/p>","sections":[{"id":"K08-1","title":"周波数と波長"},{"id":"K08-2","title":"代表的な空中線"},{"id":"K08-3","title":"給電線"},{"id":"K08-4","title":"整合と SWR"}],"search":[{"id":"","title":"","text":"空中線（アンテナ）は、送信機の高周波の電力を電波にして空間に出し、空間の電波を受け止める装置です。この章では、波長と空中線の長さ、代表的な空中線の性質、給電線と整合（SWR）を覚えます。"},{"id":"K08-1","title":"周波数と波長","text":"周波数と波長 電波は、1 秒間に約 30 万 km（3 × 10⁸ m）進みます。波 1 つ分の長さを波長といい、周波数が高いほど短くなります。 波長〔m〕 ＝ 300 ÷ 周波数〔MHz〕 例：145 MHz の波長は 300 ÷ 145 ≒ 2.07 m、435 MHz の波長は 300 ÷ 435 ≒ 0.69 m です。 空中線の長さは、波長を基準に決めます。たとえば 145 MHz の 2 分の 1 波長は約 1 m、4 分の 1 波長は約 50 cm です。"},{"id":"K08-2","title":"代表的な空中線","text":"代表的な空中線 空中線形給電点インピーダンス指向性（水平面）半波長ダイポール2 分の 1 波長の導線の中央から給電する約 73 Ω水平に張ると、導線と直角の方向に強い（8 の字形）1/4 波長垂直接地空中線4 分の 1 波長の導線を、大地の上に垂直に立てる約 36 Ω全方向に同じ（無指向性）八木・宇田空中線（八木アンテナ）放射器（給電する素子）の前に導波器、後ろに反射器を並べる構造による導波器の方向に鋭い（単一指向性） 八木・宇田空中線の導波器は放射器より少し短く、反射器は放射器より少し長くします。導波器の数を増やすと、利得が上がり、指向性が鋭くなります水平に置いた空中線からは水平偏波、垂直に立てた空中線からは垂直偏波の電波が出ます。相手と偏波をそろえると、よく受信できますグランドプレーン空中線は、大地の代わりに、根元に放射状の導線（ラジアル）を付けた 1/4 波長の垂直空中線です。水平面内は無指向性ですハンディ機のホイップ空中線や、空中線を短くしたいときは、途中にコイル（延長コイル）を入れて電気的な長さを長くします"},{"id":"K08-3","title":"給電線","text":"給電線 送信機と空中線をつなぐ線を、給電線といいます。 給電線形特性インピーダンス平衡・不平衡同軸ケーブル中心の導体のまわりを、絶縁物をはさんで網線で包んだもの50 Ω、75 Ω など不平衡平行二線式給電線2 本の導線を平行に並べたもの200 Ω、300 Ω など平衡 半波長ダイポールのような平衡形の空中線に、同軸ケーブル（不平衡）をつなぐときは、バラン（平衡不平衡変換器）を使います。"},{"id":"K08-4","title":"整合と SWR","text":"整合と SWR 空中線の給電点インピーダンスと、給電線の特性インピーダンスが等しいことを、整合がとれているといいます。整合がとれていないと、電力の一部が空中線から送信機の側へ戻り（反射）、給電線の上に定在波ができます。 定在波の大きさを表すのが定在波比（SWR）です。SWR は 1 以上の値で、1 に近いほど整合がよく、反射が少ないことを表します。SWR は、送信機と空中線の間に SWR メーター（通過形電力計）を入れて測ります。"}],"only":""},{"id":"K09","subject":"無線工学","num":9,"title":"電波の伝わり方","html":"\u003cp>電波は、周波数によって伝わり方がちがいます。この章では、地上波と電離層、VHF・UHF の電波の伝わり方、フェージングなどの現象を覚えます。\u003c/p>\n\u003ch3 id=\"K09-1\">電波の伝わり方の種類\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>種類\u003c/th>\u003cth>伝わり方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>直接波\u003c/td>\u003ctd>送信空中線から受信空中線へ、まっすぐ伝わる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大地反射波\u003c/td>\u003ctd>地面で反射して伝わる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>地表波\u003c/td>\u003ctd>地面に沿って伝わる。周波数が低いほど遠くまで届く\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電離層反射波\u003c/td>\u003ctd>上空の電離層で反射して、遠くまで届く\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>直接波、大地反射波、地表波をまとめて地上波といいます。\u003c/p>\n\u003ch3 id=\"K09-2\">電離層\u003c/h3>\n\u003cp>地上およそ 60 km から 400 km の高さには、太陽の紫外線などで大気が電離した層があり、これを電離層といいます。低いほうから D 層、E 層、F 層です。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>層\u003c/th>\u003cth>高さ（およそ）\u003c/th>\u003cth>性質\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>D 層\u003c/td>\u003ctd>60〜90 km\u003c/td>\u003ctd>昼間だけ現れる。中波や、短波の低い周波数を吸収する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E 層\u003c/td>\u003ctd>約 100 km\u003c/td>\u003ctd>昼間に強い。中波や短波を反射する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F 層\u003c/td>\u003ctd>200〜400 km\u003c/td>\u003ctd>夜も残る。短波を反射して、遠くまで届ける\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>短波（HF）の電波は、電離層と地面で反射をくり返して、地球の裏側まで届くことがあります。\u003c/p>\n\u003cp>スポラジック E 層（Es 層）は、E 層の高さに突然現れる、電子の密度が高い層です。日本では初夏から夏の昼間によく現れ、ふだんは電離層を突き抜ける VHF（50 MHz 帯など）の電波を反射して、遠くまで届けることがあります。\u003c/p>\n\u003ch3 id=\"K09-3\">VHF・UHF の伝わり方\u003c/h3>\n\u003cp>VHF や UHF の電波は、ふつう電離層を突き抜けてしまうので、おもに直接波で伝わります。見通しのきく範囲が、おもな通信範囲です。空中線を高くすると、見通し距離が長くなり、遠くまで届きます。\u003c/p>\n\u003cp>電波の見通し距離は、空気による屈折のため、目で見通せる距離より少し長くなります。送信と受信の空中線の高さを h1、h2〔m〕とすると、次のおよその式で求められます。\u003c/p>\n\u003cdiv class=\"formula\">見通し距離〔km〕 ≒ 4.12 × (√h1 ＋ √h2)\u003c/div>\n\u003cp>例：両方の空中線が地上 4 m なら、4.12 × (2 ＋ 2) ≒ 16 km です。実際には、建物や山にさえぎられて短くなることも、山や建物で反射・回折して、見えない場所に届くこともあります。\u003c/p>\n\u003ch3 id=\"K09-4\">電波の伝わり方の現象\u003c/h3>\n\u003cul>\u003cli>フェージング：受信する電波の強さが、時間とともに強くなったり弱くなったりする現象。いくつかの経路を通った電波が干渉することなどで起こる\u003c/li>\u003cli>デリンジャー現象：太陽の表面の爆発（フレア）で D 層の電子密度が急に高くなり、昼間の地域で短波の電波が吸収されて、通信が突然できなくなる現象。数分から数十分続く\u003c/li>\u003cli>磁気嵐：地球の磁気が乱れて電離層が乱れ、短波の通信が長いあいだ（数日にわたることもある）不安定になる現象\u003c/li>\u003cli>跳躍距離：短波で、送信点から、電離層の反射波が最初に地上に戻ってくる地点までの距離。地表波が届かなくなる地点からこの地点までは、電波が届かない（不感地帯）\u003c/li>\u003c/ul>","sections":[{"id":"K09-1","title":"電波の伝わり方の種類"},{"id":"K09-2","title":"電離層"},{"id":"K09-3","title":"VHF・UHF の伝わり方"},{"id":"K09-4","title":"電波の伝わり方の現象"}],"search":[{"id":"","title":"","text":"電波は、周波数によって伝わり方がちがいます。この章では、地上波と電離層、VHF・UHF の電波の伝わり方、フェージングなどの現象を覚えます。"},{"id":"K09-1","title":"電波の伝わり方の種類","text":"電波の伝わり方の種類 種類伝わり方直接波送信空中線から受信空中線へ、まっすぐ伝わる大地反射波地面で反射して伝わる地表波地面に沿って伝わる。周波数が低いほど遠くまで届く電離層反射波上空の電離層で反射して、遠くまで届く 直接波、大地反射波、地表波をまとめて地上波といいます。"},{"id":"K09-2","title":"電離層","text":"電離層 地上およそ 60 km から 400 km の高さには、太陽の紫外線などで大気が電離した層があり、これを電離層といいます。低いほうから D 層、E 層、F 層です。 層高さ（およそ）性質D 層60〜90 km昼間だけ現れる。中波や、短波の低い周波数を吸収するE 層約 100 km昼間に強い。中波や短波を反射するF 層200〜400 km夜も残る。短波を反射して、遠くまで届ける 短波（HF）の電波は、電離層と地面で反射をくり返して、地球の裏側まで届くことがあります。 スポラジック E 層（Es 層）は、E 層の高さに突然現れる、電子の密度が高い層です。日本では初夏から夏の昼間によく現れ、ふだんは電離層を突き抜ける VHF（50 MHz 帯など）の電波を反射して、遠くまで届けることがあります。"},{"id":"K09-3","title":"VHF・UHF の伝わり方","text":"VHF・UHF の伝わり方 VHF や UHF の電波は、ふつう電離層を突き抜けてしまうので、おもに直接波で伝わります。見通しのきく範囲が、おもな通信範囲です。空中線を高くすると、見通し距離が長くなり、遠くまで届きます。 電波の見通し距離は、空気による屈折のため、目で見通せる距離より少し長くなります。送信と受信の空中線の高さを h1、h2〔m〕とすると、次のおよその式で求められます。 見通し距離〔km〕 ≒ 4.12 × (√h1 ＋ √h2) 例：両方の空中線が地上 4 m なら、4.12 × (2 ＋ 2) ≒ 16 km です。実際には、建物や山にさえぎられて短くなることも、山や建物で反射・回折して、見えない場所に届くこともあります。"},{"id":"K09-4","title":"電波の伝わり方の現象","text":"電波の伝わり方の現象 フェージング：受信する電波の強さが、時間とともに強くなったり弱くなったりする現象。いくつかの経路を通った電波が干渉することなどで起こるデリンジャー現象：太陽の表面の爆発（フレア）で D 層の電子密度が急に高くなり、昼間の地域で短波の電波が吸収されて、通信が突然できなくなる現象。数分から数十分続く磁気嵐：地球の磁気が乱れて電離層が乱れ、短波の通信が長いあいだ（数日にわたることもある）不安定になる現象跳躍距離：短波で、送信点から、電離層の反射波が最初に地上に戻ってくる地点までの距離。地表波が届かなくなる地点からこの地点までは、電波が届かない（不感地帯）"}],"only":""},{"id":"K10","subject":"無線工学","num":10,"title":"測定と保守","html":"\u003cp>無線設備を正しく動かすには、電圧や電流を測ったり、送信機と空中線の具合を確かめたりします。この章では、電圧計と電流計のつなぎ方、テスター、SWR メーター、擬似空中線（ダミーロード）の使い方を覚えます。\u003c/p>\n\u003ch3 id=\"K10-1\">電圧計と電流計\u003c/h3>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>測定器\u003c/th>\u003cth>つなぎ方\u003c/th>\u003cth>内部抵抗\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>電圧計\u003c/td>\u003ctd>測る部分に並列につなぐ\u003c/td>\u003ctd>大きいほどよい（測る回路に影響しにくい）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電流計\u003c/td>\u003ctd>測る回路に直列につなぐ\u003c/td>\u003ctd>小さいほどよい（測る回路に影響しにくい）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>電流計を回路に並列につなぐと、大きな電流が流れて、電流計がこわれることがあります。どれくらいの値か分からないときは、いちばん大きな測定範囲から測り始めます。\u003c/p>\n\u003ch3 id=\"K10-2\">テスター（回路計）\u003c/h3>\n\u003cp>テスターは、1 台で直流電圧、交流電圧、直流電流、抵抗などを測れる測定器です。\u003c/p>\n\u003cul>\u003cli>測る量と測定範囲を、切り替えスイッチで正しく選んでから測る\u003c/li>\u003cli>抵抗を測るときは、回路の電源を切ってから測る\u003c/li>\u003cli>直流を測るときは、プラスとマイナスの向き（極性）を確かめる\u003c/li>\u003c/ul>\n\u003ch3 id=\"K10-3\">SWR メーター\u003c/h3>\n\u003cp>SWR メーター（通過形電力計）は、送信機と空中線の間（給電線の途中）に入れて、進行波と反射波の大きさから SWR を測ります。SWR が 1 に近くなるように、空中線の長さなどを調整します。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"送信機 → SWR メーター → 給電線 → 空中線\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">送信機\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">SWR メーター\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">給電線\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">空中線\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003ch3 id=\"K10-4\">擬似空中線（ダミーロード）\u003c/h3>\n\u003cp>擬似空中線は、空中線の代わりに送信機の出力につなぐ抵抗器です。給電線と同じインピーダンス（ふつう 50 Ω）で、送信機の電力を熱に変えて、電波をほとんど空間に出しません。送信機の調整や試験に使い、ほかの無線局に混信を与えないようにします（電波法第 57 条、法規の第 5 章）。\u003c/p>\n\u003ch3 id=\"K10-5\">保守と点検\u003c/h3>\n\u003cul>\u003cli>空中線や給電線のつなぎ目がゆるんだり、さびたりしていないか、ときどき確かめる\u003c/li>\u003cli>同軸ケーブルのコネクタから雨水が入らないようにする\u003c/li>\u003cli>空中線をつながずに送信しない（送信機がこわれることがある）\u003c/li>\u003cli>落雷のおそれがあるときは、空中線を無線機から外し、接地する\u003c/li>\u003c/ul>","sections":[{"id":"K10-1","title":"電圧計と電流計"},{"id":"K10-2","title":"テスター（回路計）"},{"id":"K10-3","title":"SWR メーター"},{"id":"K10-4","title":"擬似空中線（ダミーロード）"},{"id":"K10-5","title":"保守と点検"}],"search":[{"id":"","title":"","text":"無線設備を正しく動かすには、電圧や電流を測ったり、送信機と空中線の具合を確かめたりします。この章では、電圧計と電流計のつなぎ方、テスター、SWR メーター、擬似空中線（ダミーロード）の使い方を覚えます。"},{"id":"K10-1","title":"電圧計と電流計","text":"電圧計と電流計 測定器つなぎ方内部抵抗電圧計測る部分に並列につなぐ大きいほどよい（測る回路に影響しにくい）電流計測る回路に直列につなぐ小さいほどよい（測る回路に影響しにくい） 電流計を回路に並列につなぐと、大きな電流が流れて、電流計がこわれることがあります。どれくらいの値か分からないときは、いちばん大きな測定範囲から測り始めます。"},{"id":"K10-2","title":"テスター（回路計）","text":"テスター（回路計） テスターは、1 台で直流電圧、交流電圧、直流電流、抵抗などを測れる測定器です。 測る量と測定範囲を、切り替えスイッチで正しく選んでから測る抵抗を測るときは、回路の電源を切ってから測る直流を測るときは、プラスとマイナスの向き（極性）を確かめる"},{"id":"K10-3","title":"SWR メーター","text":"SWR メーター SWR メーター（通過形電力計）は、送信機と空中線の間（給電線の途中）に入れて、進行波と反射波の大きさから SWR を測ります。SWR が 1 に近くなるように、空中線の長さなどを調整します。 送信機→SWR メーター→給電線→空中線"},{"id":"K10-4","title":"擬似空中線（ダミーロード）","text":"擬似空中線（ダミーロード） 擬似空中線は、空中線の代わりに送信機の出力につなぐ抵抗器です。給電線と同じインピーダンス（ふつう 50 Ω）で、送信機の電力を熱に変えて、電波をほとんど空間に出しません。送信機の調整や試験に使い、ほかの無線局に混信を与えないようにします（電波法第 57 条、法規の第 5 章）。"},{"id":"K10-5","title":"保守と点検","text":"保守と点検 空中線や給電線のつなぎ目がゆるんだり、さびたりしていないか、ときどき確かめる同軸ケーブルのコネクタから雨水が入らないようにする空中線をつながずに送信しない（送信機がこわれることがある）落雷のおそれがあるときは、空中線を無線機から外し、接地する"}],"only":""},{"id":"K11","subject":"無線工学","num":11,"title":"電気と磁気","html":"\u003cp>電流と磁気の関係は、コイル、スピーカー、モーター、メーター、変圧器などのしくみの基本です。この章では、電流が作る磁界、磁界の中の電流に働く力、電磁誘導、静電気の性質と、電力の比を表すデシベルを覚えます。\u003c/p>\n\u003ch3 id=\"K11-1\">電流が作る磁界\u003c/h3>\n\u003cp>導線に電流を流すと、そのまわりに磁界ができます。磁界の向きは、電流の向きに右ねじを進めるときに、ねじを回す向きです。これを右ねじの法則といいます。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"電流を流す → まわりに磁界ができる → 向きは右ねじを回す向き\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">電流を流す\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">まわりに磁界ができる\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">向きは右ねじを回す向き\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>導線を巻いたコイルに電流を流すと、コイルの中に強い磁界ができて、電磁石になる\u003c/li>\u003cli>磁界は、流す電流が大きいほど、コイルの巻数が多いほど強くなる\u003c/li>\u003cli>コイルの中に鉄心を入れると、磁界がさらに強くなる（コイルのインダクタンスも大きくなる）\u003c/li>\u003cli>磁石の外では、磁力線は N 極から出て S 極に入る\u003c/li>\u003c/ul>\n\u003ch3 id=\"K11-2\">磁界の中の電流に働く力\u003c/h3>\n\u003cp>磁界の中に置いた導線に電流を流すと、導線に力が働きます。この力を電磁力といいます。\u003c/p>\n\u003cp>力の向きは、フレミングの左手の法則で分かります。左手の親指、人差し指、中指をたがいに直角に開き、人差し指を磁界の向き（N 極から S 極）、中指を電流の向きに合わせると、親指が力の向きです。中指から順に「電・磁・力」と覚えます。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>左手の指\u003c/th>\u003cth>表すもの\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>中指\u003c/td>\u003ctd>電流の向き\u003c/td>\u003c/tr>\u003ctr>\u003ctd>人差し指\u003c/td>\u003ctd>磁界の向き\u003c/td>\u003c/tr>\u003ctr>\u003ctd>親指\u003c/td>\u003ctd>力の向き\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>力の大きさは、磁界の強さ（磁束密度）、電流の大きさ、磁界の中にある導線の長さに比例します。\u003c/p>\n\u003cdiv class=\"formula\">F ＝ B × I × l（F：力〔N〕、B：磁束密度〔T〕、I：電流〔A〕、l：導線の長さ〔m〕）\u003c/div>\n\u003cp>電磁力を利用したものに、電動機（モーター）、ダイナミックスピーカー、可動コイル形の計器（第 13 章）があります。\u003c/p>\n\u003ch3 id=\"K11-3\">電磁誘導\u003c/h3>\n\u003cp>コイルを貫く磁界（磁束）が変化すると、コイルに電圧（起電力）が生じます。これを電磁誘導といい、流れる電流を誘導電流といいます。\u003c/p>\n\u003cul>\u003cli>起電力の大きさは、磁束の変化が速いほど、コイルの巻数が多いほど大きい（ファラデーの法則）。磁束が変化しなければ、強い磁石を置いておいても起電力は生じない\u003c/li>\u003cli>起電力の向きは、その起電力で流れる電流が、磁束の変化を妨げる向き（レンツの法則）\u003c/li>\u003c/ul>\n\u003cp>磁界の中で導線を動かしても、起電力が生じます。その向きは、フレミングの右手の法則で分かります。右手の親指を導線の動く向き、人差し指を磁界の向きに合わせると、中指が起電力（誘導電流）の向きです。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>法則\u003c/th>\u003cth>分かること\u003c/th>\u003cth>利用したもの\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>右ねじの法則\u003c/td>\u003ctd>電流が作る磁界の向き\u003c/td>\u003ctd>電磁石\u003c/td>\u003c/tr>\u003ctr>\u003ctd>フレミングの左手の法則\u003c/td>\u003ctd>磁界の中の電流に働く力の向き\u003c/td>\u003ctd>電動機、ダイナミックスピーカー、可動コイル形計器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>フレミングの右手の法則\u003c/td>\u003ctd>磁界の中で動く導線に生じる起電力の向き\u003c/td>\u003ctd>発電機、ダイナミックマイクロホン\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>変圧器は、1 次コイルに流れる交流の電流が変化すると、鉄心の中の磁束が変化して、2 次コイルに起電力が生じるしくみです。これを相互誘導といいます。直流では磁束が変化しないので、変圧器で直流の電圧は変えられません。コイル自身の電流の変化で、そのコイルに起電力が生じることは、自己誘導といいます。\u003c/p>\n\u003ch3 id=\"K11-4\">静電気\u003c/h3>\n\u003cp>電荷（電気）には正（＋）と負（－）があり、同じ種類の電荷は反発し、ちがう種類の電荷は引き合います。\u003c/p>\n\u003cp>2 つの電荷の間に働く力は、2 つの電荷の大きさの積に比例し、距離の 2 乗に反比例します。これをクーロンの法則といいます。距離を 2 倍にすると、力は 4 分の 1 になります。\u003c/p>\n\u003cdiv class=\"formula\">F ＝ k × Q1 × Q2 ÷ r²（Q1、Q2：電荷、r：距離、k：定数）\u003c/div>\n\u003cul>\u003cli>静電誘導：帯電した物を導体に近づけると、導体の近い側に反対の種類の電荷、遠い側に同じ種類の電荷が現れる\u003c/li>\u003cli>静電遮へい：回路を導体（金属のケースなど）で囲んで接地すると、外の電界の影響を受けなくなる。受信機や測定器のケース、同軸ケーブルの網線（シールド）に使われている\u003c/li>\u003c/ul>\n\u003cp>コンデンサの静電容量は、電極の面積が大きいほど、電極の間隔が狭いほど、間に入れる誘電体の誘電率が大きいほど大きくなります。\u003c/p>\n\u003cdiv class=\"formula\">C ＝ ε × S ÷ d（C：静電容量〔F〕、ε：誘電率、S：電極の面積〔m²〕、d：電極の間隔〔m〕）\u003cbr>Q ＝ C × V（Q：たまる電荷〔C〕、V：加える電圧〔V〕）\u003c/div>\n\u003ch3 id=\"K11-5\">デシベル\u003c/h3>\n\u003cp>増幅器の利得や空中線の利得は、電力の比をデシベル〔dB〕で表します。\u003c/p>\n\u003cdiv class=\"formula\">電力の比〔dB〕 ＝ 10 × log₁₀（P2 ÷ P1）\u003c/div>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>電力の比\u003c/th>\u003cth>デシベル\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1/2 倍\u003c/td>\u003ctd>約 －3 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 倍\u003c/td>\u003ctd>約 3 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 倍\u003c/td>\u003ctd>約 6 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 倍\u003c/td>\u003ctd>10 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20 倍\u003c/td>\u003ctd>約 13 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100 倍\u003c/td>\u003ctd>20 dB\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>デシベルの足し算は、倍率のかけ算になる。10 dB と 3 dB で 13 dB は、10 倍 × 2 倍 ＝ 20 倍\u003c/li>\u003cli>電圧の比（同じ抵抗のとき）は 20 × log₁₀（V2 ÷ V1）で表す。電圧の 10 倍は 20 dB で、電力にすると 100 倍に当たる\u003c/li>\u003c/ul>\n\u003cp>例：入力 1 W、出力 10 W の増幅器の電力利得は 10 dB です。利得 6 dB の空中線は、基準の空中線に比べて、いちばん強い方向へ約 4 倍の電力を送るのと同じ効果があります。\u003c/p>","sections":[{"id":"K11-1","title":"電流が作る磁界"},{"id":"K11-2","title":"磁界の中の電流に働く力"},{"id":"K11-3","title":"電磁誘導"},{"id":"K11-4","title":"静電気"},{"id":"K11-5","title":"デシベル"}],"search":[{"id":"","title":"","text":"電流と磁気の関係は、コイル、スピーカー、モーター、メーター、変圧器などのしくみの基本です。この章では、電流が作る磁界、磁界の中の電流に働く力、電磁誘導、静電気の性質と、電力の比を表すデシベルを覚えます。"},{"id":"K11-1","title":"電流が作る磁界","text":"電流が作る磁界 導線に電流を流すと、そのまわりに磁界ができます。磁界の向きは、電流の向きに右ねじを進めるときに、ねじを回す向きです。これを右ねじの法則といいます。 電流を流す→まわりに磁界ができる→向きは右ねじを回す向き 導線を巻いたコイルに電流を流すと、コイルの中に強い磁界ができて、電磁石になる磁界は、流す電流が大きいほど、コイルの巻数が多いほど強くなるコイルの中に鉄心を入れると、磁界がさらに強くなる（コイルのインダクタンスも大きくなる）磁石の外では、磁力線は N 極から出て S 極に入る"},{"id":"K11-2","title":"磁界の中の電流に働く力","text":"磁界の中の電流に働く力 磁界の中に置いた導線に電流を流すと、導線に力が働きます。この力を電磁力といいます。 力の向きは、フレミングの左手の法則で分かります。左手の親指、人差し指、中指をたがいに直角に開き、人差し指を磁界の向き（N 極から S 極）、中指を電流の向きに合わせると、親指が力の向きです。中指から順に「電・磁・力」と覚えます。 左手の指表すもの中指電流の向き人差し指磁界の向き親指力の向き 力の大きさは、磁界の強さ（磁束密度）、電流の大きさ、磁界の中にある導線の長さに比例します。 F ＝ B × I × l（F：力〔N〕、B：磁束密度〔T〕、I：電流〔A〕、l：導線の長さ〔m〕） 電磁力を利用したものに、電動機（モーター）、ダイナミックスピーカー、可動コイル形の計器（第 13 章）があります。"},{"id":"K11-3","title":"電磁誘導","text":"電磁誘導 コイルを貫く磁界（磁束）が変化すると、コイルに電圧（起電力）が生じます。これを電磁誘導といい、流れる電流を誘導電流といいます。 起電力の大きさは、磁束の変化が速いほど、コイルの巻数が多いほど大きい（ファラデーの法則）。磁束が変化しなければ、強い磁石を置いておいても起電力は生じない起電力の向きは、その起電力で流れる電流が、磁束の変化を妨げる向き（レンツの法則） 磁界の中で導線を動かしても、起電力が生じます。その向きは、フレミングの右手の法則で分かります。右手の親指を導線の動く向き、人差し指を磁界の向きに合わせると、中指が起電力（誘導電流）の向きです。 法則分かること利用したもの右ねじの法則電流が作る磁界の向き電磁石フレミングの左手の法則磁界の中の電流に働く力の向き電動機、ダイナミックスピーカー、可動コイル形計器フレミングの右手の法則磁界の中で動く導線に生じる起電力の向き発電機、ダイナミックマイクロホン 変圧器は、1 次コイルに流れる交流の電流が変化すると、鉄心の中の磁束が変化して、2 次コイルに起電力が生じるしくみです。これを相互誘導といいます。直流では磁束が変化しないので、変圧器で直流の電圧は変えられません。コイル自身の電流の変化で、そのコイルに起電力が生じることは、自己誘導といいます。"},{"id":"K11-4","title":"静電気","text":"静電気 電荷（電気）には正（＋）と負（－）があり、同じ種類の電荷は反発し、ちがう種類の電荷は引き合います。 2 つの電荷の間に働く力は、2 つの電荷の大きさの積に比例し、距離の 2 乗に反比例します。これをクーロンの法則といいます。距離を 2 倍にすると、力は 4 分の 1 になります。 F ＝ k × Q1 × Q2 ÷ r²（Q1、Q2：電荷、r：距離、k：定数） 静電誘導：帯電した物を導体に近づけると、導体の近い側に反対の種類の電荷、遠い側に同じ種類の電荷が現れる静電遮へい：回路を導体（金属のケースなど）で囲んで接地すると、外の電界の影響を受けなくなる。受信機や測定器のケース、同軸ケーブルの網線（シールド）に使われている コンデンサの静電容量は、電極の面積が大きいほど、電極の間隔が狭いほど、間に入れる誘電体の誘電率が大きいほど大きくなります。 C ＝ ε × S ÷ d（C：静電容量〔F〕、ε：誘電率、S：電極の面積〔m²〕、d：電極の間隔〔m〕） Q ＝ C × V（Q：たまる電荷〔C〕、V：加える電圧〔V〕）"},{"id":"K11-5","title":"デシベル","text":"デシベル 増幅器の利得や空中線の利得は、電力の比をデシベル〔dB〕で表します。 電力の比〔dB〕 ＝ 10 × log₁₀（P2 ÷ P1） 電力の比デシベル1/2 倍約 －3 dB2 倍約 3 dB4 倍約 6 dB10 倍10 dB20 倍約 13 dB100 倍20 dB デシベルの足し算は、倍率のかけ算になる。10 dB と 3 dB で 13 dB は、10 倍 × 2 倍 ＝ 20 倍電圧の比（同じ抵抗のとき）は 20 × log₁₀（V2 ÷ V1）で表す。電圧の 10 倍は 20 dB で、電力にすると 100 倍に当たる 例：入力 1 W、出力 10 W の増幅器の電力利得は 10 dB です。利得 6 dB の空中線は、基準の空中線に比べて、いちばん強い方向へ約 4 倍の電力を送るのと同じ効果があります。"}],"only":"3アマ"},{"id":"K12","subject":"無線工学","num":12,"title":"送受信機の回路と電信","html":"\u003cp>3アマは、モールス符号の電信（A1A）や、短波（HF）の SSB を運用できます。この章では、トランジスタ回路の接地方式、電信の送信機と受信機、キークリックとチャープ、受信機についている便利な回路を覚えます。\u003c/p>\n\u003ch3 id=\"K12-1\">トランジスタの接地方式\u003c/h3>\n\u003cp>トランジスタの 3 つの電極のうち、どれを入力と出力の共通にするかで、3 つの使い方（接地方式）があります。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>接地方式\u003c/th>\u003cth>入力\u003c/th>\u003cth>出力\u003c/th>\u003cth>特徴\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>エミッタ接地\u003c/td>\u003ctd>ベース\u003c/td>\u003ctd>コレクタ\u003c/td>\u003ctd>電流増幅率も電力利得も大きく、いちばんよく使う。出力の位相は入力と逆（反転する）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ベース接地\u003c/td>\u003ctd>エミッタ\u003c/td>\u003ctd>コレクタ\u003c/td>\u003ctd>電流増幅率は 1 より少し小さい。高い周波数の特性がよい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>コレクタ接地（エミッタホロワ）\u003c/td>\u003ctd>ベース\u003c/td>\u003ctd>エミッタ\u003c/td>\u003ctd>電圧増幅度は約 1（1 より少し小さい）。入力インピーダンスが高く、出力インピーダンスが低い。位相は入力と同じ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>エミッタホロワは、電圧はほとんど増幅しませんが、高いインピーダンスの回路から低いインピーダンスの回路へ信号を渡す（インピーダンスを変換する）のに使います。\u003c/p>\n\u003cp>トランジスタの電流には、次の関係があります。直流電流増幅率は hFE と書きます。\u003c/p>\n\u003cdiv class=\"formula\">エミッタ電流 IE ＝ ベース電流 IB ＋ コレクタ電流 IC\u003cbr>直流電流増幅率 hFE ＝ IC ÷ IB\u003c/div>\n\u003cp>例：ベース電流 20 μA でコレクタ電流が 2 mA なら、hFE ＝ 2 mA ÷ 0.02 mA ＝ 100 です。エミッタ電流は 2.02 mA です。\u003c/p>\n\u003ch3 id=\"K12-2\">電信（A1A）の送信機\u003c/h3>\n\u003cp>電信（A1A）は、搬送波を電鍵（キー）で出したり止めたりして、モールス符号を送る電波です。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"水晶発振器 → 緩衝増幅器 → 励振増幅器 → 電力増幅器 → 空中線。電鍵 → キーイング回路 → 励振増幅器\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">水晶発振器\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">緩衝増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">励振増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">電力増幅器\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">空中線\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan class=\"box\">電鍵\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">キーイング回路\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">励振増幅器\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cul>\u003cli>水晶発振器：周波数の安定な搬送波を作る\u003c/li>\u003cli>緩衝増幅器：後ろの段の変化で、発振器の周波数が変わらないようにする\u003c/li>\u003cli>キーイング回路：電鍵の操作に合わせて、電波を出したり止めたりする。発振器ではなく、後ろの段の増幅器をキーイングする\u003c/li>\u003cli>電力増幅器：電信の電波は、出ている間の振幅が一定なので、ひずみは大きいが効率のよい C 級増幅を使える。出てくる高調波は、同調回路や低域フィルタ（LPF）で取り除く\u003c/li>\u003c/ul>\n\u003cp>電信の電波は、無線電話（AM・SSB・FM）の電波より占有周波数帯幅が狭いので、受信機の帯域を狭くして、弱い電波でも混信や雑音の少ない通信ができます。\u003c/p>\n\u003ch3 id=\"K12-3\">キークリックとチャープ\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>現象\u003c/th>\u003cth>どんなことか\u003c/th>\u003cth>原因\u003c/th>\u003cth>防ぎ方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>キークリック\u003c/td>\u003ctd>近くの周波数の受信機に「カチッ、カチッ」という妨害を与える\u003c/td>\u003ctd>キーイングで、電波の立ち上がりと立ち下がりが急すぎて、側波帯が広がる\u003c/td>\u003ctd>キーイング回路にキークリック防止回路（コイル、コンデンサ、抵抗で作る低域フィルタなど）を入れ、立ち上がりと立ち下がりをなだらかにする\u003c/td>\u003c/tr>\u003ctr>\u003ctd>チャープ（チャーピング）\u003c/td>\u003ctd>キーイングのたびに送信周波数がわずかにずれ、受信すると音の高さが「ピョッ」と変わる\u003c/td>\u003ctd>発振器を直接キーイングしている、キーイングで電源電圧や負荷が変わる\u003c/td>\u003ctd>発振器ではなく後ろの段をキーイングする、緩衝増幅器を入れる、電源を安定にする\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K12-4\">電信の受信\u003c/h3>\n\u003cp>電信の電波は、搬送波を出したり止めたりするだけで、音の信号を含んでいません。そのまま AM の検波をしても、モールス符号の音になりません。\u003c/p>\n\u003cp>そこで、BFO（うなり周波数発振器）で、中間周波数と少しちがう周波数の信号を作って検波器に加えます。中間周波数の信号と BFO の信号の周波数の差が、うなり（ビート）の音として聞こえます。\u003c/p>\n\u003cdiv class=\"formula\">聞こえる音の周波数 ＝ BFO の周波数と中間周波数の差\u003c/div>\n\u003cp>例：中間周波数が 455 kHz で、BFO を 455.8 kHz にすると、差の 0.8 kHz（800 Hz）の音が聞こえます。\u003c/p>\n\u003cp>混信を減らすため、電信を受信するときは、中間周波増幅器に帯域幅の狭いフィルタ（CW フィルタ。たとえば 500 Hz）を使います。選択度がよくなり、近くの周波数の電波と分けて受信できます。\u003c/p>\n\u003ch3 id=\"K12-5\">受信機の付加回路\u003c/h3>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>回路\u003c/th>\u003cth>働き\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RIT（クラリファイア）\u003c/td>\u003ctd>送信周波数を変えずに、受信周波数だけを少し動かす。相手の周波数がわずかにずれて SSB の声が不自然なときや、電信の音の高さを合わせるときに使う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ノイズブランカ（NB）\u003c/td>\u003ctd>自動車の点火プラグなどから出る、パルス状の雑音を消す\u003c/td>\u003c/tr>\u003ctr>\u003ctd>アッテネータ（ATT）\u003c/td>\u003ctd>強すぎる電波を弱めて受信機に入れ、ひずみや混変調を防ぐ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S メーター\u003c/td>\u003ctd>受信した電波の強さを示す\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AGC\u003c/td>\u003ctd>受信する電波の強さが変わっても、出力をほぼ一定にする（第 5 章）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>スケルチ\u003c/td>\u003ctd>電波が来ていないときの雑音を消す（第 5 章）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","sections":[{"id":"K12-1","title":"トランジスタの接地方式"},{"id":"K12-2","title":"電信（A1A）の送信機"},{"id":"K12-3","title":"キークリックとチャープ"},{"id":"K12-4","title":"電信の受信"},{"id":"K12-5","title":"受信機の付加回路"}],"search":[{"id":"","title":"","text":"3アマは、モールス符号の電信（A1A）や、短波（HF）の SSB を運用できます。この章では、トランジスタ回路の接地方式、電信の送信機と受信機、キークリックとチャープ、受信機についている便利な回路を覚えます。"},{"id":"K12-1","title":"トランジスタの接地方式","text":"トランジスタの接地方式 トランジスタの 3 つの電極のうち、どれを入力と出力の共通にするかで、3 つの使い方（接地方式）があります。 接地方式入力出力特徴エミッタ接地ベースコレクタ電流増幅率も電力利得も大きく、いちばんよく使う。出力の位相は入力と逆（反転する）ベース接地エミッタコレクタ電流増幅率は 1 より少し小さい。高い周波数の特性がよいコレクタ接地（エミッタホロワ）ベースエミッタ電圧増幅度は約 1（1 より少し小さい）。入力インピーダンスが高く、出力インピーダンスが低い。位相は入力と同じ エミッタホロワは、電圧はほとんど増幅しませんが、高いインピーダンスの回路から低いインピーダンスの回路へ信号を渡す（インピーダンスを変換する）のに使います。 トランジスタの電流には、次の関係があります。直流電流増幅率は hFE と書きます。 エミッタ電流 IE ＝ ベース電流 IB ＋ コレクタ電流 IC 直流電流増幅率 hFE ＝ IC ÷ IB 例：ベース電流 20 μA でコレクタ電流が 2 mA なら、hFE ＝ 2 mA ÷ 0.02 mA ＝ 100 です。エミッタ電流は 2.02 mA です。"},{"id":"K12-2","title":"電信（A1A）の送信機","text":"電信（A1A）の送信機 電信（A1A）は、搬送波を電鍵（キー）で出したり止めたりして、モールス符号を送る電波です。 水晶発振器→緩衝増幅器→励振増幅器→電力増幅器→空中線電鍵→キーイング回路→励振増幅器 水晶発振器：周波数の安定な搬送波を作る緩衝増幅器：後ろの段の変化で、発振器の周波数が変わらないようにするキーイング回路：電鍵の操作に合わせて、電波を出したり止めたりする。発振器ではなく、後ろの段の増幅器をキーイングする電力増幅器：電信の電波は、出ている間の振幅が一定なので、ひずみは大きいが効率のよい C 級増幅を使える。出てくる高調波は、同調回路や低域フィルタ（LPF）で取り除く 電信の電波は、無線電話（AM・SSB・FM）の電波より占有周波数帯幅が狭いので、受信機の帯域を狭くして、弱い電波でも混信や雑音の少ない通信ができます。"},{"id":"K12-3","title":"キークリックとチャープ","text":"キークリックとチャープ 現象どんなことか原因防ぎ方キークリック近くの周波数の受信機に「カチッ、カチッ」という妨害を与えるキーイングで、電波の立ち上がりと立ち下がりが急すぎて、側波帯が広がるキーイング回路にキークリック防止回路（コイル、コンデンサ、抵抗で作る低域フィルタなど）を入れ、立ち上がりと立ち下がりをなだらかにするチャープ（チャーピング）キーイングのたびに送信周波数がわずかにずれ、受信すると音の高さが「ピョッ」と変わる発振器を直接キーイングしている、キーイングで電源電圧や負荷が変わる発振器ではなく後ろの段をキーイングする、緩衝増幅器を入れる、電源を安定にする"},{"id":"K12-4","title":"電信の受信","text":"電信の受信 電信の電波は、搬送波を出したり止めたりするだけで、音の信号を含んでいません。そのまま AM の検波をしても、モールス符号の音になりません。 そこで、BFO（うなり周波数発振器）で、中間周波数と少しちがう周波数の信号を作って検波器に加えます。中間周波数の信号と BFO の信号の周波数の差が、うなり（ビート）の音として聞こえます。 聞こえる音の周波数 ＝ BFO の周波数と中間周波数の差 例：中間周波数が 455 kHz で、BFO を 455.8 kHz にすると、差の 0.8 kHz（800 Hz）の音が聞こえます。 混信を減らすため、電信を受信するときは、中間周波増幅器に帯域幅の狭いフィルタ（CW フィルタ。たとえば 500 Hz）を使います。選択度がよくなり、近くの周波数の電波と分けて受信できます。"},{"id":"K12-5","title":"受信機の付加回路","text":"受信機の付加回路 回路働きRIT（クラリファイア）送信周波数を変えずに、受信周波数だけを少し動かす。相手の周波数がわずかにずれて SSB の声が不自然なときや、電信の音の高さを合わせるときに使うノイズブランカ（NB）自動車の点火プラグなどから出る、パルス状の雑音を消すアッテネータ（ATT）強すぎる電波を弱めて受信機に入れ、ひずみや混変調を防ぐS メーター受信した電波の強さを示すAGC受信する電波の強さが変わっても、出力をほぼ一定にする（第 5 章）スケルチ電波が来ていないときの雑音を消す（第 5 章）"}],"only":"3アマ"},{"id":"K13","subject":"無線工学","num":13,"title":"測定機器","html":"\u003cp>3アマの無線工学には、無線設備と空中線系のための測定機器の理論、構造、機能、保守と運用の初歩が入ります（無線従事者規則第 5 条）。この章では、指示電気計器の種類、分流器と倍率器、回路計、周波数カウンタ、ディップメータ、オシロスコープ、高周波電力と SWR の測り方、測定の誤差を覚えます。電圧計と電流計のつなぎ方は第 10 章にあります。\u003c/p>\n\u003ch3 id=\"K13-1\">指示電気計器の種類\u003c/h3>\n\u003cp>指針の振れで値を示す計器（指示電気計器）には、しくみによって次の種類があります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>種類\u003c/th>\u003cth>しくみ\u003c/th>\u003cth>おもに測るもの\u003c/th>\u003cth>指示する値\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>可動コイル形\u003c/td>\u003ctd>永久磁石の磁界の中のコイルに電流を流し、電磁力で指針を動かす\u003c/td>\u003ctd>直流\u003c/td>\u003ctd>平均値。目盛りは等間隔\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可動鉄片形\u003c/td>\u003ctd>固定したコイルの磁界で、鉄片を動かす\u003c/td>\u003ctd>商用周波数の交流（直流も）\u003c/td>\u003ctd>実効値\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整流形\u003c/td>\u003ctd>整流器で交流を直流にして、可動コイル形で指示する\u003c/td>\u003ctd>低い周波数の交流\u003c/td>\u003ctd>平均値に比例し、正弦波の実効値で目盛る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>熱電対形\u003c/td>\u003ctd>電流で熱線を熱し、熱電対に生じる起電力を可動コイル形で指示する\u003c/td>\u003ctd>高周波の電流（直流と交流も）\u003c/td>\u003ctd>実効値\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電流力計形\u003c/td>\u003ctd>固定したコイルと動くコイルに電流を流し、その間の力で指針を動かす\u003c/td>\u003ctd>電力（直流と交流）\u003c/td>\u003ctd>実効値\u003c/td>\u003c/tr>\u003ctr>\u003ctd>静電形\u003c/td>\u003ctd>電極の間の静電力で、指針を動かす\u003c/td>\u003ctd>高い電圧（直流と交流）\u003c/td>\u003ctd>実効値\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>可動コイル形は、フレミングの左手の法則（第 11 章）を使った計器で、直流の電流計や電圧計に使う\u003c/li>\u003cli>高周波の電流は、熱電対形で測る。熱を利用するので、周波数に関係なく実効値を指示できる\u003c/li>\u003c/ul>\n\u003ch3 id=\"K13-2\">分流器と倍率器\u003c/h3>\n\u003cp>計器の測定範囲を広げるには、抵抗を組み合わせます。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>抵抗\u003c/th>\u003cth>使う計器\u003c/th>\u003cth>つなぎ方\u003c/th>\u003cth>測定範囲を n 倍にする抵抗の値\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>分流器\u003c/td>\u003ctd>電流計\u003c/td>\u003ctd>電流計に並列\u003c/td>\u003ctd>R ＝ r ÷ (n － 1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>倍率器\u003c/td>\u003ctd>電圧計\u003c/td>\u003ctd>電圧計に直列\u003c/td>\u003ctd>R ＝ (n － 1) × r\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>（r は計器の内部抵抗）\u003c/p>\n\u003cp>例 1：内部抵抗 0.9 Ω、最大目盛り 1 mA の電流計で 10 mA まで測る（n ＝ 10）。分流器は 0.9 ÷ (10 － 1) ＝ 0.1 Ω です。電流計に 1 mA、分流器に 9 mA が流れます。\u003c/p>\n\u003cp>例 2：内部抵抗 10 kΩ、最大目盛り 10 V の電圧計で 100 V まで測る（n ＝ 10）。倍率器は (10 － 1) × 10 kΩ ＝ 90 kΩ です。電圧計に 10 V、倍率器に 90 V がかかります。\u003c/p>\n\u003ch3 id=\"K13-3\">回路計（テスター）\u003c/h3>\n\u003cp>回路計は、可動コイル形の計器に、分流器、倍率器、整流器、電池を組み合わせて、1 台で直流電流、直流電圧、交流電圧、抵抗を測れるようにしたものです。\u003c/p>\n\u003cul>\u003cli>交流電圧は、整流器で直流にして測る。高い周波数の交流や、高周波の電流は測れない\u003c/li>\u003cli>抵抗は、中の電池から電流を流して測る。測る前に、2 本のテスト棒の先をつないで（短絡して）、指針を 0 Ω に合わせる（0 Ω 調整）\u003c/li>\u003cli>抵抗の目盛りは、右の端が 0 Ω で、左へ行くほど大きくなり、間隔はそろっていない\u003c/li>\u003cli>数字で表示するデジタル式の回路計（デジタルマルチメータ）もある\u003c/li>\u003c/ul>\n\u003ch3 id=\"K13-4\">周波数カウンタとディップメータ\u003c/h3>\n\u003cp>周波数カウンタ（計数形周波数計）は、入力した信号をパルスに変え、正確に決めた時間（ゲート時間）の間に通ったパルスの数を数えて、周波数を表示します。時間の基準には、水晶発振器を使います。\u003c/p>\n\u003cdiv class=\"formula\">周波数〔Hz〕 ＝ 数えたパルスの数 ÷ ゲート時間〔秒〕\u003c/div>\n\u003cp>例：ゲート時間 0.1 秒で 14,500 個数えたら、14,500 ÷ 0.1 ＝ 145,000 Hz ＝ 145 kHz です。ゲート時間を長くすると、より細かい桁まで表示できます。\u003c/p>\n\u003cp>ディップメータは、目盛りの付いた LC の発振器です。発振器のコイルを、測りたい共振回路（同調回路や空中線）に近づけて発振周波数を変えていくと、共振したところで発振器のエネルギーが吸収され、メーターの指示が下がります（ディップ）。そのときの周波数が、共振回路の共振周波数です。\u003c/p>\n\u003ch3 id=\"K13-5\">オシロスコープと標準信号発生器\u003c/h3>\n\u003cp>オシロスコープは、電圧の波形を画面に表示する測定器です。縦の方向が電圧、横の方向が時間を表します。\u003c/p>\n\u003cul>\u003cli>1 周期の長さ（時間）を読めば、周波数が分かる（周波数 ＝ 1 ÷ 周期）\u003c/li>\u003cli>AM の電波の波形を表示すると、変調度を求められる\u003c/li>\u003c/ul>\n\u003cp>例：横 1 目盛りが 0.5 ms で、1 周期が 4 目盛りなら、周期は 2 ms、周波数は 1 ÷ 0.002 ＝ 500 Hz です。\u003c/p>\n\u003cp>AM の変調度は、波形の振幅（山から谷まで）のいちばん大きいところ A と、いちばん小さいところ B から求めます。\u003c/p>\n\u003cdiv class=\"formula\">変調度〔%〕 ＝ (A － B) ÷ (A ＋ B) × 100\u003c/div>\n\u003cp>例：A が 12 目盛り、B が 4 目盛りなら、(12 － 4) ÷ (12 ＋ 4) × 100 ＝ 50 % です。\u003c/p>\n\u003cp>標準信号発生器（SG）は、周波数と出力の大きさが正確に分かる高周波の信号（変調もかけられる）を出す測定器です。受信機の感度や選択度を測るときに使います。\u003c/p>\n\u003ch3 id=\"K13-6\">高周波電力と SWR の測定\u003c/h3>\n\u003cp>送信機の出力の電力は、次のどちらかで測ります。\u003c/p>\n\u003cul>\u003cli>通過形電力計：送信機と空中線（又は擬似空中線）の間に入れて、進行波の電力と反射波の電力を測る。空中線に送られる電力は、進行波の電力から反射波の電力を引いたもの\u003c/li>\u003cli>終端形電力計：擬似空中線（負荷の抵抗）に電力を吸収させて測る。負荷の抵抗 R にかかる電圧（実効値）V から、電力 P ＝ V² ÷ R で求められる\u003c/li>\u003c/ul>\n\u003cp>例：50 Ω の擬似空中線の両端の電圧（実効値）が 20 V なら、電力は 20 × 20 ÷ 50 ＝ 8 W です。\u003c/p>\n\u003cp>SWR（定在波比）は、進行波の電力 Pf と反射波の電力 Pr から求められます（第 8 章・第 10 章）。\u003c/p>\n\u003cdiv class=\"formula\">反射係数 Γ ＝ √(Pr ÷ Pf)\u003cbr>SWR ＝ (1 ＋ Γ) ÷ (1 － Γ)\u003c/div>\n\u003cp>例：進行波の電力 100 W、反射波の電力 4 W なら、Γ ＝ √(4 ÷ 100) ＝ 0.2、SWR ＝ 1.2 ÷ 0.8 ＝ 1.5 です。空中線に送られる電力は 100 － 4 ＝ 96 W です。\u003c/p>\n\u003ch3 id=\"K13-7\">測定の誤差\u003c/h3>\n\u003cp>測った値（測定値）M と、本当の値（真値）T との差を誤差、誤差を真値で割った割合を誤差率といいます。\u003c/p>\n\u003cdiv class=\"formula\">誤差 ＝ M － T\u003cbr>誤差率〔%〕 ＝ (M － T) ÷ T × 100\u003c/div>\n\u003cp>例：真値 100 V の電圧を測って 98 V だったら、誤差は －2 V、誤差率は －2 % です。\u003c/p>\n\u003cul>\u003cli>計器をつなぐと、測る回路の状態が少し変わる。電圧計は内部抵抗が大きいほど、電流計は内部抵抗が小さいほど、誤差が小さい（第 10 章）\u003c/li>\u003cli>指針を読むときは、目盛り板に垂直な方向から読む\u003c/li>\u003c/ul>","sections":[{"id":"K13-1","title":"指示電気計器の種類"},{"id":"K13-2","title":"分流器と倍率器"},{"id":"K13-3","title":"回路計（テスター）"},{"id":"K13-4","title":"周波数カウンタとディップメータ"},{"id":"K13-5","title":"オシロスコープと標準信号発生器"},{"id":"K13-6","title":"高周波電力と SWR の測定"},{"id":"K13-7","title":"測定の誤差"}],"search":[{"id":"","title":"","text":"3アマの無線工学には、無線設備と空中線系のための測定機器の理論、構造、機能、保守と運用の初歩が入ります（無線従事者規則第 5 条）。この章では、指示電気計器の種類、分流器と倍率器、回路計、周波数カウンタ、ディップメータ、オシロスコープ、高周波電力と SWR の測り方、測定の誤差を覚えます。電圧計と電流計のつなぎ方は第 10 章にあります。"},{"id":"K13-1","title":"指示電気計器の種類","text":"指示電気計器の種類 指針の振れで値を示す計器（指示電気計器）には、しくみによって次の種類があります。 種類しくみおもに測るもの指示する値可動コイル形永久磁石の磁界の中のコイルに電流を流し、電磁力で指針を動かす直流平均値。目盛りは等間隔可動鉄片形固定したコイルの磁界で、鉄片を動かす商用周波数の交流（直流も）実効値整流形整流器で交流を直流にして、可動コイル形で指示する低い周波数の交流平均値に比例し、正弦波の実効値で目盛る熱電対形電流で熱線を熱し、熱電対に生じる起電力を可動コイル形で指示する高周波の電流（直流と交流も）実効値電流力計形固定したコイルと動くコイルに電流を流し、その間の力で指針を動かす電力（直流と交流）実効値静電形電極の間の静電力で、指針を動かす高い電圧（直流と交流）実効値 可動コイル形は、フレミングの左手の法則（第 11 章）を使った計器で、直流の電流計や電圧計に使う高周波の電流は、熱電対形で測る。熱を利用するので、周波数に関係なく実効値を指示できる"},{"id":"K13-2","title":"分流器と倍率器","text":"分流器と倍率器 計器の測定範囲を広げるには、抵抗を組み合わせます。 抵抗使う計器つなぎ方測定範囲を n 倍にする抵抗の値分流器電流計電流計に並列R ＝ r ÷ (n － 1)倍率器電圧計電圧計に直列R ＝ (n － 1) × r （r は計器の内部抵抗） 例 1：内部抵抗 0.9 Ω、最大目盛り 1 mA の電流計で 10 mA まで測る（n ＝ 10）。分流器は 0.9 ÷ (10 － 1) ＝ 0.1 Ω です。電流計に 1 mA、分流器に 9 mA が流れます。 例 2：内部抵抗 10 kΩ、最大目盛り 10 V の電圧計で 100 V まで測る（n ＝ 10）。倍率器は (10 － 1) × 10 kΩ ＝ 90 kΩ です。電圧計に 10 V、倍率器に 90 V がかかります。"},{"id":"K13-3","title":"回路計（テスター）","text":"回路計（テスター） 回路計は、可動コイル形の計器に、分流器、倍率器、整流器、電池を組み合わせて、1 台で直流電流、直流電圧、交流電圧、抵抗を測れるようにしたものです。 交流電圧は、整流器で直流にして測る。高い周波数の交流や、高周波の電流は測れない抵抗は、中の電池から電流を流して測る。測る前に、2 本のテスト棒の先をつないで（短絡して）、指針を 0 Ω に合わせる（0 Ω 調整）抵抗の目盛りは、右の端が 0 Ω で、左へ行くほど大きくなり、間隔はそろっていない数字で表示するデジタル式の回路計（デジタルマルチメータ）もある"},{"id":"K13-4","title":"周波数カウンタとディップメータ","text":"周波数カウンタとディップメータ 周波数カウンタ（計数形周波数計）は、入力した信号をパルスに変え、正確に決めた時間（ゲート時間）の間に通ったパルスの数を数えて、周波数を表示します。時間の基準には、水晶発振器を使います。 周波数〔Hz〕 ＝ 数えたパルスの数 ÷ ゲート時間〔秒〕 例：ゲート時間 0.1 秒で 14,500 個数えたら、14,500 ÷ 0.1 ＝ 145,000 Hz ＝ 145 kHz です。ゲート時間を長くすると、より細かい桁まで表示できます。 ディップメータは、目盛りの付いた LC の発振器です。発振器のコイルを、測りたい共振回路（同調回路や空中線）に近づけて発振周波数を変えていくと、共振したところで発振器のエネルギーが吸収され、メーターの指示が下がります（ディップ）。そのときの周波数が、共振回路の共振周波数です。"},{"id":"K13-5","title":"オシロスコープと標準信号発生器","text":"オシロスコープと標準信号発生器 オシロスコープは、電圧の波形を画面に表示する測定器です。縦の方向が電圧、横の方向が時間を表します。 1 周期の長さ（時間）を読めば、周波数が分かる（周波数 ＝ 1 ÷ 周期）AM の電波の波形を表示すると、変調度を求められる 例：横 1 目盛りが 0.5 ms で、1 周期が 4 目盛りなら、周期は 2 ms、周波数は 1 ÷ 0.002 ＝ 500 Hz です。 AM の変調度は、波形の振幅（山から谷まで）のいちばん大きいところ A と、いちばん小さいところ B から求めます。 変調度〔%〕 ＝ (A － B) ÷ (A ＋ B) × 100 例：A が 12 目盛り、B が 4 目盛りなら、(12 － 4) ÷ (12 ＋ 4) × 100 ＝ 50 % です。 標準信号発生器（SG）は、周波数と出力の大きさが正確に分かる高周波の信号（変調もかけられる）を出す測定器です。受信機の感度や選択度を測るときに使います。"},{"id":"K13-6","title":"高周波電力と SWR の測定","text":"高周波電力と SWR の測定 送信機の出力の電力は、次のどちらかで測ります。 通過形電力計：送信機と空中線（又は擬似空中線）の間に入れて、進行波の電力と反射波の電力を測る。空中線に送られる電力は、進行波の電力から反射波の電力を引いたもの終端形電力計：擬似空中線（負荷の抵抗）に電力を吸収させて測る。負荷の抵抗 R にかかる電圧（実効値）V から、電力 P ＝ V² ÷ R で求められる 例：50 Ω の擬似空中線の両端の電圧（実効値）が 20 V なら、電力は 20 × 20 ÷ 50 ＝ 8 W です。 SWR（定在波比）は、進行波の電力 Pf と反射波の電力 Pr から求められます（第 8 章・第 10 章）。 反射係数 Γ ＝ √(Pr ÷ Pf) SWR ＝ (1 ＋ Γ) ÷ (1 － Γ) 例：進行波の電力 100 W、反射波の電力 4 W なら、Γ ＝ √(4 ÷ 100) ＝ 0.2、SWR ＝ 1.2 ÷ 0.8 ＝ 1.5 です。空中線に送られる電力は 100 － 4 ＝ 96 W です。"},{"id":"K13-7","title":"測定の誤差","text":"測定の誤差 測った値（測定値）M と、本当の値（真値）T との差を誤差、誤差を真値で割った割合を誤差率といいます。 誤差 ＝ M － T 誤差率〔%〕 ＝ (M － T) ÷ T × 100 例：真値 100 V の電圧を測って 98 V だったら、誤差は －2 V、誤差率は －2 % です。 計器をつなぐと、測る回路の状態が少し変わる。電圧計は内部抵抗が大きいほど、電流計は内部抵抗が小さいほど、誤差が小さい（第 10 章）指針を読むときは、目盛り板に垂直な方向から読む"}],"only":"3アマ"},{"id":"K14","subject":"無線工学","num":14,"title":"短波の空中線と電波","html":"\u003cp>3アマは、8 MHz 以下と 18 MHz 以上の周波数で、空中線電力 50 ワットまで運用できます。短波（HF、3〜30 MHz）の電波は電離層で反射して遠くまで届きますが、時刻、季節、太陽の活動で届き方が大きく変わります。この章では、短波の空中線と、短波の電波の伝わり方をくわしく覚えます。電離層の基本と、デリンジャー現象などの現象は第 9 章にあります。\u003c/p>\n\u003ch3 id=\"K14-1\">3アマで使える短波の周波数帯\u003c/h3>\n\u003cp>3アマの操作の範囲は、空中線電力 50 ワット以下で、18 MHz 以上又は 8 MHz 以下の周波数です（電波法施行令第 3 条、法規の第 4 章・第 9 章）。短波のアマチュアの周波数帯では、次のようになります。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>周波数帯\u003c/th>\u003cth>3アマ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1.9 MHz 帯、3.5 MHz 帯、3.8 MHz 帯、7 MHz 帯\u003c/td>\u003ctd>運用できる（8 MHz 以下）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 MHz 帯、14 MHz 帯\u003c/td>\u003ctd>運用できない（2アマ以上が要る）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18 MHz 帯、21 MHz 帯、24 MHz 帯、28 MHz 帯\u003c/td>\u003ctd>運用できる（18 MHz 以上）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"K14-2\">短波の空中線\u003c/h3>\n\u003cp>短波は波長が長い（7 MHz で約 43 m）ので、空中線も大きくなります。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>空中線\u003c/th>\u003cth>形と特徴\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>半波長ダイポール\u003c/td>\u003ctd>長さが 2 分の 1 波長。7 MHz なら 300 ÷ 7 ÷ 2 ≒ 21.4 m、21 MHz なら約 7.1 m。実際には、導線の太さなどの影響で、計算より少し短くする\u003c/td>\u003c/tr>\u003ctr>\u003ctd>逆 V 形ダイポール\u003c/td>\u003ctd>1 本の支柱の上から、ダイポールの両側を斜め下へ張る。広い場所がなくても張れる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>トラップ付きダイポール\u003c/td>\u003ctd>導線の途中に、コイルとコンデンサの並列共振回路（トラップ）を入れ、1 本で 2 つ以上の周波数帯に使う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1/4 波長垂直接地空中線（バーチカル）\u003c/td>\u003ctd>長さが 4 分の 1 波長（7 MHz で約 10.7 m）。大地やラジアル（放射状の導線）と組み合わせる。水平面内は全方向に同じ（無指向性）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>トラップは、トラップの共振周波数（高いほうの周波数帯）では、インピーダンスがとても高くなって、外側の導線を切り離します。内側の導線だけが、高い周波数の半波長ダイポールとして働きます。共振周波数より低い周波数では、トラップはコイル（延長コイル）として働き、全体が低い周波数の半波長ダイポールとして働きます。\u003c/p>\n\u003cdiv class=\"flows\" role=\"img\" aria-label=\"高い周波数帯 → トラップのインピーダンスが高い → 内側だけが働く。低い周波数帯 → トラップはコイルとして働く → 全体が働く\">\u003cdiv class=\"flow\">\u003cspan class=\"box\">高い周波数帯\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">トラップのインピーダンスが高い\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">内側だけが働く\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan class=\"box\">低い周波数帯\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">トラップはコイルとして働く\u003c/span>\u003c/span>\u003cspan class=\"step\">\u003cspan class=\"arr\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"box\">全体が働く\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\u003cp>アンテナチューナ（空中線整合器）は、空中線系のインピーダンスを、送信機の出力インピーダンス（ふつう 50 Ω）に合わせる装置です。SWR が高いときに整合をとり、送信機の電力を空中線系に送れるようにします。\u003c/p>\n\u003ch3 id=\"K14-3\">臨界周波数と MUF\u003c/h3>\n\u003cp>電離層は、周波数が高すぎる電波を反射できず、突き抜けさせてしまいます。反射できる周波数の上限を表すのが、臨界周波数と MUF です。\u003c/p>\n\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>用語\u003c/th>\u003cth>意味\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>臨界周波数\u003c/td>\u003ctd>電波を真上（垂直）に発射したとき、電離層で反射して戻ってくる最高の周波数。電離層の電子密度が高いほど高い\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MUF（最高使用周波数）\u003c/td>\u003ctd>ある 2 地点の間で、電離層の反射波で通信できる最高の周波数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LUF（最低使用周波数）\u003c/td>\u003ctd>これより低い周波数では、電離層（D 層など）での吸収が大きくなり、通信できない\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FOT（最適使用周波数）\u003c/td>\u003ctd>安定して通信しやすい周波数。MUF の 85 % ぐらい\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>電波は、電離層に斜めに入るほど、臨界周波数より高い周波数でも反射される。そのため、遠い 2 地点の間の MUF は、臨界周波数より高い\u003c/li>\u003cli>MUF より高い周波数は電離層を突き抜け、LUF より低い周波数は吸収される。通信には、その間の周波数を使う\u003c/li>\u003cli>周波数が高いほど、電離層で反射して最初に地上に戻る点が遠くなり、跳躍距離が長くなる\u003c/li>\u003c/ul>\n\u003ch3 id=\"K14-4\">時刻・季節・太陽活動と短波\u003c/h3>\n\u003cp>電離層の電子密度は、太陽の紫外線などで決まるので、時刻や季節、太陽の活動で変わります。\u003c/p>\n\u003cdiv class=\"table nw1\">\u003ctable>\u003cthead>\u003ctr>\u003cth>とき\u003c/th>\u003cth>電離層\u003c/th>\u003cth>よく使える周波数\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>昼\u003c/td>\u003ctd>電子密度が高く、MUF が高い。D 層が低い周波数を吸収する\u003c/td>\u003ctd>21 MHz 帯や 28 MHz 帯などの高い周波数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>夜\u003c/td>\u003ctd>D 層が消える。F 層の電子密度が下がり、MUF が低くなる\u003c/td>\u003ctd>3.5 MHz 帯や 7 MHz 帯などの低い周波数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>太陽の表面の黒点の数は、約 11 年の周期で増えたり減ったりする。黒点が多い時期は電離層の電子密度が高くなって MUF が上がり、28 MHz 帯などの高い周波数で遠距離の通信がしやすくなる\u003c/li>\u003cli>季節によっても、電離層の状態は変わる。日本では、初夏から夏の昼間にスポラジック E 層が現れやすく、28 MHz 帯や 50 MHz 帯の電波が思わぬ遠くまで届くことがある（第 9 章）\u003c/li>\u003cli>太陽のフレアによるデリンジャー現象や、磁気嵐が起こると、短波の通信が急にできなくなったり、不安定になったりする（第 9 章）\u003c/li>\u003c/ul>","sections":[{"id":"K14-1","title":"3アマで使える短波の周波数帯"},{"id":"K14-2","title":"短波の空中線"},{"id":"K14-3","title":"臨界周波数と MUF"},{"id":"K14-4","title":"時刻・季節・太陽活動と短波"}],"search":[{"id":"","title":"","text":"3アマは、8 MHz 以下と 18 MHz 以上の周波数で、空中線電力 50 ワットまで運用できます。短波（HF、3〜30 MHz）の電波は電離層で反射して遠くまで届きますが、時刻、季節、太陽の活動で届き方が大きく変わります。この章では、短波の空中線と、短波の電波の伝わり方をくわしく覚えます。電離層の基本と、デリンジャー現象などの現象は第 9 章にあります。"},{"id":"K14-1","title":"3アマで使える短波の周波数帯","text":"3アマで使える短波の周波数帯 3アマの操作の範囲は、空中線電力 50 ワット以下で、18 MHz 以上又は 8 MHz 以下の周波数です（電波法施行令第 3 条、法規の第 4 章・第 9 章）。短波のアマチュアの周波数帯では、次のようになります。 周波数帯3アマ1.9 MHz 帯、3.5 MHz 帯、3.8 MHz 帯、7 MHz 帯運用できる（8 MHz 以下）10 MHz 帯、14 MHz 帯運用できない（2アマ以上が要る）18 MHz 帯、21 MHz 帯、24 MHz 帯、28 MHz 帯運用できる（18 MHz 以上）"},{"id":"K14-2","title":"短波の空中線","text":"短波の空中線 短波は波長が長い（7 MHz で約 43 m）ので、空中線も大きくなります。 空中線形と特徴半波長ダイポール長さが 2 分の 1 波長。7 MHz なら 300 ÷ 7 ÷ 2 ≒ 21.4 m、21 MHz なら約 7.1 m。実際には、導線の太さなどの影響で、計算より少し短くする逆 V 形ダイポール1 本の支柱の上から、ダイポールの両側を斜め下へ張る。広い場所がなくても張れるトラップ付きダイポール導線の途中に、コイルとコンデンサの並列共振回路（トラップ）を入れ、1 本で 2 つ以上の周波数帯に使う1/4 波長垂直接地空中線（バーチカル）長さが 4 分の 1 波長（7 MHz で約 10.7 m）。大地やラジアル（放射状の導線）と組み合わせる。水平面内は全方向に同じ（無指向性） トラップは、トラップの共振周波数（高いほうの周波数帯）では、インピーダンスがとても高くなって、外側の導線を切り離します。内側の導線だけが、高い周波数の半波長ダイポールとして働きます。共振周波数より低い周波数では、トラップはコイル（延長コイル）として働き、全体が低い周波数の半波長ダイポールとして働きます。 高い周波数帯→トラップのインピーダンスが高い→内側だけが働く低い周波数帯→トラップはコイルとして働く→全体が働く アンテナチューナ（空中線整合器）は、空中線系のインピーダンスを、送信機の出力インピーダンス（ふつう 50 Ω）に合わせる装置です。SWR が高いときに整合をとり、送信機の電力を空中線系に送れるようにします。"},{"id":"K14-3","title":"臨界周波数と MUF","text":"臨界周波数と MUF 電離層は、周波数が高すぎる電波を反射できず、突き抜けさせてしまいます。反射できる周波数の上限を表すのが、臨界周波数と MUF です。 用語意味臨界周波数電波を真上（垂直）に発射したとき、電離層で反射して戻ってくる最高の周波数。電離層の電子密度が高いほど高いMUF（最高使用周波数）ある 2 地点の間で、電離層の反射波で通信できる最高の周波数LUF（最低使用周波数）これより低い周波数では、電離層（D 層など）での吸収が大きくなり、通信できないFOT（最適使用周波数）安定して通信しやすい周波数。MUF の 85 % ぐらい 電波は、電離層に斜めに入るほど、臨界周波数より高い周波数でも反射される。そのため、遠い 2 地点の間の MUF は、臨界周波数より高いMUF より高い周波数は電離層を突き抜け、LUF より低い周波数は吸収される。通信には、その間の周波数を使う周波数が高いほど、電離層で反射して最初に地上に戻る点が遠くなり、跳躍距離が長くなる"},{"id":"K14-4","title":"時刻・季節・太陽活動と短波","text":"時刻・季節・太陽活動と短波 電離層の電子密度は、太陽の紫外線などで決まるので、時刻や季節、太陽の活動で変わります。 とき電離層よく使える周波数昼電子密度が高く、MUF が高い。D 層が低い周波数を吸収する21 MHz 帯や 28 MHz 帯などの高い周波数夜D 層が消える。F 層の電子密度が下がり、MUF が低くなる3.5 MHz 帯や 7 MHz 帯などの低い周波数 太陽の表面の黒点の数は、約 11 年の周期で増えたり減ったりする。黒点が多い時期は電離層の電子密度が高くなって MUF が上がり、28 MHz 帯などの高い周波数で遠距離の通信がしやすくなる季節によっても、電離層の状態は変わる。日本では、初夏から夏の昼間にスポラジック E 層が現れやすく、28 MHz 帯や 50 MHz 帯の電波が思わぬ遠くまで届くことがある（第 9 章）太陽のフレアによるデリンジャー現象や、磁気嵐が起こると、短波の通信が急にできなくなったり、不安定になったりする（第 9 章）"}],"only":"3アマ"}],"questions":[{"id":"H01-01","subject":"法規","chapter":"H01","text":"\u003cp>電波法の目的として、電波法に規定されているものはどれか。\u003c/p>","choices":["電波の公平かつ能率的な利用を確保することによって、公共の福祉を増進すること","電波の能率的な利用と無線技術の進歩を図ることによって、国民の生活を豊かにすること","無線局の開設を自由にすることによって、無線通信の発達を図ること","電波の秩序を守ることによって、無線通信の安全を確保すること"],"answer":0,"explain":"\u003cp>電波法の第 1 条です。「公平」「能率的」「公共の福祉」の 3 つの言葉で覚えます。\u003c/p>","refs":[{"label":"電波法 第1条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_1","lines":["（目的）","第一条　この法律は、電波の公平且つ能率的な利用を確保することによつて、公共の福祉を増進することを目的とする。"]}],"section":"H01-2","fixed":false},{"id":"H01-02","subject":"法規","chapter":"H01","text":"\u003cp>次の文は、電波法の目的の規定である。[ A ] と [ B ] に入る字句の組合せで、正しいものはどれか。\u003cbr>「この法律は、電波の [ A ] な利用を確保することによって、[ B ] を増進することを目的とする。」\u003c/p>","choices":["A：公平かつ能率的　B：公共の福祉","A：公平かつ能率的　B：無線通信の発達","A：自由かつ効率的　B：公共の福祉","A：自由かつ効率的　B：無線通信の発達"],"answer":0,"explain":"\u003cp>A は「公平かつ能率的」、B は「公共の福祉」です。「自由」や「無線通信の発達」は、第 1 条には出てきません。\u003c/p>","refs":[{"label":"電波法 第1条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_1","lines":["（目的）","第一条　この法律は、電波の公平且つ能率的な利用を確保することによつて、公共の福祉を増進することを目的とする。"]}],"section":"H01-2","fixed":true},{"id":"H01-03","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「電波」の定義はどれか。\u003c/p>","choices":["300 万メガヘルツ以下の周波数の電磁波","30 万メガヘルツ以下の周波数の電磁波","3 万メガヘルツ以下の周波数の電磁波","3,000 メガヘルツ以下の周波数の電磁波"],"answer":0,"explain":"\u003cp>電波は「300 万メガヘルツ以下の周波数の電磁波」です。数字の「300 万」を覚えます。\u003c/p>","refs":[{"label":"電波法 第2条第1項第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_1","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","一　「電波」とは、三百万メガヘルツ以下の周波数の電磁波をいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-04","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「無線電信」の定義はどれか。\u003c/p>","choices":["電波を利用して、符号を送り、又は受けるための通信設備","電波を利用して、音声その他の音響を送り、又は受けるための通信設備","電波を利用して、符号を送るための電気的設備","有線又は無線を利用して、符号を送り、又は受けるための通信設備"],"answer":0,"explain":"\u003cp>無線電信は「符号」を送り、又は受けるための「通信設備」です。「音声その他の音響」は無線電話の定義です。\u003c/p>","refs":[{"label":"電波法 第2条第1項第2号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_2","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","二　「無線電信」とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-05","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「無線電話」の定義はどれか。\u003c/p>","choices":["電波を利用して、音声その他の音響を送り、又は受けるための通信設備","電波を利用して、符号を送り、又は受けるための通信設備","電波を利用して、音声を送るための電気的設備","無線設備及び無線設備の操作を行う者の総体"],"answer":0,"explain":"\u003cp>無線電話は「音声その他の音響」を送り、又は受けるための「通信設備」です。「符号」は無線電信、「総体」は無線局の定義です。\u003c/p>","refs":[{"label":"電波法 第2条第1項第3号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_3","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","三　「無線電話」とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-06","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「無線設備」の定義はどれか。\u003c/p>","choices":["無線電信、無線電話その他電波を送り、又は受けるための電気的設備","無線電信、無線電話その他電波を送るための通信設備","無線設備及び無線設備の操作を行う者の総体","電波を利用して、符号又は音響を送り、又は受けるための通信設備"],"answer":0,"explain":"\u003cp>無線設備は「電波を送り、又は受けるための電気的設備」です。送るだけでなく、受けるための設備も入ります。\u003c/p>","refs":[{"label":"電波法 第2条第1項第4号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_4","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","四　「無線設備」とは、無線電信、無線電話その他電波を送り、又は受けるための電気的設備をいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-07","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「無線局」の定義はどれか。\u003c/p>","choices":["無線設備及び無線設備の操作を行う者の総体をいう。ただし、受信のみを目的とするものを含まない。","無線設備及び無線設備の操作を行う者の総体をいい、受信のみを目的とするものを含む。","無線電信、無線電話その他電波を送り、又は受けるための電気的設備をいう。","無線設備の操作を行う者であって、総務大臣の免許を受けたものをいう。"],"answer":0,"explain":"\u003cp>無線局は、設備と、その操作を行う人をあわせた「総体」です。受信のみを目的とするものは含みません。\u003c/p>","refs":[{"label":"電波法 第2条第1項第5号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_5","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","五　「無線局」とは、無線設備及び無線設備の操作を行う者の総体をいう。但し、受信のみを目的とするものを含まない。"]}],"section":"H01-3","fixed":false},{"id":"H01-08","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する「無線従事者」の定義はどれか。\u003c/p>","choices":["無線設備の操作又はその監督を行う者であって、総務大臣の免許を受けたもの","無線設備の操作を行う者であって、総務大臣に届け出たもの","無線局の免許を受けた者","無線設備の操作又はその監督を行う者であって、国家試験に合格したもの"],"answer":0,"explain":"\u003cp>無線従事者は、操作や監督を行う者で、総務大臣の「免許を受けた」ものです。国家試験に合格しただけでは無線従事者ではなく、免許を受けて無線従事者になります。\u003c/p>","refs":[{"label":"電波法 第2条第1項第6号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_6","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","六　「無線従事者」とは、無線設備の操作又はその監督を行う者であつて、総務大臣の免許を受けたものをいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-09","subject":"法規","chapter":"H01","text":"\u003cp>電波法施行規則に規定する「アマチュア業務」の定義はどれか。\u003c/p>","choices":["金銭上の利益のためでなく、もっぱら個人的な無線技術の興味によって行う自己訓練、通信及び技術的研究その他総務大臣が別に告示する業務を行う無線通信業務","金銭上の利益のためでなく、もっぱら公共の利益のために行う通信及び技術的研究の業務を行う無線通信業務","個人的な無線技術の興味によって行う無線通信業務であって、営利を目的とするものを含むもの","無線技術の研究のため、もっぱら試験的に行う無線通信業務"],"answer":0,"explain":"\u003cp>「金銭上の利益のためでなく」「個人的な無線技術の興味によって」が決め手です。お金もうけや、公共の仕事のための業務ではありません。\u003c/p>","refs":[{"label":"電波法施行規則 第3条第1項第15号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_3-Pr_1-It_15","lines":["宇宙無線通信の業務以外の無線通信業務を次のとおり分類し、それぞれ当該各号に定めるとおり定義する。","十五　アマチュア業務　金銭上の利益のためでなく、もつぱら個人的な無線技術の興味によつて行う自己訓練、通信及び技術的研究その他総務大臣が別に告示する業務を行う無線通信業務をいう。"]}],"section":"H01-4","fixed":false},{"id":"H01-10","subject":"法規","chapter":"H01","text":"\u003cp>次の記述のうち、電波法の用語の定義に照らして正しいものはどれか。\u003c/p>","choices":["受信のみを目的とするものは、無線局に含まれない。","無線局とは、無線設備だけをいい、無線設備の操作を行う者を含まない。","無線電話とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。","無線従事者とは、無線局の免許を受けた者をいう。"],"answer":0,"explain":"\u003cp>無線局の定義のただし書に「受信のみを目的とするものを含まない」とあります。無線局は人も含む総体で、符号を送るのは無線電信、無線従事者は無線設備の操作や監督の免許を受けた者です。\u003c/p>","refs":[{"label":"電波法 第2条第1項第5号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_5","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","五　「無線局」とは、無線設備及び無線設備の操作を行う者の総体をいう。但し、受信のみを目的とするものを含まない。"]}],"section":"H01-3","fixed":false},{"id":"H01-11","subject":"法規","chapter":"H01","text":"\u003cp>電波法でいう「電波」の上限の周波数を、別の単位で表したものはどれか。\u003c/p>","choices":["3,000 ギガヘルツ","300 ギガヘルツ","30 ギガヘルツ","3 ギガヘルツ"],"answer":0,"explain":"\u003cp>上限は 300 万メガヘルツです。1 ギガヘルツは 1,000 メガヘルツなので、300 万 ÷ 1,000 ＝ 3,000 ギガヘルツです。\u003c/p>","refs":[{"label":"電波法 第2条第1項第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_1","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","一　「電波」とは、三百万メガヘルツ以下の周波数の電磁波をいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-12","subject":"法規","chapter":"H01","text":"\u003cp>電波法に規定する用語の定義のうち、誤っているものはどれか。\u003c/p>","choices":["「電波」とは、300 万メガヘルツ以下の周波数の電磁波をいう。","「無線設備」とは、無線電信、無線電話その他電波を送り、又は受けるための電気的設備をいう。","「無線局」とは、無線設備の操作を行う者であって、総務大臣の免許を受けたものをいう。","「無線電話」とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。"],"answer":2,"explain":"\u003cp>「総務大臣の免許を受けたもの」は、無線従事者の定義です。無線局は「無線設備及び無線設備の操作を行う者の総体」です。\u003c/p>","refs":[{"label":"電波法 第2条第1項第5号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_5","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","五　「無線局」とは、無線設備及び無線設備の操作を行う者の総体をいう。但し、受信のみを目的とするものを含まない。"]},{"label":"電波法 第2条第1項第6号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_1-At_2-Pr_1-It_6","lines":["この法律及びこの法律に基づく命令の規定の解釈に関しては、次の定義に従うものとする。","六　「無線従事者」とは、無線設備の操作又はその監督を行う者であつて、総務大臣の免許を受けたものをいう。"]}],"section":"H01-3","fixed":false},{"id":"H01-13","subject":"法規","chapter":"H01","text":"\u003cp>電波法施行規則に規定する「アマチュア局」の定義はどれか。\u003c/p>","choices":["アマチュア業務を行う無線局","アマチュア無線技士の資格をもつ者が開設する無線局","個人が開設するすべての無線局","空中線電力が 20 ワット以下の無線局"],"answer":0,"explain":"\u003cp>アマチュア局は「アマチュア業務を行う無線局」です。開設する人の資格や、送信出力で決まるのではありません。\u003c/p>","refs":[{"label":"電波法施行規則 第4条第1項第24号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4-Pr_1-It_24","lines":["無線局の種別を次のとおり定め、それぞれ当該各号に定めるとおり定義する。","二十四　アマチュア局　アマチュア業務を行う無線局をいう。"]}],"section":"H01-4","fixed":false},{"id":"H02-01","subject":"法規","chapter":"H02","text":"\u003cp>無線局を開設しようとする者が受けなければならないのは、だれの免許か。\u003c/p>","choices":["総務大臣","都道府県知事","日本無線協会の会長","内閣総理大臣"],"answer":0,"explain":"\u003cp>電波法第 4 条で「総務大臣の免許を受けなければならない」と決められています。\u003c/p>","refs":[{"label":"電波法 第4条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_4-Pr_1","lines":["無線局を開設しようとする者は、総務大臣の免許を受けなければならない。ただし、次に掲げる無線局については、この限りでない。","一　発射する電波が著しく微弱な無線局で総務省令で定めるもの","二　二十六・九メガヘルツから二十七・二メガヘルツまでの周波数の電波を使用し、かつ、空中線電力が〇・五ワット以下である無線局のうち総務省令で定めるものであつて、第三十八条の七第一項（第三十八条の三十一第四項において準用する場合を含む。）、第三十八条の二十六（第三十八条の三十一第六項において準用する場合を含む。）若しくは第三十八条の三十五又は第三十八条の四十四第三項の規定により表示が付されている無線設備（第三十八条の二十三第一項（第三十八条の二十九、第三十八条の三十一第四項及び第六項並びに第三十八条の三十八において準用する場合を含む。）の規定により表示が付されていないものとみなされたものを除く。以下「適合表示無線設備」という。）のみを使用するもの","三　空中線電力が一ワット以下である無線局のうち総務省令で定めるものであつて、第四条の三の規定により指定された呼出符号又は呼出名称を自動的に送信し、又は受信する機能その他総務省令で定める機能を有することにより他の無線局にその運用を阻害するような混信その他の妨害を与えないように運用することができるもので、かつ、適合表示無線設備のみを使用するもの","四　第二十七条の二十一第一項の登録を受けて開設する無線局（以下「登録局」という。）"]}],"section":"H02-1","fixed":false},{"id":"H02-02","subject":"法規","chapter":"H02","text":"\u003cp>電波法第 4 条の規定により、免許を受けなくても開設できる無線局はどれか。\u003c/p>","choices":["発射する電波が著しく微弱な無線局で、総務省令で定めるもの","空中線電力が 5 ワット以下のアマチュア局","適合表示無線設備だけを使用するアマチュア局","144 MHz 帯の電波を使用する、移動するアマチュア局"],"answer":0,"explain":"\u003cp>免許が要らないのは、著しく微弱な無線局、市民ラジオ、1 ワット以下の一部の小電力の無線局、登録局です。アマチュア局は、出力が小さくても、技適のある無線機だけを使っても、免許が要ります。\u003c/p>","refs":[{"label":"電波法 第4条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_4-Pr_1","lines":["無線局を開設しようとする者は、総務大臣の免許を受けなければならない。ただし、次に掲げる無線局については、この限りでない。","一　発射する電波が著しく微弱な無線局で総務省令で定めるもの","二　二十六・九メガヘルツから二十七・二メガヘルツまでの周波数の電波を使用し、かつ、空中線電力が〇・五ワット以下である無線局のうち総務省令で定めるものであつて、第三十八条の七第一項（第三十八条の三十一第四項において準用する場合を含む。）、第三十八条の二十六（第三十八条の三十一第六項において準用する場合を含む。）若しくは第三十八条の三十五又は第三十八条の四十四第三項の規定により表示が付されている無線設備（第三十八条の二十三第一項（第三十八条の二十九、第三十八条の三十一第四項及び第六項並びに第三十八条の三十八において準用する場合を含む。）の規定により表示が付されていないものとみなされたものを除く。以下「適合表示無線設備」という。）のみを使用するもの","三　空中線電力が一ワット以下である無線局のうち総務省令で定めるものであつて、第四条の三の規定により指定された呼出符号又は呼出名称を自動的に送信し、又は受信する機能その他総務省令で定める機能を有することにより他の無線局にその運用を阻害するような混信その他の妨害を与えないように運用することができるもので、かつ、適合表示無線設備のみを使用するもの","四　第二十七条の二十一第一項の登録を受けて開設する無線局（以下「登録局」という。）"]}],"section":"H02-1","fixed":false},{"id":"H02-03","subject":"法規","chapter":"H02","text":"\u003cp>日本の国籍を有しない人などに無線局の免許を与えない、という電波法第 5 条第 1 項のきまりについて、正しいものはどれか。\u003c/p>","choices":["アマチュア無線局には適用されない。","アマチュア無線局にも適用される。","アマチュア無線局には、空中線電力が 10 ワット以下のときだけ適用されない。","実験等無線局にだけ適用される。"],"answer":0,"explain":"\u003cp>電波法第 5 条第 2 項で、第 1 項は実験等無線局やアマチュア無線局などには適用しないとされています。外国籍の人でも、アマチュア局の免許を受けられます。\u003c/p>","refs":[{"label":"電波法 第5条第2項第2号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_5-Pr_2-It_2","lines":["前項の規定は、次に掲げる無線局については、適用しない。","二　アマチュア無線局（個人的な興味によつて無線通信を行うために開設する無線局をいう。以下同じ。）"]}],"section":"H02-2","fixed":false},{"id":"H02-04","subject":"法規","chapter":"H02","text":"\u003cp>次の文の [ ] に入る期間はどれか。\u003cbr>「電波法に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなった日から [ ] を経過しない者には、無線局の免許を与えないことができる。」\u003c/p>","choices":["2 年","1 年","3 年","5 年"],"answer":0,"explain":"\u003cp>2 年です。免許の取消しを受けた者も、取消しの日から 2 年を経過しないうちは、免許を与えないことができます。\u003c/p>","refs":[{"label":"電波法 第5条第3項第1号","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_5-Pr_3-It_1","lines":["次の各号のいずれかに該当する者には、無線局の免許を与えないことができる。","一　この法律又は放送法（昭和二十五年法律第百三十二号）に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなつた日から二年を経過しない者"]}],"section":"H02-2","fixed":false},{"id":"H02-05","subject":"法規","chapter":"H02","text":"\u003cp>予備免許を与えるときに指定する事項に含まれないものはどれか。\u003c/p>","choices":["免許の有効期間","工事落成の期限","空中線電力","運用許容時間"],"answer":0,"explain":"\u003cp>予備免許で指定するのは、工事落成の期限、電波の型式と周波数、識別信号、空中線電力、運用許容時間の 5 つです。\u003c/p>","refs":[{"label":"電波法 第8条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_8-Pr_1","lines":["総務大臣は、前条の規定により審査した結果、その申請が同条第一項各号又は第二項各号に適合していると認めるときは、申請者に対し、次に掲げる事項を指定して、無線局の予備免許を与える。","一　工事落成の期限","二　電波の型式及び周波数","三　呼出符号（標識符号を含む。）、呼出名称その他の総務省令で定める識別信号（以下「識別信号」という。）","四　空中線電力","五　運用許容時間"]}],"section":"H02-3","fixed":false},{"id":"H02-06","subject":"法規","chapter":"H02","text":"\u003cp>予備免許を受けた者から、工事落成の期限が過ぎてから一定の期間内に工事落成の届出がないとき、総務大臣はその無線局の免許を拒否しなければならない。その期間はどれか。\u003c/p>","choices":["2 週間","1 週間","1 か月","3 か月"],"answer":0,"explain":"\u003cp>工事落成の期限（延長されたときは延長後の期限）を過ぎてから 2 週間以内に届出がないと、免許は拒否されます。\u003c/p>","refs":[{"label":"電波法 第11条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_11","lines":["（免許の拒否）","第十一条　第八条第一項第一号の期限（同条第二項の規定による期限の延長があつたときは、その期限）経過後二週間以内に前条の規定による届出がないときは、総務大臣は、その無線局の免許を拒否しなければならない。"]}],"section":"H02-3","fixed":false},{"id":"H02-07","subject":"法規","chapter":"H02","text":"\u003cp>適合表示無線設備だけを使用する無線局の免許の手続として、正しいものはどれか。\u003c/p>","choices":["申請を審査して適合と認められれば、予備免許と落成後の検査を経ずに免許が与えられる。","予備免許を受けたあと、落成後の検査に合格すると免許が与えられる。","免許は要らず、運用を始める前に届け出ればよい。","落成後の検査に合格してから、免許を申請する。"],"answer":0,"explain":"\u003cp>適合表示無線設備だけを使う無線局は、簡易な手続きで免許を受けられます（電波法第 15 条）。予備免許、落成後の検査などの手続きは行いません。\u003c/p>","refs":[{"label":"電波法 第15条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_15","lines":["（簡易な免許手続）","第十五条　第十三条第一項ただし書の再免許及び適合表示無線設備のみを使用する無線局その他総務省令で定める無線局の免許については、第六条（第八項及び第九項を除く。）及び第八条から第十二条までの規定にかかわらず、総務省令で定める簡易な手続によることができる。"]},{"label":"無線局免許手続規則 第15条の4第3項","url":"https://laws.e-gov.go.jp/law/325M50080000015#Mp-Ch_2-Se_1_2-At_15_4-Pr_3","lines":["法第八条に規定する予備免許、法第九条に規定する工事設計の変更、法第十条に規定する落成後の検査及び法第十一条に規定する免許の拒否の各手続は、第一項の免許については、適用しない。"]}],"section":"H02-3","fixed":false},{"id":"H02-08","subject":"法規","chapter":"H02","text":"\u003cp>アマチュア局の免許の有効期間はどれか。\u003c/p>","choices":["免許の日から起算して 5 年","免許の日から起算して 3 年","免許の日から起算して 10 年","無期限"],"answer":0,"explain":"\u003cp>電波法第 13 条で 5 年を超えない範囲で総務省令で定めるとされ、電波法施行規則第 7 条で、アマチュア局を含む「その他の無線局」は 5 年です。\u003c/p>","refs":[{"label":"電波法 第13条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_13-Pr_1","lines":["免許の有効期間は、免許の日から起算して五年を超えない範囲内において総務省令で定める。ただし、再免許を妨げない。"]},{"label":"電波法施行規則 第7条第1項第7号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_1-At_7-Pr_1-It_7","lines":["法第十三条第一項の総務省令で定める免許の有効期間は、次の各号に掲げる無線局の種別に従い、それぞれ当該各号に定めるとおりとする。","七　その他の無線局　五年"]}],"section":"H02-4","fixed":false},{"id":"H02-09","subject":"法規","chapter":"H02","text":"\u003cp>アマチュア局（人工衛星等のアマチュア局を除く）の再免許の申請を行う期間として、正しいものはどれか。\u003c/p>","choices":["免許の有効期間満了前 1 か月以上 6 か月を超えない期間","免許の有効期間満了前 3 か月以上 6 か月を超えない期間","免許の有効期間満了前 1 か月以上 1 年を超えない期間","免許の有効期間満了後 1 か月以内"],"answer":0,"explain":"\u003cp>満了日の 6 か月前から 1 か月前までの間に申請します。「3 か月以上 6 か月を超えない期間」は、アマチュア局と特定実験試験局を除く、ほかの無線局の期間です。\u003c/p>","refs":[{"label":"無線局免許手続規則 第18条第1項第1号","url":"https://laws.e-gov.go.jp/law/325M50080000015#Mp-Ch_2-Se_2-At_18-Pr_1-It_1","lines":["再免許の申請は、次の各号に掲げる無線局の種別に従い、それぞれ当該各号に掲げる期間に行わなければならない。ただし、免許の有効期間が一年以内である無線局については、その有効期間満了前一箇月までに行うことができる。","一　アマチュア局（人工衛星等のアマチュア局を除く。）　免許の有効期間満了前一箇月以上六箇月を超えない期間"]}],"section":"H02-4","fixed":false},{"id":"H02-10","subject":"法規","chapter":"H02","text":"\u003cp>総務大臣が無線局の免許を与えたときの扱いとして、電波法に規定されているものはどれか。\u003c/p>","choices":["免許の内容を記録した電磁的記録（免許記録）を作成し、免許人に通知する。","紙の免許状を交付し、無線設備のある場所に掲げさせる。","免許人に、無線従事者免許証を交付する。","免許の内容は記録せず、免許人に口頭で伝える。"],"answer":0,"explain":"\u003cp>いまは紙の免許状ではなく、免許記録という電子の記録が作られ、免許人に通知されます。免許人は、免許記録を証明した書面の交付を請求できます（電波法第 14 条の 2）。無線従事者免許証は、人の資格の免許証です。\u003c/p>","refs":[{"label":"電波法 第14条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["総務大臣は、免許を与えたときは、当該免許に係る次に掲げる事項を記録した電磁的記録（電子的方式、磁気的方式その他人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下同じ。）を作成し、総務省令で定めるところにより、遅滞なく、その旨及び総務省令で定める事項を当該免許に係る免許人（無線局の免許を受けた者をいう。以下同じ。）に通知するとともに、当該電磁的記録に記録されている事項を、当該免許の有効期間中、当該免許人が閲覧することができる状態に置かなければならない。","一　免許の年月日及び免許の番号","二　免許人の氏名又は名称及び住所","三　無線局の種別","四　無線局の目的（主たる目的及び従たる目的を有する無線局にあつては、その主従の区別を含む。）","五　通信の相手方及び通信事項","六　無線設備の設置場所","七　免許の有効期間","八　識別信号","九　電波の型式及び周波数","十　空中線電力","十一　運用許容時間"]}],"section":"H02-5","fixed":false},{"id":"H02-11","subject":"法規","chapter":"H02","text":"\u003cp>電波法第 14 条で、免許記録に記録する事項として規定されていないものはどれか。\u003c/p>","choices":["免許人の生年月日","識別信号","空中線電力","免許の有効期間"],"answer":0,"explain":"\u003cp>免許人について記録されるのは、氏名又は名称と住所です。生年月日は、記録する事項に入っていません。\u003c/p>","refs":[{"label":"電波法 第14条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_14-Pr_1","lines":["総務大臣は、免許を与えたときは、当該免許に係る次に掲げる事項を記録した電磁的記録（電子的方式、磁気的方式その他人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下同じ。）を作成し、総務省令で定めるところにより、遅滞なく、その旨及び総務省令で定める事項を当該免許に係る免許人（無線局の免許を受けた者をいう。以下同じ。）に通知するとともに、当該電磁的記録に記録されている事項を、当該免許の有効期間中、当該免許人が閲覧することができる状態に置かなければならない。","一　免許の年月日及び免許の番号","二　免許人の氏名又は名称及び住所","三　無線局の種別","四　無線局の目的（主たる目的及び従たる目的を有する無線局にあつては、その主従の区別を含む。）","五　通信の相手方及び通信事項","六　無線設備の設置場所","七　免許の有効期間","八　識別信号","九　電波の型式及び周波数","十　空中線電力","十一　運用許容時間"]}],"section":"H02-5","fixed":false},{"id":"H02-12","subject":"法規","chapter":"H02","text":"\u003cp>免許人が無線設備の設置場所を変更しようとするときの手続として、正しいものはどれか。\u003c/p>","choices":["あらかじめ総務大臣の許可を受ける。","変更したあと、遅滞なく総務大臣に届け出る。","変更したあと、1 か月以内に総務大臣に届け出る。","手続は要らない。"],"answer":0,"explain":"\u003cp>無線局の目的、通信の相手方、通信事項、無線設備の設置場所の変更と、無線設備の変更の工事は、あらかじめ許可を受けます。\u003c/p>","refs":[{"label":"電波法 第17条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_17-Pr_1","lines":["免許人は、無線局の目的、通信の相手方、通信事項、放送事項、放送区域若しくは無線設備の設置場所の変更若しくは第六条第二項第六号に掲げる事項の変更（総務省令で定める軽微な変更を除く。）をし、又は無線設備の変更の工事をしようとするときは、あらかじめ、総務大臣の許可を受けなければならない。ただし、次に掲げる事項を内容とする無線局の目的の変更は、これを行うことができない。","一　基幹放送局以外の無線局が基幹放送をすることとすること。","二　基幹放送局が基幹放送をしないこととすること。"]}],"section":"H02-6","fixed":false},{"id":"H02-13","subject":"法規","chapter":"H02","text":"\u003cp>無線設備の変更の工事の許可を受けた免許人が、許可に係る無線設備を運用できるのはいつか。ただし、総務省令で定める場合を除く。\u003c/p>","choices":["総務大臣の検査を受け、許可の内容に適合していると認められた後","変更の工事の許可を受けた直後","変更の工事が終わった直後","変更の工事が終わったことを届け出た直後"],"answer":0,"explain":"\u003cp>設置場所の変更や変更の工事の許可を受けたときは、検査を受けて、許可の内容に適合していると認められた後でなければ運用できません。\u003c/p>","refs":[{"label":"電波法 第18条第1項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_18-Pr_1","lines":["前条第一項の規定により無線設備の設置場所の変更又は無線設備の変更の工事の許可を受けた免許人は、総務大臣の検査を受け、当該変更又は工事の結果が同条同項の許可の内容に適合していると認められた後でなければ、許可に係る無線設備を運用してはならない。ただし、総務省令で定める場合は、この限りでない。"]}],"section":"H02-6","fixed":false},{"id":"H02-14","subject":"法規","chapter":"H02","text":"\u003cp>免許人の氏名が変わり、免許記録に記録した事項に変更を生じたときの手続として、正しいものはどれか。ただし、変更の許可などを受けた場合を除く。\u003c/p>","choices":["遅滞なく、その旨を総務大臣に届け出る。","あらかじめ、総務大臣の許可を受ける。","次の再免許の申請のときに届け出る。","手続は要らない。"],"answer":0,"explain":"\u003cp>許可などに当たらない変更で、免許記録の事項に変更を生じたときは、免許人が遅滞なく届け出ます。届出があると、総務大臣が免許記録を変更して通知します。\u003c/p>","refs":[{"label":"電波法 第21条第2項","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_21-Pr_2","lines":["免許人は、前項第一号に掲げる場合に該当しない場合において、免許記録に記録した事項に変更を生じたときは、総務省令で定めるところにより、遅滞なく、その旨を総務大臣に届け出なければならない。"]}],"section":"H02-6","fixed":false},{"id":"H02-15","subject":"法規","chapter":"H02","text":"\u003cp>免許人が無線局を廃止するときの手続として、正しいものはどれか。\u003c/p>","choices":["その旨を総務大臣に届け出る。","あらかじめ総務大臣の許可を受ける。","免許記録を自分で消去する。","手続は要らない。"],"answer":0,"explain":"\u003cp>廃止するときは届け出ます。無線局を廃止すると、免許は効力を失います（電波法第 23 条）。\u003c/p>","refs":[{"label":"電波法 第22条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_22","lines":["（無線局の廃止）","第二十二条　免許人は、その無線局を廃止するときは、その旨を総務大臣に届け出なければならない。"]},{"label":"電波法 第23条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_2-Se_1-At_23","lines":["第二十三条　免許人が無線局を廃止したときは、免許は、その効力を失う。"]}],"section":"H02-6","fixed":false},{"id":"H02-16","subject":"法規","chapter":"H02","text":"\u003cp>無線局の免許がその効力を失ったとき、アマチュア局の免許人であった者が遅滞なく講じなければならない措置はどれか。\u003c/p>","choices":["空中線を撤去すること","送信機を総務大臣に返納すること","無線設備の電池を取り外すこと","無線設備に封印をすること"],"answer":0,"explain":"\u003cp>電波法第 78 条で電波の発射を防止する措置が求められ、電波法施行規則第 42 条の 4 の表で、アマチュア局を含む「その他の無線設備」は空中線を撤去することとされています。電池を取り外すのは、携帯用位置指示無線標識などの措置です。\u003c/p>","refs":[{"label":"電波法 第78条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_6-At_78","lines":["（電波の発射の防止）","第七十八条　無線局の免許等がその効力を失つたときは、免許人等であつた者は、遅滞なく空中線の撤去その他の総務省令で定める電波の発射を防止するために必要な措置を講じなければならない。"]},{"label":"電波法施行規則 第42条の4第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_2-Se_7-At_42_4-Pr_1","lines":["法第七十八条（法第四条の二第五項において準用する場合を含む。）の総務省令で定める電波の発射を防止するために必要な措置は、次の表の上欄に掲げる無線局の無線設備の区別に従い、それぞれ同表の下欄に掲げるとおりとする。ただし、当該無線設備のうち、設置場所（移動する無線局にあつては、移動範囲又は常置場所）、利用方法その他の事情により当該措置を行うことが困難なものであつて総務大臣が別に告示するものについては、同表の下段に掲げる措置に代え、別に告示する措置によることができる。","無線設備｜必要な措置","一　携帯用位置指示無線標識、衛星非常用位置指示無線標識、捜索救助用レーダートランスポンダ、捜索救助用位置指示送信装置、設備規則第四十五条の三の五に規定する無線設備、航空機用救命無線機及び航空機用携帯無線機｜電池を取り外すこと。","六　その他の無線設備｜空中線を撤去すること。"]}],"section":"H02-6","fixed":false},{"id":"H02-17","subject":"法規","chapter":"H02","text":"\u003cp>アマチュア局（人工衛星等のアマチュア局を除く）の免許を申請するとき、申請書への記載を省略できる事項はどれか。\u003c/p>","choices":["開設を必要とする理由","無線設備の設置場所","電波の型式並びに希望する周波数の範囲及び空中線電力","無線設備の工事設計"],"answer":0,"explain":"\u003cp>アマチュア局は、開設を必要とする理由、通信の相手方、希望する運用許容時間、運用開始の予定期日の記載を省略できます。\u003c/p>","refs":[{"label":"無線局免許手続規則 第15条第1項第5号","url":"https://laws.e-gov.go.jp/law/325M50080000015#Mp-Ch_2-Se_1_2-At_15-Pr_1-It_5","lines":["次に掲げる無線局の免許を申請しようとするときは、法第六条の規定する記載事項のうち、次の区分に従い、それぞれ下記の事項の記載を省略することができる。","五　アマチュア局（人工衛星等のアマチュア局を除く。）　開設を必要とする理由、通信の相手方、希望する運用許容時間及び運用開始の予定期日"]}],"section":"H02-3","fixed":false},{"id":"H03-01","subject":"法規","chapter":"H03","text":"\u003cp>電波の型式「F3E」を表す記述として、正しいものはどれか。\u003c/p>","choices":["周波数変調で、アナログ信号の単一チャネルの電話","振幅変調の両側波帯で、アナログ信号の単一チャネルの電話","抑圧搬送波による単側波帯で、アナログ信号の単一チャネルの電話","周波数変調で、デジタル信号の単一チャネルの電信（自動受信）"],"answer":0,"explain":"\u003cp>F は周波数変調、3 はアナログ信号の単一チャネル、E は電話です。FM の電話で、UV-5R Mini もこの型式です。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の2第1項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_2-Pr_1","lines":["電波の主搬送波の変調の型式、主搬送波を変調する信号の性質及び伝送情報の型式は、次の各号に掲げるように分類し、それぞれ当該各号に掲げる記号をもつて表示する。ただし、主搬送波を変調する信号の性質を表示する記号は、対応する算用数字をもつて表示することがあるものとする。","一　主搬送波の変調の型式｜記号","（１）　無変調｜Ｎ","（２）　振幅変調","（一）　両側波帯｜Ａ","（二）　全搬送波による単側波帯｜Ｈ","（三）　低減搬送波による単側波帯｜Ｒ","（四）　抑圧搬送波による単側波帯｜Ｊ","（五）　独立側波帯｜Ｂ","（六）　残留側波帯｜Ｃ","（３）　角度変調","（一）　周波数変調｜Ｆ","（二）　位相変調｜Ｇ","（４）　同時に、又は一定の順序で振幅変調及び角度変調を行うもの｜Ｄ","（５）　パルス変調","（一）　無変調パルス列｜Ｐ","（二）　変調パルス列","ア　振幅変調｜Ｋ","イ　幅変調又は時間変調｜Ｌ","ウ　位置変調又は位相変調｜Ｍ","エ　パルスの期間中に搬送波を角度変調するもの｜Ｑ","オ　アからエまでの各変調の組合せ又は他の方法によつて変調するもの｜Ｖ","（６）　（１）から（５）までに該当しないものであつて、同時に、又は一定の順序で振幅変調、角度変調又はパルス変調のうちの二以上を組み合わせて行うもの｜Ｗ","（７）　その他のもの｜Ｘ","二　主搬送波を変調する信号の性質｜記号","（１）　変調信号のないもの｜〇","（２）　デイジタル信号である単一チヤネルのもの","（一）　変調のための副搬送波を使用しないもの｜一","（二）　変調のための副搬送波を使用するもの｜二","（３）　アナログ信号である単一チヤネルのもの｜三","（４）　デイジタル信号である二以上のチヤネルのもの｜七","（５）　アナログ信号である二以上のチヤネルのもの｜八","（６）　デイジタル信号の一又は二以上のチヤネルとアナログ信号の一又は二以上のチヤネルを複合したもの｜九","（７）　その他のもの｜Ｘ","三　伝送情報の型式｜記号","（１）　無情報｜Ｎ","（２）　電信","（一）　聴覚受信を目的とするもの｜Ａ","（二）　自動受信を目的とするもの｜Ｂ","（３）　フアクシミリ｜Ｃ","（４）　データ伝送、遠隔測定又は遠隔指令｜Ｄ","（５）　電話（音響の放送を含む。）｜Ｅ","（６）　テレビジヨン（映像に限る。）｜Ｆ","（７）　（１）から（６）までの型式の組合せのもの｜Ｗ","（８）　その他のもの｜Ｘ"]}],"section":"H03-1","fixed":false},{"id":"H03-02","subject":"法規","chapter":"H03","text":"\u003cp>電波の型式「J3E」の、主搬送波の変調の型式はどれか。\u003c/p>","choices":["抑圧搬送波による単側波帯","全搬送波による単側波帯","低減搬送波による単側波帯","両側波帯"],"answer":0,"explain":"\u003cp>J は抑圧搬送波による単側波帯です。H は全搬送波、R は低減搬送波による単側波帯、A は両側波帯です。J3E は SSB の電話です。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の2第1項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_2-Pr_1","lines":["電波の主搬送波の変調の型式、主搬送波を変調する信号の性質及び伝送情報の型式は、次の各号に掲げるように分類し、それぞれ当該各号に掲げる記号をもつて表示する。ただし、主搬送波を変調する信号の性質を表示する記号は、対応する算用数字をもつて表示することがあるものとする。","一　主搬送波の変調の型式｜記号","（１）　無変調｜Ｎ","（２）　振幅変調","（一）　両側波帯｜Ａ","（二）　全搬送波による単側波帯｜Ｈ","（三）　低減搬送波による単側波帯｜Ｒ","（四）　抑圧搬送波による単側波帯｜Ｊ","（五）　独立側波帯｜Ｂ","（六）　残留側波帯｜Ｃ","（３）　角度変調","（一）　周波数変調｜Ｆ","（二）　位相変調｜Ｇ","（４）　同時に、又は一定の順序で振幅変調及び角度変調を行うもの｜Ｄ","（５）　パルス変調","（一）　無変調パルス列｜Ｐ","（二）　変調パルス列","ア　振幅変調｜Ｋ","イ　幅変調又は時間変調｜Ｌ","ウ　位置変調又は位相 す。A は振幅変調の両側波帯、G は位相変調、J は抑圧搬送波による単側波帯です。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の2第1項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_2-Pr_1","lines":["電波の主搬送波の変調の型式、主搬送波を変調する信号の性質及び伝送情報の型式は、次の各号に掲げるように分類し、それぞれ当該各号に掲げる記号をもつて表示する。ただし、主搬送波を変調する信号の性質を表示する記号は、対応する算用数字をもつて表示することがあるものとする。","一　主搬送波の変調の型式｜記号","（１）　無変調｜Ｎ","（２）　振幅変調","（一）　両側波帯｜Ａ","（二）　全搬送波による単側波帯｜Ｈ","（三）　低減搬送波による単側波帯｜Ｒ","（四）　抑圧搬送波による単側波帯｜Ｊ","（五）　独立側波帯｜Ｂ","（六）　残留側波帯｜Ｃ","（３）　角度変調","（一）　周波数変調｜Ｆ","（二）　位相変調｜Ｇ","（４）　同時に、又は一定の順序で振幅変調及び角度変調を行うもの｜Ｄ","（５）　パルス変調","（一）　無変調パルス列｜Ｐ","（二）　変調パルス列","ア　振幅変調｜Ｋ","イ　幅変調又は時間変調｜Ｌ","ウ　位置変調又は位相変調｜Ｍ","エ　パルスの期間中に搬送波を角度変調するもの｜Ｑ","オ　アからエまでの各変調の組合せ又は他の方法によつて変調するもの｜Ｖ","（６）　（１）から（５）までに該当しないものであつて、同時に、又は一定の順序で振幅変調、角度変調又はパルス変調のうちの二以上を組み合わせて行うもの｜Ｗ","（７）　その他のもの｜Ｘ","二　主搬送波を変調する信号の性質｜記号","（１）　変調信号のないもの｜〇","（２）　デイジタル信号である単一チヤネルのもの","（一）　変調のための副搬送波を使用しないもの｜一","（二）　変調のための副搬送波を使用するもの｜二","（３）　アナログ信号である単一チヤネルのもの｜三","（４）　デイジタル信号である二以上のチヤネルのもの｜七","（５）　アナログ信号である二以上のチヤネルのもの｜八","（６）　デイジタル信号の一又は二以上のチヤネルとアナログ信号の一又は二以上のチヤネルを複合したもの｜九","（７）　その他のもの｜Ｘ","三　伝送情報の型式｜記号","（１）　無情報｜Ｎ","（２）　電信","（一）　聴覚受信を目的とするもの｜Ａ","（二）　自動受信を目的とするもの｜Ｂ","（３）　フアクシミリ｜Ｃ","（４）　データ伝送、遠隔測定又は遠隔指令｜Ｄ","（５）　電話（音響の放送を含む。）｜Ｅ","（６）　テレビジヨン（映像に限る。）｜Ｆ","（７）　（１）から（６）までの型式の組合せのもの｜Ｗ","（８）　その他のもの｜Ｘ"]}],"section":"H03-1","fixed":false},{"id":"H03-06","subject":"法規","chapter":"H03","text":"\u003cp>電波の周波数の表示について、電波法施行規則の規定に合っているものはどれか。\u003c/p>","choices":["435 MHz の電波は、MHz で表示する。","7 MHz の電波は、kHz で表示する。","2,500 kHz の電波は、MHz で表示する。","1,200 MHz の電波は、GHz で表示する。"],"answer":0,"explain":"\u003cp>3,000 kHz 以下は kHz、3,000 kHz を超え 3,000 MHz 以下は MHz、3,000 MHz を超え 3,000 GHz 以下は GHz です。7 MHz（7,000 kHz）は MHz、2,500 kHz は kHz、1,200 MHz は MHz で表示します。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の3第1項","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_3-Pr_1","lines":["電波の周波数は、三、〇〇〇ｋＨｚ以下のものはｋＨｚ、三、〇〇〇ｋＨｚをこえ三、〇〇〇ＭＨｚ以下のものはＭＨｚ、三、〇〇〇ＭＨｚをこえ三、〇〇〇ＧＨｚ以下のものはＧＨｚで表示する。ただし、周波数の使用上特に必要がある場合は、この表示方法によらないことができる。"]}],"section":"H03-2","fixed":false},{"id":"H03-07","subject":"法規","chapter":"H03","text":"\u003cp>144 MHz 帯の電波が属する周波数帯はどれか。\u003c/p>","choices":["VHF（30 MHz を超え 300 MHz 以下）","HF（3 MHz を超え 30 MHz 以下）","UHF（300 MHz を超え 3,000 MHz 以下）","SHF（3 GHz を超え 30 GHz 以下）"],"answer":0,"explain":"\u003cp>144 MHz は 30 MHz を超え 300 MHz 以下なので、VHF（メートル波）です。430 MHz 帯は UHF です。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の3第2項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_3-Pr_2","lines":["電波のスペクトルは、その周波数の範囲に応じ、次の表に掲げるように九の周波数帯に区分する。","周波数帯の周波数の範囲｜周波数帯の番号｜周波数帯の略称｜メートルによる区分","三〇ＭＨｚをこえ、三〇〇ＭＨｚ以下｜８｜ＶＨＦ｜メートル波"]}],"section":"H03-2","fixed":false},{"id":"H03-08","subject":"法規","chapter":"H03","text":"\u003cp>UHF の周波数帯の範囲はどれか。\u003c/p>","choices":["300 MHz を超え 3,000 MHz 以下","30 MHz を超え 300 MHz 以下","3 MHz を超え 30 MHz 以下","3 GHz を超え 30 GHz 以下"],"answer":0,"explain":"\u003cp>UHF（デシメートル波）は 300 MHz を超え 3,000 MHz 以下です。30 MHz を超え 300 MHz 以下は VHF、3 MHz を超え 30 MHz 以下は HF、3 GHz を超え 30 GHz 以下は SHF です。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の3第2項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_3-Pr_2","lines":["電波のスペクトルは、その周波数の範囲に応じ、次の表に掲げるように九の周波数帯に区分する。","周波数帯の周波数の範囲｜周波数帯の番号｜周波数帯の略称｜メートルによる区分","三〇〇ＭＨｚをこえ、三、〇〇〇ＭＨｚ以下｜９｜ＵＨＦ｜デシメートル波"]}],"section":"H03-2","fixed":false},{"id":"H03-09","subject":"法規","chapter":"H03","text":"\u003cp>電波法第 28 条に規定する「電波の質」として、正しいものはどれか。\u003c/p>","choices":["電波の周波数の偏差及び幅、高調波の強度等","空中線電力及び電波の型式","電界強度及び電波の到達距離","変調の深さ及び送信の時間"],"answer":0,"explain":"\u003cp>電波の質は「周波数の偏差及び幅、高調波の強度等」です。総務省令で定めるところに適合していなければなりません。\u003c/p>","refs":[{"label":"電波法 第28条","url":"https://laws.e-gov.go.jp/law/325AC0000000131#Mp-Ch_3-At_28","lines":["（電波の質）","第二十八条　送信設備に使用する電波の周波数の偏差及び幅、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。"]}],"section":"H03-3","fixed":false},{"id":"H03-10","subject":"法規","chapter":"H03","text":"\u003cp>「占有周波数帯幅」は、その上限の周波数より上と下限の周波数より下に輻射される平均電力が、それぞれ全平均電力の何パーセントに等しくなる周波数帯幅か。\u003c/p>","choices":["0.5 パーセント","1 パーセント","5 パーセント","10 パーセント"],"answer":0,"explain":"\u003cp>上と下にそれぞれ 0.5 パーセントずつはみ出す幅です。つまり、全体の 99 パーセントの電力が入る幅です。\u003c/p>","refs":[{"label":"電波法施行規則 第2条第1項第61号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_2-Pr_1-It_61","lines":["電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。","六十一　「占有周波数帯幅」とは、その上限の周波数をこえて輻射され、及びその下限の周波数未満において輻射される平均電力がそれぞれ与えられた発射によつて輻射される全平均電力の〇・五パーセントに等しい上限及び下限の周波数帯幅をいう。ただし、周波数分割多重方式の場合、テレビジヨン伝送の場合等〇・五パーセントの比率が占有周波数帯幅及び必要周波数帯幅の定義を実際に適用することが困難な場合においては、異なる比率によることができる。"]}],"section":"H03-3","fixed":false},{"id":"H03-11","subject":"法規","chapter":"H03","text":"\u003cp>電波法施行規則に規定する「スプリアス発射」に含まれないものはどれか。\u003c/p>","choices":["帯域外発射","高調波発射","低調波発射","寄生発射"],"answer":0,"explain":"\u003cp>スプリアス発射は、高調波発射、低調波発射、寄生発射、相互変調積を含み、帯域外発射を含みません。スプリアス発射と帯域外発射をあわせて、不要発射といいます。\u003c/p>","refs":[{"label":"電波法施行規則 第2条第1項第63号","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_2-Pr_1-It_63","lines":["電波法に基づく命令の規定の解釈に関しては、別に規定するもののほか、次の定義に従うものとする。","六十三　「スプリアス発射」とは、必要周波数帯外における一又は二以上の周波数の電波の発射であつて、そのレベルを情報の伝送に影響を与えないで低減することができるものをいい、高調波発射、低調波発射、寄生発射及び相互変調積を含み、帯域外発射を含まないものとする。"]}],"section":"H03-3","fixed":false},{"id":"H03-12","subject":"法規","chapter":"H03","text":"\u003cp>F3E の電波を使用するアマチュア局の送信設備の空中線電力は、何で表示するか。\u003c/p>","choices":["平均電力（pY）","尖頭電力（pX）","搬送波電力（pZ）","規格電力（pR）"],"answer":0,"explain":"\u003cp>1 文字目が F（周波数変調）の電波は、平均電力で表示します。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の4第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-Ch_1-At_4_4-Pr_1","lines":["空中線電力は、電波の型式のうち主搬送波の変調の型式及び主搬送波を変調する信号の性質が次の上欄に掲げる記号で表される電波を使用する送信設備について、それぞれ同表の下欄に掲げる電力をもつて表示する。","記号｜空中線電力","主搬送波の変調の型式｜主搬送波を変調する信号の性質","Ｆ｜平均電力（ｐＹ）"]}],"section":"H03-4","fixed":false},{"id":"H03-13","subject":"法規","chapter":"H03","text":"\u003cp>J3E の電波を使用するアマチュア局の送信設備の空中線電力は、何で表示するか。\u003c/p>","choices":["尖頭電力（pX）","平均電力（pY）","搬送波電力（pZ）","規格電力（pR）"],"answer":0,"explain":"\u003cp>1 文字目が J（抑圧搬送波による単側波帯）の電波は、尖頭電力で表示します。SSB は話していないと電力がほとんど出ないので、いちばん強いところで表します。\u003c/p>","refs":[{"label":"電波法施行規則 第4条の4第1項（表の一部）","url":"https://laws.e-gov.go.jp/law/325M50080000014#Mp-
